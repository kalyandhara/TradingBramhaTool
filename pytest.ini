; pytest configuration — B-83
;
; Before this file the suite had no config at all: it ran because pytest's default
; discovery happened to find `tools/` and because the `prepend` import mode happens
; to put each test's own directory on `sys.path`, which is what lets
; `import scanner_templates` resolve. Both are defaults, not decisions, and the
; suite's 566 tests depended on them silently.
;
; `testpaths` is the one that matters. Without it, a bare `pytest` at the repo root
; walks EVERYTHING, including the vendored `tools/breakout_scanner/node_modules`
; tree. It found nothing there today; the reason to bound it is that a vendored
; bundle is not this project's code and should never be able to fail this project's
; suite.

[pytest]
testpaths = tools

; Vendored, generated, or not-ours. `norecursedirs` replaces pytest's default list,
; so the usual suspects are restated rather than lost.
norecursedirs =
    .git
    .claude
    __pycache__
    *.egg-info
    node_modules
    tools/breakout_scanner
    tools/cache
    tools/logs
    tools/pine_scripts
    trading-wiki
    raw
    reports
    data

; -q keeps a 566-test run to a few lines; the failure output is unaffected.
; --strict-markers turns a typo'd @pytest.mark into an error rather than a marker
; that silently does nothing.
addopts = -q --strict-markers --tb=short

; Tests are named for what they pin, which is why several run long: the desk
; prefers a readable assertion to a fast one.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
