<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, sans-serif;
    font-size: 12px;
  }
  #wrap {
    box-sizing: border-box; overflow-y: auto; overflow-x: hidden;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  }
  .row {
    display: grid; align-items: center; height: 44px; padding: 0 6px; gap: 6px;
    border-bottom: 1px solid var(--border); position: relative;
  }
  .row.head { height: 26px; }
  .row.head {
    position: sticky; top: 0; z-index: 1; background: var(--surface-alt);
    color: var(--muted); font-weight: 600;
  }
  .row:not(.head):hover { background: var(--surface-alt); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .sym a {
    color: var(--accent-link); text-decoration: none; font-weight: 600;
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sym a:hover { text-decoration: underline; }
  .heart { text-align: center; color: var(--risk); }
  .nm { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis;
        white-space: nowrap; margin-top: 1px; }
  .px { font-weight: 600; font-size: 12.5px; }
  .pc { font-size: 11px; display: inline-flex; align-items: center; gap: 3px;
        justify-content: flex-end; width: 100%; }
  .badge { width: 12px; height: 12px; border-radius: 50%; display: inline-flex;
           align-items: center; justify-content: center; color: #fff; font-size: 7px;
           line-height: 1; flex: none; }
  .spk { position: relative; height: 26px; }
  .spk svg { display: block; }
  .acts { position: absolute; inset: 0; display: none; align-items: center;
          justify-content: center; gap: 3px; }
  .act {
    border: 1px solid var(--border); background: var(--surface); color: var(--accent-link);
    border-radius: 5px; font-size: 10px; font-weight: 700; padding: 2px 4px;
    cursor: pointer; line-height: 1.2;
  }
  .act:hover { background: var(--accent-link); color: #fff; }
  .row:not(.head):hover .acts { display: flex; }
  .row:not(.head):hover .spk svg { visibility: hidden; }
  @media (hover: none) { .acts { display: flex; } .spk svg { visibility: hidden; } }
  .chartbtn {
    border: none; background: none; cursor: pointer; padding: 0;
    color: var(--muted); font-size: 13px; line-height: 1;
  }
  .chartbtn:hover { color: var(--accent-link); }
  input[type=checkbox] { margin: 0; cursor: pointer; }
  .empty { padding: 10px; color: var(--muted); }
  .row.cur { background: var(--surface-alt); box-shadow: inset 3px 0 0 var(--accent-link); }
  .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
</style>
</head>
<body>
<div id="wrap"></div>

<script>
// ── Streamlit component protocol ────────────────────────────────────────────
// Hand-rolled like components/symbol_search: three postMessage types, no build.
function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*");
}
function setHeight(h) { send("streamlit:setFrameHeight", {height: h}); }
function setValue(v)  { send("streamlit:setComponentValue", {value: v, dataType: "json"}); }
// One value carries both the ticks and the last page-jump request; the jump
// has a counter so Python acts on a NEW request, not on every rerun.
function report() { setValue({picked: [...picked], open: openReq}); }

const LWC_SRC = "https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js";
const OPEN_MS = 250, CLOSE_MS = 200, FETCH_MS = 6000, ERR_TTL_MS = 60000;
const CARD_W = 560, CARD_H = 340;
const TOUCH = window.matchMedia("(hover: none)").matches;
// The card never exceeds the viewport: 560 px on desktop, screen width on a phone.
function cardW() { return Math.min(CARD_W, window.parent.innerWidth - 16); }

const wrap = document.getElementById("wrap");
let ARGS = {}, rowsSig = "", picked = new Set(), openReq = null, openN = 0;

// ── Rows ────────────────────────────────────────────────────────────────────
function fmtClose(v) {
  return v == null ? "—" : "₹" + v.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtPct(v)   { return v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function columns() {
  // checkbox · symbol/name · sparkline · price/day% · [extra…] · [♥] · chart
  const spk = (ARGS.rows || []).some(r => r.spark && r.spark.length > 1) ? "54px" : "26px";
  const lead = ARGS.no_check ? "0px " : "14px ";
  const tail = (ARGS.show_heart ? "12px " : "") + "18px";
  if (!(ARGS.extra_cols || []).length)
    return lead + "minmax(0,1fr) " + spk + " 74px " + tail;
  // Scan tables: every column has a floor (the narrow panes) and a share of any
  // spare width (the full-width band), so a wide table spreads out instead of
  // bunching on the left. Text may shrink to an ellipsis; numbers never do.
  const extra = (ARGS.extra_cols || []).map(c => {
    const w = (Number(c.width) || 70) + "px";
    return c.fmt === "text" ? `minmax(0,1.2fr)` : `minmax(${w},0.6fr)`;
  }).join(" ");
  return lead + "minmax(84px,1.6fr) " + spk + " minmax(74px,0.8fr) " + extra + " " + tail;
}

// Scan-table cells (watch_rail.SCAN_FORMATS). Text is escaped; numbers are formatted here.
function fmtCell(c, v) {
  if (v == null || v === "") return "—";
  if (c.fmt === "x") return Number(v).toFixed(1) + "×";
  if (c.fmt === "pct") return (v > 0 ? "+" : "") + Number(v).toFixed(2) + "%";
  if (c.fmt === "num") return String(Math.round(Number(v)));
  return esc(v);
}

// One-month closes as a line, with a dotted baseline at the first close and a
// dot on the last — Google Finance's row chart, on daily bars.
function spark(vals) {
  if (!vals || vals.length < 2) return "";
  const W = 54, H = 26, lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const x = i => (i * (W - 3) / (vals.length - 1)).toFixed(1);
  const y = v => (H - 3 - (v - lo) / span * (H - 6)).toFixed(1);
  const up = vals[vals.length - 1] >= vals[0];
  const c = up ? ARGS.good : ARGS.risk;
  const muted = (ARGS.theme || {}).muted || "#999";
  const pts = vals.map((v, i) => x(i) + "," + y(v)).join(" ");
  const last = vals.length - 1;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
    `<line x1="0" x2="${W}" y1="${y(vals[0])}" y2="${y(vals[0])}" stroke="${muted}" ` +
    `stroke-width="0.8" stroke-dasharray="1.5 2"/>` +
    `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.3" stroke-linejoin="round"/>` +
    `<circle cx="${x(last)}" cy="${y(vals[last])}" r="2" fill="${c}"/></svg>`;
}

function badge(p) {
  const muted = (ARGS.theme || {}).muted || "#888";
  if (p == null || p === 0) return `<span class="badge" style="background:${muted}">●</span>`;
  return `<span class="badge" style="background:${p > 0 ? ARGS.good : ARGS.risk}">${p > 0 ? "▲" : "▼"}</span>`;
}

function renderRows() {
  const rows = ARGS.rows || [];
  const cols = columns();
  let html = `<div class="row head" style="grid-template-columns:${cols}">` +
             `<span></span><span>Symbol</span><span title="One month of daily closes">${(ARGS.rows || []).some(r => r.spark && r.spark.length > 1) ? "1M" : ""}</span>` +
             `<span class="num">${esc(ARGS.pct_label || "Close · Day")}</span>` +
             (ARGS.extra_cols || []).map(c =>
               `<span class="${c.fmt === "text" ? "txt" : "num"}">${esc(c.label)}</span>`).join("") +
             (ARGS.show_heart ? `<span class="heart">♥</span>` : "") +
             `<span></span></div>`;
  if (!rows.length) html += `<div class="empty">No names match.</div>`;
  rows.forEach((r, i) => {
    const pc = r.day_pct == null || r.day_pct === 0 ? "" :
               `color:${r.day_pct > 0 ? ARGS.good : ARGS.risk}`;
    const cur = ARGS.current && r.symbol === ARGS.current ? " cur" : "";
    html += `<div class="row${cur}" data-i="${i}" style="grid-template-columns:${cols}">` +
      (ARGS.no_check ? `<span></span>` :
        `<input type="checkbox" data-i="${i}"${picked.has(r.symbol) ? " checked" : ""}>`) +
      `<span class="sym" data-i="${i}" style="min-width:0"><a ` +
      (ARGS.link_mode === "select" ? `class="sel" data-i="${i}" ` : `target="_blank" rel="noopener" `) +
      `href="${esc(ARGS.analyze_base + encodeURIComponent(r.symbol))}">${esc(r.symbol)}</a>` +
      `<div class="nm" title="${esc(r.name || "")}">${esc(r.name || "")}</div></span>` +
      `<span class="spk">${spark(r.spark)}<span class="acts">` +
      `<button class="act" data-i="${i}" data-page="analyze" title="Stock Analyzer">SA</button>` +
      `</span></span>` +
      `<span class="num"><div class="px">${fmtClose(r.close)}</div>` +
      `<div class="pc" style="${pc}">${fmtPct(r.day_pct)}${badge(r.day_pct)}</div></span>` +
      (ARGS.extra_cols || []).map(c =>
        `<span class="${c.fmt === "text" ? "txt" : "num"}"` +
        (c.fmt === "text" ? ` title="${esc((r.extra || {})[c.key] || "")}"` : "") +
        `>${fmtCell(c, (r.extra || {})[c.key])}</span>`).join("") +
      (ARGS.show_heart ? `<span class="heart">${r.watched ? "♥" : ""}</span>` : "") +
      `<button class="chartbtn" data-i="${i}" title="Open in the chart tool (new window)" aria-label="Open chart">&#x1F4C8;</button>` +
      `</div>`;
  });
  wrap.innerHTML = html;
}

wrap.addEventListener("change", (e) => {
  if (e.target.type !== "checkbox") return;
  const r = (ARGS.rows || [])[Number(e.target.dataset.i)];
  if (!r) return;
  if (e.target.checked) picked.add(r.symbol); else picked.delete(r.symbol);
  report();
});

// ── Chart card, hosted in the PARENT page so the narrow frame can't clip it ──
const P = window.parent.document;
let card = null, chart = null, openTimer = null, closeTimer = null;
let token = 0, openFor = null;
const cache = new Map();      // chart symbol -> {bars, prev} | {err, at}

function loadLwc() {
  // A script tag that already failed never fires load/error again, so a dead
  // tag must be removed (the next hover retries) and every wait is bounded.
  if (window.parent.LightweightCharts) return Promise.resolve(window.parent.LightweightCharts);
  let s = P.getElementById("tb-lwc");
  if (s && s.dataset.state === "failed") { s.remove(); s = null; }
  if (s && !s.dataset.state && !s.dataset.pending) { s.remove(); s = null; }   // stale, untracked
  if (!s) {
    s = P.createElement("script");
    s.id = "tb-lwc"; s.src = LWC_SRC; s.dataset.pending = "1";
    s.addEventListener("load", () => { s.dataset.state = "ok"; delete s.dataset.pending; }, {once: true});
    s.addEventListener("error", () => { s.dataset.state = "failed"; delete s.dataset.pending; }, {once: true});
    P.head.appendChild(s);
  }
  const tag = s;
  return new Promise((ok, bad) => {
    const done = () => window.parent.LightweightCharts
      ? ok(window.parent.LightweightCharts) : bad(new Error("chart library failed to load"));
    if (tag.dataset.state) return done();
    const timer = setTimeout(() => {
      tag.dataset.state = "failed"; delete tag.dataset.pending;
      bad(new Error("chart library timed out"));
    }, FETCH_MS);
    tag.addEventListener("load", () => { clearTimeout(timer); done(); }, {once: true});
    tag.addEventListener("error", () => { clearTimeout(timer); done(); }, {once: true});
  });
}

function ensureCard() {
  if (card && card.isConnected) return card;
  P.querySelectorAll("#tb-hover-card").forEach(n => n.remove());   // never two
  const t = ARGS.theme || {};
  card = P.createElement("div");
  card.id = "tb-hover-card";
  Object.assign(card.style, {
    position: "fixed", zIndex: "10000", display: "none",
    width: cardW() + "px", height: CARD_H + "px", boxSizing: "border-box",
    background: t.surface || "#fff", color: t.text || "#111",
    border: `1px solid ${t.border || "#ddd"}`, borderRadius: "10px",
    boxShadow: "0 12px 32px rgba(0,0,0,0.18)", padding: "8px 10px",
    fontFamily: "Source Sans Pro, -apple-system, Segoe UI, Roboto, sans-serif",
    fontSize: "12px",
  });
  card.innerHTML = `<div class="tb-hc-head" style="display:flex;gap:10px;align-items:baseline;` +
    `white-space:nowrap;overflow:hidden;margin-bottom:4px"></div>` +
    `<div class="tb-hc-body" style="position:relative;height:${CARD_H - 44}px"></div>`;
  card.addEventListener("mouseenter", () => clearTimeout(closeTimer));
  card.addEventListener("mouseleave", scheduleClose);
  P.body.appendChild(card);
  return card;
}

function hideCard() {
  clearTimeout(openTimer); clearTimeout(closeTimer);
  token++; openFor = null;
  if (chart) { try { chart.remove(); } catch (e) {} chart = null; }
  if (card) card.style.display = "none";
}

function scheduleClose() {
  clearTimeout(closeTimer);
  closeTimer = setTimeout(hideCard, CLOSE_MS);
}

function place(rowEl) {
  const fr = window.frameElement ? window.frameElement.getBoundingClientRect()
                                 : {left: 0, right: 0, top: 0};
  const rr = rowEl.getBoundingClientRect();
  const vw = window.parent.innerWidth, vh = window.parent.innerHeight;
  const w = cardW();
  card.style.width = w + "px";
  let left = fr.right + 8;
  if (left + w > vw - 8) left = Math.max(8, vw - w - 8);
  let top = fr.top + rr.top - 8;
  if (top + CARD_H > vh - 8) top = fr.top + rr.bottom - CARD_H + 8;   // flip up
  top = Math.max(8, Math.min(top, vh - CARD_H - 8));
  card.style.left = left + "px"; card.style.top = top + "px";
}

function setHead(html) { card.querySelector(".tb-hc-head").innerHTML = html; }
function setBody(text) {
  const b = card.querySelector(".tb-hc-body");
  b.innerHTML = text ? `<div style="padding:40px 0;text-align:center;color:` +
    `${(ARGS.theme || {}).muted || "#888"}">${text}</div>` : "";
  return b;
}

async function fetchBars(sym) {
  const hit = cache.get(sym);
  if (hit && hit.bars) return hit;
  if (hit && hit.err && Date.now() - hit.at < ERR_TTL_MS) throw new Error("unavailable");
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), FETCH_MS);
  try {
    const url = `${ARGS.chart_api}?symbol=${encodeURIComponent(sym)}&timeframe=1d&bars=130`;
    const res = await fetch(url, {signal: ctl.signal});
    const data = await res.json();
    if (!res.ok || data.error || !Array.isArray(data.bars) || data.bars.length < 5) {
      throw new Error("unavailable");
    }
    const out = {bars: data.bars};
    cache.set(sym, out);
    return out;
  } catch (e) {
    cache.set(sym, {err: true, at: Date.now()});
    throw e;
  } finally {
    clearTimeout(t);
  }
}

function sma(bars, n) {
  const out = []; let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i].close;
    if (i >= n) sum -= bars[i - n].close;
    if (i >= n - 1) out.push({time: bars[i].time, value: sum / n});
  }
  return out;
}

async function openCard(i, rowEl) {
  const r = (ARGS.rows || [])[i];
  if (!r) return;
  const my = ++token;
  openFor = r.symbol;
  ensureCard();
  if (chart) { try { chart.remove(); } catch (e) {} chart = null; }
  const t = ARGS.theme || {};
  const analyze = `<a href="${esc(ARGS.analyze_base + encodeURIComponent(r.symbol))}" ` +
    `target="_blank" rel="noopener" style="margin-left:auto;color:${t.link || "#2563eb"};` +
    `text-decoration:none">Analyze ↗</a>`;
  setHead(`<b>${esc(r.symbol)}</b><span style="color:${t.muted}">Daily</span>${analyze}`);
  setBody("Loading…");
  place(rowEl);
  card.style.display = "block";
  let got, L;
  try {
    [got, L] = await Promise.all([fetchBars(r.chart), loadLwc()]);
  } catch (e) {
    if (my !== token) return;
    setBody("Chart unavailable");
    return;
  }
  if (my !== token) return;                    // the user moved on while this loaded
  const bars = got.bars, last = bars[bars.length - 1], prev = bars[bars.length - 2];
  const chg = prev && prev.close ? (last.close - prev.close) / prev.close * 100 : null;
  const cc = chg == null || chg === 0 ? t.muted : (chg > 0 ? ARGS.good : ARGS.risk);
  const f = v => Number(v).toFixed(2);
  setHead(`<b>${esc(r.symbol)}</b><span style="color:${t.muted}">Daily</span>` +
    `<span>O ${f(last.open)} H ${f(last.high)} L ${f(last.low)} C ${f(last.close)}</span>` +
    `<span style="color:${cc}">${chg == null ? "" : (chg > 0 ? "+" : "") + chg.toFixed(2) + "%"}</span>` +
    analyze);
  const body = setBody("");
  try {
    chart = L.createChart(body, {
      width: cardW() - 22, height: CARD_H - 44,
      layout: {background: {color: t.surface || "#fff"}, textColor: t.muted || "#666", fontSize: 11},
      grid: {vertLines: {color: t.grid || "#eee"}, horzLines: {color: t.grid || "#eee"}},
      rightPriceScale: {borderColor: t.border || "#ddd"},
      timeScale: {borderColor: t.border || "#ddd"},
      crosshair: {mode: 0},
    });
    const candles = chart.addCandlestickSeries({
      upColor: ARGS.good, downColor: ARGS.risk, borderVisible: false,
      wickUpColor: ARGS.good, wickDownColor: ARGS.risk,
    });
    candles.priceScale().applyOptions({scaleMargins: {top: 0.06, bottom: 0.24}});
    candles.setData(bars.map(b => ({time: b.time, open: b.open, high: b.high, low: b.low, close: b.close})));
    const vol = chart.addHistogramSeries({priceFormat: {type: "volume"}, priceScaleId: "vol"});
    chart.priceScale("vol").applyOptions({scaleMargins: {top: 0.8, bottom: 0}});
    vol.setData(bars.map(b => ({time: b.time, value: b.volume,
      color: (b.close >= b.open ? ARGS.good : ARGS.risk) + "66"})));
    chart.addLineSeries({color: t.sma20 || "#2563eb", lineWidth: 1, priceLineVisible: false,
                         lastValueVisible: false}).setData(sma(bars, 20));
    chart.addLineSeries({color: t.sma50 || "#d97706", lineWidth: 1, priceLineVisible: false,
                         lastValueVisible: false}).setData(sma(bars, 50));
    chart.timeScale().fitContent();
  } catch (e) {
    setBody("Chart unavailable");
  }
}

// Hover (desktop): rest on a Symbol cell for OPEN_MS.
wrap.addEventListener("mouseover", (e) => {
  if (TOUCH) return;
  const cell = e.target.closest(".sym");
  if (!cell) return;
  clearTimeout(closeTimer);
  const i = Number(cell.dataset.i), rowEl = cell.closest(".row");
  const sym = (ARGS.rows || [])[i] && ARGS.rows[i].symbol;
  if (openFor === sym && card && card.style.display === "block") return;
  clearTimeout(openTimer);
  openTimer = setTimeout(() => openCard(i, rowEl), OPEN_MS);
});
wrap.addEventListener("mouseout", (e) => {
  if (TOUCH) return;
  const row = e.target.closest(".row");
  if (!row || (e.relatedTarget && row.contains(e.relatedTarget))) return;
  clearTimeout(openTimer);
  scheduleClose();
});

// PA / SA: ask Python to switch page, in this tab.
wrap.addEventListener("click", (e) => {
  const b = e.target.closest(".act");
  if (!b) return;
  const r = (ARGS.rows || [])[Number(b.dataset.i)];
  if (!r) return;
  hideCard();
  openReq = {page: b.dataset.page, symbol: r.symbol, n: Date.now() + (++openN)};
  report();
});

// link_mode "select": the ticker loads the stock into the host page instead of
// opening a new tab (the Stock Analyzer's candidate list).
wrap.addEventListener("click", (e) => {
  const a = e.target.closest("a.sel");
  if (!a) return;
  e.preventDefault();
  const r = (ARGS.rows || [])[Number(a.dataset.i)];
  if (!r) return;
  hideCard();
  openReq = {page: "select", symbol: r.symbol, n: Date.now() + (++openN)};
  report();
});

// Chart icon: the desk's own chart tool (:5001) in a separate window. One named
// window, reused, so stepping down a list does not pile up windows. Hover still
// shows the quick card; on touch screens the icon is now the way to a chart.
wrap.addEventListener("click", (e) => {
  const btn = e.target.closest(".chartbtn");
  if (!btn) return;
  const r = (ARGS.rows || [])[Number(btn.dataset.i)];
  if (!r) return;
  hideCard();
  const base = ARGS.chart_tool || "http://localhost:5001/";
  const url = base + "?symbol=" + encodeURIComponent(r.chart) + "&tf=1d";
  const w = window.parent.open(url, "tb_chart_tool", "popup,width=1400,height=900");
  if (w) w.focus();
});

function onKey(e) { if (e.key === "Escape") hideCard(); }
document.addEventListener("keydown", onKey);
P.addEventListener("keydown", onKey);
function onOutside(e) {
  if (!card || card.style.display !== "block") return;
  if (card.contains(e.target)) return;
  hideCard();
}
P.addEventListener("pointerdown", onOutside);
// The card is pinned to where the row WAS; once the page scrolls it points at
// nothing, so it closes. Capture phase: Streamlit scrolls an inner container.
P.addEventListener("scroll", hideCard, true);
document.addEventListener("scroll", hideCard, true);   // the list's own scroll
window.addEventListener("pagehide", () => {
  hideCard();
  P.removeEventListener("keydown", onKey);
  P.removeEventListener("pointerdown", onOutside);
  P.removeEventListener("scroll", hideCard, true);
});

// ── Host handshake ──────────────────────────────────────────────────────────
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  hideCard();                                  // a rerun never leaves a card behind
  ARGS = event.data.args || {};
  const t = ARGS.theme || {};
  const root = document.documentElement.style;
  root.setProperty("--border", t.border || "#e5e7eb");
  root.setProperty("--surface", t.surface || "#fff");
  root.setProperty("--surface-alt", t.surface_alt || "#f8fafc");
  root.setProperty("--muted", t.muted || "#6b7280");
  root.setProperty("--accent-link", t.link || "#2563eb");
  root.setProperty("--risk", ARGS.risk || "#dc2626");
  const sig = JSON.stringify([ARGS.rows, ARGS.show_heart, ARGS.extra_cols, ARGS.pct_label,
                              ARGS.current, ARGS.no_check, ARGS.link_mode]);
  if (sig !== rowsSig) {
    rowsSig = sig;
    // Keep only ticks whose rows are still shown, and tell Python whenever that
    // changed — otherwise a cleared box could still count for Add/Remove.
    const shown = new Set((ARGS.rows || []).map(r => r.symbol));
    const kept = new Set([...picked].filter(x => shown.has(x)));
    const changed = kept.size !== picked.size;
    picked = kept;
    renderRows();
    if (changed) report();
  }
  const h = ARGS.height || 520;
  wrap.style.height = h + "px";
  setHeight(h + 2);
});

send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
