// ── Heikin Ashi transform (a DISPLAY-only recolouring of the candles) ─────────
// HA smooths noise by averaging: HA-close = (O+H+L+C)/4, HA-open = mean of the
// prior HA open/close, HA-high/low extended to include the HA open/close. This is
// a rendering choice ONLY — indicators keep computing from the RAW bars (pane.bars),
// so RSI/VWAP/patterns are never fed the smoothed series. Same {time,o,h,l,c}
// shape the candlestick series already consumes, so no series swap is needed.
function heikinAshiBars(bars) {
  const out = [];
  let prevOpen, prevClose;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const haClose = (b.open + b.high + b.low + b.close) / 4;
    const haOpen  = (i === 0) ? (b.open + b.close) / 2 : (prevOpen + prevClose) / 2;
    const haHigh  = Math.max(b.high, haOpen, haClose);
    const haLow   = Math.min(b.low,  haOpen, haClose);
    out.push({time: b.time, open: haOpen, high: haHigh, low: haLow, close: haClose});
    prevOpen = haOpen; prevClose = haClose;
  }
  return out;
}

// Feed the main candle series either the raw bars or their Heikin-Ashi transform,
// per pane.chartType. Called on load, on live tick, and on chart-type toggle.
function applyPriceStyle(pane) {
  const bars = pane.bars || [];
  if (!bars.length) return;
  pane.series.setData(pane.chartType === 'heikin' ? heikinAshiBars(bars) : bars);
}

// ── Indicator math (computed from a full bars[] array of {time,open,high,low,close,volume}) ──
function smaSeries(bars, period) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i].close;
    if (i >= period) sum -= bars[i - period].close;
    if (i >= period - 1) out.push({time: bars[i].time, value: sum / period});
  }
  return out;
}

function emaSeries(bars, period) {
  const out = [];
  const k = 2 / (period + 1);
  let prev = null;
  for (let i = 0; i < bars.length; i++) {
    const c = bars[i].close;
    if (prev === null) {
      if (i === period - 1) {
        // seed with SMA of first `period` closes
        let sum = 0;
        for (let j = 0; j <= i; j++) sum += bars[j].close;
        prev = sum / period;
        out.push({time: bars[i].time, value: prev});
      }
      continue;
    }
    prev = c * k + prev * (1 - k);
    out.push({time: bars[i].time, value: prev});
  }
  return out;
}

// Timeframes on which a calendar day contains more than one bar. The UTC day
// boundary is correct for every market we chart: NSE 09:15-15:30 IST is
// 03:45-10:00 UTC and US 09:30-16:00 ET is 13:30-20:00 UTC, so neither session
// straddles UTC midnight, and crypto is quoted on UTC days anyway.
// Timeframes where a "session" is a fraction of a day, so session VWAP and the SVP
// day-grain are meaningful. 6h qualifies on a 24h market; on NSE cash the session is
// 6h15m, so a 6h bar is most of a session and SVP's measured grain-picker steps up to
// weekly on its own rather than trusting a hardcoded table (see session_volume_profile).
const INTRADAY_TFS = new Set(['1m', '5m', '15m', '30m', '1h', '4h', '6h']);

function vwapSeries(bars, tf) {
  // SESSION VWAP — resets at the start of each calendar day (UTC).
  //
  // Only defined when a session holds several bars. On '1d'/'1w' every bar
  // starts its own session, the accumulator resets on every bar, and the
  // formula collapses to that bar's own typical price: measured 2026-08-02 on
  // daily RELIANCE bars it equalled (H+L+C)/3 on 24 of 24. That is a typical-
  // price line wearing a VWAP label, so draw nothing instead and let the
  // Anchored VWAP below cover daily charts.
  if (!INTRADAY_TFS.has(tf)) return [];

  const out = [];
  let cumPV = 0, cumVol = 0, curDay = null;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const day = new Date(b.time * 1000).toISOString().slice(0, 10);
    if (day !== curDay) { curDay = day; cumPV = 0; cumVol = 0; }
    cumPV  += ((b.high + b.low + b.close) / 3) * (b.volume || 0);
    cumVol += (b.volume || 0);
    // No volume yet -> no average yet. This used to fall back to `b.close`,
    // which silently drew VWAP *as the price line* on any feed missing volume —
    // the most convincing way possible to be wrong.
    if (cumVol > 0) out.push({time: b.time, value: cumPV / cumVol});
  }
  return out;
}

// Minimum prominence, in ATRs, for a swing low to be worth anchoring to.
//
// Measured rather than picked: across RELIANCE / TCS / TATASTEEL / HDFCBANK /
// SUNPHARMA / DLF / TITAN on 400 daily bars, prominence over the ~80 confirmed
// lows per symbol runs median ≈1.55 ATR, p90 ≈2.25, max 3.1-4.5. So 3 ATR is far
// too strict — it left ONE qualifying low per symbol, 328 bars back, effectively
// the start of the window. At 2.0 the filter keeps roughly the top fifth of lows
// and lands the anchor 5-86 bars back (median ~22), against 3-5 bars unfiltered.
const AVWAP_MIN_DEPTH_ATR = 2.0;
const AVWAP_ATR_PERIOD = 14;

function lastSwingLowIdx(bars, minDepthATR = AVWAP_MIN_DEPTH_ATR) {
  // Index of the most recent CONFIRMED, *significant* zigzag swing low, or null.
  //
  // Confirmed only. EW.computeZigzag marks its trailing pivot `provisional` —
  // it tracks a still-forming extreme and moves as bars arrive. Anchoring to it
  // would slide the anchor and redraw the entire line underneath the user on
  // every new bar, which is the one thing an *anchored* VWAP must never do.
  //
  // Significant, because the zigzag is deliberately fine-grained — ~80 confirmed
  // lows in 400 daily bars — so "the last swing low" is usually 3-5 bars back and
  // the anchored line is a stub with no more meaning than a 5-bar average.
  if (!window.EW || typeof EW.computeZigzag !== 'function') return null;
  let pivots;
  try { pivots = EW.computeZigzag(bars); } catch (e) { return null; }
  if (!pivots || !pivots.length) return null;

  const atrByTime = new Map(atrSeries(bars, AVWAP_ATR_PERIOD).map(a => [a.time, a.value]));
  const lastClose = bars[bars.length - 1].close;

  const scored = [];
  for (let k = 0; k < pivots.length; k++) {
    const p = pivots[k];
    if (p.type !== 'low' || p.provisional) continue;
    if (p.idx == null || p.idx < 0 || p.idx >= bars.length) continue;

    let prevHigh = null, nextHigh = null;
    for (let j = k - 1; j >= 0; j--) if (pivots[j].type === 'high') { prevHigh = pivots[j]; break; }
    for (let j = k + 1; j < pivots.length; j++) if (pivots[j].type === 'high') { nextHigh = pivots[j]; break; }
    if (!prevHigh) continue;                       // no decline into it to measure

    const atr = atrByTime.get(bars[p.idx].time);
    if (!atr) continue;                            // inside the ATR warm-up

    // Topographic prominence: the SMALLER of the decline into the low and the
    // advance out of it, in ATRs. Both legs have to be real — a low that ended a
    // deep decline but produced no rally is not a level buyers defended, and a
    // low that launched a rally but barely dipped is just a pause. For the most
    // recent low the advance is measured to the current close, which makes a
    // young rally score low; that is correct, not a bug. Significance is earned.
    const depth = Math.min(prevHigh.price - p.price,
                           (nextHigh ? nextHigh.price : lastClose) - p.price) / atr;
    scored.push({idx: p.idx, depth});
  }
  if (!scored.length) return null;

  const qualifying = scored.filter(s => s.depth >= minDepthATR);
  if (qualifying.length) return qualifying[qualifying.length - 1].idx;

  // Nothing in this window clears the bar. Anchor to the DEEPEST low present
  // rather than the most recent one: within the loaded range that is by
  // definition the most significant level available, and it beats both drawing
  // nothing and silently falling back to the 3-bar stub this filter exists to
  // avoid.
  return scored.reduce((a, b) => (b.depth > a.depth ? b : a)).idx;
}

function anchoredVwapSeries(bars, anchorIdx) {
  // ANCHORED VWAP — cumulative from a chosen bar, never reset.
  //
  // This is the form that means something on a daily chart: "the average price
  // every share has actually changed hands at since the swing low". Price above
  // it means buyers since that low are collectively in profit; below, under
  // water. It is still an execution benchmark, not a valuation.
  if (anchorIdx == null || anchorIdx < 0 || anchorIdx >= bars.length) return [];
  const out = [];
  let cumPV = 0, cumVol = 0;
  for (let i = anchorIdx; i < bars.length; i++) {
    const b = bars[i];
    cumPV  += ((b.high + b.low + b.close) / 3) * (b.volume || 0);
    cumVol += (b.volume || 0);
    if (cumVol > 0) out.push({time: b.time, value: cumPV / cumVol});
  }
  return out;
}

function bollingerSeries(bars, period, mult) {
  const mid = [], upper = [], lower = [];
  for (let i = period - 1; i < bars.length; i++) {
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += bars[j].close;
    const mean = sum / period;
    let sqSum = 0;
    for (let j = i - period + 1; j <= i; j++) sqSum += Math.pow(bars[j].close - mean, 2);
    const sd = Math.sqrt(sqSum / period);
    mid.push({time: bars[i].time, value: mean});
    upper.push({time: bars[i].time, value: mean + mult * sd});
    lower.push({time: bars[i].time, value: mean - mult * sd});
  }
  return {mid, upper, lower};
}

function donchianSeries(bars, period) {
  const upper = [], lower = [], mid = [];
  for (let i = period - 1; i < bars.length; i++) {
    let hi = -Infinity, lo = Infinity;
    for (let j = i - period + 1; j <= i; j++) {
      if (bars[j].high > hi) hi = bars[j].high;
      if (bars[j].low  < lo) lo = bars[j].low;
    }
    upper.push({time: bars[i].time, value: hi});
    lower.push({time: bars[i].time, value: lo});
    mid.push({time: bars[i].time, value: (hi + lo) / 2});
  }
  return {upper, lower, mid};
}

function atrSeries(bars, period) {
  const out = [];
  let prevClose = null, atr = null;
  const trs = [];
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const tr = prevClose === null
      ? b.high - b.low
      : Math.max(b.high - b.low, Math.abs(b.high - prevClose), Math.abs(b.low - prevClose));
    trs.push(tr);
    prevClose = b.close;
    if (i === period - 1) {
      atr = trs.slice(0, period).reduce((a, v) => a + v, 0) / period;
      out.push({time: b.time, value: atr});
    } else if (i > period - 1) {
      atr = (atr * (period - 1) + tr) / period;
      out.push({time: b.time, value: atr});
    }
  }
  return out;
}

// PMax — EMA-of-source ± ATR × Multiplier, ratcheting trailing band that flips
// direction when the smoothed source crosses the opposite stop. Port of the
// original PMax Pine (see tools/pmax.pine, lines 211-267). Defaults match the
// Pine (src=hl2, atr_len=10, atr_mult=3.0, ma=EMA, ma_len=10, changeATR=true).
// Returns an array of {time, pmax, dir, ma} — one point per bar once warmed up.
function pmaxSeries(bars, atrLen = 10, atrMult = 3.0, maLen = 10) {
  if (!bars || bars.length < Math.max(atrLen, maLen) + 2) return [];
  // Wilder ATR (matches ta.atr in Pine when changeATR=true).
  const atr = atrSeries(bars, atrLen);
  const atrByTime = new Map(atr.map(a => [a.time, a.value]));
  // EMA of hl2.
  const alpha = 2 / (maLen + 1);
  let ema = null;
  const out = [];
  let longStopPrev = null, shortStopPrev = null, dir = 1;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const src = (b.high + b.low) / 2;
    ema = ema === null ? src : alpha * src + (1 - alpha) * ema;
    // Warm-up: only start emitting once ATR has a value AND we've seeded ~maLen
    // bars into the EMA — mirrors Pine's na-propagation.
    if (i < maLen - 1) continue;
    const a = atrByTime.get(b.time);
    if (a === undefined) continue;
    let longStop  = ema - atrMult * a;
    let shortStop = ema + atrMult * a;
    if (longStopPrev !== null && ema > longStopPrev)  longStop  = Math.max(longStop,  longStopPrev);
    if (shortStopPrev !== null && ema < shortStopPrev) shortStop = Math.min(shortStop, shortStopPrev);
    if      (dir === -1 && ema > (shortStopPrev ?? shortStop)) dir = 1;
    else if (dir ===  1 && ema < (longStopPrev  ?? longStop))  dir = -1;
    const pmax = dir === 1 ? longStop : shortStop;
    out.push({time: b.time, pmax, dir, ma: ema});
    longStopPrev  = longStop;
    shortStopPrev = shortStop;
  }
  return out;
}

// ── ATR Trailing Stop (Long / Short selectable) ───────────────────────────
// The classic Wilder-style trailing stop: in an uptrend the stop ratchets UP
// at close − mult × ATR(n); it never lowers until price closes below it, which
// flips to a downtrend where the stop ratchets DOWN at close + mult × ATR(n).
// Unlike PMax (which trails an EMA of hl2) this trails raw price — the stop is
// always a fixed ATR-multiple away from the highest/lowest close since the last
// flip, which is the definition most "ATR Trailing Stop" TradingView scripts use.
function atrTrailSeries(bars, atrLen = 14, mult = 3.0) {
  if (!bars || bars.length < atrLen + 2) return {rows: [], flips: []};
  const atr = atrSeries(bars, atrLen);
  const atrByTime = new Map(atr.map(a => [a.time, a.value]));
  const rows = [], flips = [];
  let dir = 1;
  let longStop = null, shortStop = null;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const a = atrByTime.get(b.time);
    if (a === undefined) continue;
    const band = mult * a;
    let ls = b.close - band;
    let ss = b.close + band;
    if (longStop !== null && b.close > longStop)   ls = Math.max(ls, longStop);
    if (shortStop !== null && b.close < shortStop) ss = Math.min(ss, shortStop);
    const prevDir = dir;
    if      (dir === -1 && b.close > (shortStop ?? ss)) dir = 1;
    else if (dir ===  1 && b.close < (longStop  ?? ls)) dir = -1;
    const stop = dir === 1 ? ls : ss;
    rows.push({time: b.time, stop, dir});
    if (prevDir !== dir) flips.push({time: b.time, dir});
    longStop  = ls;
    shortStop = ss;
  }
  return {rows, flips};
}

// PMax trade signals — a flip of `dir` IS the reversal, and that's the only
// actionable event the indicator produces. The two colored lines alone don't
// say where the flip happened or what to risk, so this turns each flip into an
// explicit trade: entry at the flip bar's close, stop at the PMax band on that
// bar (the band is the invalidation level by construction), and targets at
// 1R/2R/3R off that initial risk. `hit` records how far price has already run
// since the flip, so a stale signal reads as "TP2 ✓" rather than looking live.
// Returns oldest → newest; the last element is the currently-open position.
function pmaxSignals(rows, bars) {
  if (!rows || rows.length < 2) return [];
  const barByTime = new Map(bars.map(b => [b.time, b]));
  const sigs = [];
  for (let i = 1; i < rows.length; i++) {
    if (rows[i].dir === rows[i - 1].dir) continue;
    const r = rows[i];
    const b = barByTime.get(r.time);
    const entry = b ? b.close : r.ma;
    const stop  = r.pmax;
    const risk  = Math.abs(entry - stop);
    const sign  = r.dir === 1 ? 1 : -1;
    sigs.push({
      time: r.time, dir: r.dir, entry, stop, risk, idx: i,
      targets: risk > 0 ? [1, 2, 3].map(m => entry + sign * m * risk) : [],
      hit: 0,
    });
  }
  // Best excursion since each flip, in whole R — drives the TPn ✓ badges.
  sigs.forEach((s, n) => {
    const end = n + 1 < sigs.length ? sigs[n + 1].idx : rows.length;
    if (!s.risk) return;
    let best = 0;
    for (let i = s.idx; i < end; i++) {
      const b = barByTime.get(rows[i].time);
      if (!b) continue;
      const move = s.dir === 1 ? b.high - s.entry : s.entry - b.low;
      if (move > best) best = move;
    }
    s.hit = Math.min(3, Math.floor(best / s.risk));
  });
  return sigs;
}

function keltnerSeries(bars, period, mult) {
  const emaMid = emaSeries(bars, period);
  const atr = atrSeries(bars, period);
  const atrByTime = new Map(atr.map(a => [a.time, a.value]));
  const mid = [], upper = [], lower = [];
  emaMid.forEach(pt => {
    const a = atrByTime.get(pt.time);
    if (a === undefined) return;
    mid.push(pt);
    upper.push({time: pt.time, value: pt.value + mult * a});
    lower.push({time: pt.time, value: pt.value - mult * a});
  });
  return {mid, upper, lower};
}

// The band the RSI pane treats as neutral. 60/30 rather than the textbook
// 70/30: the framework reads a hold above 60 as trend strength and a break
// under 30 as washout, which is the same pair the ROC+RSI zone overlay and
// the RSI-60-40 setup already use.
const RSI_OB = 60;
const RSI_OS = 30;

// Wilder RSI. Previously used an accumulator seed that could produce
// avgGain=0 even when the price series was monotonically rising in the small
// (e.g. a liquid ETF where daily diffs frequently round to 0.00). One rare
// small down-day would then land as avgLoss>0 with avgGain=0, giving
// rs=0 -> RSI=0 -> phantom vertical plunges on an otherwise flat panel
// (see the LIQUIDCASE.NS case, 2026-07-03). Switching to Wilder EMA from
// bar 1 with a warmup period and a proper neutral-when-both-zero branch.
function rsiSeries(bars, period = 14) {
  if (!bars || bars.length < period + 1) return [];
  const out = [];
  const alpha = 1 / period;
  let avgGain = 0, avgLoss = 0;
  for (let i = 1; i < bars.length; i++) {
    const diff = bars[i].close - bars[i - 1].close;
    const gain = diff > 0 ?  diff : 0;
    const loss = diff < 0 ? -diff : 0;
    avgGain = alpha * gain + (1 - alpha) * avgGain;
    avgLoss = alpha * loss + (1 - alpha) * avgLoss;
    if (i < period) continue;                           // warmup
    // Neutral (not 0/100) while price hasn't moved either way — this is what
    // prevented the false plunge on near-monotonic series.
    let value;
    if (avgGain === 0 && avgLoss === 0)      value = 50;
    else if (avgLoss === 0)                  value = 100;
    else                                     value = 100 - 100 / (1 + avgGain / avgLoss);
    out.push({time: bars[i].time, value});
  }
  return out;
}

// Isolates the excursions where an oscillator sits outside a threshold, so a
// BaselineSeries anchored at that threshold can shade them. Each excursion
// keeps its two bracketing in-band points: the baseline then clips both the
// fill and the colored line at the level itself rather than at the bar that
// broke it, so the shading starts exactly on the 60/30 line. Everything else
// is whitespace, which leaves the pane blank there.
function bandExcursions(data, level, dir) {
  const isOut = v => dir > 0 ? v > level : v < level;
  return data.map((p, i) => {
    const near = isOut(p.value) ||
                 (i > 0 && isOut(data[i - 1].value)) ||
                 (i < data.length - 1 && isOut(data[i + 1].value));
    return near ? p : {time: p.time};
  });
}

function macdCalc(bars, fast = 12, slow = 26, signal = 9) {
  const fastEma = emaSeries(bars, fast);
  const slowEma = emaSeries(bars, slow);
  const fastMap = new Map(fastEma.map(p => [p.time, p.value]));
  const macdLine = [];
  slowEma.forEach(p => {
    const f = fastMap.get(p.time);
    if (f !== undefined) macdLine.push({time: p.time, value: f - p.value});
  });
  // EMA of MACD line = signal
  const k = 2 / (signal + 1);
  const signalLine = [];
  let prev = null;
  for (let i = 0; i < macdLine.length; i++) {
    const v = macdLine[i].value;
    if (prev === null) {
      if (i === signal - 1) {
        let sum = 0;
        for (let j = 0; j <= i; j++) sum += macdLine[j].value;
        prev = sum / signal;
        signalLine.push({time: macdLine[i].time, value: prev});
      }
      continue;
    }
    prev = v * k + prev * (1 - k);
    signalLine.push({time: macdLine[i].time, value: prev});
  }
  const sigMap = new Map(signalLine.map(p => [p.time, p.value]));
  const hist = [];
  macdLine.forEach(p => {
    const sv = sigMap.get(p.time);
    if (sv !== undefined) hist.push({time: p.time, value: p.value - sv, color: p.value - sv >= 0 ? '#26a69a' : '#ef5350'});
  });
  const sigTimes = new Set(signalLine.map(p => p.time));
  return {macd: macdLine.filter(p => sigTimes.has(p.time)), signal: signalLine, hist};
}

// The card. Small on purpose: the whole point of this indicator is that the
// COLOUR is the reading, so the panel adds only what colour cannot say — how
// far above its own average today is, and whether pocket pivots are clustering,
// which is the "institutional accumulation" tell the author describes.
const SVOL_LABEL = {
  ppv: 'Pocket Pivot', up: 'Above average (up)', down: 'Above average (down)',
  dry: 'Dry — a fifth of average', noise: 'Unremarkable',
};

function renderSimpleVolumeCard(pane) {
  const st = pane.svolStats;
  let box = pane.el.querySelector('.svol-info');
  if (!st) { if (box) box.style.display = 'none'; return; }
  if (!box) {
    box = document.createElement('div');
    box.className = 'svol-info';
    mountCard(pane, box, 'stack');
  }
  box.style.display = 'block';
  const col = (SVOL.colors[st.kind] || SVOL.colors.noise);
  const rv = st.rvol == null ? '—' : `${st.rvol.toFixed(0)}%`;
  box.innerHTML =
    `<div class="svol-head" style="color:${col}">Volume — ${SVOL_LABEL[st.kind]}</div>` +
    `<div class="sbc-row"><span>RVol (vs ${SVOL.maLen}-day avg)</span>` +
      `<span>${rv}</span></div>` +
    `<div class="sbc-row"><span>Average</span><span>` +
      `${st.ma == null ? '—' : fmtVol(st.ma)}</span></div>` +
    `<div class="sbc-row"><span>Pocket pivots (20b)</span><span>${st.ppv20}</span></div>` +
    `<div class="sbc-row"><span>Dry bars (20b)</span><span>${st.dry20}</span></div>` +
    `<div class="sbc-note">Blue = up-day volume above every down day of the last ` +
      `${SVOL.ppvLen}; green/red = above average; orange = dry. Grey is noise by ` +
      `design.<br><i>Unmeasured: no forward-return study backs these colours ` +
      `on this desk.</i></div>`;
}

function fmtVol(v) {
  if (v == null) return '—';
  if (v >= 1e7) return (v / 1e7).toFixed(2) + ' Cr';
  if (v >= 1e5) return (v / 1e5).toFixed(2) + ' L';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(Math.round(v));
}

function renderIchimokuCard(pane, ik) {

  let box = pane.el.querySelector('.' + cls);
  const on = pane.indicators instanceof Set && pane.indicators.has('ichimoku');
  if (!on) { if (box) box.style.display = 'none'; return; }
  if (!box) {
    box = document.createElement('div');
    box.className = 'trail-status ' + cls;
    mountCard(pane, box, 'stack');
  }
  const st = ik.state;
  const lines = ['<div class="svol-head">Ichimoku (9, 26, 52)</div>'];
  if (st) {
    const cloud = st.priceVsCloud === 'above' ? '🟢 Above cloud'
                : st.priceVsCloud === 'below' ? '🔴 Below cloud'

function volumeBarSeries(bars) {

// Stochastic Oscillator (Lane, late 1950s) — Full Stochastic (k, kSmooth, dSmooth).
// Defaults 14/3/3 = the widely-taught "slow stochastic".
//   raw %K  = 100 × (close − lowestLow(k)) / (highestHigh(k) − lowestLow(k))
//   %K      = SMA(raw %K, kSmooth)
//   %D      = SMA(%K, dSmooth)
// Returns {k: [{time,value}], d: [{time,value}]}. Values in [0, 100], with the
// standard 80 / 20 overbought / oversold guide lines rendered in the sub-pane.
function stochSeries(bars, k = 14, kSmooth = 3, dSmooth = 3) {
  if (!bars || bars.length < k + kSmooth + dSmooth) return {k: [], d: []};
  const raw = [];
  for (let i = k - 1; i < bars.length; i++) {
    let hh = -Infinity, ll = Infinity;
    for (let j = i - k + 1; j <= i; j++) {
      if (bars[j].high > hh) hh = bars[j].high;
      if (bars[j].low  < ll) ll = bars[j].low;
    }
    const rng = hh - ll;
    const v = rng > 0 ? 100 * (bars[i].close - ll) / rng : 50;
    raw.push({time: bars[i].time, value: v});
  }
  const sma = (arr, n) => {
    const out = [];
    let sum = 0;
    for (let i = 0; i < arr.length; i++) {
      sum += arr[i].value;
      if (i >= n) sum -= arr[i - n].value;
      if (i >= n - 1) out.push({time: arr[i].time, value: sum / n});
    }
    return out;
  };
  const kSm = sma(raw, kSmooth);
  const dSm = sma(kSm, dSmooth);
  return {k: kSm, d: dSm};
}

function obvSeries(bars) {
  const out = [];
  let obv = 0;
  for (let i = 0; i < bars.length; i++) {
    if (i > 0) {
      if (bars[i].close > bars[i - 1].close)      obv += (bars[i].volume || 0);
      else if (bars[i].close < bars[i - 1].close) obv -= (bars[i].volume || 0);
    }
    out.push({time: bars[i].time, value: obv});
  }
  return out;
}

// Money Flow Index (14) — volume-weighted RSI on typical price (H+L+C)/3.
//
// This is a deliberate LINE-BY-LINE PORT of `_mfi_series`
// (tools/scanner_templates.py:2366), which already feeds `scan_mfi_oversold`.
// B-24 is on this page's backlog because two RSI-divergence implementations
// were allowed to drift apart and disagree; the point of writing this one as a
// port rather than from the formula is that the chart and the scanner must
// answer the same question the same way. Anything changed here is owed a
// matching change there.
//
// Two conventions carried over from the Python on purpose:
//   • the sums are a ROLLING WINDOW SUM over n bars (not Wilder smoothing) —
//     that is the original Quong/Soudack definition and what the scanner fires on;
//   • when no bar in the window had a DOWN typical price, negative flow is 0 and
//     the ratio is undefined. Python yields NaN there and the scanner skips the
//     bar; here the point is OMITTED, leaving a visible gap. A gap is the honest
//     rendering — substituting 100 would draw a pinned overbought line that the
//     scanner does not see.
function mfiSeries(bars, n = 14) {
  if (!bars || bars.length < n + 1) return [];
  const tp = bars.map(b => (b.high + b.low + b.close) / 3);
  const rmf = bars.map((b, i) => tp[i] * (b.volume || 0));
  const out = [];
  for (let i = n; i < bars.length; i++) {
    let pos = 0, neg = 0;
    // Window covers the n bars whose direction is defined, matching
    // rolling(n).sum() over a diff()-derived series in pandas.
    for (let j = i - n + 1; j <= i; j++) {
      if (tp[j] > tp[j - 1])      pos += rmf[j];
      else if (tp[j] < tp[j - 1]) neg += rmf[j];
    }
    if (neg === 0) continue;                       // undefined — see note above
    out.push({time: bars[i].time, value: 100 - 100 / (1 + pos / neg)});
  }
  return out;
}

// ── ROC + RSI Zones — port of "Rate Of Change and rsi zones" Pine v5 ─────────
// Base ROC = SMA(100*(src-src[length])/src[length], roc_smooth). Layered on
// top is a second colored line that only appears when both ROC and RSI agree
// on a regime — GREEN when RSI<40 & ROC<0 (deep oversold), RED when RSI>60 &
// ROC>0 (extended overbought). Buy/sell triangles fire when the ROC crosses
// its own SMA in the confirming zone. Fill between ROC and zero is inverted:
// green when ROC<0 (contrarian bullish exhaustion), red when ROC>0 (overheat).
function rocRsiSeries(bars, {length = 21, rocSmooth = 5, rocSmaVal = 5, rsiLen = 14} = {}) {
  const n = bars.length;
  const empty = {roc: [], overlayGreen: [], overlayRed: [], baseline: [],
                 buys: [], sells: []};
  if (n < Math.max(length + rocSmooth, rsiLen) + 2) return empty;

  // RSI (Wilder RMA) — matches Pine's ta.rma
  const rsiArr = new Array(n).fill(NaN);
  {
    const alpha = 1 / rsiLen;
    let ag = 0, al = 0;
    for (let i = 1; i < n; i++) {
      const d = bars[i].close - bars[i - 1].close;
      ag = alpha * (d > 0 ?  d : 0) + (1 - alpha) * ag;
      al = alpha * (d < 0 ? -d : 0) + (1 - alpha) * al;
      if (i >= rsiLen) {
        rsiArr[i] = (ag === 0 && al === 0) ? 50
                   : al === 0 ? 100
                   : 100 - 100 / (1 + ag / al);
      }
    }
  }

  // Raw ROC then SMA-smooth it
  const rawRoc = new Array(n).fill(NaN);
  for (let i = length; i < n; i++) {
    const prev = bars[i - length].close;
    if (prev !== 0) rawRoc[i] = 100 * (bars[i].close - prev) / prev;
  }
  const rocArr = new Array(n).fill(NaN);
  {
    let sum = 0, cnt = 0;
    for (let i = 0; i < n; i++) {
      if (!isNaN(rawRoc[i])) { sum += rawRoc[i]; cnt++; }
      if (cnt > rocSmooth) { sum -= rawRoc[i - rocSmooth]; cnt--; }
      if (cnt === rocSmooth) rocArr[i] = sum / rocSmooth;
    }
  }

  // SMA of the ROC — Pine uses it for the cross-signal comparator
  const rocSmaArr = new Array(n).fill(NaN);
  {
    let sum = 0, cnt = 0;
    for (let i = 0; i < n; i++) {
      if (!isNaN(rocArr[i])) { sum += rocArr[i]; cnt++; }
      if (cnt > rocSmaVal) { sum -= rocArr[i - rocSmaVal]; cnt--; }
      if (cnt === rocSmaVal) rocSmaArr[i] = sum / rocSmaVal;
    }
  }

  const roc = [], overlayGreen = [], overlayRed = [], baseline = [];
  const buys = [], sells = [];
  for (let i = 0; i < n; i++) {
    const r = rocArr[i], rs = rsiArr[i];
    if (isNaN(r)) continue;
    const t = bars[i].time;
    roc.push({time: t, value: r});
    baseline.push({time: t, value: r});
    // Zone overlays (only render where the condition holds — gaps stay blank).
    if (!isNaN(rs) && rs < 40 && r < 0) overlayGreen.push({time: t, value: r});
    if (!isNaN(rs) && rs > 60 && r > 0) overlayRed.push({time: t, value: r});
    // Buy/sell markers on the ROC×SMA cross with regime confirmation.
    const rSma = rocSmaArr[i], rPrev = rocArr[i - 1], rSmaPrev = rocSmaArr[i - 1];
    if (!isNaN(rSma) && !isNaN(rPrev) && !isNaN(rSmaPrev)) {
      const crossedUp   = rPrev <= rSmaPrev && r > rSma;
      const crossedDown = rPrev >= rSmaPrev && r < rSma;
      if (crossedUp && rSma < r && r < 0 && !isNaN(rs) && rs < 50) {
        buys.push({time: t, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: '▲'});
      }
      if (crossedDown && rSma > r && r > 0 && !isNaN(rs) && rs > 50) {
        sells.push({time: t, position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: '▼'});
      }
    }
  }
  return {roc, overlayGreen, overlayRed, baseline, buys, sells};
}

// ── Card placement mode ─────────────────────────────────────────────────────
// PER-PANE. This shipped global, on the argument that the cards behave the same
// everywhere so the answer should be one. That was wrong about how the grid gets
// used: panes are a comparison surface, and the pane you are reading closely
// wants its cards docked and legible while the three you are watching out of the
// corner of your eye want the full plot. One switch for all eight forced the
// same answer onto both jobs.
//
// It lives in LS_PANES with symbol/tf/indicators/rangePreset rather than in a key
// of its own, because that is already the per-pane config store and a second one
// would drift out of step with it.
//
// The ARRAY ORDER IS THE CYCLE ORDER, and CARD_MODE_UI's titles describe what the
// NEXT click does -- reorder one and the other has to move with it. First entry
// is the default for a pane that has never been switched: floating, the layout
// the tool has always had, so nothing moves under a reader who did not ask for
// it. One click from there docks; a second hides.
const CARD_MODES   = ['float', 'dock', 'off'];
// Legacy: the key the global version wrote. Still read, so a reader who had
// chosen `dock` back then keeps it as the default for panes that have no stored
// mode of their own. Never written any more.
const LS_CARD_MODE = 'tb_card_mode';
// 'dock' rather than CARD_MODES[0] ('float'): floating cards cover the price
// action they describe, and the dock no longer costs the chart anything that
// grows with the card count (fixed-height strip, see .card-dock). A stored
// choice still wins — this is only the default for a pane that never chose.
function defaultCardMode() {
  const v = localStorage.getItem(LS_CARD_MODE);
  return CARD_MODES.includes(v) ? v : 'dock';
}
function cardMode(pane) {
  return (pane && CARD_MODES.includes(pane.cardMode)) ? pane.cardMode : defaultCardMode();
}
function setCardMode(pane, mode) {
  if (!pane) return;
  pane.cardMode = CARD_MODES.includes(mode) ? mode : defaultCardMode();
  try { savePaneCfg(); } catch (e) { console.warn('card mode save:', e); }
  try { applyCardMode(pane); syncCardModeBtn(pane); } catch (e) { console.warn('card mode:', e); }
}

// One flow strip per pane, a SIBLING of .chart-body rather than a child of it.
// The body scrolls now (sub-plots extend past the bottom of the pane), and a
// dock inside it would scroll away with them — the cards are a permanent
// readout, not another row of the chart stack, so they stay pinned to the
// bottom edge of the pane while the chart column scrolls behind them.
function ensureCardDock(pane) {
  const host = pane.el;
  if (!host) return null;
  let dock = host.querySelector(':scope > .card-dock');
  if (!dock) {
    dock = document.createElement('div');
    dock.className = 'card-dock empty';
    host.appendChild(dock);
    pane._syncDock = watchDock(dock);
  }
  return dock;
}

// The dock has to collapse when every card in it is hidden. Cards are shown and
// hidden by a dozen different renderers writing style.display, so rather than
// add a call to each one — which the next card added would forget — watch the
// dock itself. Coalesced to one frame because a render pass touches several
// cards in a row.
function watchDock(dock) {
  let queued = false;
  const sync = () => {
    queued = false;
    const any = Array.from(dock.children).some(c => getComputedStyle(c).display !== 'none');
    dock.classList.toggle('empty', !any);
  };
  // setTimeout, not requestAnimationFrame: a pane in a background tab stops
  // getting animation frames, and the dock would then sit collapsed over live
  // cards until the user looked at it. Timers still run there.
  const queue = () => { if (!queued) { queued = true; setTimeout(sync, 0); } };
  new MutationObserver(queue).observe(dock, {
    attributes: true, attributeFilter: ['style', 'class'], childList: true, subtree: true,
  });
  sync();
  return sync;
}

// Where a card lives is a mode, not a fixed parent. Every card declares the home
// it wants when cards FLOAT — the top-right action stack, or its own chart
// corner — and is mounted through here, so the switch can re-home all of them
// without thirteen renderers each having to know about the dock.
function mountCard(pane, el, home) {
  el.dataset.cardHome = home;
  const host = cardHost(pane, home);
  if (host) host.appendChild(el);
  return el;
}
function cardHost(pane, home) {
  if (cardMode(pane) === 'dock') return ensureCardDock(pane);
  return home === 'stack' ? ensureActionStack(pane)
                          : pane.el.querySelector('.chart-main');
}

function applyCardMode(pane) {
  const mode = cardMode(pane);
  const chartMain = pane.el.querySelector('.chart-main');
  const dock = ensureCardDock(pane);
  if (!chartMain || !dock) return;
  Array.from(pane.el.querySelectorAll('[data-card-home]')).forEach(el => {
    const host = (mode === 'dock') ? dock
               : (el.dataset.cardHome === 'stack' ? ensureActionStack(pane) : chartMain);
    if (el.parentElement !== host) host.appendChild(el);
  });
  pane.el.classList.toggle('cards-off', mode === 'off');
  dock.hidden = (mode !== 'dock');
  if (pane._syncDock) pane._syncDock();
  // Docking takes height out of the flex column, so the chart is now a different
  // size and every price-anchored overlay is drawing against a stale y-mapping.
  // The ResizeObserver on .chart-main repaints four of them; this is the rest.
  try { redrawPaneOverlays(pane, true); } catch {}
}

// ── Symbol search (TradingView-style typeahead, backed by /api/symbols/search) ──
const symSearchCache = new Map();   // query → results[] (small in-memory cache)

function debounce(fn, ms) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

async function fetchSymbolMatches(query) {
  const q = query.trim();
  if (!q) return [];
  if (symSearchCache.has(q)) return symSearchCache.get(q);
  try {
    const r = await fetch(`${SERVER}/api/symbols/search?q=${encodeURIComponent(q)}&limit=20`);
    if (!r.ok) return [];
    const d = await r.json();
    const results = d.results || [];
    symSearchCache.set(q, results);
    return results;
  } catch (e) {
    console.warn('Symbol search failed:', e);
    return [];
  }
}

function fmtPrice(p) {

}
function fmtChg(chgPct) {
  if (chgPct === null || isNaN(chgPct)) return '';
  const sign = chgPct >= 0 ? '+' : '';
  return `${sign}${chgPct.toFixed(2)}%`;
}
// Currency prefix for the absolute change figure. The symbol suffix alone
// is unambiguous for NSE/BSE (.NS/.BO) and indices (^), but a bare ticker
// could be a US stock (AAPL) or a crypto coin (BTC) — those look identical
// as strings. We disambiguate using `source` ('yfinance' vs 'hyperliquid'),
// which the server already resolved via detect_source() and echoes back on
// every /api/ohlcv response — cheaper and more correct than re-guessing here.
function currencyPrefix(symbol, source) {
  const s = symbol.toUpperCase();
  if (s.endsWith('.NS') || s.endsWith('.BO') || s.endsWith('.BSE')) return '₹';
  if (s.startsWith('^')) return '';
  if (s.endsWith('=X') || s.endsWith('.NYB')) return '';  // forex rate / USD index — unitless
  if (source === 'hyperliquid') return '';   // crypto — no fixed prefix
  return '$';                                 // yfinance + no suffix = US equity / =F future (USD)
}
function fmtAbsChange(diff, symbol, source) {
  if (diff === null || isNaN(diff)) return '';
  // Explicit sign always shown (never rely on pill color alone — same
  // accessibility convention as gain_loss_badge() in dashboard_app.py).
  const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
  const prefix = currencyPrefix(symbol, source);
  const abs = Math.abs(diff);
  // Equities (₹/$): clean 2-decimal display matching how prices are quoted
  // (Google Finance shows "+0.65", not "+0.650000"). Crypto (no prefix)
  // keeps fmtPrice's adaptive precision since its magnitudes span from
  // sub-cent meme coins to $100k+ BTC.
  const formatted = prefix ? abs.toFixed(2) : fmtPrice(abs);
  return `${sign}${prefix}${formatted}`;
}

// ── Grid builder ──────────────────────────────────────────────────────────────
function buildGrid(count) {
  // Tear down existing panes
  panes.forEach(p => {
    if (p.resizeObs) p.resizeObs.disconnect();
    Object.values(p.subCharts || {}).forEach(sub => {
      if (sub.ro) sub.ro.disconnect();
      try { sub.chart.remove(); } catch {}
    });
    if (p.chart) try { p.chart.remove(); } catch {}
  });
  panes = [];

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.className = GRID_CLASSES[count] || 'g4';

  const saved = loadPaneCfg();

  for (let i = 0; i < count; i++) {
    const def  = DEFAULT_SYMS[i % DEFAULT_SYMS.length];
    const cfg  = saved[i] || {};
    const sym  = cfg.symbol || def.symbol;
    const tf   = cfg.tf     || def.tf;
    const pane = makePane(i, sym, tf, cfg.indicators || [], cfg.rangePreset, cfg.chartType, cfg.cardMode);
    grid.appendChild(pane.el);
    panes.push(pane);
    // Stagger loads to avoid hammering the server
    setTimeout(() => loadData(i), i * 180);
  }
}

// ── Pane factory ──────────────────────────────────────────────────────────────
function makePane(idx, symbol, tf, savedIndicators, savedRangePreset, savedChartType, savedCardMode) {
  savedIndicators = savedIndicators || [];
  const chartType = savedChartType || 'candles';
  const el = document.createElement('div');
  el.className = 'pane';
  el.innerHTML = `
    <div class="ph">
      <div class="sym-wrap">
        <input type="text" class="sym-in" value="${symbol}" autocomplete="off"
               title="Type a symbol or company name, pick a match, or press Enter to load">
        <div class="sym-dropdown"></div>
      </div>
      <select class="tf-sel">${TIMEFRAMES.map(t =>
        `<option value="${t}"${t===tf?' selected':''}>${t}</option>`
      ).join('')}</select>
      <select class="tf-sel ctype-sel" title="Chart type">${CHART_TYPES.map(ct =>
        `<option value="${ct.value}"${ct.value===chartType?' selected':''}>${ct.label}</option>`
      ).join('')}</select>
      <button type="button" class="nav-btn nav-back" title="Back to previous chart (⌘←)">←</button>
      <button type="button" class="nav-btn nav-forward" title="Forward to next chart (⌘→)">→</button>
      <div class="ind-wrap">
        <button type="button" class="ind-btn">INDICATORS</button>
        <div class="ind-panel">${renderIndicatorPanel()}</div>
      </div>
      <button type="button" class="ind-btn snap-btn" title="Copy chart image to clipboard">📷</button>
      <div class="qlinks" title="External research links for this symbol"></div>
      <div class="ticker-wrap">
        <span class="sym-badge">${symbol}</span>
        <span class="sym-company"></span>
        <span class="sym-exch-badge"></span>
        <span class="price-el" title="Last price">—</span>
        <span class="chg-el"  title="Change vs previous close">—</span>
        <span class="etf-badge" title="Liquid-ETF / cash-equivalent detected — momentum indicators (RSI, MACD, %R, RS, Elliott) are hidden because they produce noise-level signals on a near-monotonic yield instrument. Volume, volume profile and moving averages remain available.">CASH-EQ</span>
      </div>
    </div>
    <div class="range-row">${RANGE_PRESETS.map(p =>
      `<button type="button" class="range-btn" data-range="${p.label}">${p.label}</button>`
    ).join('')}<span class="range-sep"></span><input type="date" class="goto-date" title="Go to date — jump the chart to a specific date"><button type="button" class="range-btn goto-btn" title="Jump the chart to the selected date">Go&nbsp;to</button></div>
    <div class="chart-body">
      <div class="chart-main">
        <div class="loading-msg">Loading…</div>
      </div>
      <div class="sub-panes"></div>
    </div>`;

  const symIn      = el.querySelector('.sym-in');
  const symDrop    = el.querySelector('.sym-dropdown');
  const tfSel      = el.querySelector('.tf-sel');
  const chartMain  = el.querySelector('.chart-main');
  const priceEl    = el.querySelector('.price-el');
  const chgEl      = el.querySelector('.chg-el');
  const badge      = el.querySelector('.sym-badge');
  const companyEl  = el.querySelector('.sym-company');
  const exchBadge  = el.querySelector('.sym-exch-badge');
  const indBtn     = el.querySelector('.ind-btn');
  const indPanel   = el.querySelector('.ind-panel');
  const snapBtn    = el.querySelector('.snap-btn');
  const chartBody  = el.querySelector('.chart-body');

  // ── Right-click drag to scroll vertically ─────────────────────────────────
  {
    let dragging = false, startY = 0, startScroll = 0;
    chartBody.addEventListener('contextmenu', e => e.preventDefault());
    chartBody.addEventListener('mousedown', e => {
      if (e.button !== 2) return;
      dragging = true; startY = e.clientY; startScroll = chartBody.scrollTop;
      e.preventDefault();
      chartBody.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      chartBody.scrollTop = startScroll - (e.clientY - startY);
    });
    window.addEventListener('mouseup', e => {
      if (e.button !== 2 || !dragging) return;
      dragging = false;
      chartBody.style.cursor = '';
    });
  }

  // ── LWC chart ──────────────────────────────────────────────────────────────
  const chart = LightweightCharts.createChart(chartMain, {
    width:  chartMain.clientWidth  || 300,
    height: chartMain.clientHeight || 200,
    ...mainChartOpts(),
  });

  const series = chart.addCandlestickSeries({
    upColor:       '#26a69a',
    downColor:     '#ef5350',
    borderVisible: false,
    wickUpColor:   '#26a69a',
    wickDownColor: '#ef5350',
  });

  // ── Volume profile canvas overlay (always present, drawn on demand) ────────
  const volCanvas = document.createElement('canvas');
  volCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:10;width:100%;height:100%;';
  chartMain.appendChild(volCanvas);

  // ── Fair Value Gap canvas overlay (always present, drawn on demand) ────────
  // z-index below volCanvas so the volume profile histogram (right edge)
  // stays legible if both indicators are on at once.
  const fvgCanvas = document.createElement('canvas');
  fvgCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:9;width:100%;height:100%;';
  chartMain.appendChild(fvgCanvas);

  // ── Pattern base-zone canvas overlay (VCP / Rounding Bottom footprints) ────
  // z-index below fvg so the FVG imbalance boxes and volume-profile histogram
  // stay legible on top. Drawn on demand by drawPatternZones().
  const patternCanvas = document.createElement('canvas');
  patternCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:8;width:100%;height:100%;';
  chartMain.appendChild(patternCanvas);

  // ── Order Block canvas overlay (SMC demand/supply zones) ───────────────────
  // Broad backdrop zones — z-index below FVG/pattern so the sharper imbalance
  // boxes stay legible on top. Drawn on demand by drawOrderBlocks().
  const obCanvas = document.createElement('canvas');
  obCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:7;width:100%;height:100%;';
  chartMain.appendChild(obCanvas);

  // ── %R exhaustion background tint (lowest overlay — a faint context wash) ───
  // Full-height red/green bands where %R Trend Exhaustion sits in its OB/OS zone,
  // so the pressure is visible on the price chart before the flip. Drawn by
  // drawPrteBackground(); the ▲/▼ flip arrows go on the candles via markers.
  const prteCanvas = document.createElement('canvas');
  prteCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5;width:100%;height:100%;';
  chartMain.appendChild(prteCanvas);

  // ── Price-projection canvas overlay (Milestone 3 forward line + label) ─────
  const projCanvas = document.createElement('canvas');
  projCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:7;width:100%;height:100%;';
  chartMain.appendChild(projCanvas);

  // ── Fibonacci grid + trade-plan canvas overlay ────────────────────────────
  // Lowest z-index of the price-anchored overlays: the grid is a horizontal
  // backdrop that the projection slope, FVG boxes and volume histogram are all
  // meant to be read ON TOP OF. Above it they would be obscured by it.
  const fibCanvas = document.createElement('canvas');
  fibCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:6;width:100%;height:100%;';
  chartMain.appendChild(fibCanvas);

  // ── User drawing canvas (topmost — your markup sits over every indicator) ──
  // The ONLY overlay canvas that ever takes pointer events. It stays
  // pointer-events:none so the chart pans and zooms exactly as before, and flips
  // to auto only while a tool is armed or the erase mode is on. Without that
  // toggle the canvas would swallow every drag and the chart would feel frozen.
  const drawCanvas = document.createElement('canvas');
  drawCanvas.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:20;width:100%;height:100%;';
  chartMain.appendChild(drawCanvas);

  const drawTools = document.createElement('div');
  drawTools.className = 'draw-tools';
  drawTools.innerHTML = DRAW_TOOLBAR_HTML;
  chartMain.appendChild(drawTools);

  // Track whether we've ever seen a real (>0) size. If the chart was created
  // at fallback 300×200 because chartMain was 0×0 at construction time, the
  // first resize to real dimensions is also when we need to *re-apply* the
  // visible range view — otherwise setData()'s bars are placed on the fallback
  // time axis and stay off-screen after the true axis is measured, showing
  // a completely blank chart.
  let hadRealSize = false;
  const resizeObs = new ResizeObserver(entries => {
    for (const e of entries) {
      const {width, height} = e.contentRect;
      if (width > 0 && height > 0) {
        chart.resize(Math.floor(width), Math.floor(height));
        if (!hadRealSize) {
          hadRealSize = true;
          // First real measurement — re-fit the range so any bars loaded
          // during the 0×0 window snap into the correct visible extent.
          if (pane && pane.bars && pane.bars.length) {
            try { applyRangeView(pane); } catch {}
          }
        }
        // A resize changes how many bars are visible but does NOT fire
        // subscribeVisibleTimeRangeChange (that only fires on pan/zoom),
        // so sub-panes (RSI/Volume/etc.) would otherwise be left showing
        // the stale range from before the resize. Re-push it here (logical).
        syncSubPaneRanges(pane);
        if (pane && pane.indicators && pane.indicators.has('volprofile'))
          drawVolumeProfile(pane);
        if (pane && pane.indicators && pane.indicators.has('fvg'))
          drawFVG(pane);
        if (pane && pane.indicators &&
            (pane.indicators.has('vcp') || pane.indicators.has('roundbottom') ||
             pane.indicators.has('doublebottom')))
          drawPatternZones(pane);
        if (pane && pane.indicators && pane.indicators.has('projection'))
          drawProjection(pane);
        // The drawing canvas is sized from offsetWidth/Height on every paint,
        // so a resize leaves it stretched until it repaints.
        if (pane && pane.drawings && pane.drawings.length) scheduleDrawRedraw(pane);
      }
    }
  });
  resizeObs.observe(chartMain);

  // ── Pane object ────────────────────────────────────────────────────────────
  const pane = { idx, el, chart, series, resizeObs, symbol, tf,
                 lastPrice: null, openPrice: null, prevClose: null, dataSource: null,
                 priceEl, chgEl, badge,
                 bars: [], indicators: new Set(savedIndicators),
                 chartType,
                 rangePreset: savedRangePreset || DEFAULT_RANGE_PRESET,
                 cardMode: CARD_MODES.includes(savedCardMode) ? savedCardMode : defaultCardMode(),
                 indSeries: {}, subCharts: {}, volCanvas, fvgCanvas, patternCanvas, projCanvas,
                 fibCanvas, obCanvas, prteCanvas,
                 drawCanvas, drawTools,
                 drawings: [], drawTool: null, drawSel: null, drawMagnet: true,
                 drawHidden: false, drawStart: null, drawPreview: null,
                 // Chart history navigation
                 chartHistory: [{symbol, tf, chartType, indicators: new Set(savedIndicators)}],
                 historyIdx: 0 };

  // ── Time-scale sync: main chart drives all sub-pane charts ─────────────────
  chart.timeScale().subscribeVisibleTimeRangeChange(range => {
    if (!range) return;
    syncSubPaneRanges(pane);   // logical-range sync (see syncSubPaneRanges)
    // FVG boxes are anchored to time coordinates, so panning/zooming the
    // x-axis (unlike Volume Profile, which only depends on the y-axis) must
    // also trigger a redraw — otherwise the boxes drift away from their bars.
    redrawPaneOverlays(pane);
  });

  // ── Crosshair sync to sub-pane charts ─────────────────────────────────────
  chart.subscribeCrosshairMove(param => {
    Object.values(pane.subCharts).forEach(sub => {
      if (!sub.series) return;
      if (!param.point || !param.time) {
        try { sub.chart.clearCrosshairPosition(); } catch {}
      } else {
        try { sub.chart.setCrosshairPosition(NaN, param.time, sub.series); } catch {}
      }
    });
  });

  // ── Chart history navigation ───────────────────────────────────────────────
  const navBackBtn    = el.querySelector('.nav-back');
  const navForwardBtn = el.querySelector('.nav-forward');

  function updateNavButtons() {
    navBackBtn.disabled = pane.historyIdx <= 0;
    navForwardBtn.disabled = pane.historyIdx >= pane.chartHistory.length - 1;
  }

  pane.recordChartState = function() {
    const current = this.chartHistory[this.historyIdx];
    // Only add to history if the chart state actually changed
    if (!current || current.symbol !== this.symbol || current.tf !== this.tf ||
        current.chartType !== this.chartType) {
      // Remove any forward history when a new chart is loaded
      this.chartHistory = this.chartHistory.slice(0, this.historyIdx + 1);
      this.chartHistory.push({
        symbol: this.symbol,
        tf: this.tf,
        chartType: this.chartType,
        indicators: new Set(this.indicators)
      });
      this.historyIdx = this.chartHistory.length - 1;
      updateNavButtons();
    }
  };

  pane.navigateToHistory = function(histIdx) {
    if (histIdx < 0 || histIdx >= this.chartHistory.length) return;
    this.historyIdx = histIdx;
    const entry = this.chartHistory[histIdx];
    symIn.value = entry.symbol;
    tfSel.value = entry.tf;
    ctypeSel.value = entry.chartType;
    this.indicators = new Set(entry.indicators);
    this.symbol = entry.symbol;
    this.tf = entry.tf;
    this.chartType = entry.chartType;
    resetPaneVisuals(this);
    applyPriceStyle(this);
    applyIndicators(this);
    loadData(idx);
    savePaneCfg();
    updateNavButtons();
  };

  navBackBtn.addEventListener('click', () => {
    if (pane.historyIdx > 0) pane.navigateToHistory(pane.historyIdx - 1);
  });

  navForwardBtn.addEventListener('click', () => {
    if (pane.historyIdx < pane.chartHistory.length - 1) pane.navigateToHistory(pane.historyIdx + 1);
  });

  updateNavButtons();

  // Resolve the exchange chip, the company-name headline and the research
  // links for a symbol. Called both when the symbol CHANGES and once at pane
  // creation — the initial symbol comes straight from saved config / the URL
  // and never passes through applySymbol, so without the init call a restored
  // pane sat there showing the bare ticker and no exchange chip.
  function refreshSymbolMeta(s) {
    const bare = s.replace(/\.(NS|BO|BSE)$/i, '');
    const suffix = (s.match(/\.(NS|BO|BSE)$/i) || [''])[0].toUpperCase();
    const wantExch = suffix === '.NS' ? 'NSE' : (suffix === '.BO' || suffix === '.BSE') ? 'BSE' : null;
    renderQuickLinks(el, bare, wantExch);   // per-symbol external research links
    fetchSymbolMatches(bare).then(results => {
      // Ignore a response that lost the race with a newer symbol.
      if (pane.symbol.toUpperCase() !== s.toUpperCase()) return;
      // If pane symbol has an exchange suffix, only accept matches from that
      // exchange — otherwise a BSE-only ticker like 'MARINE.BO' would fall
      // back to NSE 'MARINE.NS' (a totally different company) and mislabel
      // the chart.
      let match = results.find(r => r.symbol.toUpperCase() === s.toUpperCase());
      if (!match && wantExch) {
        match = results.find(r => r.exchange === wantExch && r.display.toUpperCase() === bare.toUpperCase());
      }
      if (!match && !wantExch) {
        match = results.find(r => r.display.toUpperCase() === bare.toUpperCase()) || results[0];
      }
      if (match) {
        companyEl.textContent = match.name;
        companyEl.title = match.name;
        // Company name replaces the ticker as the headline label (the ticker is
        // already in the symbol input at the far left of the toolbar).
        badge.textContent = match.name;
        badge.title = `${s} — ${match.name}`;
        exchBadge.textContent = match.exchange;
        exchBadge.className = `sym-exch-badge ${match.exchange}`;
      } else if (wantExch) {
        exchBadge.textContent = wantExch;
        exchBadge.className = `sym-exch-badge ${wantExch}`;
      }
    });
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  function applySymbol(s) {
    s = s.trim().toUpperCase();
    if (!s) return;
    pane.symbol = s;
    pane.lastPrice = null;
    pane.openPrice = null;
    pane.prevClose = null;
    pane.dataSource = null;
    badge.textContent = s;
    companyEl.textContent = '';
    exchBadge.textContent = '';
    exchBadge.className = 'sym-exch-badge';
    priceEl.textContent = '—';
    priceEl.className = 'price-el';
    chgEl.textContent  = '';
    chgEl.className    = 'chg-el';
    // Same full reset as the tf-change handler — every series and overlay, so
    // the incoming symbol never shares an axis with the outgoing one's data.
    resetPaneVisuals(pane);
    // Drawings are keyed per symbol, so swap in the new symbol's set. (They
    // deliberately survive a TIMEFRAME change — a level you drew on the daily
    // is still that level on the weekly, since anchors are timestamps.)
    try { loadDrawings(pane); } catch {}
    refreshSymbolMeta(s);
    savePaneCfg();
    loadData(idx);
  }

  // ── Symbol search dropdown (TradingView-style typeahead) ───────────────────
  let symResults  = [];
  let symHlIdx    = -1;

  function closeSymDropdown() {
    symDrop.classList.remove('open');
    symResults = [];
    symHlIdx = -1;
  }

  function highlightSymOpt(i) {
    symDrop.querySelectorAll('.sym-opt').forEach(o => o.classList.remove('hl'));
    if (i < 0 || i >= symResults.length) { symHlIdx = -1; return; }
    symHlIdx = i;
    const opt = symDrop.querySelector(`.sym-opt[data-idx="${i}"]`);
    if (opt) { opt.classList.add('hl'); opt.scrollIntoView({block: 'nearest'}); }
  }

  function pickSymResult(i) {
    const r = symResults[i];
    if (!r) return;
    symIn.value = r.display;
    closeAllSymbolDropdowns();
    applySymbol(r.symbol);
  }

  const runSymSearch = debounce(async (q) => {
    const results = await fetchSymbolMatches(q);
    symResults = results;
    symHlIdx = -1;
    renderSymResults(symDrop, results, q);
    symDrop.classList.add('open');
  }, 180);

  symIn.addEventListener('input', () => {
    const q = symIn.value.trim();
    if (!q) { closeSymDropdown(); return; }
    runSymSearch(q);
  });

  symIn.addEventListener('focus', () => {
    if (symIn.value.trim()) runSymSearch(symIn.value.trim());
  });

  symIn.addEventListener('click', e => e.stopPropagation());

  symIn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (symDrop.classList.contains('open') && symResults.length)
        highlightSymOpt((symHlIdx + 1) % symResults.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (symDrop.classList.contains('open') && symResults.length)
        highlightSymOpt((symHlIdx - 1 + symResults.length) % symResults.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (symDrop.classList.contains('open') && symHlIdx >= 0) {
        pickSymResult(symHlIdx);
      } else if (symDrop.classList.contains('open') && symResults.length) {
        pickSymResult(0);
      } else {
        closeAllSymbolDropdowns();
        applySymbol(symIn.value);
      }
    } else if (e.key === 'Escape') {
      closeSymDropdown();
      symIn.blur();
    }
  });

  symDrop.addEventListener('click', e => {
    const opt = e.target.closest('.sym-opt');
    if (!opt) return;
    pickSymResult(parseInt(opt.dataset.idx, 10));
  });

  symDrop.addEventListener('mousemove', e => {
    const opt = e.target.closest('.sym-opt');
    if (opt) highlightSymOpt(parseInt(opt.dataset.idx, 10));
  });

  pane._closeSymDropdown = closeSymDropdown;

  tfSel.addEventListener('change', () => {
    pane.tf = tfSel.value;
    // Clear EVERY series and overlay, not just the candles — otherwise old-tf
    // data lingers visible during the async loadData(), the visible-range
    // subscribe callback fires against stale time coordinates that don't
    // intersect the incoming new-tf data (see NH.NS %R collapse, 2026-07-03),
    // and the leftover daily timestamps crash Lightweight Charts' paint loop
    // (see resetPaneVisuals).
    resetPaneVisuals(pane);
    savePaneCfg();
    loadData(idx);
  });

  // ── Chart type (Candles / Heikin Ashi) — display-only, no reload needed ──────
  const ctypeSel = el.querySelector('.ctype-sel');
  ctypeSel.addEventListener('change', () => {
    pane.chartType = ctypeSel.value;
    applyPriceStyle(pane);   // re-feed the candle series from the same pane.bars
    savePaneCfg();
  });

  // ── Indicators dropdown ──────────────────────────────────────────────────────
  indBtn.addEventListener('click', e => {
    e.stopPropagation();
    const willOpen = !indPanel.classList.contains('open');
    closeAllIndicatorPanels();
    if (willOpen) {
      indPanel.classList.add('open'); indBtn.classList.add('active');
      const s = indPanel.querySelector('.ind-search');
      if (s) setTimeout(() => { s.focus(); s.select(); }, 0);   // ready to type immediately
    }
  });

  snapBtn.addEventListener('click', () => copyChartSnapshot(pane));

  const rangeBtns = el.querySelectorAll('.range-btn[data-range]');
  rangeBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === pane.rangePreset);
    btn.addEventListener('click', () => {
      pane.rangePreset = btn.dataset.range;
      rangeBtns.forEach(b => b.classList.toggle('active', b === btn));
      clearGotoLine(pane);          // leaving the focused date for a preset window
      applyRangeView(pane);
      savePaneCfg();
    });
  });

  // ── Go to date (TradingView-style) ──────────────────────────────────────────
  const gotoInput = el.querySelector('.goto-date');
  const gotoBtn   = el.querySelector('.goto-btn');
  const runGoto = () => { if (gotoInput.value) gotoDate(pane, gotoInput.value); };
  gotoBtn.addEventListener('click', runGoto);
  gotoInput.addEventListener('change', runGoto);   // picking a date jumps immediately

  indPanel.querySelectorAll('.ind-chk').forEach(chk => {
    const key = chk.dataset.key;
    chk.checked = pane.indicators.has(key);
    chk.addEventListener('change', () => {
      // Row may have been greyed out by ETF-mode after last render — the
      // CSS blocks the click but a keyboard-driven change event can still
      // fire, so belt-and-braces refuse it here too.
      const row = chk.closest('.ind-row');
      if (chk.checked && row && row.classList.contains('ind-disabled')) {
        chk.checked = false;
        return;
      }
      if (chk.checked) pane.indicators.add(key);
      else             pane.indicators.delete(key);
      applyIndicators(pane);
      savePaneCfg();
      if (pane._refreshIndActiveCount) pane._refreshIndActiveCount();
      // Un-ticking while the "On this chart" view is up must drop the row, or
      // the list keeps showing something that is no longer on the chart.
      if (pane._filterIndicators) pane._filterIndicators();
    });
  });

  // ── Indicator search / family filter ────────────────────────────────────────
  const indSearch = indPanel.querySelector('.ind-search');
  const indEmpty  = indPanel.querySelector('.ind-empty');
  const indList   = indPanel.querySelector('.ind-list');
  let indFam = '__all__';

  // Kept current by every checkbox change, so the rail's "On this chart" count
  // is a live read of pane.indicators rather than a number that drifts.
  function refreshActiveCount() {
    const n = indPanel.querySelectorAll('.ind-chk:checked').length;
    const badge = indPanel.querySelector('[data-active-count]');
    if (badge) badge.textContent = n;
  }
  pane._refreshIndActiveCount = refreshActiveCount;

  function filterIndicators() {
    const q = indSearch ? indSearch.value.trim().toLowerCase() : '';
    // A search spans every family — typing is how you escape the rail, so a
    // query silently widens the scope instead of returning "no matches" for a
    // term that exists one family over.
    const fam = q ? '__all__' : indFam;
    indPanel.classList.toggle('ind-searching', !!q);
    let anyVisible = false;
    indPanel.querySelectorAll('.ind-group').forEach(group => {
      let groupVisible = false;
      group.querySelectorAll('.ind-row').forEach(row => {
        const okFam = fam === '__all__'
                    || (fam === '__active__' ? row.querySelector('.ind-chk').checked
                                             : row.dataset.fam === fam);
        const match = okFam && (!q || (row.dataset.search || '').includes(q));
        row.style.display = match ? '' : 'none';
        if (match) groupVisible = true;
      });
      group.style.display = groupVisible ? '' : 'none';   // hide whole group when empty
      if (groupVisible) anyVisible = true;
    });
    if (indEmpty) {
      indEmpty.style.display = anyVisible ? 'none' : '';
      indEmpty.textContent = (!anyVisible && fam === '__active__' && !q)
        ? 'Nothing on this chart yet'
        : 'No indicators match';
    }
  }
  pane._filterIndicators = filterIndicators;

  indPanel.querySelectorAll('.ind-fam').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();                      // don't close the panel
      indFam = btn.dataset.fam;
      indPanel.querySelectorAll('.ind-fam').forEach(b => b.classList.toggle('active', b === btn));
      if (indSearch) indSearch.value = '';      // family and query are one scope
      filterIndicators();
      if (indList) indList.scrollTop = 0;
    });
  });

  if (indSearch) {
    indSearch.addEventListener('input', () => {
      // Typing leaves whatever family was picked; reflect that in the rail so
      // the highlighted chip never contradicts what the list is showing.
      if (indSearch.value.trim()) {
        indPanel.querySelectorAll('.ind-fam').forEach(b =>
          b.classList.toggle('active', b.dataset.fam === '__all__'));
        indFam = '__all__';
      }
      filterIndicators();
    });
    indSearch.addEventListener('click', e => e.stopPropagation());   // don't close the panel
    indSearch.addEventListener('keydown', e => {
      if (e.key === 'Escape') { indSearch.value = ''; filterIndicators(); indSearch.blur(); }
      else if (e.key === 'Enter') {
        // If exactly one match is visible and enabled, toggle it — fast path.
        const vis = [...indPanel.querySelectorAll('.ind-row')]
          .filter(r => r.style.display !== 'none' && !r.classList.contains('ind-disabled'));
        if (vis.length === 1) {
          const c = vis[0].querySelector('.ind-chk');
          c.checked = !c.checked;
          c.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    });
  }
  refreshActiveCount();

  // Drawing tools: wire the toolbar/canvas, then restore this symbol's markup.
  try { wireDrawingTools(pane); loadDrawings(pane); } catch (e) { console.warn('drawing tools:', e); }

  // Build the dock and apply the saved placement before any card exists, so the
  // first card a renderer mounts already lands in the right container.
  try { applyCardMode(pane); } catch (e) { console.warn('card mode:', e); }

  // Label the pane's starting symbol (company name + exchange chip + links).
  try { refreshSymbolMeta(pane.symbol); } catch (e) { console.warn('symbol meta:', e); }

  return pane;
}

// ── Chart snapshot (copy image to clipboard) ────────────────────────────────────
// Composited entirely from existing canvases — the main chart's own
// takeScreenshot() already bakes in every series/marker Lightweight Charts
// drew (candles, overlays, %R/RSI/etc. lines, reversal arrows), so the only
// extra work is layering our own overlay canvases (volume profile / FVG) on
// top and stacking each visible sub-pane's screenshot underneath. No new
// external library (e.g. html2canvas) needed for this.
let _snapToastEl = null;
function showToast(msg, ms = 2200) {
  if (!_snapToastEl) {
    _snapToastEl = document.createElement('div');
    _snapToastEl.className = 'snap-toast';
    document.body.appendChild(_snapToastEl);
  }
  _snapToastEl.textContent = msg;
  _snapToastEl.classList.add('show');
  clearTimeout(_snapToastEl._hideTimer);
  _snapToastEl._hideTimer = setTimeout(() => _snapToastEl.classList.remove('show'), ms);
}

// ── Card readout band ───────────────────────────────────────────────────────
// The info panels (FVG signal, Structure Break Chain, PMax trade state, VCP,
// Elliott Wave, Rounding Bottom, Projection, Session VP, Reversal Calendar) are
// DOM divs, not canvases — takeScreenshot() cannot see them, so snapshots used
// to lose exactly the numbers you took the snapshot for. They are rasterized by
// wrapping clones in an SVG <foreignObject>: the browser lays out real HTML with
// real CSS, so the cards keep their true styling and no external library
// (html2canvas etc.) is needed.
//
// They are laid out in a BAND UNDER the chart rather than composited back over
// it in place (changed 2026-09-12, "insider card is not readable"). Overlaying
// is what the app looks like, but it cannot be made legible: a card is ~260 CSS
// px wide on a chart 1300-2700 CSS px wide, so in a shared PNG — which every
// viewer sees scaled to fit — the 10.5px card type lands under half a pixel per
// stroke. Magnifying the cards in place was tried first and is bounded by the
// chart's own HEIGHT, not by resolution: measured on the running chart, the top
// card stack is already 56% of it (259px of 458px) and the bottom Session VP
// card another 32%, so the most that fits before the two blocks meet is 1.08x —
// 7px type in an 800px-wide view, still unreadable. A band has as much room as
// it needs, so the cards are drawn at a constant ~34% of the image width
// whatever the monitor, and the price action stops being covered by them.
//
// Two details make the rasterization work: the page's own stylesheet is inlined
// (foreignObject gets no access to the parent document's CSS), and the :root
// custom properties are copied as resolved values (`:root` inside the SVG would
// not match the document root, so --overlay-bg etc. would silently fall back to
// nothing). Reading them off getComputedStyle also means the snapshot follows
// the live Dark/Light toggle for free.
// Cards are found by the attribute mountCard() stamps on every one of them, not
// by a list of class names. The hand-maintained list this replaces had already
// drifted — it was missing the OI-walls and falling-wedge cards — and it could
// only find cards parented under .chart-main, which stopped being true the
// moment the placement switch gained a dock below the sub-plots.
const SNAP_PANEL_SEL = '[data-card-home]';

// Width of one "column" of band, in CSS px: the band is laid out this many px
// wide per unit of magnification, so a 260px card is always ~34% of the frame
// and reads at ~11px when the image is viewed 800px wide. Lower = bigger cards.
const SNAP_BAND_REF = 760;

async function renderPanelBand(pane, scale, cssW) {
  const chartMain = pane.el.querySelector('.chart-main');
  if (!chartMain) return null;
  const vis = el => el.offsetParent !== null && getComputedStyle(el).display !== 'none';
  // Whole-pane query, not chart-main: in dock mode the cards live below the
  // sub-plots. Each card is taken individually rather than through its
  // container, so the band reads the same whichever mode the chart is in — and
  // `order` survives, because the band is a flex row like the stack and the
  // dock, so the cards keep the sequence they have on screen. Hidden mode needs
  // no special case: `vis` is false for every card, so the band is skipped.
  const panels = Array.from(pane.el.querySelectorAll(SNAP_PANEL_SEL)).filter(vis);
  if (!panels.length || !cssW) return null;

  // The band is laid out at cssW / K px wide, so K is both the magnification
  // AND how many cards fit per row: shrinking it widens the layout, which
  // un-wraps rows and shortens the band. The two pull against each other, and
  // the resolved K is the largest one whose band still fits `capH` — settled by
  // measuring rather than solving, because where the cards wrap is the
  // browser's call, not arithmetic we can redo here.
  const KMAX = Math.min(3.5, Math.max(1.25, cssW / SNAP_BAND_REF));
  const capH = Math.max(300, 0.9 * (chartMain.clientHeight || 400));

  const rootCS = getComputedStyle(document.documentElement);
  let vars = '';
  for (let i = 0; i < rootCS.length; i++) {
    const prop = rootCS[i];
    if (prop.startsWith('--')) vars += `${prop}:${rootCS.getPropertyValue(prop)};`;
  }

  let css = '';
  for (const sheet of document.styleSheets) {
    // Same-origin inline <style> only; a cross-origin sheet would throw here.
    try { for (const rule of sheet.cssRules) css += rule.cssText + '\n'; } catch {}
  }

  const wrap = document.createElement('div');
  wrap.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  // Width is left to the fit loop below — it is the variable being solved for.
  wrap.setAttribute('style',
    `box-sizing:border-box;display:flex;flex-wrap:wrap;` +
    `align-items:flex-start;gap:8px;padding:9px 10px;${vars}`);
  const style = document.createElement('style');
  style.textContent = css;
  wrap.appendChild(style);
  panels.forEach(el => {
    const clone = el.cloneNode(true);
    // A card anchored to a chart corner would leave the flow as an absolutely
    // positioned flex child and contribute no height at all, collapsing the band
    // to its padding. RELATIVE rather than static, because .rb-info and
    // .vcp-info hang their collapse chevron on an absolutely positioned child
    // that needs the card as its containing block.
    //
    // Unconditional, and that matters: this used to neutralise only cards whose
    // LIVE computed position was absolute, which reads the card in whatever
    // container the placement mode put it in. Docked, `.card-dock > *` has
    // already made it relative, so the test said "not absolute", the clone got
    // no override, and .pmax-info's own `position: absolute` re-applied inside
    // the band — silently dropping every corner card out of the snapshot.
    clone.style.position = 'relative';
    clone.style.top = clone.style.right = clone.style.bottom = clone.style.left = 'auto';
    clone.style.transform = 'none';
    clone.style.margin = '0';
    // Pin each card to the width it has on screen. Where a flex row wraps is
    // otherwise decided by measured text, and the measuring pass here and the
    // SVG image's own layout pass disagreed by a few px — enough to flip a card
    // onto a second row in one pass and not the other, which sized the band for
    // a row the rendered image did not have (a dead strip under the cards).
    // With explicit widths the wrap point is arithmetic, so both passes agree.
    const r = el.getBoundingClientRect();
    clone.style.boxSizing = 'border-box';
    clone.style.width = Math.ceil(r.width) + 'px';
    clone.style.flex = '0 0 auto';
    // In the dock a card is height-capped and scrolls inside itself; a shared
    // image has no scrollbar, so the clone must render its full content.
    clone.style.maxHeight = 'none';
    clone.style.overflow = 'visible';
    wrap.appendChild(clone);
  });

  // <foreignObject> needs an explicit height, and the only honest source for it
  // is the browser: lay the real thing out offscreen in this document, with this
  // document's stylesheet, and measure it.
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none;';
  holder.appendChild(wrap);
  document.body.appendChild(holder);
  // Sweep K from the most magnified down and measure what each one costs. The
  // pick is NOT simply the largest K that fits: a slightly bigger K that spills
  // one card onto a second row makes the band taller AND leaves a hole beside
  // that card, which reads worse than cards a few percent smaller in one row.
  // So the rule is "fewest rows first, then as large as fits" — lh is the proxy
  // for row count, and lhMin is the tightest packing any K achieves.
  const steps = [];
  for (let i = 0; i <= 24; i++) {
    const K = KMAX - (KMAX - 1.25) * (i / 24);
    const lw = Math.max(200, Math.round(cssW / K));
    wrap.style.width = lw + 'px';
    steps.push({K, lw, lh: Math.max(1, Math.ceil(wrap.getBoundingClientRect().height))});
  }
  holder.remove();
  const lhMin = Math.min(...steps.map(s => s.lh));
  // steps is ordered largest K first, so `find` is "the biggest that qualifies".
  // Fallbacks: no minimal-row layout fits the height cap, so take the biggest
  // that fits at all; and if nothing fits, the smallest K — the shortest band.
  const pick = steps.find(s => s.lh <= lhMin * 1.05 && s.lh * s.K <= capH)
            || steps.find(s => s.lh * s.K <= capH)
            || steps[steps.length - 1];
  const K = pick.K, lw = pick.lw, lh = pick.lh;
  wrap.style.width = lw + 'px';

  const xml = new XMLSerializer().serializeToString(wrap);
  // viewBox is the band's CSS-pixel layout; width/height are its device pixels.
  // One attribute pair therefore carries both jobs — content magnified by K, and
  // rendered at `scale` device pixels per CSS pixel, so the cards are natively
  // sharp rather than a 1x render stretched into a 2x canvas.
  const pw = Math.round(cssW * scale), ph = Math.round(lh * K * scale);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${pw}" height="${ph}" viewBox="0 0 ${lw} ${lh}">` +
              `<foreignObject x="0" y="0" width="${lw}" height="${lh}">${xml}</foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  return {img, w: pw, h: ph};
}

// Trim `text` to fit `maxW` device px in the ctx's CURRENT font, ellipsising if
// it has to. The header draws a full company name into whatever room the ticker
// left it, and a long name silently running under the brand is worse than a cut
// one.
function fitTextToWidth(ctx, text, maxW) {
  if (!text || ctx.measureText(text).width <= maxW) return text || '';
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (ctx.measureText(text.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  return lo > 0 ? text.slice(0, lo) + '…' : '';
}

async function copyChartSnapshot(pane) {
  const chartMain = pane.el.querySelector('.chart-main');
  // Re-render Lightweight Charts at a higher pixel ratio for the capture so the
  // candles are NATIVELY sharp — not a low-res screenshot stretched up (which is
  // what read as "degraded"). LWC v4 reads window.devicePixelRatio when it sizes
  // its canvases, so override it, force a resize to rebuild the backing store,
  // screenshot, then restore in finally. Guarded end-to-end: if the hi-DPI path
  // is a no-op on some engine, we fall back to the native screenshot (sharp, just
  // smaller) and never a stretched one. App overlay canvases (volume profile,
  // fib, FVG) keep their own ratio and are scaled by drawImage — fine for
  // line/bar overlays.
  const dpr0    = window.devicePixelRatio || 1;
  const S       = Math.max(2, dpr0);   // target export ratio (>= 2x CSS pixels)

  // ── Export chrome scale ────────────────────────────────────────────────────
  // The snapshot is composed in the chart's own CSS pixels, so every piece of
  // text in it — header, info cards, axis labels — is sized for a desktop
  // viewport sitting an arm's length away. On a 1920px-wide chart that is ~10px
  // type inside a 3840px image, and nobody ever views a 3840px image at 1:1, so
  // it arrives as the grey mush this fixes ("unclear, hazy, card not readable",
  // 2026-09-12). Resolution was never the problem — the hi-DPI path below was
  // already producing crisp pixels of text that is simply too small a share of
  // the frame. Measured before the fix: a 1272px chart exported 2544x1348 with
  // a 16px title and 10.5px cards, i.e. the title was 0.6% of the image height.
  //
  // So the chrome scales with how much wider the chart is than the width its UI
  // was designed to be read at. Capped, because past ~2x the cards start eating
  // the chart they annotate.
  const UI_REF  = 980;                 // CSS px at which the chart UI reads 1:1
