  const UI_K    = Math.min(1.9, Math.max(1, (chartMain.clientWidth || UI_REF) / UI_REF));
  // Lightweight Charts' own axis labels get a gentler bump: unlike the header
  // they are laid out against each other, and scaling them like the header
  // collides the price labels that sit a few px apart on a busy scale (measured
  // at 19px: the buy-side/sell-side line labels overlapped into one blur).
  const AXIS_K  = Math.min(1.25, UI_K);
  const dprDesc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
  const subEls  = Array.from(pane.el.querySelectorAll('.sub-pane'));
  const reflow  = [{chart: pane.chart, el: chartMain}];
  subEls.forEach(subEl => {
    const sub = pane.subCharts[subEl.dataset.key];
    if (sub) reflow.push({chart: sub.chart, el: subEl});
  });
  // Remember each chart's own axis font so the capture can raise it and put it
  // back — read per chart rather than assumed, since a sub-pane may not match.
  reflow.forEach(e => {
    try { e.font0 = (e.chart.options().layout || {}).fontSize || 12; } catch { e.font0 = 12; }
  });
  const relayout = (ratioVal, bigFont) => {
    try { Object.defineProperty(window, 'devicePixelRatio', {configurable: true, get: () => ratioVal}); } catch {}
    // The app overlays do not read devicePixelRatio through LWC, so they are told
    // directly. Without this they render at 1x and drawImage stretches them into
    // the 2x canvas — the candles sharpen and everything drawn ON them does not,
    // which is what "the snapshot still looks poor" actually was.
    SNAP_RATIO = (ratioVal > 1) ? ratioVal : 0;
    reflow.forEach(entry => {
      const {chart, el} = entry;
      // Axis labels ride along with the chrome scale — applied before the resize
      // so the price scale's new width is part of the same relayout.
      const fs = bigFont ? Math.min(16, Math.round(entry.font0 * AXIS_K)) : entry.font0;
      try { chart.applyOptions({layout: {fontSize: fs}}); } catch {}
      const w = el.clientWidth, h = el.clientHeight;
      // Jiggle the width so LWC actually recomputes its bitmap at the new ratio
      // (a same-size resize is a no-op).
      if (w > 0 && h > 0) { try { chart.resize(w - 1, h, true); chart.resize(w, h, true); } catch {} }
    });
  };

  try {
    if (S > dpr0) {
      relayout(S, true);        // engage hi-DPI only when it would help
      // Re-render the overlays INTO the raised ratio. Synchronous, because the
      // capture below runs to completion in this turn and a deferred
      // animation-frame redraw would land after the screenshot.
      redrawPaneOverlays(pane, true);
    }

    const mainShot = pane.chart.takeScreenshot();
    // Stack sub-panes in the order they appear on screen.
    const subShots = subEls.map(subEl => {
      const sub = pane.subCharts[subEl.dataset.key];
      if (!sub) return null;
      return {shot: sub.chart.takeScreenshot(), label: sub.label ? sub.label.textContent : subEl.dataset.key};
    }).filter(Boolean);

    // The ratio actually captured: S if the hi-DPI re-render engaged, else native.
    // All vector drawing uses it; the rasters are drawn at their own native size.
    const ratio   = mainShot.width / (chartMain.clientWidth || mainShot.width) || 1;
    // Chrome (header, footer, sub-pane labels, cards) is drawn at ratio * UI_K
    // so its type holds a constant SHARE of the frame however wide the chart is.
    const u       = ratio * UI_K;
    const headerH = Math.round(52 * u);   // two rows (symbol/company, then price)
    const footerH = Math.round(24 * u);   // brand + timestamp caption strip
    const totalW  = mainShot.width;
    // The card band is rasterized before the canvas exists, because its height
    // is what the canvas has to be sized for. A failure here must not cost the
    // whole snapshot — the chart itself is still worth copying.
    let band = null;
    try {
      band = await renderPanelBand(pane, ratio, chartMain.clientWidth);
    } catch (bandErr) {
      console.warn('Snapshot: card band skipped —', bandErr);
    }
    const bandH   = band ? band.h : 0;
    const totalH  = headerH + mainShot.height
                  + subShots.reduce((s, x) => s + x.shot.height, 0) + bandH + footerH;

    const out = document.createElement('canvas');
    out.width = totalW;
    out.height = totalH;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';   // app overlay canvases are scaled to fit — smooth them

    const rootStyle = getComputedStyle(document.documentElement);
    ctx.fillStyle = rootStyle.getPropertyValue('--bg-pane-header').trim() || '#161b22';
    ctx.fillRect(0, 0, totalW, totalH);

    // Header, two rows — the caption a shared image is actually read by:
    //  Row 1 — SYMBOL (bold) · exchange chip      …      COMPANY NAME (right)
    //  Row 2 — price · change · timeframe         …      Trading Bramha (right)
    //
    // The company name moved to the top RIGHT (2026-09-12). It used to trail the
    // exchange chip on the left in 13px type, where on a wide chart it read as a
    // footnote to the ticker — and the ticker alone does not say what the chart
    // is of. The right corner is the second place a reader's eye lands, so the
    // name takes it and the brand drops to the quiet row underneath.
    const SNAP_FONT = '-apple-system, "Segoe UI", sans-serif';
    const symVal    = pane.el.querySelector('.sym-in').value;
    const tfVal     = pane.el.querySelector('.tf-sel').value;
    const priceEl   = pane.el.querySelector('.price-el');
    const chgEl     = pane.el.querySelector('.chg-el');
    const companyEl = pane.el.querySelector('.sym-company');
    const exchEl    = pane.el.querySelector('.sym-exch-badge');
    const company   = companyEl ? companyEl.textContent.trim() : '';
    const exch      = exchEl ? exchEl.textContent.trim() : '';
    const textPrimary   = rootStyle.getPropertyValue('--text-primary').trim()   || '#e6edf3';
    const textSecondary = rootStyle.getPropertyValue('--text-secondary').trim() || '#8b949e';
    ctx.textBaseline = 'middle';
    const row1Y = Math.round(19 * u), row2Y = Math.round(38 * u);
    const padX  = Math.round(12 * u);

    // Right column FIRST: it fixes the point the left column has to stop before,
    // so a long ticker truncates instead of colliding with the company name.
    ctx.textAlign = 'right';
    let rightLimit = totalW - padX;
    if (company) {
      ctx.font = `600 ${Math.round(15 * u)}px ${SNAP_FONT}`;
      ctx.fillStyle = textPrimary;
      const nameTxt = fitTextToWidth(ctx, company, totalW * 0.52);
      ctx.fillText(nameTxt, totalW - padX, row1Y);
      rightLimit = totalW - padX - ctx.measureText(nameTxt).width - 16 * u;
    }
    ctx.font = `700 ${Math.round(11 * u)}px ${SNAP_FONT}`;
    ctx.fillStyle = textSecondary;
    ctx.fillText('Trading Bramha', totalW - padX, row2Y);
    ctx.textAlign = 'left';

    // Row 1 left — bold symbol, then the exchange chip
    let hx = padX;
    ctx.font = `700 ${Math.round(18 * u)}px ${SNAP_FONT}`;
    ctx.fillStyle = textPrimary;
    const symTxt = fitTextToWidth(ctx, symVal, Math.max(60 * u, rightLimit - hx));
    ctx.fillText(symTxt, hx, row1Y);
    hx += ctx.measureText(symTxt).width + 10 * u;
    // exchange chip
    if (exch) {
      ctx.font = `600 ${Math.round(11 * u)}px ${SNAP_FONT}`;
      const ew = ctx.measureText(exch).width, epx = 6 * u, ech = 18 * u;
      // Take the chip's colours off the live badge rather than hard-coding the
      // dark-theme pair: the old rgba(88,166,255,.18) on #58a6ff washed out to
      // near-invisible on the Light theme's white header.
      const exchCS = getComputedStyle(exchEl);
      ctx.fillStyle = exchCS.backgroundColor || 'rgba(88,166,255,0.18)';
      ctx.fillRect(hx, row1Y - ech / 2, ew + epx * 2, ech);
      ctx.fillStyle = exchCS.color || '#58a6ff';
      ctx.fillText(exch, hx + epx, row1Y);
      hx += ew + epx * 2 + 10 * u;
    }

    // Row 2 — price · change · timeframe (theme-aware up/down coloring preserved)
    let px = padX;
    ctx.font = `600 ${Math.round(15 * u)}px ${SNAP_FONT}`;
    [[priceEl.textContent, getComputedStyle(priceEl).color || textPrimary],
     [chgEl.textContent,   getComputedStyle(chgEl).color   || textPrimary],
     [tfVal,               textSecondary],
    ].forEach(([txt, color]) => {
      if (!txt) return;
      ctx.fillStyle = color;
      ctx.fillText(txt, px, row2Y);
      px += ctx.measureText(txt + '   ').width;
    });

    // Hairline divider under the header
    const hair = Math.max(1, Math.round(ratio / 2));
    ctx.fillStyle = 'rgba(139,148,158,0.25)';
    ctx.fillRect(0, headerH - hair, totalW, hair);

    // Candle chart + its overlay canvases, drawn at the captured size.
    // Both are now rendered AT `ratio`: the candles by Lightweight Charts and the
    // overlays by sizeOverlay via SNAP_RATIO, so these drawImage calls are 1:1
    // rather than an upscale. Any overlay that failed to re-render still fits the
    // same OW/OH box, so a miss degrades to the old soft-but-correct behaviour
    // instead of a misaligned one.
    let y = headerH;
    const OW = mainShot.width, OH = mainShot.height;
    ctx.drawImage(mainShot, 0, y);
    // An overlay is only worth compositing when it actually holds pixels. A
    // layer whose indicator was never switched on can sit at a 0-sized backing
    // store, and drawImage throws InvalidStateError on one of those — which took
    // the ENTIRE snapshot down with it (seen 2026-09-12 on a fresh load, where
    // the drawing layer had been sized before the pane had a width).
    const blit = c => { if (c && c.width > 0 && c.height > 0) ctx.drawImage(c, 0, y, OW, OH); };
    blit(pane.prteCanvas);      // %R exhaustion tint (z-index 5)
    blit(pane.fibCanvas);
    blit(pane.patternCanvas);
    blit(pane.projCanvas);
    blit(pane.obCanvas);        // Order Blocks (z-index 7)
    // Session Volume Profile HD (z-index 8, below volCanvas) — draw before it.
    blit(pane.svpCanvas);
    blit(pane.tpoCanvas);
    blit(pane.volCanvas);
    blit(pane.fvgCanvas);
    // User drawings last of the price-anchored layers (z-index 20) — your own
    // markup should survive into a shared snapshot, and on top of the machine's.
    if (!pane.drawHidden) blit(pane.drawCanvas);
    y += mainShot.height;

    subShots.forEach(({shot, label}) => {
      ctx.drawImage(shot, 0, y);
      const fontSize = Math.round(11 * u), lpx = 7 * u, lpy = 4 * u;
      ctx.font = `600 ${fontSize}px -apple-system, "Segoe UI", sans-serif`;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(4 * u, y + 4 * u, tw + lpx * 2, fontSize + lpy * 2);
      ctx.fillStyle = '#c9d1d9';
      ctx.textBaseline = 'top';
      ctx.fillText(label, 4 * u + lpx, y + 4 * u + lpy);
      ctx.textBaseline = 'middle';
      y += shot.height;
    });

    // Card readout band — the info panels, at a size that survives being shared.
    if (band) {
      const hair2 = Math.max(1, Math.round(ratio / 2));
      ctx.fillStyle = 'rgba(139,148,158,0.25)';
      ctx.fillRect(0, y, totalW, hair2);
      ctx.drawImage(band.img, 0, y, totalW, bandH);
      y += bandH;
    }

    // Footer caption strip — brand, symbol/company, timestamp and a quiet
    // disclaimer, so a shared image explains itself away from the app.
    const fy = totalH - footerH;
    ctx.fillStyle = 'rgba(139,148,158,0.25)';
    ctx.fillRect(0, fy, totalW, Math.max(1, Math.round(ratio / 2)));
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.font = `${Math.round(12 * u)}px -apple-system, "Segoe UI", sans-serif`;
    ctx.fillStyle = textSecondary;
    ctx.fillText(`${symVal}${company ? '  ·  ' + company : ''}`, padX, fy + footerH / 2);
    ctx.textAlign = 'right';
    ctx.fillText(`Trading Bramha · ${new Date().toLocaleString()} · not investment advice`,
                 totalW - padX, fy + footerH / 2);
    ctx.textAlign = 'left';

    out.toBlob(async blob => {
      if (!blob) { showToast('Snapshot failed — could not render image'); return; }
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        showToast('Chart copied to clipboard');
      } catch (clipErr) {
        // Clipboard image writes need a secure context + user gesture; if the
        // browser blocks it, fall back to a direct download so the click
        // still does something useful.
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${symVal}_${tfVal}_${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('Clipboard blocked — downloaded image instead');
      }
    }, 'image/png');
  } catch (err) {
    console.error('Chart snapshot error:', err);
    showToast('Snapshot failed: ' + err.message);
  } finally {
    // Always put devicePixelRatio and the on-screen charts back, even if capture
    // threw. The composited `out` canvas already holds its pixels by now, so this
    // never affects the image — it only restores the live view.
    if (S > dpr0) {
      SNAP_RATIO = 0;           // back to the screen's own ratio
      try {
        if (dprDesc) Object.defineProperty(window, 'devicePixelRatio', dprDesc);
        else Object.defineProperty(window, 'devicePixelRatio', {configurable: true, get: () => dpr0});
      } catch {}
      reflow.forEach(entry => {
        const {chart, el} = entry;
        try { chart.applyOptions({layout: {fontSize: entry.font0}}); } catch {}
        const w = el.clientWidth, h = el.clientHeight;
        // Jiggle on the way BACK too. This used to be a same-size resize, which
        // LWC treats as a no-op for exactly the reason the engage path above
        // already documents — so the charts kept the capture's 2x bitmaps until
        // the next pan. Supersampled and therefore invisible, which is why it
        // survived.
        //
        // Measured after the fix (2026-09-11): the main and time-scale canvases
        // do return to 1x, but the two 72px PRICE-SCALE canvases stay at 2x —
        // the width jiggle does not make LWC rebuild those. Left as is: it is
        // ~0.5 MB per pane and renders slightly sharper, so chasing it would be
        // churn for no visible gain. Recorded so the next reader who measures
        // the same thing does not think it is a new leak.
        if (w > 0 && h > 0) { try { chart.resize(w - 1, h, true); chart.resize(w, h, true); } catch {} }
      });
      // Put the overlays back at the screen ratio too. A same-size LWC resize
      // may fire no visible-range change, so nothing else would repaint them and
      // they would sit at the capture ratio until the next pan — harmless to
      // look at, but it is capture state leaking into the live view, and the
      // next reader of this code should not have to work out why.
      try { redrawPaneOverlays(pane, true); } catch {}
    }
  }
}

// ── Indicators dropdown helpers ─────────────────────────────────────────────────
function closeAllIndicatorPanels() {
  document.querySelectorAll('.ind-panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.ind-btn.active').forEach(b => b.classList.remove('active'));
}

// ── Symbol search dropdown helpers ──────────────────────────────────────────────
function closeAllSymbolDropdowns() {
  panes.forEach(p => { if (p._closeSymDropdown) p._closeSymDropdown(); });
}

document.addEventListener('click', () => {
  closeAllIndicatorPanels();
  closeAllSymbolDropdowns();
});

// ── Chart history keyboard shortcuts ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Cmd/Ctrl + Left Arrow → back in chart history (on all panes)
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowLeft') {
    e.preventDefault();
    panes.forEach(pane => {
      if (pane && pane.historyIdx > 0) {
        pane.navigateToHistory(pane.historyIdx - 1);
      }
    });
  }
  // Cmd/Ctrl + Right Arrow → forward in chart history (on all panes)
  if ((e.metaKey || e.ctrlKey) && e.key === 'ArrowRight') {
    e.preventDefault();
    panes.forEach(pane => {
      if (pane && pane.historyIdx < pane.chartHistory.length - 1) {
        pane.navigateToHistory(pane.historyIdx + 1);
      }
    });
  }
});

// ── Indicator overlay rendering ─────────────────────────────────────────────────
function removeIndicatorSeries(pane, key) {
  const existing = pane.indSeries[key];
  if (!existing) return;
  (Array.isArray(existing) ? existing : [existing]).forEach(s => {
    try { pane.chart.removeSeries(s); } catch {}
  });
  delete pane.indSeries[key];
}

function addLine(pane, color, lineWidth = 1, lineStyle = 0) {
  return pane.chart.addLineSeries({
    color, lineWidth, lineStyle, priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerVisible: false,
  });
}

// A scatter series. lightweight-charts has no dedicated points type, so it is a
// line with the line hidden and the per-point markers shown — the standard way,
// and the only way to draw Parabolic SAR without implying a stroke between dots
// that sit on opposite sides of price.
function addDots(pane, color, radius = 1.6) {
  return pane.chart.addLineSeries({
    color, lineVisible: false, pointMarkersVisible: true, pointMarkersRadius: radius,
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
  });
}

// Momentum / directional-signal indicators that are meaningless on a
// cash-equivalent instrument (Liquid ETFs like LIQUIDCASE.NS, LIQUIDBEES,
// etc.): applying them produces phantom oversold reads, spurious %R
// exhaustion dots and Elliott counts on what is effectively a savings
// account. Volume/volume-profile/MAs stay — those are structural, not
// momentum, and remain informative on any series.
// mabias joins them: a trend-bias card on a monotonic yield line would read
// "permanent golden cross" — technically true, decisionally meaningless.
// 'mfi' joins them for the same reason as 'rsi': a volume-weighted oscillator on
// a monotonic yield line prints permanent overbought. 'atr' deliberately does
// NOT — on a cash-equivalent an ATR of ~0 is the TRUE and useful answer, the
// same reason volume and the MAs stay. Volatility is structural, not momentum.
const MOMENTUM_KEYS = ['rsi', 'macd', 'obv', 'rs', 'prte', 'adxdi', 'stoch', 'elliott', 'mabias', 'rsidiv', 'obvdiv', 'hm', 'evmacd', 'mfi'];

// Detect liquid-ETF / cash-equivalent behaviour from bar statistics rather
// than symbol lists — new liquid ETFs launch faster than any hardcoded set
// stays current. Threshold picked from the LIQUIDCASE.NS autopsy: median
// |daily return| ≈ 0.018% (< 0.05%) and worst single-day |return| ≈ 0.01%
// (< 0.5%). A normal small-cap prints 1–3% median swings; the two-order-of-
// magnitude gap makes this robust without a per-instrument config.
function isLikelyLiquidETF(bars) {
  if (!bars || bars.length < 60) return false;
  const rets = [];
  for (let i = 1; i < bars.length; i++) {
    const p = bars[i - 1].close, c = bars[i].close;
    if (p > 0 && c > 0) rets.push(Math.abs((c - p) / p) * 100);
  }
  if (rets.length < 60) return false;
  const sorted = rets.slice().sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];
  const worst = sorted[sorted.length - 1];
  return median < 0.05 && worst < 0.5;
}

// Sync the pane's INDICATORS panel to reflect ETF mode: grey-and-disable
// the momentum rows, uncheck any that are currently active (so they get
// torn down in the same applyIndicators pass), and toggle the CASH-EQ tag.
function applyEtfMode(pane, isEtf) {
  const badge = pane.el.querySelector('.etf-badge');
  if (badge) badge.classList.toggle('active', !!isEtf);
  const panel = pane.el.querySelector('.ind-panel');
  if (!panel) return;
  MOMENTUM_KEYS.forEach(key => {
    const chk = panel.querySelector(`.ind-chk[data-key="${key}"]`);
    if (!chk) return;
    const row = chk.closest('.ind-row');
    if (row) row.classList.toggle('ind-disabled', !!isEtf);
    if (isEtf && pane.indicators.has(key)) {
      pane.indicators.delete(key);
      chk.checked = false;
    }
  });
}

//: How many chips fit before the legend starts competing with the chart. The
//: rest collapse into "+N", which is still more than the zero the chart used to
//: say. Deliberately low: a legend that covers the candles has replaced one
//: problem with a worse one.
const LEGEND_MAX_CHIPS = 6;

//: Indicators whose name on the chart would be noise rather than information —
//: they either draw nothing on the price pane or are the pane itself.
const LEGEND_SKIP = new Set(['volume']);

function shortIndicatorLabel(label) {
  // Registry labels carry their parenthetical explanation, which is right in a
  // 300px-wide panel and wrong in a 9px chip: "Session Volume Profile HD (D/P/B/I
  // + Accum/Distrib)" is one chip's worth of chart otherwise.
  return String(label || '').split('(')[0].split('—')[0].trim();
}

function renderIndicatorLegend(pane) {
  const host = pane.el.querySelector('.chart-main');
  if (!host) return;
  let box = host.querySelector(':scope > .ind-legend');
  if (!box) {
    box = document.createElement('div');
    box.className = 'ind-legend';
    host.appendChild(box);
  }
  // INDICATOR_DEFS, not INDICATORS — the first cut guessed the registry's name,
  // threw a ReferenceError inside a caller that swallows it, and rendered an
  // EMPTY legend rather than no legend. Empty looked like "no indicators on".
  const on = (pane.indicators instanceof Set)
    ? INDICATOR_DEFS.filter(i => pane.indicators.has(i.key) && !LEGEND_SKIP.has(i.key))
    : [];
  if (!on.length) { box.innerHTML = ''; return; }
  const shown = on.slice(0, LEGEND_MAX_CHIPS);
  const rest = on.length - shown.length;
  box.innerHTML = shown.map(i =>
      `<span class="leg" style="color:${i.color}" title="${i.label}">` +
      `${shortIndicatorLabel(i.label)}</span>`).join('')
    + (rest > 0 ? `<span class="leg leg-more" title="${
        on.slice(LEGEND_MAX_CHIPS).map(i => i.label).join(' · ')
      }">+${rest}</span>` : '');
}

function applyIndicators(pane) {
  const bars = pane.bars;
  // ETF-mode gate runs BEFORE anything else so momentum indicators get
  // removed on the same pass they would otherwise be rendered.
  applyEtfMode(pane, isLikelyLiquidETF(bars));
  // RSI Divergence draws across the RSI pane as well as the price chart, and a
  // divergence shown on price alone hides the half that makes it a divergence.
  // So switching it ON also switches RSI on and ticks its box.
  //
  // Only on the TRANSITION, though. Re-asserting it every pass meant unticking
  // RSI while divergence was active silently re-added it — the box bounced back
  // and the click appeared to do nothing. If you turn RSI off deliberately, that
  // holds, and divergence keeps drawing its price-side lines alone.
  //
  // Runs after the ETF gate so a cash-equivalent (where both keys are stripped)
  // cannot re-add RSI through the back door.
  // OBV divergence draws its lower half in the OBV sub-pane, so turning it on
  // opens that pane the way rsidiv opens the RSI pane. Without this the
  // divergence exists but half of it is invisible.
  const _obvDivOn = pane.indicators.has('obvdiv');
  if (_obvDivOn && !pane._obvdivWasOn && !pane.indicators.has('obv')) {
    pane.indicators.add('obv');
  }
  pane._obvdivWasOn = _obvDivOn;

  const _divOn = pane.indicators.has('rsidiv');
  if (_divOn && !pane._rsidivWasOn && !pane.indicators.has('rsi')) {
    pane.indicators.add('rsi');
    const rsiChk = pane.el.querySelector('.ind-panel .ind-chk[data-key="rsi"]');
    if (rsiChk) rsiChk.checked = true;
  }
  pane._rsidivWasOn = _divOn;
  // Remove overlay series for indicators no longer selected
  Object.keys(pane.indSeries).forEach(key => {
    if (!pane.indicators.has(key)) removeIndicatorSeries(pane, key);
  });
  // Remove sub-pane charts for deselected oscillators
  // 'volume' is deliberately absent — it is a main-chart overlay now, torn down
  // by removeIndicatorSeries above. A stale volume SUB-pane can still exist from
  // a session saved before the change, so it is swept once here.
  ['rsi','macd','obv','rs','prte','adxdi','evmacd','roc','stoch','hm','mfi','atr'].forEach(key => {
    if (!pane.indicators.has(key) && pane.subCharts[key]) removeSubPane(pane, key);
  });
  if (pane.subCharts.volume) removeSubPane(pane, 'volume');
  // Clear volume profile canvas if deselected
  if (!pane.indicators.has('volprofile') && pane.volCanvas) {
    const ctx = pane.volCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.volCanvas.width, pane.volCanvas.height);
    pane.vp = null;
  }
  // Clear Session Volume Profile HD (canvas + card) if deselected
  if (!pane.indicators.has('svp') && pane.svp) clearSessionVP(pane);
  // Clear TPO / Market Profile (canvas + card) if deselected
  if (!pane.indicators.has('tpo') && pane.tpo) clearTPO(pane);
  if (!pane.indicators.has('deltaprofile')) clearDeltaProfile(pane);
  // Clear FVG canvas + buy/sell signal markers/panel if deselected
  if (!pane.indicators.has('fvg') && pane.fvgCanvas) {
    const ctx = pane.fvgCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.fvgCanvas.width, pane.fvgCanvas.height);
    pane.fvgZones = null;
    clearFVGSignals(pane);
  }
  // Clear Order Block zones if deselected; if %R is still on, downgrade its
  // confluence arrows back to plain (no zones to confluence with anymore).
  if (!pane.indicators.has('orderblock') && pane.ob) {
    clearOrderBlocks(pane);
    if (pane.indicators.has('prte')) renderPrteOverlay(pane);
  }
  // Clear liquidity pools + sweep marker if deselected.
  if (!pane.indicators.has('liquidity') && pane.liq) clearLiquidity(pane);
  // Clear the %R exhaustion main-chart overlay (arrows + tint) if deselected.
  if (!pane.indicators.has('prte') && (pane.prteData || pane._markerSrcs?.prte)) clearPrteOverlay(pane);
  // B-127 status cards go with their line.
  renderTrailStatusCard(pane, 'stai');
  renderTrailStatusCard(pane, 'psar');
  // Tear down the Simple Volume card if deselected (the histogram itself is
  // removed by the generic series teardown).
  if (!pane.indicators.has('simplevol')) {
    pane.svolStats = null;
    const b = pane.el.querySelector('.svol-info');
    if (b) b.style.display = 'none';
  }
  // Tear down MA Bias card + cross markers if deselected
  if (!pane.indicators.has('mabias') && pane.maBias) clearMABias(pane);
  // Tear down Elliott Wave overlay if deselected
  if (!pane.indicators.has('elliott') && pane.ew) clearElliottWave(pane);
  // Tear down RSI divergence if deselected. When only RSI is switched off the
  // divergence survives on the price pane; clearRsiDivergence skips the RSI-side
  // removal once subCharts.rsi is gone, since that chart is already destroyed.
  if (pane.rsidiv && !pane.indicators.has('rsidiv')) clearRsiDivergence(pane);
  if (pane.obvdiv && !pane.indicators.has('obvdiv')) clearObvDivergence(pane);
  // Tear down Rounding Bottom overlay if deselected
  if (!pane.indicators.has('roundbottom') && pane.rb) clearRoundingBottom(pane);
  // Tear down Double Bottom overlay if deselected
  if (!pane.indicators.has('doublebottom') && pane.db) clearDoubleBottom(pane);
  // Tear down VCP overlay if deselected
  if (!pane.indicators.has('vcp') && pane.vcp) clearVCP(pane);
  // Tear down Trendlines overlay if deselected
  if (!pane.indicators.has('trendlines') && pane.tl) clearTrendlines(pane);
  if (!pane.indicators.has('falling_wedge') && pane.fw) clearFallingWedge(pane);
  if (!pane.indicators.has('flag_pole') && pane.flagPole) clearFlagPole(pane);
  // Tear down the Structure Break Chain overlay if deselected
  if (!pane.indicators.has('structure_chain') && pane.sbc) clearStructureChain(pane);
  // Tear down PMax flip markers + trade levels if deselected
  if (!pane.indicators.has('pmax') && pane.pmaxTrade) clearPmaxTrade(pane);
  // Clear SuperTrend AI flip markers if deselected (its lines are torn down by
  // removeIndicatorSeries, but the merged markers must be cleared explicitly).
  if (!pane.indicators.has('stai')) setPaneMarkers(pane, 'stai', null);
  // Same for the EVWMA/VWAP MACD crossover arrows mirrored onto the candles —
  // the sub-pane teardown below removes the oscillator, not the price markers.
  if (!pane.indicators.has('evmacd')) setPaneMarkers(pane, 'evmacd', null);
  // VWAP mean-reversion arrows are a marker source too, so they need the same
  // explicit clear - removeIndicatorSeries only takes the three band lines.
  if (!pane.indicators.has('vwmr')) setPaneMarkers(pane, 'vwmr', null);
  // Renko draws a step line (torn down by removeIndicatorSeries) plus merged flip
  // markers, which have to be cleared explicitly like every other marker source.
  if (!pane.indicators.has('renko')) { setPaneMarkers(pane, 'renko', null); clearRenkoState(pane); }
  // Tear down Harmonic overlay if deselected
  if (!pane.indicators.has('harmonic') && pane.hm) clearHarmonic(pane);
  // Tear down Price Projection overlay if deselected
  if (!pane.indicators.has('projection') && pane.proj) clearProjection(pane);
  // Tear down Fibonacci grid + trade plan if deselected
  if (!pane.indicators.has('fib') && pane.fib) clearFibonacci(pane);
  // Tear down Gann S/R levels + card if deselected
  if (!pane.indicators.has('gann') && pane.gann) clearGann(pane);
  if (!pane.indicators.has('oiwalls') && pane.oiw) clearOiWalls(pane);
  // Tear down Reversal Calendar markers if deselected
  if (!pane.indicators.has('reversal_calendar') && pane.rev) clearReversalCalendar(pane);
  if (!bars || bars.length < 2) return;

  INDICATOR_DEFS.forEach(def => {
    const key = def.key;
    if (!pane.indicators.has(key)) return;
    if (pane.indSeries[key]) return; // already rendered, will be refreshed in-place below

    switch (key) {
      case 'sma20':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'sma50':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'sma200': pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema9':   pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema20':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema50':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema200': pane.indSeries[key] = addLine(pane, def.color); break;
      case 'vwap':   pane.indSeries[key] = addLine(pane, def.color); break;
      case 'avwap':  pane.indSeries[key] = addLine(pane, def.color, 2); break;
      case 'vwmr':   pane.indSeries[key] = [
        addLine(pane, def.color, 2),        // the mean itself
        addLine(pane, def.color, 1, 2),     // +k sigma
        addLine(pane, def.color, 1, 2),     // -k sigma
      ]; break;
      case 'volume': {
        // Volume rides ON the price chart rather than in its own sub-pane, the
        // way every trading platform draws it — bars sit under the candles they
        // belong to, so a volume spike reads against its own bar with no eye
        // movement between panes.
        //
        // `priceScaleId: 'volume'` is the mechanism: any id that is not 'right'
        // or 'left' creates an OVERLAY scale, so these values never enter the
        // price axis. Without it a 30-million-share bar and a ₹1,325 candle
        // would share one scale and flatten the candles into a line.
        //
        // scaleMargins top 0.80 confines the histogram to the bottom fifth of
        // the pane; the candles keep the top 80%. lastValueVisible/priceLine are
        // off so the price axis stays the price axis.
        const vs = pane.chart.addHistogramSeries({
          priceScaleId: 'volume',
          priceFormat: {type: 'volume'},
          priceLineVisible: false,
          lastValueVisible: false,
        });
        try {
          vs.priceScale().applyOptions({scaleMargins: {top: 0.80, bottom: 0}});
        } catch {}
        pane.indSeries[key] = vs;
        break;
      }
      case 'simplevol': {
        // Same overlay-scale mechanism as `volume` (see above) — it is the same
        // histogram, read differently. Given its own scale id so the two can be
        // shown together without one rescaling the other, which is the state a
        // reader ends up in while deciding whether they prefer the colours.
        const sv = pane.chart.addHistogramSeries({
          priceScaleId: 'simplevol',
          priceFormat: {type: 'volume'},
          priceLineVisible: false,
          lastValueVisible: false,
        });
        try {
          sv.priceScale().applyOptions({scaleMargins: {top: 0.80, bottom: 0}});
        } catch {}
        pane.indSeries[key] = sv;
        break;
      }
      case 'bollinger':
        pane.indSeries[key] = [
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1, 2),
          addLine(pane, def.color, 1, 2),
        ];
        break;
      case 'donchian':
        pane.indSeries[key] = [
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1, 2),
        ];
        break;
      case 'keltner':
        pane.indSeries[key] = [
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1, 2),
          addLine(pane, def.color, 1, 2),
        ];
        break;
      case 'pmax':
        // One switching PMax trendline drawn as two colour segments: green while
        // up-trend, red while down-trend. Each series is whitespace-padded to the
        // full grid (see the data block) so it draws only during its own trend and
        // breaks cleanly at the flip — reading as a single line that swaps side and
        // colour, not two crossing lines.
        pane.indSeries[key] = [
          addLine(pane, '#26a69a', 2),  // up-trend (below price)
          addLine(pane, '#f23645', 2),  // down-trend (above price)
        ];
        break;
      case 'stai':
        // SuperTrend AI: one adaptive trailing line, colour-switched like PMax —
        // teal up-trend (below price), red down-trend (above). Whitespace-padded
        // in the data block so each colour draws only during its own trend.
        pane.indSeries[key] = [
          addLine(pane, '#00bcd4', 2),  // up-trend (below price)
          addLine(pane, '#f23645', 2),  // down-trend (above price)
        ];
        break;
      case 'cpr':
        // Five stepwise level lines from the PRIOR bar: the band (TC / BC dashed,
        // Pivot solid) in gold, R1 / S1 dotted grey. Same arithmetic as the
        // classic chart's CPR pane and row_metrics.pivot_levels.
        pane.indSeries[key] = [
          addLine(pane, '#c9a227', 1, 2),   // [0] TC  (dashed)
          addLine(pane, '#c9a227', 1),      // [1] Pivot
          addLine(pane, '#c9a227', 1, 2),   // [2] BC  (dashed)
          addLine(pane, '#9aa4af', 1, 1),   // [3] R1  (dotted)
          addLine(pane, '#9aa4af', 1, 1),   // [4] S1  (dotted)
        ];
        break;
      case 'psar':
        // DOTS, not a line. Consecutive SAR values sit on opposite sides of price
        // across a reversal, so joining them would draw a stroke straight through
        // the candles that no part of the indicator asserts. lineVisible:false with
        // point markers is how lightweight-charts draws a scatter.
        pane.indSeries[key] = [
          addDots(pane, '#26a69a'),   // long — dots trail BELOW price
          addDots(pane, '#f23645'),   // short — dots trail ABOVE price
        ];
        break;
      case 'ichimoku':
        // Ichimoku: Tenkan (conversion), Kijun (base), Senkou A, Senkou B, Chikou.
        // The cloud (kumo) is drawn as two semi-transparent area series — one for
        // bullish cloud (A > B, green tint) and one for bearish (B > A, red tint).
        pane.indSeries[key] = [
          addLine(pane, '#2962ff', 1),    // [0] Tenkan-sen (conversion, blue)
          addLine(pane, '#f23645', 1),    // [1] Kijun-sen  (base, red)
          addLine(pane, '#26a69a', 1, 2), // [2] Senkou A   (leading A, green dashed)
          addLine(pane, '#ef5350', 1, 2), // [3] Senkou B   (leading B, red dashed)
          addLine(pane, '#9aa4af', 1, 2), // [4] Chikou Span (lagging, grey dashed)
        ];
        break;
      case 'atrtrail':
        // ATR Trailing Stop: one switching line, green below price (uptrend), red
        // above (downtrend). Same two-series colour-switch as PMax/STAI.
        pane.indSeries[key] = [
          addLine(pane, '#fdd835', 2),  // up-trend (below price, yellow-gold)
          addLine(pane, '#f23645', 2),  // down-trend (above price, red)
        ];
        break;
      case 'renko':
        // The Renko grid as a STAIRCASE over the candles — stepped, because the brick
        // close only changes when a brick completes, and a smooth line between those
        // points would imply prices the Renko series never acknowledged. Split into two
        // colours by brick direction, whitespace-padded like PMax/STAI so each draws
        // only during its own run.
        pane.indSeries[key] = [
          addLine(pane, '#26a69a', 2),  // up-bricks
          addLine(pane, '#ab47bc', 2),  // down-bricks
        ];
        try {
          pane.indSeries[key][0].applyOptions({lineType: 1});   // 1 = LineType.WithSteps
          pane.indSeries[key][1].applyOptions({lineType: 1});
        } catch {}
        break;
      // sub-pane indicators — created in the computation section below
      case 'rsi': case 'macd': case 'obv': case 'rs': case 'volprofile': break;
    }
  });

  // (Re)compute and push data into each active indicator's series
  pane.indicators.forEach(key => {
    const s = pane.indSeries[key];
    if (!s) return;
    switch (key) {
      case 'sma20':  s.setData(smaSeries(bars, 20));  break;
      case 'sma50':  s.setData(smaSeries(bars, 50));  break;
      case 'sma200': s.setData(smaSeries(bars, 200)); break;
      case 'ema9':   s.setData(emaSeries(bars, 9));   break;
      case 'ema20':  s.setData(emaSeries(bars, 20));  break;
      case 'ema50':  s.setData(emaSeries(bars, 50));  break;
      case 'ema200': s.setData(emaSeries(bars, 200)); break;
      case 'vwap':   s.setData(vwapSeries(bars, pane.tf)); break;
      case 'volume': s.setData(volumeBarSeries(bars)); break;
      case 'simplevol': {
        const rows = classifySimpleVolume(bars);
        s.setData(rows.map(r => ({time: r.time, value: r.value, color: r.color})));
        // Stash the reading for the card. The classification is the expensive
        // part and the card must never recompute it differently from the bars
        // the reader is looking at.
        pane.svolStats = simpleVolumeStats(rows);
        renderSimpleVolumeCard(pane);
        break;
      }
      case 'avwap':  s.setData(anchoredVwapSeries(bars, lastSwingLowIdx(bars))); break;
      case 'bollinger': {
        const {mid, upper, lower} = bollingerSeries(bars, 20, 2);
        s[0].setData(mid); s[1].setData(upper); s[2].setData(lower);
        break;
      }
      case 'vwmr': {
        // The mean and its bands are the drawing; the arrows are the claim. Both
        // come from one VWMR.compute so the chart can never show a band the
        // signals were not derived from.
        const mr = (typeof VWMR !== 'undefined')
          ? VWMR.compute(bars, {tf: pane.tf}) : null;
        if (!mr || mr.insufficient) {
          s[0].setData([]); s[1].setData([]); s[2].setData([]);
          setPaneMarkers(pane, 'vwmr', null);
          break;
        }
        s[0].setData(mr.vwap); s[1].setData(mr.upper); s[2].setData(mr.lower);
        // Deliberately NOT stop-and-reverse, unlike evmacd: each signal is one
        // reversion trade that ends at the mean, so an arrow is an entry and
        // nothing else. The bearish arrow says TRIM, not SHORT — the scanner
        // registry takes the same stance and this desk trades cash equity.
        setPaneMarkers(pane, 'vwmr', mr.signals.map(sig => sig.dir === 1
          ? {time: sig.time, position: 'belowBar', color: '#7c4dff', shape: 'arrowUp',
             text: 'BUY ' + sig.targetPct.toFixed(1) + '%'}
          : {time: sig.time, position: 'aboveBar', color: '#b388ff', shape: 'arrowDown',
             text: 'TRIM ' + sig.targetPct.toFixed(1) + '%'}));
        break;
      }
      case 'donchian': {
        const {upper, lower, mid} = donchianSeries(bars, 20);
        s[0].setData(upper); s[1].setData(lower); s[2].setData(mid);
        break;
      }
      case 'keltner': {
        const {mid, upper, lower} = keltnerSeries(bars, 20, 1.5);
        s[0].setData(mid); s[1].setData(upper); s[2].setData(lower);
        break;
      }
      case 'pmax': {
        // One trailing PMax line that switches SIDE and COLOUR at each reversal:
        // green while below price (up-trend), red while above price (down-trend).
        // Rendered as two series that each carry the value ONLY during their own
        // trend and whitespace elsewhere — padToBars inserts the whitespace so a
        // series never connects across the other's stretch (that gap-jumping was
        // the old "two crossing lines" bug). The result reads as a single line.
        const rows = pmaxSeries(bars, 10, 3.0, 10);
        const up = [], dn = [];
        rows.forEach(r => {
          if (r.dir === 1) up.push({time: r.time, value: r.pmax});
          else             dn.push({time: r.time, value: r.pmax});
        });
        s[0].setData(padToBars(up, bars)); s[1].setData(padToBars(dn, bars));
        renderPmaxTrade(pane, rows, bars);
        break;
      }
      case 'stai': {
        // SuperTrend AI (adaptive factor) — one switching line + flip signals.
        const r = STAI.compute(bars);
        s[0].setData(padToBars(r.up, bars));   // up-trend segments (teal)
        s[1].setData(padToBars(r.dn, bars));   // down-trend segments (red)
        // Flip signals as BUY/SELL markers carrying the 0-10 performance strength.
        setPaneMarkers(pane, 'stai', r.signals.map(sig => sig.dir === 1
          ? {time: sig.time, position: 'belowBar', color: '#00bcd4', shape: 'arrowUp',
             text: 'BUY ' + sig.strength}
          : {time: sig.time, position: 'aboveBar', color: '#f23645', shape: 'arrowDown',
             text: 'SELL ' + sig.strength}));
        renderTrailStatusCard(pane, 'stai');
        break;
      }
      case 'cpr': {
        const cp = CPR.compute(bars);
        s[0].setData(padToBars(cp.tc, bars));
        s[1].setData(padToBars(cp.p, bars));
        s[2].setData(padToBars(cp.bc, bars));
        s[3].setData(padToBars(cp.r1, bars));
        s[4].setData(padToBars(cp.s1, bars));
        renderCprCard(pane, cp);
        break;
      }
      case 'psar': {
        // Wilder's dots, split by side so the colour states the trend without a
        // second series carrying the same information. Whitespace-padded like
        // pmax/stai so neither colour connects across the other's stretch.
        const ps = PSAR.compute(bars);
        s[0].setData(padToBars(ps.up, bars));   // long  (green, below price)
        s[1].setData(padToBars(ps.dn, bars));   // short (red, above price)
        // NO flip markers, deliberately. pmax and stai already draw BUY/SELL
        // arrows, and a third set on the same pane would read as three
        // independent confirmations of one idea. B-46's objection to a PSAR
        // signal stands until the overlap check it asks for has been run.
        renderTrailStatusCard(pane, 'psar');
        break;
      }
      case 'ichimoku': {
        const ik = ICHIMOKU.compute(bars);
        s[0].setData(padToBars(ik.tenkan, bars));
        s[1].setData(padToBars(ik.kijun, bars));
        // Senkou A/B extend past the last bar. padToBars pads to the main grid;
        // points beyond the grid are appended as-is, and lightweight-charts
        // renders them as projected whitespace points to the right.
        s[2].setData(ik.senkouA);
        s[3].setData(ik.senkouB);
        s[4].setData(padToBars(ik.chikou, bars));
        renderIchimokuCard(pane, ik);
        break;
      }
      case 'atrtrail': {
        const at = atrTrailSeries(bars, 14, 3.0);
        const atUp = [], atDn = [];
        at.rows.forEach(r => {
          if (r.dir === 1) atUp.push({time: r.time, value: r.stop});
          else             atDn.push({time: r.time, value: r.stop});
        });
        s[0].setData(padToBars(atUp, bars));
        s[1].setData(padToBars(atDn, bars));
        setPaneMarkers(pane, 'atrtrail', at.flips.map(f => f.dir === 1
          ? {time: f.time, position: 'belowBar', color: '#fdd835', shape: 'arrowUp',
             text: 'BUY'}
          : {time: f.time, position: 'aboveBar', color: '#f23645', shape: 'arrowDown',
             text: 'SELL'}));
        renderTrailStatusCard(pane, 'atrtrail');
        break;
      }
      case 'renko': {
        // "Renko intelligence on candles": the bricks are the analysis, the candles stay
        // the chart. Never a chart-type swap — pane.bars is untouched, exactly like the
        // Heikin Ashi rule, so every other indicator still sees real OHLC.
        const rk = RENKO.compute(bars, {atrPeriod: 5});
        const dirByTime = new Map();
        rk.bricks.forEach(b => dirByTime.set(b.time, b.dir));   // last brick of the bar wins
        const up = [], dn = [];
        let curDir = 0;
        rk.path.forEach(p => {
          if (p.value === null || p.value === undefined) return;
          if (dirByTime.has(p.time)) curDir = dirByTime.get(p.time);
          if (curDir === 0) return;                    // grid anchored, no brick yet
          (curDir === 1 ? up : dn).push({time: p.time, value: p.value});
        });
        s[0].setData(padToBars(up, bars));
        s[1].setData(padToBars(dn, bars));
        // Flips are the only actionable event Renko produces, and the measured result
        // (B-43) is that they carry NO forward edge — labelled FLIP, deliberately not
        // BUY/SELL, so the chart does not imply a trigger the data does not support.
        setPaneMarkers(pane, 'renko', rk.flips.map(f => f.dir === 1
          ? {time: f.time, position: 'belowBar', color: '#26a69a', shape: 'arrowUp',
             text: 'FLIP↑'}
          : {time: f.time, position: 'aboveBar', color: '#ab47bc', shape: 'arrowDown',
             text: 'FLIP↓'}));
        renderRenkoState(pane, rk);
        break;
      }
    }
  });

  // ── Sub-pane oscillators ───────────────────────────────────────────────────
  if (pane.indicators.has('rsi')) {
    if (!pane.subCharts.rsi) {
      const sub = addSubPane(pane, 'rsi', 'RSI (14)');
      sub.series = sub.chart.addLineSeries({
        color: '#7b61ff', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      // Guides at the working band. 60/30 are the live thresholds the
      // shading keys off; 70 stays as a fainter deep-overbought marker.
      sub.series.createPriceLine({price:70, color:'rgba(248,81,73,0.22)', lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.series.createPriceLine({price:RSI_OB, color:'rgba(248,81,73,0.45)',  lineWidth:1, lineStyle:1, axisLabelVisible:false});
      sub.series.createPriceLine({price:50, color:'rgba(140,140,140,0.25)',lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.series.createPriceLine({price:RSI_OS, color:'rgba(63,185,80,0.45)',  lineWidth:1, lineStyle:1, axisLabelVisible:false});
      // Overbought / oversold shading. Added after the base line so both the
      // fill and the recolored segment sit on top of the purple RSI. Each is
      // a baseline anchored on its own threshold with the far half made
      // transparent, so only the out-of-band excursion paints.
      sub.obFill = sub.chart.addBaselineSeries({
        baseValue: {type: 'price', price: RSI_OB},
        topLineColor:    '#f85149', lineWidth: 2,
        topFillColor1:   'rgba(248,81,73,0.32)',
        topFillColor2:   'rgba(248,81,73,0.04)',
        bottomLineColor: 'rgba(0,0,0,0)',
        bottomFillColor1:'rgba(0,0,0,0)',
        bottomFillColor2:'rgba(0,0,0,0)',
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
      sub.osFill = sub.chart.addBaselineSeries({
        baseValue: {type: 'price', price: RSI_OS},
        topLineColor:    'rgba(0,0,0,0)', lineWidth: 2,
        topFillColor1:   'rgba(0,0,0,0)',
        topFillColor2:   'rgba(0,0,0,0)',
        bottomLineColor: '#3fb950',
        bottomFillColor1:'rgba(63,185,80,0.04)',
        bottomFillColor2:'rgba(63,185,80,0.32)',
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
    }
    const rsiData = rsiSeries(bars, 14);
    pane.subCharts.rsi.series.setData(padToBars(rsiData, bars));   // primary → full grid
    pane.subCharts.rsi.obFill.setData(bandExcursions(rsiData, RSI_OB,  1));
    pane.subCharts.rsi.osFill.setData(bandExcursions(rsiData, RSI_OS, -1));
  }

  // Divergence renders HERE, immediately after the RSI pane is built and filled,
  // because it draws into that pane. Anywhere earlier and the sub-chart it needs
  // does not exist yet on the pass where RSI was just switched on. Not gated on
  // RSI being present — with the pane off it still draws the price-side lines.
  if (pane.indicators.has('rsidiv')) renderRsiDivergence(pane);
  if (pane.indicators.has('obvdiv')) renderObvDivergence(pane);

  if (pane.indicators.has('macd')) {
    if (!pane.subCharts.macd) {
      const sub = addSubPane(pane, 'macd', 'MACD (12,26,9)');
      sub.hist = sub.chart.addHistogramSeries({
        priceLineVisible: false, lastValueVisible: false,
        priceScaleId: 'right',
      });
      sub.macdLine = sub.chart.addLineSeries({
        color: '#2962ff', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.signalLine = sub.chart.addLineSeries({
        color: '#ff9800', lineWidth: 1, lineStyle: 2,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series = sub.macdLine;   // used for crosshair sync
    }
    const {macd, signal, hist} = macdCalc(bars);
    pane.subCharts.macd.hist.setData(hist);
    pane.subCharts.macd.macdLine.setData(padToBars(macd, bars));   // primary → full grid
    pane.subCharts.macd.signalLine.setData(signal);
  }

  if (pane.indicators.has('obv')) {
    if (!pane.subCharts.obv) {
      const sub = addSubPane(pane, 'obv', 'OBV');
      sub.series = sub.chart.addLineSeries({
        color: '#00bd6f', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
        // Compact labels — and this is an ALIGNMENT fix, not just cosmetics.
        //
        // subChartOpts sets rightPriceScale.minimumWidth: 72, which is a MINIMUM.
        // Raw OBV is a running share count in the billions, so labels rendered as
        // "2934007946.00" / "2000000000.00" — far wider than the "75.00" / "-48.42"
        // on every other oscillator. The scale grew past 72px to fit them, which
        // narrowed OBV's PLOT area, so its right edge stopped short of the other
        // panes and the series visibly ended early. Same reason its left edge sat
        // inboard of theirs.
        //
        // "2.93B" fits inside the shared 72px, so every sub-pane keeps an
        // identical plot width and the panes line up. It also makes the axis
        // readable, which twelve digits of share count never was.
        priceFormat: {
          type: 'custom',
          minMove: 1,
          formatter: v => {
            if (v === null || v === undefined || isNaN(v)) return '';
            const a = Math.abs(v);
            if (a >= 1e12) return (v / 1e12).toFixed(2) + 'T';
            if (a >= 1e9)  return (v / 1e9 ).toFixed(2) + 'B';
            if (a >= 1e6)  return (v / 1e6 ).toFixed(2) + 'M';
            if (a >= 1e3)  return (v / 1e3 ).toFixed(2) + 'K';
            return v.toFixed(0);
          },
        },
      });
    }
    pane.subCharts.obv.series.setData(padToBars(obvSeries(bars), bars));
  }

  if (pane.indicators.has('rs')) {
    if (!pane.subCharts.rs) {
      const sub = addSubPane(pane, 'rs', 'RS vs Benchmark');
      sub.series = sub.chart.addLineSeries({
        color: '#ffd60a', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series.createPriceLine({price:100, color:'rgba(180,180,180,0.3)', lineWidth:1, lineStyle:2, axisLabelVisible:false});
    }
    fetchRsData(pane, bars);   // async: fetches ref symbol and sets data
  }

  if (pane.indicators.has('prte')) {
    if (!pane.subCharts.prte) {
      // Taller pane (150 vs the default 100px): %R sweeps the full 0→−100
      // band constantly, so at 100px the swings compressed into a near-flat
      // ribbon (user report, 2026-07-22).
      const sub = addSubPane(pane, 'prte', '%R Trend Exhaustion', 150);
      // The lines were 1px pale grey + pale blue — indistinguishable from
      // each other, and the grey vanished entirely on the light theme.
      // Deep blue (fast) vs orange (slow) separate cleanly on BOTH themes;
      // fast carries the weight since it holds the markers + value label.
      // Trend-pivot regime fill anchored on the −50 centerline: green while %R is
      // in the upper half (up-bias), red in the lower half. Added FIRST so the
      // fast/slow lines and markers sit on top. Read WITH the slow line for trend.
      sub.regime = sub.chart.addBaselineSeries({
        baseValue: {type: 'price', price: -50},
        topLineColor:    'rgba(0,0,0,0)',
        topFillColor1:   'rgba(38,166,154,0.16)',   // upper half → up-bias green
        topFillColor2:   'rgba(38,166,154,0.02)',
        bottomLineColor: 'rgba(0,0,0,0)',
        bottomFillColor1:'rgba(239,83,80,0.02)',
        bottomFillColor2:'rgba(239,83,80,0.16)',    // lower half → down-bias red
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      });
      sub.slowLine = sub.chart.addLineSeries({
        color: '#f0883e', lineWidth: 1,
        priceLineVisible: false, lastValueVisible: false,
      });
      sub.fastLine = sub.chart.addLineSeries({
        color: '#2466A7', lineWidth: 2,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series = sub.fastLine;   // used for crosshair sync
      // Squeeze the default 8% scale margins to 4% — every pixel of a
      // bounded oscillator's pane should go to the 0→−100 band itself.
      sub.chart.priceScale('right').applyOptions({scaleMargins: {top: 0.04, bottom: 0.04}});
      const th = 20;
      sub.fastLine.createPriceLine({price:0,          color:'rgba(202,0,23,0.4)',   lineWidth:1, lineStyle:1, axisLabelVisible:false});
      sub.fastLine.createPriceLine({price:-th,         color:'rgba(202,0,23,0.4)',   lineWidth:1, lineStyle:2, axisLabelVisible:false});
      // −50 = the trend pivot: a clear solid centerline (labelled), not a faint dash.

      sub.macdLine.createPriceLine({price: 0, color: 'rgba(150,150,150,0.55)',

    const histData = ev.hist.map((p, i) => {
      const rising = i > 0 ? ev.hist[i - 1].value < p.value : true;
      return {time: p.time, value: p.value,
              color: p.value >= 0 ? (rising ? '#26A69A' : '#B2DFDB')

    // …and mirrored onto the candles as the actual BUY/SELL calls. The Pine

    setPaneMarkers(pane, 'evmacd', ev.signals.map(sig => sig.dir === 1

    const stance = ev.state

  // The subscribeVisibleTimeRangeChange callback runs whenever the main
  // chart's range changes, but on tf/symbol reloads it fires BEFORE sub-pane
  // series get their new data (order: main setData → applyRangeView → THIS
  // function's setData calls). Sub-panes therefore accept a visible range
  // that doesn't intersect their (still-stale) data, and when new data
  // finally arrives via setData above, Lightweight Charts silently reverts
  // to fit-to-content — which crushes narrow-range oscillators like the %R
  // panel to a hairline (NH.NS %R pane collapsed to just the -27.24 marker,
  // 2026-07-03). Re-syncing HERE, after every setData, guarantees the
  // sub-panes end up aligned to whatever the main chart is showing.
  syncSubPaneRanges(pane);

  // User drawings repaint last, after every series has its data and the axes
  // have settled — their coordinates come from the price scale, so painting
  // earlier would anchor them against a scale that is about to change. Runs on
  // every apply (symbol/tf reload included), not behind an indicator gate.
  scheduleDrawRedraw(pane);

  // The legend is rendered LAST, from `pane.indicators` as it stands after the
  // ETF gate and the RSI/divergence coupling above have had their say — so it
  // lists what is actually drawn, not what was ticked. A cash-equivalent that
  // silently drops RSI must not keep advertising it.
  renderIndicatorLegend(pane);
}

// Standalone so anything that changes the main-chart visible range (loadData,
// range-preset buttons, tf change) can re-align sub-panes without duplicating
// the try/catch loop.
function syncSubPaneRanges(pane) {
  if (!pane || !pane.subCharts) return;
  // Sync by LOGICAL range (bar indices), not time range. With every sub-series
  // padded to the full bar grid (padToBars), logical index i is the same bar in
  // the main and every sub-pane, so this pins the sub-panes to the main's exact
  // visible-bar window — right edge fixed on the latest bar, symmetric shrink
  // from the left — instead of the old time-range sync that let them drift.
  //
  // NOTE (2026-08-05): a per-pane "leading offset" variant of this was tried —
  // translating the range by how far each sub-series starts into the bar array,
  // to compensate for indicator warmup (RSI short by 14, MACD by 33). It aligned
  // those panes in measurement but **misaligned %R and ROC**, so it was reverted.
  // Do not retry it without a browser that actually composites: the diagnosis
  // session could not drive the time scale faithfully (fitContent no-opped, the
  // main canvas never resized past 228px, and setVisibleLogicalRange was applied
  // inconsistently), which made every reading untrustworthy. The RS fix in
  // fetchRsData is independent of this and stands on its own.
  let lr;
  try { lr = pane.chart.timeScale().getVisibleLogicalRange(); } catch { return; }
  if (!lr) return;
  Object.values(pane.subCharts).forEach(({chart: sub}) => {
    try { sub.timeScale().setVisibleLogicalRange(lr); } catch {}
  });
}

// Identity of what a pane is currently showing: symbol + timeframe + newest bar.
// Every server-computed overlay grabs this before its fetch and re-checks it
// after, dropping a response that arrived after the user moved on. Returns null
// while the pane holds no bars — a reload is in flight, so no in-flight response
// is still current, and null never equals a key captured earlier.
function paneFetchKey(pane) {
  const bars = pane && pane.bars;
  if (!bars || !bars.length) return null;
  return `${pane.symbol}:${pane.tf}:${bars[bars.length - 1].time}`;
}

// Every series-like object hanging off a pane: the candles, the main-chart
// indicator overlays (some entries are arrays — Bollinger, Donchian, PMax…),
// and every series on every sub-pane chart. Enumerated rather than listed by
// name so a newly added series can't silently opt out of the reset below.
function paneAllSeries(pane) {
  const out = [];
  const push = v => {
    if (!v) return;
    if (Array.isArray(v)) { v.forEach(push); return; }
    if (typeof v.setData === 'function' && !out.includes(v)) out.push(v);
  };
  push(pane.series);
  Object.values(pane.indSeries || {}).forEach(push);
  Object.values(pane.subCharts || {}).forEach(sub => Object.values(sub).forEach(push));
  return out;
}

// Wipe every trace of the *previous* timeframe/symbol off a pane, called before
// the (async) reload starts.
//
// This used to be `series.setData([])` plus a hand-written list of sub-pane
// series keys — 'series', 'fastLine', 'slowLine', 'macdLine', 'signalLine',
// 'hist'. The list had drifted out of date: RSI's obFill/osFill, ROC's
// baseline/overlayGreen/overlayRed and Stochastic's dLine were never in it.
// Measured on RELIANCE.NS (2026-08-04), 300 ms into a 1d→1h switch, roc.baseline
// still held 2575 DAILY points and stoch.dLine 2583 while every sibling series
// sat empty. Two things go wrong from there, both of them visible:
//   • those sub-panes' logical grid is still the daily one, so syncSubPaneRanges
//     pins them to a window ~2000 bars away from their own data — pane blank;
//   • Lightweight Charts has to place daily timestamps on the new hourly axis
//     during paint, can't, and throws "Value is null" out of its own draw loop
//     (10 in a single switch, ~400 ms apart). Each throw aborts that frame, so
//     the chart stops redrawing — the "chart disappears until I refresh" report.
function resetPaneVisuals(pane) {
  paneAllSeries(pane).forEach(s => { try { s.setData([]); } catch {} });
  // Server-computed overlays (waves, trendlines, fib grids, pattern boxes) carry
  // absolute timestamps from the timeframe they were computed on, and each is
  // refetched asynchronously. Leaving them up means 1-3 s of daily geometry
  // drawn against an hourly axis — the same unmappable-coordinate throw as
  // above. Tear them down; applyIndicators() re-renders each against the new
  // timeframe once the bars land (their fetch keys include pane.tf).
  [clearElliottWave, clearRoundingBottom, clearDoubleBottom, clearVCP, clearTrendlines,
   clearFallingWedge, clearStructureChain, clearHarmonic, clearProjection,
   clearFibonacci, clearReversalCalendar, clearMABias, clearPmaxTrade,
   clearFVGSignals, clearOrderBlocks, clearPrteOverlay,
   clearLiquidity, clearOiWalls].forEach(fn => { try { fn(pane); } catch {} });
  // Canvas overlays are redrawn from pane.bars on resize/pan, and pane.bars
  // still holds the OLD candles until the fetch lands. Blank the canvases and
  // drop the bars so nothing repaints the old timeframe in the meantime.
  [pane.volCanvas, pane.fvgCanvas, pane.patternCanvas, pane.projCanvas, pane.fibCanvas, pane.obCanvas, pane.prteCanvas]
    .forEach(c => {
      if (!c) return;
      try { c.getContext('2d').clearRect(0, 0, c.width, c.height); } catch {}
    });
  pane.vp = null;
  pane.fvgZones = null;
  pane.bars = [];
  clearGotoLine(pane);   // the focused date belongs to the old symbol/timeframe
}

// ── Sub-pane chart lifecycle ───────────────────────────────────────────────────
function addSubPane(pane, key, labelText, height) {
  const container = pane.el.querySelector('.sub-panes');
  const el = document.createElement('div');
  el.className = 'sub-pane';
  // Optional per-indicator height override (px) — the default 100px suits
  // most oscillators, but full-range ones like %R need more vertical room
  // to be readable. CSS flex-shrink still applies when space is tight.
  if (height) el.style.height = height + 'px';
  el.dataset.key = key;
  container.appendChild(el);

  const labelEl = document.createElement('div');
  labelEl.className = 'sub-pane-label';
  labelEl.textContent = labelText || key;
  el.appendChild(labelEl);

  const subChart = LightweightCharts.createChart(el, {
    width:  el.clientWidth  || 300,
    height: el.clientHeight || 100,
    ...subChartOpts(),
  });

  const ro = new ResizeObserver(entries => {
    for (const e of entries) {
      const {width, height} = e.contentRect;
      if (width > 0 && height > 0) subChart.resize(Math.floor(width), Math.floor(height));
    }
  });
  ro.observe(el);

  // Sync to the main chart's current visible window (logical — see syncSubPaneRanges).
  setTimeout(() => {
    try {
      const lr = pane.chart.timeScale().getVisibleLogicalRange();
      if (lr) subChart.timeScale().setVisibleLogicalRange(lr);
    } catch {}
  }, 60);

  const sub = {chart: subChart, el, ro, label: labelEl, series: null};
  pane.subCharts[key] = sub;
  return sub;
}

function removeSubPane(pane, key) {
  const sub = pane.subCharts[key];
  if (!sub) return;
  if (sub.ro) sub.ro.disconnect();
  try { sub.chart.remove(); } catch {}
  sub.el.remove();
  delete pane.subCharts[key];
}

// ── Volume Profile canvas overlay ─────────────────────────────────────────────
// ── Volume Profile (POC / Value Area / HVN / LVN) ──────────────────────────────
// Computation lives in volume_profile.js (window.VP, pure, no chart dependency).
// This function is the rendering "plug": draws the histogram, POC line, Value
// Area band, and HVN/LVN pocket highlights onto the per-pane canvas overlay
// that already sits on top of the candlestick chart.
// Shape options only — bin COUNT is derived per-draw from the pane height (see
// vpBinCount), so a row is a readable height instead of a fixed 1/30th of
// whatever price range happens to be loaded.
const VP_OPTS = {valueAreaPct: 0.70, hvnMult: 1.5, lvnMult: 0.5,
                 hvnExpandTol: 0.85, lvnExpandTol: 1.30};
const VP_ROW_PX     = 9;     // target on-screen height of one profile row
const VP_MIN_BINS   = 24;
const VP_MAX_BINS   = 80;
// Widest row, as a fraction of the PLOT width. The profile is painted over the
// most recent candles, which are the ones you care about — at 0.22 the HVN
// pocket swallowed the last three months of price action.
const VP_WIDTH_FRAC = 0.15;

function vpBinCount(H) {
  return Math.max(VP_MIN_BINS, Math.min(VP_MAX_BINS, Math.round(H / VP_ROW_PX)));
}

// Bars the profile is built from: the ones actually on screen.
//
// It used to profile pane.bars — everything loaded, which on '1d' is 2600 bars
// / 10+ years. Measured on RELIANCE.NS (2026-08-04) with the default 1Y view:
// the profile spanned ₹191.55–1604.38 in ₹47 bins, so only 9 of 30 rows had a
// y-coordinate on the canvas at all (the other 21 were skipped by the
// off-canvas test) and the POC came back at ₹215.10 — a 2016 price. The POC
// line, both Value Area edges and the VA shading were all drawn off-screen,
// which is why the profile read as a handful of loose blocks with no anchor.
// Profiling the visible window is also what the indicator means everywhere
// else: "where did volume trade in the range I'm looking at".
function vpWindowBars(pane) {
  const bars = pane.bars;
  let lr = null;
  try { lr = pane.chart.timeScale().getVisibleLogicalRange(); } catch {}
  if (!lr) return bars;
  const from = Math.max(0, Math.ceil(lr.from));
  const to   = Math.min(bars.length - 1, Math.floor(lr.to));
  const win  = from <= to ? bars.slice(from, to + 1) : [];
  // Zoomed in past a handful of candles there is no profile worth binning —
  // fall back to the full set rather than draw noise.
  return win.length >= 10 ? win : bars;
}

// Redraw every active app overlay for this pane.
//
// Extracted 2026-09-11 from the visible-range subscriber, which was the only
// caller. The snapshot needs the identical list — it re-renders the overlays at
// the export ratio rather than upscaling them — and two copies of "which
// overlays exist" would drift the moment an eleventh one is added. Same reason
// columns.py (B-63a) exists.
//
// `immediate` forces the user-drawing layer to paint synchronously: the normal
// path defers it to an animation frame, which a capture running to completion in
// one turn would miss entirely.
function redrawPaneOverlays(pane, immediate = false) {
  const has = k => pane.indicators && pane.indicators.has(k);
  if (has('fvg')) drawFVG(pane);
  // Pattern base-zone boxes are time+price anchored — same staleness as FVG.
  if (has('vcp') || has('roundbottom') || has('doublebottom')) drawPatternZones(pane);
  if (has('projection')) drawProjection(pane);
  // Fibonacci levels are price-anchored, so the y-mapping changing on
  // pan/zoom stales them for the same reason the volume profile stales.
  if (has('fib')) drawFibonacci(pane);
  // Volume Profile histogram uses priceToCoordinate — pan/zoom changes
  // the y-scale mapping, so it needs a redraw on range change too. FVG
  // is time-anchored; VP is price-scale-anchored. Both stale on zoom
  // for the same reason (mapping changed) — now both redraw.
  if (has('volprofile')) drawVolumeProfile(pane);
  // Session VP is both price- AND time-anchored, so it stales on any pan/zoom.
  if (has('svp')) drawSessionVP(pane);
  if (has('tpo')) drawTPO(pane);
  if (has('deltaprofile')) drawDeltaProfile(pane);
  // Order-block zones are time+price anchored — same staleness as FVG boxes.
  if (has('orderblock')) drawOrderBlocks(pane);
  // %R exhaustion background is time-anchored (x-runs) — redraw on pan/zoom.
  if (has('prte')) drawPrteBackground(pane);
  // User drawings are time+price anchored, so they stale on any pan/zoom for
  // the same reason every overlay above does. No indicator gate — they are
  // always on when present.
  if (pane.drawings && pane.drawings.length) {
    if (immediate) redrawDrawings(pane);
    else scheduleDrawRedraw(pane);
  }
}

// ── Overlay canvas sizing (device-pixel aware) ──────────────────────────────
//
// Every app overlay — volume profile, SVP, FVG, order blocks, fib, projection,
// pattern zones, %R tint, delta profile, user drawings — used to size itself
//
//     canvas.width = canvas.offsetWidth
//
// i.e. ONE backing-store pixel per CSS pixel, regardless of the display. On any
// HiDPI screen that is a permanently soft overlay sitting on top of candles
// Lightweight Charts renders at the real device ratio, and in a 2x snapshot it
// is upscaled by drawImage while the candles are natively sharp. Measured on the
// running chart 2026-09-11: LWC's own canvases at ratio 1.00 on a ratio-1
// display, the user-drawing canvas at a STALE 1016x656 buffer stretched across
// 1313x483 CSS px, and seven inactive overlays still at the HTML default 300x150
// — which become 1x the moment their indicator is switched on.
//
// The fix is one helper, because ten call sites drifting apart is how this got
// missed in the first place. The backing store is sized in DEVICE pixels and the
// context is pre-scaled, so **every existing draw call keeps working in CSS
// pixels** and no drawing code below had to change.
//
// SNAP_RATIO lets the snapshot raise the ratio for one capture: the overlays are
// re-rendered at the export ratio instead of being stretched into it.
let SNAP_RATIO = 0;

function overlayRatio() {
  return SNAP_RATIO || window.devicePixelRatio || 1;
}

function sizeOverlay(canvas) {
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const r = overlayRatio();
  // Assigning width/height also CLEARS the canvas and resets its transform,
  // which is what the old two-liner relied on — so the scale must be applied
  // after, every time, not once at creation.
  canvas.width  = Math.round(W * r);
  canvas.height = Math.round(H * r);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(r, 0, 0, r, 0, 0);
  return {W, H, ctx, ratio: r};
}

function drawVolumeProfile(pane) {
  const canvas = pane.volCanvas;
  if (!canvas || !pane.bars || pane.bars.length < 10) { pane.vp = null; return; }
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // Right edge of the PLOT, not of the canvas. The price scale is inside
  // .chart-main and this overlay sits at z-index 10 over all of it, so a
  // histogram anchored at W painted its widest rows straight across the axis
  // labels — half the profile was reading as smudges on the price column.
  let scaleW = 72;
  try { scaleW = pane.chart.priceScale('right').width() || scaleW; } catch {}
  const plotR = Math.max(1, W - scaleW);

  const profile = VP.computeProfile(vpWindowBars(pane),
                                    Object.assign({}, VP_OPTS, {bins: vpBinCount(H)}));
  pane.vp = profile;
  if (!profile) return;

  const {bins, binEdges, poc, valueArea, hvnZones, lvnZones} = profile;
  const maxVol = Math.max(...bins);
  if (maxVol === 0) return;
  const maxBarW = plotR * VP_WIDTH_FRAC;
  const yOf = pr => pane.series.priceToCoordinate(pr);
  const light = currentTheme === 'light';
  // Per-theme, not one palette with the neutral row swapped: the same alpha
  // that reads as a solid block against #131722 washes out to nothing against
  // white, and gold in particular disappears on the light canvas.
  const fill = light
    ? {poc: 'rgba(196,142,0,0.55)',  hvn: 'rgba(34,139,63,0.34)',
       lvn: 'rgba(206,58,48,0.30)',  normal: 'rgba(70,95,155,0.34)'}
    : {poc: 'rgba(255,214,10,0.60)', hvn: 'rgba(63,185,80,0.32)',
       lvn: 'rgba(248,81,73,0.26)',  normal: 'rgba(140,165,225,0.24)'};

  // Re-derive bin indices for zones (computeProfile returns price boundaries
  // only) so the histogram rows can be colored by node classification.
  hvnZones.forEach(z => { z._lo = Math.round((z.low - profile.lo) / profile.binSize); z._hi = Math.round((z.high - profile.lo) / profile.binSize) - 1; });
  lvnZones.forEach(z => { z._lo = Math.round((z.low - profile.lo) / profile.binSize); z._hi = Math.round((z.high - profile.lo) / profile.binSize) - 1; });
  const inHvn = i => hvnZones.some(z => i >= z._lo && i <= z._hi);
  const inLvn = i => lvnZones.some(z => i >= z._lo && i <= z._hi);

  // ── Histogram rows, colored by classification ──
  // Row height comes from the price scale, not from H/bins. Those two agree
  // only when the visible price range equals the profile's range; when they
  // didn't, rows were drawn at 22 px where their bin actually spanned 80 px,
  // leaving 58 px gaps between chunky blocks that lined up with nothing.
  bins.forEach((vol, i) => {
    if (vol <= 0) return;
    const yTop = yOf(binEdges[i + 1]);
    const yBot = yOf(binEdges[i]);
    if (yTop === null || yBot === null) return;
    if (yBot < 0 || yTop > H) return;                  // wholly off-canvas
    const rowH = Math.max(1, yBot - yTop - 1);         // 1 px gutter between rows
    const barW = Math.max(1, (vol / maxVol) * maxBarW);
    ctx.fillStyle = i === poc.idx ? fill.poc
                  : inHvn(i)      ? fill.hvn
                  : inLvn(i)      ? fill.lvn
                  :                 fill.normal;
    ctx.fillRect(plotR - barW, yTop, barW, rowH);
  });

  // Baseline down the right edge of the plot: gives the rows something to grow
  // out of, so the shape reads as one profile instead of floating bars.
  ctx.fillStyle = light ? 'rgba(70,95,155,0.45)' : 'rgba(140,165,225,0.40)';
  ctx.fillRect(plotR - 1, 0, 1, H);

  // ── Value Area band (shaded) + VAH/VAL lines ──
  const yVAH = yOf(valueArea.high);
  const yVAL = yOf(valueArea.low);
  if (yVAH !== null && yVAL !== null) {
    ctx.fillStyle = 'rgba(255,214,10,0.05)';
    ctx.fillRect(0, yVAH, plotR, yVAL - yVAH);
    [['VAH', valueArea.high, yVAH], ['VAL', valueArea.low, yVAL]].forEach(([label, price, y]) => {
      ctx.strokeStyle = light ? 'rgba(168,121,10,0.6)' : 'rgba(255,214,10,0.5)';
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(plotR, y); ctx.stroke();
      ctx.setLineDash([]);
      vpLabel(ctx, `${label} ${price.toFixed(2)}`, 6, y - 3, '10px monospace', light);
    });
  }

  // ── POC line (across the plot, solid) ──
  const yPOC = yOf(poc.price);
  if (yPOC !== null) {
    ctx.strokeStyle = light ? 'rgba(168,121,10,0.9)' : 'rgba(255,214,10,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, yPOC); ctx.lineTo(plotR, yPOC); ctx.stroke();
    vpLabel(ctx, `POC ${poc.price.toFixed(2)}`, 6, yPOC - 3, 'bold 10px monospace', light);
  }
}

// Gold-on-white is unreadable, and these labels sit over candles either way.
// Paint a matching-color halo behind the text so it survives both themes and
// whatever is drawn underneath.
function vpLabel(ctx, text, x, y, font, light) {
  ctx.font = font;
  ctx.lineWidth = 3;
  ctx.strokeStyle = light ? 'rgba(255,255,255,0.85)' : 'rgba(13,17,23,0.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = light ? '#a8790a' : '#ffd60a';
  ctx.fillText(text, x, y);
  ctx.lineWidth = 1;
}

// ── Fair Value Gap overlay rendering (integration layer for fvg.js) ───────────
// fvg.js (window.FVG) is a pure computation module with zero chart dependency.
// This is the "plug" that draws each gap zone as a translucent box from its
// left edge (the candle that opened the gap) to either the bar that filled it
// or the right edge of the loaded data if it's still open — green = bullish,
// red = bearish, matching the convention from the source tutorial this
// feature was modeled on (see wiki/sources/YT-MultiChart-TradingView-Alternative.md).
const FVG_OPTS = {minSizePct: 0, maxZones: 60};

function drawFVG(pane) {
  const canvas = pane.fvgCanvas;
  if (!canvas || !pane.bars || pane.bars.length < 3 || typeof FVG === 'undefined') {
    pane.fvgZones = null;
    return;
  }
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const zones = FVG.compute(pane.bars, FVG_OPTS);
  pane.fvgZones = zones;
  if (!zones.length) return;

  const lastBarTime = pane.bars[pane.bars.length - 1].time;
  const ts = pane.chart.timeScale();

  zones.forEach(z => {
    const xLeft = ts.timeToCoordinate(z.startTime);
    if (xLeft === null) return; // scrolled out of view to the left
    const xRight = z.filledTime
      ? ts.timeToCoordinate(z.filledTime)
      : ts.timeToCoordinate(lastBarTime);
    const yTop    = pane.series.priceToCoordinate(z.top);
    const yBottom = pane.series.priceToCoordinate(z.bottom);
    if (xRight === null || yTop === null || yBottom === null) return;

    const x = Math.max(0, xLeft);
    const w = Math.min(W, xRight) - x;
    if (w <= 0) return;
    const y = Math.min(yTop, yBottom);
    const h = Math.max(1, Math.abs(yBottom - yTop));

    // Open (unfilled) gaps are drawn solid; filled gaps fade out so the chart
    // stays readable while still showing where price has already "tagged" the
    // imbalance — a filled gap is historical context, not an active level.
    const filled = z.filledTime !== null;
    ctx.fillStyle = z.bullish
      ? (filled ? 'rgba(38,166,154,0.08)' : 'rgba(38,166,154,0.22)')
      : (filled ? 'rgba(239,83,80,0.08)'  : 'rgba(239,83,80,0.22)');
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = z.bullish
      ? (filled ? 'rgba(38,166,154,0.25)' : 'rgba(38,166,154,0.7)')
      : (filled ? 'rgba(239,83,80,0.25)'  : 'rgba(239,83,80,0.7)');
    ctx.lineWidth = 1;
    ctx.setLineDash(filled ? [3, 3] : []);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
  });
}

// ── Order Block overlay (SMC demand / supply zones) ───────────────────────────
// Server-computed (scanner_templates.detect_order_blocks via /api/order_blocks),
// cached per (symbol,tf,lastBar); zones drawn as boxes on obCanvas. Unmitigated
// (fresh) zones are bold; mitigated ones fade to a dashed faint box (kept for
// context). Green = bullish demand, red = bearish supply. Fresh zones also draw
// their server-computed TP/SL rails — a plan MEASURED at -0.095R net of costs
// (+0.026R gross), drawn as the detector's geometry and not as a recommendation. Redrawn from
// the cached
// zones on pan/zoom (drawOrderBlocks) so it doesn't re-fetch on every frame.
function ensureObState(pane) {
  if (!pane.ob) pane.ob = {zones: null, lastFetchKey: null};
  return pane.ob;
}

function clearOrderBlocks(pane) {
  const st = pane.ob;
  if (st) { st.zones = null; st.retests = null; st.lastFetchKey = null; }
  if (pane.obCanvas) {
    const ctx = pane.obCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.obCanvas.width, pane.obCanvas.height);
  }
}

async function renderOrderBlocks(pane) {
  const st = ensureObState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
