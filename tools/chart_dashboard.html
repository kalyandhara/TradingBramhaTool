<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Bramha — Multi-Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<!-- Elliott Wave detection plug-in — pure computation module, see elliott_wave.js -->
<script src="/elliott_wave.js"></script>
<!-- Volume Profile (POC/Value Area/HVN/LVN) plug-in — pure computation module, see volume_profile.js -->
<script src="/volume_profile.js"></script>
<!-- Fair Value Gap detection plug-in — pure computation module, see fvg.js -->
<script src="/fvg.js"></script>
<!-- %R Trend Exhaustion oscillator plug-in — pure computation module, see percent_r_trend_exhaustion.js -->
<script src="/percent_r_trend_exhaustion.js"></script>
<!-- Fibonacci levels + confluence trade plan — pure computation module, see fibonacci.js.
     Loaded AFTER elliott_wave.js and volume_profile.js: it reads EW.computeZigzag for
     swing anchoring and VP.findConfluence for level scoring. -->
<script src="/fibonacci.js"></script>
<style>
/* ── Theme variables ──────────────────────────────────────────────────────── */
:root {
  --bg-page:        #0d1117;
  --bg-header:      #161b22;
  --bg-pane:        #131722;
  --bg-pane-header: rgba(22,27,34,0.97);
  --bg-input:       #1c2128;
  --bg-input-alt:   #21262d;
  --bg-dropdown:    #161b22;
  --bg-hover:       #1c2128;
  --border:         #30363d;
  --border-soft:    #21262d;
  --text-primary:   #e6edf3;
  --text-secondary: #8b949e;
  --text-chart:     #c9d1d9;
  --text-muted:     #6e7681;
  --text-load:      #484f58;
  --accent:         #58a6ff;
  --grid-line:      #1e222d;
  --grid-line-sub:  #1a1e2a;
  --overlay-bg:     rgba(13,17,23,0.82);
  --exch-nse-bg:    #1a3a2a;
  --exch-us-bg:     #1a2a3a;
  --exch-crypto-bg: #2a1a3a;
  --exch-index-bg:  #3a2a1a;
  --ws-live-bg:     #1a3a2a;
  --ws-off-bg:      #3a1a1a;
  --ws-retry-bg:    #2a2a1a;
  --so-icon-fg:     #0d1117;
}
html.light {
  --bg-page:        #f6f8fa;
  --bg-header:      #ffffff;
  --bg-pane:        #ffffff;
  --bg-pane-header: rgba(255,255,255,0.97);
  --bg-input:       #f6f8fa;
  --bg-input-alt:   #eaeef2;
  --bg-dropdown:    #ffffff;
  --bg-hover:       #f0f2f5;
  --border:         #d0d7de;
  --border-soft:    #e8eaed;
  --text-primary:   #1f2328;
  --text-secondary: #57606a;
  --text-chart:     #424a53;
  --text-muted:     #6e7681;
  --text-load:      #8c8c8c;
  --accent:         #0969da;
  --grid-line:      #e8eaed;
  --grid-line-sub:  #f0f2f5;
  --overlay-bg:     rgba(246,248,250,0.92);
  --exch-nse-bg:    #dcfce7;
  --exch-us-bg:     #dbeafe;
  --exch-crypto-bg: #ede9fe;
  --exch-index-bg:  #fef3c7;
  --ws-live-bg:     #dcfce7;
  --ws-off-bg:      #fee2e2;
  --ws-retry-bg:    #fef9c3;
  --so-icon-fg:     #ffffff;
}

/* ── Reset & base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg-page); color: var(--text-primary);
}

/* ── Header ───────────────────────────────────────────────────────────────── */
#header {
  height: 46px; display: flex; align-items: center; gap: 14px;
  padding: 0 16px; background: var(--bg-header);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#header .logo { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
#header label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
#header select {
  background: var(--bg-input-alt); border: 1px solid var(--border); color: var(--text-primary);
  padding: 3px 8px; border-radius: 6px; font-size: 12px; cursor: pointer;
  outline: none;
}
#header select:focus { border-color: var(--accent); }
#ws-indicator {
  font-size: 11px; font-weight: 600; flex-shrink: 0;
  padding: 3px 10px; border-radius: 12px;
}
.ws-live   { background: var(--ws-live-bg);  color: #3fb950; }
.ws-off    { background: var(--ws-off-bg);   color: #f85149; }
.ws-retry  { background: var(--ws-retry-bg); color: #d29922; }

/* ── Theme toggle ─────────────────────────────────────────────────────────── */
.theme-switch {
  display: flex; align-items: center;
  background: var(--bg-input-alt); border: 1px solid var(--border);
  border-radius: 16px; padding: 2px; gap: 1px; flex-shrink: 0;
}
.theme-switch input[type=radio] { display: none; }
.theme-switch label {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: 13px; cursor: pointer;
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  transition: background .15s, color .15s;
  user-select: none;
}
.theme-switch input:checked + label {
  background: var(--bg-header); color: var(--accent);
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}

/* ── Grid ─────────────────────────────────────────────────────────────────── */
#grid {
  display: grid; gap: 3px; padding: 3px;
  height: calc(100vh - 46px); overflow: hidden;
  background: var(--bg-page);
}
/* Layout classes applied dynamically */
.g1 { grid-template-columns: 1fr;                  grid-template-rows: 1fr; }
.g2 { grid-template-columns: 1fr 1fr;              grid-template-rows: 1fr; }
.g4 { grid-template-columns: 1fr 1fr;              grid-template-rows: 1fr 1fr; }
.g6 { grid-template-columns: repeat(3,1fr);        grid-template-rows: 1fr 1fr; }
.g8 { grid-template-columns: repeat(4,1fr);        grid-template-rows: 1fr 1fr; }

/* ── Pane ─────────────────────────────────────────────────────────────────── */
.pane {
  position: relative; display: flex; flex-direction: column;
  background: var(--bg-pane); border: 1px solid var(--border-soft); border-radius: 4px;
  overflow: hidden; min-height: 0;
}

/* ── Pane header ──────────────────────────────────────────────────────────── */
.ph {
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  padding: 4px 8px; background: var(--bg-pane-header);
  border-bottom: 1px solid var(--border-soft); z-index: 5;
}
.ph input[type=text] {
  width: 110px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
  padding: 2px 6px; border-radius: 4px; font-size: 11px; outline: none;
  text-transform: uppercase;
}
.ph input[type=text]:focus { border-color: var(--accent); }

/* ── Symbol search (TradingView-style typeahead) ─────────────────────────────── */
.sym-wrap { position: relative; }
.sym-dropdown {
  display: none; position: absolute; top: 100%; left: 0; margin-top: 4px;
  width: 320px; max-height: 380px; overflow-y: auto; z-index: 60;
  background: var(--bg-dropdown); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); padding: 4px 0;
}
.sym-dropdown.open { display: block; }
.sym-dropdown .sym-empty {
  padding: 14px 12px; font-size: 12px; color: var(--text-muted); text-align: center;
}
.sym-opt {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  cursor: pointer; font-size: 12px;
}
.sym-opt:hover, .sym-opt.hl { background: var(--bg-hover); }
.sym-opt .so-icon {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: var(--so-icon-fg);
}
.sym-opt .so-main { flex: 1; min-width: 0; overflow: hidden; }
.sym-opt .so-symbol { color: var(--accent); font-weight: 700; }
.sym-opt .so-name {
  color: var(--text-secondary); font-size: 11px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-left: 6px;
}
.sym-opt .so-meta { flex-shrink: 0; text-align: right; }
.sym-opt .so-type { color: var(--text-muted); font-size: 10px; display: block; }
.sym-opt .so-exch {
  font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px;
  margin-top: 2px; display: inline-block;
}
.so-exch.NSE, .so-exch.BSE     { background: var(--exch-nse-bg);    color: #3fb950; }
.so-exch.NASDAQ, .so-exch.NYSE { background: var(--exch-us-bg);     color: #58a6ff; }
.so-exch.CRYPTO                { background: var(--exch-crypto-bg); color: #bc8cff; }
.so-exch.INDEX                 { background: var(--exch-index-bg);  color: #d29922; }
.ph select {
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
  padding: 2px 4px; border-radius: 4px; font-size: 11px; cursor: pointer;
  outline: none;
}
.ph select:focus { border-color: var(--accent); }

/* ── Indicators button + dropdown ─────────────────────────────────────────── */
.ind-wrap { position: relative; }
.ind-btn {
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary);
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
  letter-spacing: .03em; cursor: pointer; outline: none; white-space: nowrap;
}
.ind-btn:hover, .ind-btn.active { border-color: var(--accent); color: var(--accent); }
.snap-btn { padding: 2px 7px; font-size: 13px; line-height: 1.4; }

/* ── Visible-range presets (1M/3M/6M/1Y/All) ─────────────────────────────── */
.range-row {
  display: flex; gap: 4px; padding: 3px 8px; background: var(--bg-pane-header);
  border-bottom: 1px solid var(--border-soft);
}
.range-btn {
  background: transparent; border: 1px solid transparent; color: var(--text-secondary);
  padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 600;
  cursor: pointer; outline: none;
}
.range-btn:hover { border-color: var(--border); color: var(--text-primary); }
.range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.ind-panel {
  display: none; position: absolute; top: 100%; left: 0; margin-top: 4px;
  width: 220px; max-height: 360px; overflow-y: auto; z-index: 50;
  background: var(--bg-dropdown); border: 1px solid var(--border); border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2); padding: 8px 0;
}
.ind-panel.open { display: block; }
.ind-group-title {
  font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--text-secondary);
  padding: 6px 12px 4px; text-transform: uppercase;
}
.ind-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 12px;
  cursor: pointer; font-size: 12px; color: var(--text-chart);
}
.ind-row:hover { background: var(--bg-hover); }
.ind-row input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
.ind-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.ind-divider { height: 1px; background: var(--border-soft); margin: 6px 0; }

/* ── Ticker bar ───────────────────────────────────────────────────────────── */
.ticker-wrap {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
}
.sym-badge {
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis;
}
.sym-company {
  font-size: 10px; color: var(--text-secondary); opacity: .7;
  white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis;
}
.sym-exch-badge {
  font-size: 9px; font-weight: 700; letter-spacing: .3px;
  padding: 1px 5px; border-radius: 8px; white-space: nowrap;
}
.sym-exch-badge.NSE { color: #3fb950; background: rgba(63,185,80,.15); border: 1px solid rgba(63,185,80,.3); }
.sym-exch-badge.BSE { color: #d29922; background: rgba(210,153,34,.15); border: 1px solid rgba(210,153,34,.3); }
.price-el {
  font-family: "Courier New", monospace; font-size: 13px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px; min-width: 90px; text-align: right;
  transition: background 0.15s ease-out;
}
.price-el.up   { color: #3fb950; }
.price-el.down { color: #f85149; }
@keyframes fgreen { 0%,100% { background:transparent; } 20% { background:rgba(63,185,80,.35); } }
@keyframes fred   { 0%,100% { background:transparent; } 20% { background:rgba(248,81,73,.35); } }
.flash-g { animation: fgreen .6s ease-out; }
.flash-r { animation: fred   .6s ease-out; }

/* Pill badge, Google-Finance style: arrow + % + absolute change vs the
   previous daily close, all on one line so it costs no extra row height. */
.chg-el {
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
  padding: 1px 7px; border-radius: 10px; display: inline-flex;
  align-items: center; gap: 3px; line-height: 1.5;
}
.chg-el.up   { color: #3fb950; background: rgba(63,185,80,.15); }
.chg-el.down { color: #f85149; background: rgba(248,81,73,.15); }
.chg-el .chg-arrow { font-size: 9px; }

/* Liquid-ETF / cash-equivalent tag — hidden by default, .active by JS. */
.etf-badge {
  display: none; font-size: 9.5px; font-weight: 700; letter-spacing: .3px;
  padding: 1px 6px; border-radius: 10px; color: #b98700;
  background: rgba(255, 214, 10, .18); border: 1px solid rgba(255, 214, 10, .35);
  cursor: help;
}
.etf-badge.active { display: inline-flex; }

/* Momentum indicators disabled by the ETF-mode detector — greyed and
   click-blocked, but still visible so the user sees WHAT was suppressed. */
.ind-row.ind-disabled { opacity: .35; cursor: not-allowed; }
.ind-row.ind-disabled input { pointer-events: none; }

/* ── Snapshot toast ───────────────────────────────────────────────────────── */
.snap-toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--bg-dropdown); border: 1px solid var(--border); color: var(--text-primary);
  padding: 8px 16px; border-radius: 6px; font-size: 12px; z-index: 999;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  opacity: 0; transition: opacity .2s ease-out; pointer-events: none;
}
.snap-toast.show { opacity: 1; }

/* ── Chart body & sub-panes ───────────────────────────────────────────────── */
.chart-body {
  flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.chart-main {
  /* min-height gives the candlestick chart a hard floor so it can't be
     collapsed to zero by a stack of sub-pane indicators. Previously with
     flex:1 + min-height:0, a pane with 6 sub-panes (6×100=600px fixed)
     in a g4 layout would leave chart-main at 0px and show only sub-panes.
     100px is the same as one sub-pane — enough to see candles even when
     everything is squeezed. */
  flex: 1 1 auto; min-height: 100px; position: relative; overflow: hidden;
}
/* Sub-panes must be allowed to shrink so the main chart's min-height wins.
   Individual sub-pane min-height keeps oscillators still readable when
   space is tight; below that they overflow-scroll rather than disappear. */
.sub-panes { display: flex; flex-direction: column; flex-shrink: 1; min-height: 0; overflow: hidden; }
.sub-pane {
  height: 100px; min-height: 50px; flex-shrink: 1;
  position: relative; border-top: 1px solid var(--border-soft); overflow: hidden;
}
.sub-pane-label {
  position: absolute; top: 4px; left: 8px; z-index: 10; pointer-events: none;
  font-size: 9px; font-weight: 700; letter-spacing: .05em;
  color: var(--text-secondary); text-transform: uppercase;
}
.loading-msg {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--text-load); font-size: 13px; pointer-events: none;
}

/* ── Elliott Wave info overlay ────────────────────────────────────────────── */
/* Moved to bottom-left so it never overlaps the top-corner INDICATORS
   dropdown or the ticker bar (LAURUSLABS case, 2026-07-03). Defaults to
   collapsed on first render — the actionable info (fib target prices, VP
   confluence stars) is already on the right price axis; the wave-math list
   is context, not a decision. State persists per-pane in localStorage. */
.ew-info {
  position: absolute; bottom: 8px; left: 8px; z-index: 8;
  background: var(--overlay-bg); border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 9px 6px 9px; font-size: 10.5px; line-height: 1.5; color: var(--text-chart);
  max-width: 260px; display: none;
}
.ew-info b { color: #00e5ff; }
.ew-info i { color: var(--text-muted); font-style: normal; }
.ew-info-toggle {
  position: absolute; top: 2px; right: 4px; cursor: pointer;
  font-size: 11px; line-height: 1; color: var(--text-muted);
  padding: 2px 4px; user-select: none;
}
.ew-info-toggle:hover { color: var(--text-chart); }
.ew-info.collapsed .ew-info-body { display: none; }
.ew-info.collapsed { padding: 2px 22px 2px 8px; max-width: none; width: auto; }
.ew-info.collapsed .ew-info-toggle { top: 0; }
/* Compact one-line summary shown when collapsed — the same identifier the
   full panel starts with, so the user knows what's parked there. */
.ew-info-summary {
  font-size: 10.5px; font-weight: 600; color: #00e5ff;
  white-space: nowrap; display: none;
}
.ew-info.collapsed .ew-info-summary { display: inline-block; }

/* ── Reversal Calendar info overlay ───────────────────────────────────────── */
/* Anchored bottom-right so it doesn't overlap the top-left ew-info panel
   when both Elliott Wave and Reversal Calendar are toggled on. */
.rev-info {
  position: absolute; bottom: 6px; right: 8px; z-index: 8; pointer-events: none;
  background: var(--overlay-bg); border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 9px; font-size: 10.5px; line-height: 1.5; color: var(--text-chart);
  max-width: 260px; display: none;
}

/* ── Top-right action stack ───────────────────────────────────────────────── */
/* Single flex row anchored to the top-RIGHT corner. It started top-left, but
   the symbol-autocomplete dropdown and the INDICATORS panel both open from
   the top-left toolbar and landed underneath the cards, so the user could
   not pick a scrip or toggle an indicator while cards were up (NESTLEIND
   case, 2026-07-22). Right-anchored the cards only overlap the top rows of
   the price scale — the same tradeoff the old rev-info corner made. Every
   card that can demand a decision (FVG signal, Fibonacci trade plan, price
   projection) plus the Rounding Bottom chip lives here as a normal flow
   child, so any number of simultaneous cards align on the top edge and flow
   with a gap — replacing the old per-card corner assignments, which collided
   when two overlays claimed the same corner (FVG + projection were both
   bottom-right). Cards wrap to a second right-aligned row on narrow panes
   rather than clipping. `order` on each card fixes the visual sequence
   regardless of which overlay the user toggled on first. pointer-events pass
   through the (possibly empty) container but stay live on the cards
   themselves. */
.action-stack {
  position: absolute; top: 6px; right: 8px; z-index: 9;
  display: flex; flex-direction: row; flex-wrap: wrap; align-items: flex-start;
  justify-content: flex-end;
  /* Reserve the left ~280px at every width: that's where the symbol
     autocomplete and INDICATORS panel drop down, and cards must never sit
     under them — wrap into right-aligned rows instead. */
  gap: 6px; max-width: calc(100% - 280px);
  pointer-events: none;
}
.action-stack > * { position: relative; pointer-events: auto; flex-shrink: 0; }

/* ── Rounding Bottom info overlay ─────────────────────────────────────────── */
/* Lives in the top-left .action-stack (order 0: chip-sized, so it leads the
   row without pushing the cards far right). Same collapse-and-persist
   pattern as ew-info; default is collapsed to a small chip. */
.rb-info {
  order: 0;
  background: var(--overlay-bg); border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 22px 6px 9px; font-size: 10.5px; line-height: 1.5; color: var(--text-chart);
  max-width: 240px; display: none;
}
.rb-info b { color: #ffab40; }
.rb-info-toggle {
  position: absolute; top: 2px; right: 4px; cursor: pointer;
  font-size: 11px; line-height: 1; color: var(--text-muted);
  padding: 2px 4px; user-select: none;
}
.rb-info-toggle:hover { color: var(--text-chart); }
.rb-info.collapsed .rb-info-body { display: none; }
.rb-info.collapsed { padding: 2px 22px 2px 8px; max-width: none; width: auto; }
.rb-info.collapsed .rb-info-toggle { top: 0; }
.rb-info-summary {
  font-size: 10.5px; font-weight: 600; color: #ffab40;
  white-space: nowrap; display: none;
}
.rb-info.collapsed .rb-info-summary { display: inline-block; }

/* ── VCP Coiling info overlay ─────────────────────────────────────────────── */
/* Anchored bottom-center. It used to hold top-center, but that slot went to
   the PMax position panel, which is read far more often and at a glance.
   Swapping rather than offsetting keeps both readable with no conditional
   layout: VCP defaults to a collapsed chip, so the bottom edge suits it.
   Four corners are taken by the INDICATORS button, Rounding Bottom, Elliott
   Wave, and Reversal Calendar. Same collapse-and-persist pattern as ew-info. */
.vcp-info {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 8;
  background: var(--overlay-bg); border: 1px solid var(--border); border-radius: 5px;
  padding: 6px 22px 6px 9px; font-size: 10.5px; line-height: 1.5; color: var(--text-chart);
  max-width: 280px; display: none;
}
.vcp-info b { color: #26c6da; }
.vcp-info-toggle {
  position: absolute; top: 2px; right: 4px; cursor: pointer;
  font-size: 11px; line-height: 1; color: var(--text-muted);
  padding: 2px 4px; user-select: none;
}
.vcp-info-toggle:hover { color: var(--text-chart); }
.vcp-info.collapsed .vcp-info-body { display: none; }
.vcp-info.collapsed { padding: 2px 22px 2px 8px; max-width: none; width: auto; }
.vcp-info.collapsed .vcp-info-toggle { top: 0; }
.vcp-info-summary {
  font-size: 10.5px; font-weight: 600; color: #26c6da;
  white-space: nowrap; display: none;
}
.vcp-info.collapsed .vcp-info-summary { display: inline-block; }

function renderIndicatorPanel() {

// ── Indicator math (computed from a full bars[] array of {time,open,high,low,close,volume}) ──
function smaSeries(bars, period) {
  const out = [];
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i].close;
    if (i >= period) sum -= bars[i - period].close;
    if (i >= period - 1) out.push({time: bars[i].time, value: sum / period});
  }
  return out;
}

function emaSeries(bars, period) {
  const out = [];
  const k = 2 / (period + 1);
  let prev = null;
  for (let i = 0; i < bars.length; i++) {
    const c = bars[i].close;
    if (prev === null) {
      if (i === period - 1) {
        // seed with SMA of first `period` closes
        let sum = 0;
        for (let j = 0; j <= i; j++) sum += bars[j].close;
        prev = sum / period;
        out.push({time: bars[i].time, value: prev});
      }
      continue;
    }
    prev = c * k + prev * (1 - k);
    out.push({time: bars[i].time, value: prev});
  }
  return out;
}

function vwapSeries(bars) {
  // Anchored VWAP, resets at the start of each calendar day (UTC).
  const out = [];
  let cumPV = 0, cumVol = 0, curDay = null;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const day = new Date(b.time * 1000).toISOString().slice(0, 10);
    if (day !== curDay) { curDay = day; cumPV = 0; cumVol = 0; }
    const typical = (b.high + b.low + b.close) / 3;
    const vol = b.volume || 0;
    cumPV  += typical * vol;
    cumVol += vol;
    out.push({time: b.time, value: cumVol > 0 ? cumPV / cumVol : b.close});
  }
  return out;
}

function bollingerSeries(bars, period, mult) {
  const mid = [], upper = [], lower = [];
  for (let i = period - 1; i < bars.length; i++) {
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += bars[j].close;
    const mean = sum / period;
    let sqSum = 0;
    for (let j = i - period + 1; j <= i; j++) sqSum += Math.pow(bars[j].close - mean, 2);
    const sd = Math.sqrt(sqSum / period);
    mid.push({time: bars[i].time, value: mean});
    upper.push({time: bars[i].time, value: mean + mult * sd});
    lower.push({time: bars[i].time, value: mean - mult * sd});
  }
  return {mid, upper, lower};
}

function donchianSeries(bars, period) {
  const upper = [], lower = [], mid = [];
  for (let i = period - 1; i < bars.length; i++) {
    let hi = -Infinity, lo = Infinity;
    for (let j = i - period + 1; j <= i; j++) {
      if (bars[j].high > hi) hi = bars[j].high;
      if (bars[j].low  < lo) lo = bars[j].low;
    }
    upper.push({time: bars[i].time, value: hi});
    lower.push({time: bars[i].time, value: lo});
    mid.push({time: bars[i].time, value: (hi + lo) / 2});
  }
  return {upper, lower, mid};
}

function atrSeries(bars, period) {
  const out = [];
  let prevClose = null, atr = null;
  const trs = [];
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const tr = prevClose === null
      ? b.high - b.low
      : Math.max(b.high - b.low, Math.abs(b.high - prevClose), Math.abs(b.low - prevClose));
    trs.push(tr);
    prevClose = b.close;
    if (i === period - 1) {
      atr = trs.slice(0, period).reduce((a, v) => a + v, 0) / period;
      out.push({time: b.time, value: atr});
    } else if (i > period - 1) {
      atr = (atr * (period - 1) + tr) / period;
      out.push({time: b.time, value: atr});
    }
  }
  return out;
}

// PMax — EMA-of-source ± ATR × Multiplier, ratcheting trailing band that flips
// direction when the smoothed source crosses the opposite stop. Port of the
// original PMax Pine (see tools/pmax.pine, lines 211-267). Defaults match the
// Pine (src=hl2, atr_len=10, atr_mult=3.0, ma=EMA, ma_len=10, changeATR=true).
// Returns an array of {time, pmax, dir, ma} — one point per bar once warmed up.
function pmaxSeries(bars, atrLen = 10, atrMult = 3.0, maLen = 10) {
  if (!bars || bars.length < Math.max(atrLen, maLen) + 2) return [];
  // Wilder ATR (matches ta.atr in Pine when changeATR=true).
  const atr = atrSeries(bars, atrLen);
  const atrByTime = new Map(atr.map(a => [a.time, a.value]));
  // EMA of hl2.
  const alpha = 2 / (maLen + 1);
  let ema = null;
  const out = [];
  let longStopPrev = null, shortStopPrev = null, dir = 1;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const src = (b.high + b.low) / 2;
    ema = ema === null ? src : alpha * src + (1 - alpha) * ema;
    // Warm-up: only start emitting once ATR has a value AND we've seeded ~maLen
    // bars into the EMA — mirrors Pine's na-propagation.
    if (i < maLen - 1) continue;
    const a = atrByTime.get(b.time);
    if (a === undefined) continue;
    let longStop  = ema - atrMult * a;
    let shortStop = ema + atrMult * a;
    if (longStopPrev !== null && ema > longStopPrev)  longStop  = Math.max(longStop,  longStopPrev);
    if (shortStopPrev !== null && ema < shortStopPrev) shortStop = Math.min(shortStop, shortStopPrev);
    if      (dir === -1 && ema > (shortStopPrev ?? shortStop)) dir = 1;
    else if (dir ===  1 && ema < (longStopPrev  ?? longStop))  dir = -1;
    const pmax = dir === 1 ? longStop : shortStop;
    out.push({time: b.time, pmax, dir, ma: ema});
    longStopPrev  = longStop;
    shortStopPrev = shortStop;
  }
  return out;
}

// PMax trade signals — a flip of `dir` IS the reversal, and that's the only
// actionable event the indicator produces. The two colored lines alone don't
// say where the flip happened or what to risk, so this turns each flip into an
// explicit trade: entry at the flip bar's close, stop at the PMax band on that
// bar (the band is the invalidation level by construction), and targets at
// 1R/2R/3R off that initial risk. `hit` records how far price has already run
// since the flip, so a stale signal reads as "TP2 ✓" rather than looking live.
// Returns oldest → newest; the last element is the currently-open position.
function pmaxSignals(rows, bars) {
  if (!rows || rows.length < 2) return [];
  const barByTime = new Map(bars.map(b => [b.time, b]));
  const sigs = [];
  for (let i = 1; i < rows.length; i++) {
    if (rows[i].dir === rows[i - 1].dir) continue;
    const r = rows[i];
    const b = barByTime.get(r.time);
    const entry = b ? b.close : r.ma;
    const stop  = r.pmax;
    const risk  = Math.abs(entry - stop);
    const sign  = r.dir === 1 ? 1 : -1;
    sigs.push({
      time: r.time, dir: r.dir, entry, stop, risk, idx: i,
      targets: risk > 0 ? [1, 2, 3].map(m => entry + sign * m * risk) : [],
      hit: 0,
    });
  }
  // Best excursion since each flip, in whole R — drives the TPn ✓ badges.
  sigs.forEach((s, n) => {
    const end = n + 1 < sigs.length ? sigs[n + 1].idx : rows.length;
    if (!s.risk) return;
    let best = 0;
    for (let i = s.idx; i < end; i++) {
      const b = barByTime.get(rows[i].time);
      if (!b) continue;
      const move = s.dir === 1 ? b.high - s.entry : s.entry - b.low;
      if (move > best) best = move;
    }
    s.hit = Math.min(3, Math.floor(best / s.risk));
  });
  return sigs;
}

function keltnerSeries(bars, period, mult) {
  const emaMid = emaSeries(bars, period);
  const atr = atrSeries(bars, period);
  const atrByTime = new Map(atr.map(a => [a.time, a.value]));
  const mid = [], upper = [], lower = [];
  emaMid.forEach(pt => {
    const a = atrByTime.get(pt.time);
    if (a === undefined) return;
    mid.push(pt);
    upper.push({time: pt.time, value: pt.value + mult * a});
    lower.push({time: pt.time, value: pt.value - mult * a});
  });
  return {mid, upper, lower};
}

// Wilder RSI. Previously used an accumulator seed that could produce
// avgGain=0 even when the price series was monotonically rising in the small
// (e.g. a liquid ETF where daily diffs frequently round to 0.00). One rare
// small down-day would then land as avgLoss>0 with avgGain=0, giving
// rs=0 -> RSI=0 -> phantom vertical plunges on an otherwise flat panel
// (see the LIQUIDCASE.NS case, 2026-07-03). Switching to Wilder EMA from
// bar 1 with a warmup period and a proper neutral-when-both-zero branch.
function rsiSeries(bars, period = 14) {
  if (!bars || bars.length < period + 1) return [];
  const out = [];
  const alpha = 1 / period;
  let avgGain = 0, avgLoss = 0;
  for (let i = 1; i < bars.length; i++) {
    const diff = bars[i].close - bars[i - 1].close;
    const gain = diff > 0 ?  diff : 0;
    const loss = diff < 0 ? -diff : 0;
    avgGain = alpha * gain + (1 - alpha) * avgGain;
    avgLoss = alpha * loss + (1 - alpha) * avgLoss;
    if (i < period) continue;                           // warmup
    // Neutral (not 0/100) while price hasn't moved either way — this is what
    // prevented the false plunge on near-monotonic series.
    let value;
    if (avgGain === 0 && avgLoss === 0)      value = 50;
    else if (avgLoss === 0)                  value = 100;
    else                                     value = 100 - 100 / (1 + avgGain / avgLoss);
    out.push({time: bars[i].time, value});
  }
  return out;
}

function macdCalc(bars, fast = 12, slow = 26, signal = 9) {
  const fastEma = emaSeries(bars, fast);
  const slowEma = emaSeries(bars, slow);
  const fastMap = new Map(fastEma.map(p => [p.time, p.value]));
  const macdLine = [];
  slowEma.forEach(p => {
    const f = fastMap.get(p.time);
    if (f !== undefined) macdLine.push({time: p.time, value: f - p.value});
  });
  // EMA of MACD line = signal
  const k = 2 / (signal + 1);
  const signalLine = [];
  let prev = null;
  for (let i = 0; i < macdLine.length; i++) {
    const v = macdLine[i].value;
    if (prev === null) {
      if (i === signal - 1) {
        let sum = 0;
        for (let j = 0; j <= i; j++) sum += macdLine[j].value;
        prev = sum / signal;
        signalLine.push({time: macdLine[i].time, value: prev});
      }
      continue;
    }
    prev = v * k + prev * (1 - k);
    signalLine.push({time: macdLine[i].time, value: prev});
  }
  const sigMap = new Map(signalLine.map(p => [p.time, p.value]));
  const hist = [];
  macdLine.forEach(p => {
    const sv = sigMap.get(p.time);
    if (sv !== undefined) hist.push({time: p.time, value: p.value - sv, color: p.value - sv >= 0 ? '#26a69a' : '#ef5350'});
  });
  const sigTimes = new Set(signalLine.map(p => p.time));
  return {macd: macdLine.filter(p => sigTimes.has(p.time)), signal: signalLine, hist};
}

function volumeBarSeries(bars) {
  // Colored like the candlesticks themselves (up/down by bar direction).
  return bars.map(b => ({
    time: b.time,
    value: b.volume || 0,
    color: b.close >= b.open ? 'rgba(38,166,154,0.7)' : 'rgba(239,83,80,0.7)',
  }));
}

// Stochastic Oscillator (Lane, late 1950s) — Full Stochastic (k, kSmooth, dSmooth).
// Defaults 14/3/3 = the widely-taught "slow stochastic".
//   raw %K  = 100 × (close − lowestLow(k)) / (highestHigh(k) − lowestLow(k))
//   %K      = SMA(raw %K, kSmooth)
//   %D      = SMA(%K, dSmooth)
// Returns {k: [{time,value}], d: [{time,value}]}. Values in [0, 100], with the
// standard 80 / 20 overbought / oversold guide lines rendered in the sub-pane.
function stochSeries(bars, k = 14, kSmooth = 3, dSmooth = 3) {
  if (!bars || bars.length < k + kSmooth + dSmooth) return {k: [], d: []};
  const raw = [];
  for (let i = k - 1; i < bars.length; i++) {
    let hh = -Infinity, ll = Infinity;
    for (let j = i - k + 1; j <= i; j++) {
      if (bars[j].high > hh) hh = bars[j].high;
      if (bars[j].low  < ll) ll = bars[j].low;
    }
    const rng = hh - ll;
    const v = rng > 0 ? 100 * (bars[i].close - ll) / rng : 50;
    raw.push({time: bars[i].time, value: v});
  }
  const sma = (arr, n) => {
    const out = [];
    let sum = 0;
    for (let i = 0; i < arr.length; i++) {
      sum += arr[i].value;
      if (i >= n) sum -= arr[i - n].value;
      if (i >= n - 1) out.push({time: arr[i].time, value: sum / n});
    }
    return out;
  };
  const kSm = sma(raw, kSmooth);
  const dSm = sma(kSm, dSmooth);
  return {k: kSm, d: dSm};
}

function obvSeries(bars) {
  const out = [];
  let obv = 0;
  for (let i = 0; i < bars.length; i++) {
    if (i > 0) {
      if (bars[i].close > bars[i - 1].close)      obv += (bars[i].volume || 0);
      else if (bars[i].close < bars[i - 1].close) obv -= (bars[i].volume || 0);
    }
    out.push({time: bars[i].time, value: obv});
  }
  return out;
}

// ── ROC + RSI Zones — port of "Rate Of Change and rsi zones" Pine v5 ─────────
// Base ROC = SMA(100*(src-src[length])/src[length], roc_smooth). Layered on
// top is a second colored line that only appears when both ROC and RSI agree
// on a regime — GREEN when RSI<40 & ROC<0 (deep oversold), RED when RSI>60 &
// ROC>0 (extended overbought). Buy/sell triangles fire when the ROC crosses
// its own SMA in the confirming zone. Fill between ROC and zero is inverted:
// green when ROC<0 (contrarian bullish exhaustion), red when ROC>0 (overheat).
function rocRsiSeries(bars, {length = 21, rocSmooth = 5, rocSmaVal = 5, rsiLen = 14} = {}) {
  const n = bars.length;
  const empty = {roc: [], overlayGreen: [], overlayRed: [], baseline: [],
                 buys: [], sells: []};
  if (n < Math.max(length + rocSmooth, rsiLen) + 2) return empty;

  // RSI (Wilder RMA) — matches Pine's ta.rma
  const rsiArr = new Array(n).fill(NaN);
  {
    const alpha = 1 / rsiLen;
    let ag = 0, al = 0;
    for (let i = 1; i < n; i++) {
      const d = bars[i].close - bars[i - 1].close;
      ag = alpha * (d > 0 ?  d : 0) + (1 - alpha) * ag;
      al = alpha * (d < 0 ? -d : 0) + (1 - alpha) * al;
      if (i >= rsiLen) {
        rsiArr[i] = (ag === 0 && al === 0) ? 50
                   : al === 0 ? 100
                   : 100 - 100 / (1 + ag / al);
      }
    }
  }

  // Raw ROC then SMA-smooth it
  const rawRoc = new Array(n).fill(NaN);
  for (let i = length; i < n; i++) {
    const prev = bars[i - length].close;
    if (prev !== 0) rawRoc[i] = 100 * (bars[i].close - prev) / prev;
  }
  const rocArr = new Array(n).fill(NaN);
  {
    let sum = 0, cnt = 0;
    for (let i = 0; i < n; i++) {
      if (!isNaN(rawRoc[i])) { sum += rawRoc[i]; cnt++; }
      if (cnt > rocSmooth) { sum -= rawRoc[i - rocSmooth]; cnt--; }
      if (cnt === rocSmooth) rocArr[i] = sum / rocSmooth;
    }
  }

  // SMA of the ROC — Pine uses it for the cross-signal comparator
  const rocSmaArr = new Array(n).fill(NaN);
  {
    let sum = 0, cnt = 0;
    for (let i = 0; i < n; i++) {
      if (!isNaN(rocArr[i])) { sum += rocArr[i]; cnt++; }
      if (cnt > rocSmaVal) { sum -= rocArr[i - rocSmaVal]; cnt--; }
      if (cnt === rocSmaVal) rocSmaArr[i] = sum / rocSmaVal;
    }
  }

  const roc = [], overlayGreen = [], overlayRed = [], baseline = [];
  const buys = [], sells = [];
  for (let i = 0; i < n; i++) {
    const r = rocArr[i], rs = rsiArr[i];
    if (isNaN(r)) continue;
    const t = bars[i].time;
    roc.push({time: t, value: r});
    baseline.push({time: t, value: r});
    // Zone overlays (only render where the condition holds — gaps stay blank).
    if (!isNaN(rs) && rs < 40 && r < 0) overlayGreen.push({time: t, value: r});
    if (!isNaN(rs) && rs > 60 && r > 0) overlayRed.push({time: t, value: r});
    // Buy/sell markers on the ROC×SMA cross with regime confirmation.
    const rSma = rocSmaArr[i], rPrev = rocArr[i - 1], rSmaPrev = rocSmaArr[i - 1];
    if (!isNaN(rSma) && !isNaN(rPrev) && !isNaN(rSmaPrev)) {
      const crossedUp   = rPrev <= rSmaPrev && r > rSma;
      const crossedDown = rPrev >= rSmaPrev && r < rSma;
      if (crossedUp && rSma < r && r < 0 && !isNaN(rs) && rs < 50) {
        buys.push({time: t, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: '▲'});
      }
      if (crossedDown && rSma > r && r > 0 && !isNaN(rs) && rs > 50) {
        sells.push({time: t, position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: '▼'});
      }
    }
  }
  return {roc, overlayGreen, overlayRed, baseline, buys, sells};
}

// ── Symbol search (TradingView-style typeahead, backed by /api/symbols/search) ──
const symSearchCache = new Map();   // query → results[] (small in-memory cache)

function debounce(fn, ms) {
  let t = null;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

async function fetchSymbolMatches(query) {
  const q = query.trim();
  if (!q) return [];
  if (symSearchCache.has(q)) return symSearchCache.get(q);
  try {
    const r = await fetch(`${SERVER}/api/symbols/search?q=${encodeURIComponent(q)}&limit=20`);
    if (!r.ok) return [];
    const d = await r.json();
    const results = d.results || [];
    symSearchCache.set(q, results);
    return results;
  } catch (e) {
    console.warn('Symbol search failed:', e);
    return [];
  }
}

// ── Price formatting ──────────────────────────────────────────────────────────
function fmtPrice(p) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  if (p >= 1000)  return p.toFixed(2);
  if (p >= 1)     return p.toFixed(4);
  return p.toFixed(6);
}
function fmtChg(chgPct) {
  if (chgPct === null || isNaN(chgPct)) return '';
  const sign = chgPct >= 0 ? '+' : '';
  return `${sign}${chgPct.toFixed(2)}%`;
}
// Currency prefix for the absolute change figure. The symbol suffix alone
// is unambiguous for NSE/BSE (.NS/.BO) and indices (^), but a bare ticker
// could be a US stock (AAPL) or a crypto coin (BTC) — those look identical
// as strings. We disambiguate using `source` ('yfinance' vs 'hyperliquid'),
// which the server already resolved via detect_source() and echoes back on
// every /api/ohlcv response — cheaper and more correct than re-guessing here.
function currencyPrefix(symbol, source) {
  const s = symbol.toUpperCase();
  if (s.endsWith('.NS') || s.endsWith('.BO') || s.endsWith('.BSE')) return '₹';
  if (s.startsWith('^')) return '';
  if (source === 'hyperliquid') return '';   // crypto — no fixed prefix
  return '$';                                 // yfinance + no suffix = US equity
}
function fmtAbsChange(diff, symbol, source) {
  if (diff === null || isNaN(diff)) return '';
  // Explicit sign always shown (never rely on pill color alone — same
  // accessibility convention as gain_loss_badge() in dashboard_app.py).
  const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
  const prefix = currencyPrefix(symbol, source);
  const abs = Math.abs(diff);
  // Equities (₹/$): clean 2-decimal display matching how prices are quoted
  // (Google Finance shows "+0.65", not "+0.650000"). Crypto (no prefix)
  // keeps fmtPrice's adaptive precision since its magnitudes span from
  // sub-cent meme coins to $100k+ BTC.
  const formatted = prefix ? abs.toFixed(2) : fmtPrice(abs);
  return `${sign}${prefix}${formatted}`;
}

// ── Grid builder ──────────────────────────────────────────────────────────────
function buildGrid(count) {
  // Tear down existing panes
  panes.forEach(p => {
    if (p.resizeObs) p.resizeObs.disconnect();
    Object.values(p.subCharts || {}).forEach(sub => {
      if (sub.ro) sub.ro.disconnect();
      try { sub.chart.remove(); } catch {}
    });
    if (p.chart) try { p.chart.remove(); } catch {}
  });
  panes = [];

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.className = GRID_CLASSES[count] || 'g4';

  const saved = loadPaneCfg();

  for (let i = 0; i < count; i++) {
    const def  = DEFAULT_SYMS[i % DEFAULT_SYMS.length];
    const cfg  = saved[i] || {};
    const sym  = cfg.symbol || def.symbol;
    const tf   = cfg.tf     || def.tf;
    const pane = makePane(i, sym, tf, cfg.indicators || [], cfg.rangePreset);
    grid.appendChild(pane.el);
    panes.push(pane);
    // Stagger loads to avoid hammering the server
    setTimeout(() => loadData(i), i * 180);
  }
}

          drawFVG(pane);
        if (pane && pane.indicators &&
            (pane.indicators.has('vcp') || pane.indicators.has('roundbottom')))
          drawPatternZones(pane);
        if (pane && pane.indicators && pane.indicators.has('projection'))
          drawProjection(pane);
      }
    }
  });
  resizeObs.observe(chartMain);

  // ── Pane object ────────────────────────────────────────────────────────────
  const pane = { idx, el, chart, series, resizeObs, symbol, tf,
                 lastPrice: null, openPrice: null, prevClose: null, dataSource: null,
                 priceEl, chgEl, badge,
                 bars: [], indicators: new Set(savedIndicators),
                 rangePreset: savedRangePreset || DEFAULT_RANGE_PRESET,
                 indSeries: {}, subCharts: {}, volCanvas, fvgCanvas, patternCanvas, projCanvas,
                 fibCanvas };

  // ── Time-scale sync: main chart drives all sub-pane charts ─────────────────
  chart.timeScale().subscribeVisibleTimeRangeChange(range => {
    if (!range) return;
    Object.values(pane.subCharts).forEach(({chart: sub}) => {
      try { sub.timeScale().setVisibleRange(range); } catch {}
    });
    // FVG boxes are anchored to time coordinates, so panning/zooming the
    // x-axis (unlike Volume Profile, which only depends on the y-axis) must
    // also trigger a redraw — otherwise the boxes drift away from their bars.
    if (pane.indicators && pane.indicators.has('fvg')) drawFVG(pane);
    // Pattern base-zone boxes are time+price anchored — same staleness as FVG.
    if (pane.indicators &&
        (pane.indicators.has('vcp') || pane.indicators.has('roundbottom')))
      drawPatternZones(pane);
    if (pane.indicators && pane.indicators.has('projection')) drawProjection(pane);
    // Fibonacci levels are price-anchored, so the y-mapping changing on
    // pan/zoom stales them for the same reason the volume profile stales.
    if (pane.indicators && pane.indicators.has('fib')) drawFibonacci(pane);
    // Volume Profile histogram uses priceToCoordinate — pan/zoom changes
    // the y-scale mapping, so it needs a redraw on range change too. FVG
    // is time-anchored; VP is price-scale-anchored. Both stale on zoom
    // for the same reason (mapping changed) — now both redraw.
    if (pane.indicators && pane.indicators.has('volprofile')) drawVolumeProfile(pane);
  });

  // ── Crosshair sync to sub-pane charts ─────────────────────────────────────
  chart.subscribeCrosshairMove(param => {
    Object.values(pane.subCharts).forEach(sub => {
      if (!sub.series) return;
      if (!param.point || !param.time) {
        try { sub.chart.clearCrosshairPosition(); } catch {}
      } else {
        try { sub.chart.setCrosshairPosition(NaN, param.time, sub.series); } catch {}
      }
    });
  });

  // ── Controls ───────────────────────────────────────────────────────────────
  function applySymbol(s) {
    s = s.trim().toUpperCase();
    if (!s) return;
    pane.symbol = s;
    pane.lastPrice = null;
    pane.openPrice = null;
    pane.prevClose = null;
    pane.dataSource = null;
    badge.textContent = s;
    companyEl.textContent = '';
    exchBadge.textContent = '';
    exchBadge.className = 'sym-exch-badge';
    priceEl.textContent = '—';
    priceEl.className = 'price-el';
    chgEl.textContent  = '';
    chgEl.className    = 'chg-el';
    series.setData([]);
    const bare = s.replace(/\.(NS|BO|BSE)$/i, '');
    const suffix = (s.match(/\.(NS|BO|BSE)$/i) || [''])[0].toUpperCase();
    const wantExch = suffix === '.NS' ? 'NSE' : (suffix === '.BO' || suffix === '.BSE') ? 'BSE' : null;
    fetchSymbolMatches(bare).then(results => {
      // If pane symbol has an exchange suffix, only accept matches from that
      // exchange — otherwise a BSE-only ticker like 'MARINE.BO' would fall
      // back to NSE 'MARINE.NS' (a totally different company) and mislabel
      // the chart.
      let match = results.find(r => r.symbol.toUpperCase() === pane.symbol.toUpperCase());
      if (!match && wantExch) {
        match = results.find(r => r.exchange === wantExch && r.display.toUpperCase() === bare);
      }
      if (!match && !wantExch) {
        match = results.find(r => r.display.toUpperCase() === bare) || results[0];
      }
      if (match) {
        companyEl.textContent = match.name;
        companyEl.title = match.name;
        exchBadge.textContent = match.exchange;
        exchBadge.className = `sym-exch-badge ${match.exchange}`;
      } else if (wantExch) {
        exchBadge.textContent = wantExch;
        exchBadge.className = `sym-exch-badge ${wantExch}`;
      }
    });
    // Same anti-race guard as the tf-change handler — clear sub-pane data so
    // the visible-range subscribe callback doesn't align to stale coords.
    Object.values(pane.subCharts || {}).forEach(sub => {
      ['series', 'fastLine', 'slowLine', 'macdLine', 'signalLine', 'hist']
        .forEach(k => { if (sub[k] && sub[k].setData) { try { sub[k].setData([]); } catch {} } });
    });
    savePaneCfg();
    loadData(idx);
  }

  // ── Symbol search dropdown (TradingView-style typeahead) ───────────────────
  let symResults  = [];
  let symHlIdx    = -1;

  function closeSymDropdown() {
    symDrop.classList.remove('open');
    symResults = [];
    symHlIdx = -1;
  }

  function highlightSymOpt(i) {
    symDrop.querySelectorAll('.sym-opt').forEach(o => o.classList.remove('hl'));
    if (i < 0 || i >= symResults.length) { symHlIdx = -1; return; }
    symHlIdx = i;
    const opt = symDrop.querySelector(`.sym-opt[data-idx="${i}"]`);
    if (opt) { opt.classList.add('hl'); opt.scrollIntoView({block: 'nearest'}); }
  }

  function pickSymResult(i) {
    const r = symResults[i];
    if (!r) return;
    symIn.value = r.display;
    closeAllSymbolDropdowns();
    applySymbol(r.symbol);
  }

  const runSymSearch = debounce(async (q) => {
    const results = await fetchSymbolMatches(q);
    symResults = results;
    symHlIdx = -1;
    renderSymResults(symDrop, results, q);
    symDrop.classList.add('open');
  }, 180);

  symIn.addEventListener('input', () => {
    const q = symIn.value.trim();
    if (!q) { closeSymDropdown(); return; }
    runSymSearch(q);
  });

  symIn.addEventListener('focus', () => {
    if (symIn.value.trim()) runSymSearch(symIn.value.trim());
  });

  symIn.addEventListener('click', e => e.stopPropagation());

  symIn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (symDrop.classList.contains('open') && symResults.length)
        highlightSymOpt((symHlIdx + 1) % symResults.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (symDrop.classList.contains('open') && symResults.length)
        highlightSymOpt((symHlIdx - 1 + symResults.length) % symResults.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (symDrop.classList.contains('open') && symHlIdx >= 0) {
        pickSymResult(symHlIdx);
      } else if (symDrop.classList.contains('open') && symResults.length) {
        pickSymResult(0);
      } else {
        closeAllSymbolDropdowns();
        applySymbol(symIn.value);
      }
    } else if (e.key === 'Escape') {
      closeSymDropdown();
      symIn.blur();
    }
  });

  symDrop.addEventListener('click', e => {
    const opt = e.target.closest('.sym-opt');
    if (!opt) return;
    pickSymResult(parseInt(opt.dataset.idx, 10));
  });

  symDrop.addEventListener('mousemove', e => {
    const opt = e.target.closest('.sym-opt');
    if (opt) highlightSymOpt(parseInt(opt.dataset.idx, 10));
  });

  pane._closeSymDropdown = closeSymDropdown;

  tfSel.addEventListener('change', () => {
    pane.tf = tfSel.value;
    series.setData([]);
    // Also clear every sub-pane's data — otherwise old-tf data lingers
    // visible during the async loadData(), and the visible-range subscribe
    // callback fires against stale time coordinates that don't intersect the
    // incoming new-tf data (see NH.NS %R collapse, 2026-07-03).
    Object.values(pane.subCharts || {}).forEach(sub => {
      ['series', 'fastLine', 'slowLine', 'macdLine', 'signalLine', 'hist']
        .forEach(k => { if (sub[k] && sub[k].setData) { try { sub[k].setData([]); } catch {} } });
    });
    savePaneCfg();
    loadData(idx);
  });

  // ── Indicators dropdown ──────────────────────────────────────────────────────
  indBtn.addEventListener('click', e => {
    e.stopPropagation();
    const willOpen = !indPanel.classList.contains('open');
    closeAllIndicatorPanels();
    if (willOpen) { indPanel.classList.add('open'); indBtn.classList.add('active'); }
  });

  snapBtn.addEventListener('click', () => copyChartSnapshot(pane));

  const rangeBtns = el.querySelectorAll('.range-btn');
  rangeBtns.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.range === pane.rangePreset);
    btn.addEventListener('click', () => {
      pane.rangePreset = btn.dataset.range;
      rangeBtns.forEach(b => b.classList.toggle('active', b === btn));
      applyRangeView(pane);
      savePaneCfg();
    });
  });

  indPanel.querySelectorAll('.ind-chk').forEach(chk => {
    const key = chk.dataset.key;
    chk.checked = pane.indicators.has(key);
    chk.addEventListener('change', () => {
      // Row may have been greyed out by ETF-mode after last render — the
      // CSS blocks the click but a keyboard-driven change event can still
      // fire, so belt-and-braces refuse it here too.
      const row = chk.closest('.ind-row');
      if (chk.checked && row && row.classList.contains('ind-disabled')) {
        chk.checked = false;
        return;
      }
      if (chk.checked) pane.indicators.add(key);
      else             pane.indicators.delete(key);
      applyIndicators(pane);
      savePaneCfg();
    });
  });

  return pane;
}

// ── Chart snapshot (copy image to clipboard) ────────────────────────────────────
// Composited entirely from existing canvases — the main chart's own
// takeScreenshot() already bakes in every series/marker Lightweight Charts
// drew (candles, overlays, %R/RSI/etc. lines, reversal arrows), so the only
// extra work is layering our own overlay canvases (volume profile / FVG) on
// top and stacking each visible sub-pane's screenshot underneath. No new
// external library (e.g. html2canvas) needed for this.
let _snapToastEl = null;
function showToast(msg, ms = 2200) {
  if (!_snapToastEl) {
    _snapToastEl = document.createElement('div');
    _snapToastEl.className = 'snap-toast';
    document.body.appendChild(_snapToastEl);
  }
  _snapToastEl.textContent = msg;
  _snapToastEl.classList.add('show');
  clearTimeout(_snapToastEl._hideTimer);
  _snapToastEl._hideTimer = setTimeout(() => _snapToastEl.classList.remove('show'), ms);
}

// The info panels (PMax trade state, VCP, Elliott Wave, Rounding Bottom,
// Projection, Reversal Calendar) are DOM divs, not canvases — takeScreenshot()
// cannot see them, so snapshots used to lose exactly the numbers you took the
// snapshot for. Rasterize them by wrapping clones in an SVG <foreignObject>:
// the browser lays out real HTML with real CSS, so panels land at their true
// positions with their true styling and no external library is needed.
//
// Two details make it work: the page's own stylesheet is inlined (foreignObject
// gets no access to the parent document's CSS), and the :root custom properties
// are copied as resolved values (`:root` inside the SVG would not match the
// document root, so --overlay-bg etc. would silently fall back to nothing).
// Reading them off getComputedStyle also means the snapshot follows the live
// Dark/Light toggle for free.
/* .action-stack is cloned as a whole: its cards (rb/fvg/fib/proj) are static
   flex children, so cloning them individually would lose their stacked
   positions — and cloning the stack also picks up the FVG and Fib cards,
   which the old per-panel list never included. */
const SNAP_PANEL_SEL = '.ew-info, .vcp-info, .pmax-info, .rev-info, .action-stack';

async function renderOverlayPanels(chartMain) {
  const panels = Array.from(chartMain.querySelectorAll(SNAP_PANEL_SEL))
    .filter(el => el.offsetParent !== null && getComputedStyle(el).display !== 'none')
    // An action stack with no visible card contributes nothing — drop it so
    // an otherwise panel-free chart skips the foreignObject pass entirely.
    .filter(el => !el.classList.contains('action-stack')
      || Array.from(el.children).some(c => getComputedStyle(c).display !== 'none'));
  if (!panels.length) return null;

  const w = chartMain.clientWidth, h = chartMain.clientHeight;
  if (!w || !h) return null;

  const rootCS = getComputedStyle(document.documentElement);
  let vars = '';
  for (let i = 0; i < rootCS.length; i++) {
    const p = rootCS[i];
    if (p.startsWith('--')) vars += `${p}:${rootCS.getPropertyValue(p)};`;
  }

  let css = '';
  for (const sheet of document.styleSheets) {
    // Same-origin inline <style> only; a cross-origin sheet would throw here.
    try { for (const rule of sheet.cssRules) css += rule.cssText + '\n'; } catch {}
  }

  const wrap = document.createElement('div');
  wrap.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  wrap.setAttribute('style', `position:relative;width:${w}px;height:${h}px;overflow:hidden;${vars}`);
  const style = document.createElement('style');
  style.textContent = css;
  wrap.appendChild(style);
  panels.forEach(el => wrap.appendChild(el.cloneNode(true)));

  const xml = new XMLSerializer().serializeToString(wrap);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
              `<foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  return img;
}

async function copyChartSnapshot(pane) {
  try {
    const chartMain = pane.el.querySelector('.chart-main');
    const mainShot = pane.chart.takeScreenshot();
    const dpr = mainShot.width / (chartMain.clientWidth || mainShot.width) || 1;

    // Stack sub-panes in the order they appear on screen.
    const subShots = Array.from(pane.el.querySelectorAll('.sub-pane')).map(subEl => {
      const sub = pane.subCharts[subEl.dataset.key];
      if (!sub) return null;
      return {shot: sub.chart.takeScreenshot(), label: sub.label ? sub.label.textContent : subEl.dataset.key};
    }).filter(Boolean);

    const headerH = Math.round(26 * dpr);
    const totalW  = mainShot.width;
    const totalH  = headerH + mainShot.height + subShots.reduce((s, x) => s + x.shot.height, 0);

    const out = document.createElement('canvas');
    out.width = totalW;
    out.height = totalH;
    const ctx = out.getContext('2d');

    const rootStyle = getComputedStyle(document.documentElement);
    ctx.fillStyle = rootStyle.getPropertyValue('--bg-pane-header').trim() || '#161b22';
    ctx.fillRect(0, 0, totalW, totalH);

    // Header: symbol · timeframe · price · change (mirrors the on-screen ticker
    // bar, including its theme-aware text color and up/down price coloring).
    const symVal  = pane.el.querySelector('.sym-in').value;
    const tfVal   = pane.el.querySelector('.tf-sel').value;
    const priceEl = pane.el.querySelector('.price-el');
    const chgEl   = pane.el.querySelector('.chg-el');
    const textPrimary = rootStyle.getPropertyValue('--text-primary').trim() || '#e6edf3';
    ctx.font = `${Math.round(13 * dpr)}px -apple-system, "Segoe UI", sans-serif`;
    ctx.textBaseline = 'middle';
    let hx = 10 * dpr;
    [[`${symVal}   ${tfVal}`, textPrimary],
     [priceEl.textContent,    getComputedStyle(priceEl).color || textPrimary],
     [chgEl.textContent,      getComputedStyle(chgEl).color   || textPrimary],
    ].forEach(([txt, color]) => {
      ctx.fillStyle = color;
      ctx.fillText(txt, hx, headerH / 2);
      hx += ctx.measureText(txt + '   ').width;
    });

    // Overlay canvases (volume profile / FVG) draw on top of the candle chart —
    // same z-order as on screen.
    let y = headerH;
    ctx.drawImage(mainShot, 0, y);
    if (pane.fibCanvas) ctx.drawImage(pane.fibCanvas, 0, y, mainShot.width, mainShot.height);
    if (pane.patternCanvas) ctx.drawImage(pane.patternCanvas, 0, y, mainShot.width, mainShot.height);
    if (pane.projCanvas) ctx.drawImage(pane.projCanvas, 0, y, mainShot.width, mainShot.height);
    if (pane.volCanvas) ctx.drawImage(pane.volCanvas, 0, y, mainShot.width, mainShot.height);
    if (pane.fvgCanvas) ctx.drawImage(pane.fvgCanvas, 0, y, mainShot.width, mainShot.height);
    // Info panels go last so they sit on top, matching their on-screen z-index.
    // A failure here must not cost you the whole snapshot — the chart itself is
    // still worth copying, so this degrades to the old canvas-only behaviour.
    try {
      const panelImg = await renderOverlayPanels(chartMain);
      if (panelImg) ctx.drawImage(panelImg, 0, y, mainShot.width, mainShot.height);
    } catch (panelErr) {
      console.warn('Snapshot: overlay panels skipped —', panelErr);
    }
    y += mainShot.height;

    subShots.forEach(({shot, label}) => {
      ctx.drawImage(shot, 0, y);
      const fontSize = Math.round(10 * dpr), padX = 6 * dpr, padY = 3 * dpr;
      ctx.font = `${fontSize}px -apple-system, "Segoe UI", sans-serif`;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(4 * dpr, y + 4 * dpr, tw + padX * 2, fontSize + padY * 2);
      ctx.fillStyle = '#c9d1d9';
      ctx.textBaseline = 'top';
      ctx.fillText(label, 4 * dpr + padX, y + 4 * dpr + padY);
      y += shot.height;
    });

    out.toBlob(async blob => {
      if (!blob) { showToast('Snapshot failed — could not render image'); return; }
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        showToast('Chart copied to clipboard');
      } catch (clipErr) {
        // Clipboard image writes need a secure context + user gesture; if the
        // browser blocks it, fall back to a direct download so the click
        // still does something useful.
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${symVal}_${tfVal}_${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('Clipboard blocked — downloaded image instead');
      }
    }, 'image/png');
  } catch (err) {
    console.error('Chart snapshot error:', err);
    showToast('Snapshot failed: ' + err.message);
  }
}

// ── Indicators dropdown helpers ─────────────────────────────────────────────────
function closeAllIndicatorPanels() {
  document.querySelectorAll('.ind-panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.ind-btn.active').forEach(b => b.classList.remove('active'));
}

// ── Symbol search dropdown helpers ──────────────────────────────────────────────
function closeAllSymbolDropdowns() {
  panes.forEach(p => { if (p._closeSymDropdown) p._closeSymDropdown(); });
}

document.addEventListener('click', () => {
  closeAllIndicatorPanels();
  closeAllSymbolDropdowns();
});

// ── Indicator overlay rendering ─────────────────────────────────────────────────
function removeIndicatorSeries(pane, key) {
  const existing = pane.indSeries[key];
  if (!existing) return;
  (Array.isArray(existing) ? existing : [existing]).forEach(s => {
    try { pane.chart.removeSeries(s); } catch {}
  });
  delete pane.indSeries[key];
}

function addLine(pane, color, lineWidth = 1, lineStyle = 0) {
  return pane.chart.addLineSeries({
    color, lineWidth, lineStyle, priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerVisible: false,
  });
}

// Momentum / directional-signal indicators that are meaningless on a
// cash-equivalent instrument (Liquid ETFs like LIQUIDCASE.NS, LIQUIDBEES,
// etc.): applying them produces phantom oversold reads, spurious %R
// exhaustion dots and Elliott counts on what is effectively a savings
// account. Volume/volume-profile/MAs stay — those are structural, not
// momentum, and remain informative on any series.
// mabias joins them: a trend-bias card on a monotonic yield line would read
// "permanent golden cross" — technically true, decisionally meaningless.
const MOMENTUM_KEYS = ['rsi', 'macd', 'obv', 'rs', 'prte', 'stoch', 'elliott', 'mabias'];

// Detect liquid-ETF / cash-equivalent behaviour from bar statistics rather
// than symbol lists — new liquid ETFs launch faster than any hardcoded set
// stays current. Threshold picked from the LIQUIDCASE.NS autopsy: median
// |daily return| ≈ 0.018% (< 0.05%) and worst single-day |return| ≈ 0.01%
// (< 0.5%). A normal small-cap prints 1–3% median swings; the two-order-of-
// magnitude gap makes this robust without a per-instrument config.
function isLikelyLiquidETF(bars) {
  if (!bars || bars.length < 60) return false;
  const rets = [];
  for (let i = 1; i < bars.length; i++) {
    const p = bars[i - 1].close, c = bars[i].close;
    if (p > 0 && c > 0) rets.push(Math.abs((c - p) / p) * 100);
  }
  if (rets.length < 60) return false;
  const sorted = rets.slice().sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];
  const worst = sorted[sorted.length - 1];
  return median < 0.05 && worst < 0.5;
}

// Sync the pane's INDICATORS panel to reflect ETF mode: grey-and-disable
// the momentum rows, uncheck any that are currently active (so they get
// torn down in the same applyIndicators pass), and toggle the CASH-EQ tag.
function applyEtfMode(pane, isEtf) {
  const badge = pane.el.querySelector('.etf-badge');
  if (badge) badge.classList.toggle('active', !!isEtf);
  const panel = pane.el.querySelector('.ind-panel');
  if (!panel) return;
  MOMENTUM_KEYS.forEach(key => {
    const chk = panel.querySelector(`.ind-chk[data-key="${key}"]`);
    if (!chk) return;
    const row = chk.closest('.ind-row');
    if (row) row.classList.toggle('ind-disabled', !!isEtf);
    if (isEtf && pane.indicators.has(key)) {
      pane.indicators.delete(key);
      chk.checked = false;
    }
  });
}

function applyIndicators(pane) {
  const bars = pane.bars;
  // ETF-mode gate runs BEFORE anything else so momentum indicators get
  // removed on the same pass they would otherwise be rendered.
  applyEtfMode(pane, isLikelyLiquidETF(bars));
  // Remove overlay series for indicators no longer selected
  Object.keys(pane.indSeries).forEach(key => {
    if (!pane.indicators.has(key)) removeIndicatorSeries(pane, key);
  });
  // Remove sub-pane charts for deselected oscillators
  ['rsi','macd','obv','rs','prte','roc','stoch','volume'].forEach(key => {
    if (!pane.indicators.has(key) && pane.subCharts[key]) removeSubPane(pane, key);
  });
  // Clear volume profile canvas if deselected
  if (!pane.indicators.has('volprofile') && pane.volCanvas) {
    const ctx = pane.volCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.volCanvas.width, pane.volCanvas.height);
    pane.vp = null;
  }
  // Clear FVG canvas + buy/sell signal markers/panel if deselected
  if (!pane.indicators.has('fvg') && pane.fvgCanvas) {
    const ctx = pane.fvgCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.fvgCanvas.width, pane.fvgCanvas.height);
    pane.fvgZones = null;
    clearFVGSignals(pane);
  }
  // Tear down MA Bias card + cross markers if deselected
  if (!pane.indicators.has('mabias') && pane.maBias) clearMABias(pane);
  // Tear down Elliott Wave overlay if deselected
  if (!pane.indicators.has('elliott') && pane.ew) clearElliottWave(pane);
  // Tear down Rounding Bottom overlay if deselected
  if (!pane.indicators.has('roundbottom') && pane.rb) clearRoundingBottom(pane);
  // Tear down VCP overlay if deselected
  if (!pane.indicators.has('vcp') && pane.vcp) clearVCP(pane);
  // Tear down Trendlines overlay if deselected
  if (!pane.indicators.has('trendlines') && pane.tl) clearTrendlines(pane);
  // Tear down PMax flip markers + trade levels if deselected
  if (!pane.indicators.has('pmax') && pane.pmaxTrade) clearPmaxTrade(pane);
  // Tear down Harmonic overlay if deselected
  if (!pane.indicators.has('harmonic') && pane.hm) clearHarmonic(pane);
  // Tear down Price Projection overlay if deselected
  if (!pane.indicators.has('projection') && pane.proj) clearProjection(pane);
  // Tear down Fibonacci grid + trade plan if deselected
  if (!pane.indicators.has('fib') && pane.fib) clearFibonacci(pane);
  // Tear down Reversal Calendar markers if deselected
  if (!pane.indicators.has('reversal_calendar') && pane.rev) clearReversalCalendar(pane);
  if (!bars || bars.length < 2) return;

  INDICATOR_DEFS.forEach(def => {
    const key = def.key;
    if (!pane.indicators.has(key)) return;
    if (pane.indSeries[key]) return; // already rendered, will be refreshed in-place below

    switch (key) {
      case 'sma20':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'sma50':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'sma200': pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema9':   pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema20':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema50':  pane.indSeries[key] = addLine(pane, def.color); break;
      case 'ema200': pane.indSeries[key] = addLine(pane, def.color); break;
      case 'vwap':   pane.indSeries[key] = addLine(pane, def.color); break;
      case 'bollinger':
        pane.indSeries[key] = [
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1, 2),
          addLine(pane, def.color, 1, 2),
        ];
        break;
      case 'donchian':
        pane.indSeries[key] = [
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1, 2),
        ];
        break;
      case 'keltner':
        pane.indSeries[key] = [
          addLine(pane, def.color, 1),
          addLine(pane, def.color, 1, 2),
          addLine(pane, def.color, 1, 2),
        ];
        break;
      case 'pmax':
        // Two colored line series: green for up-trend segments, red for down.
        // Each series holds the PMax value only during its direction — LWC
        // draws a gap on flip, which is visually accurate for a trend break.
        pane.indSeries[key] = [
          addLine(pane, '#26a69a', 2),  // up-trend PMax
          addLine(pane, '#f23645', 2),  // down-trend PMax
        ];
        break;
      // sub-pane indicators — created in the computation section below
      case 'rsi': case 'macd': case 'obv': case 'rs': case 'volprofile': break;
    }
  });

  // (Re)compute and push data into each active indicator's series
  pane.indicators.forEach(key => {
    const s = pane.indSeries[key];
    if (!s) return;
    switch (key) {
      case 'sma20':  s.setData(smaSeries(bars, 20));  break;
      case 'sma50':  s.setData(smaSeries(bars, 50));  break;
      case 'sma200': s.setData(smaSeries(bars, 200)); break;
      case 'ema9':   s.setData(emaSeries(bars, 9));   break;
      case 'ema20':  s.setData(emaSeries(bars, 20));  break;
      case 'ema50':  s.setData(emaSeries(bars, 50));  break;
      case 'ema200': s.setData(emaSeries(bars, 200)); break;
      case 'vwap':   s.setData(vwapSeries(bars));     break;
      case 'bollinger': {
        const {mid, upper, lower} = bollingerSeries(bars, 20, 2);
        s[0].setData(mid); s[1].setData(upper); s[2].setData(lower);
        break;
      }
      case 'donchian': {
        const {upper, lower, mid} = donchianSeries(bars, 20);
        s[0].setData(upper); s[1].setData(lower); s[2].setData(mid);
        break;
      }
      case 'keltner': {
        const {mid, upper, lower} = keltnerSeries(bars, 20, 1.5);
        s[0].setData(mid); s[1].setData(upper); s[2].setData(lower);
        break;
      }
      case 'pmax': {
        const rows = pmaxSeries(bars, 10, 3.0, 10);
        const up = [], dn = [];
        rows.forEach(r => {
          if (r.dir === 1) up.push({time: r.time, value: r.pmax});
          else             dn.push({time: r.time, value: r.pmax});
        });
        s[0].setData(up); s[1].setData(dn);
        renderPmaxTrade(pane, rows, bars);
        break;
      }
    }
  });

  // ── Sub-pane oscillators ───────────────────────────────────────────────────
  if (pane.indicators.has('rsi')) {
    if (!pane.subCharts.rsi) {
      const sub = addSubPane(pane, 'rsi', 'RSI (14)');
      sub.series = sub.chart.addLineSeries({
        color: '#7b61ff', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series.createPriceLine({price:70, color:'rgba(248,81,73,0.45)',  lineWidth:1, lineStyle:1, axisLabelVisible:false});
      sub.series.createPriceLine({price:50, color:'rgba(140,140,140,0.25)',lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.series.createPriceLine({price:30, color:'rgba(63,185,80,0.45)',  lineWidth:1, lineStyle:1, axisLabelVisible:false});
    }
    pane.subCharts.rsi.series.setData(rsiSeries(bars, 14));
  }

  if (pane.indicators.has('macd')) {
    if (!pane.subCharts.macd) {
      const sub = addSubPane(pane, 'macd', 'MACD (12,26,9)');
      sub.hist = sub.chart.addHistogramSeries({
        priceLineVisible: false, lastValueVisible: false,
        priceScaleId: 'right',
      });
      sub.macdLine = sub.chart.addLineSeries({
        color: '#2962ff', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.signalLine = sub.chart.addLineSeries({
        color: '#ff9800', lineWidth: 1, lineStyle: 2,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series = sub.macdLine;   // used for crosshair sync
    }
    const {macd, signal, hist} = macdCalc(bars);
    pane.subCharts.macd.hist.setData(hist);
    pane.subCharts.macd.macdLine.setData(macd);
    pane.subCharts.macd.signalLine.setData(signal);
  }

  if (pane.indicators.has('obv')) {
    if (!pane.subCharts.obv) {
      const sub = addSubPane(pane, 'obv', 'OBV');
      sub.series = sub.chart.addLineSeries({
        color: '#00bd6f', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
    }
    pane.subCharts.obv.series.setData(obvSeries(bars));
  }

  if (pane.indicators.has('rs')) {
    if (!pane.subCharts.rs) {
      const sub = addSubPane(pane, 'rs', 'RS vs Benchmark');
      sub.series = sub.chart.addLineSeries({
        color: '#ffd60a', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series.createPriceLine({price:100, color:'rgba(180,180,180,0.3)', lineWidth:1, lineStyle:2, axisLabelVisible:false});
    }
    fetchRsData(pane, bars);   // async: fetches ref symbol and sets data
  }

  if (pane.indicators.has('prte')) {
    if (!pane.subCharts.prte) {
      // Taller pane (150 vs the default 100px): %R sweeps the full 0→−100
      // band constantly, so at 100px the swings compressed into a near-flat
      // ribbon (user report, 2026-07-22).
      const sub = addSubPane(pane, 'prte', '%R Trend Exhaustion', 150);
      // The lines were 1px pale grey + pale blue — indistinguishable from
      // each other, and the grey vanished entirely on the light theme.
      // Deep blue (fast) vs orange (slow) separate cleanly on BOTH themes;
      // fast carries the weight since it holds the markers + value label.
      sub.slowLine = sub.chart.addLineSeries({
        color: '#f0883e', lineWidth: 1,
        priceLineVisible: false, lastValueVisible: false,
      });
      sub.fastLine = sub.chart.addLineSeries({
        color: '#2466A7', lineWidth: 2,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.series = sub.fastLine;   // used for crosshair sync
      // Squeeze the default 8% scale margins to 4% — every pixel of a
      // bounded oscillator's pane should go to the 0→−100 band itself.
      sub.chart.priceScale('right').applyOptions({scaleMargins: {top: 0.04, bottom: 0.04}});
      const th = 20;
      sub.fastLine.createPriceLine({price:0,          color:'rgba(202,0,23,0.4)',   lineWidth:1, lineStyle:1, axisLabelVisible:false});
      sub.fastLine.createPriceLine({price:-th,         color:'rgba(202,0,23,0.4)',   lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.fastLine.createPriceLine({price:-50,         color:'rgba(140,140,140,0.25)', lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.fastLine.createPriceLine({price:-(100-th),   color:'rgba(36,102,167,0.4)', lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.fastLine.createPriceLine({price:-100,        color:'rgba(36,102,167,0.4)', lineWidth:1, lineStyle:1, axisLabelVisible:false});
    }
    const prte = PRTE.compute(bars);
    pane.subCharts.prte.fastLine.setData(prte.fast);
    pane.subCharts.prte.slowLine.setData(prte.slow);
    // Headline signal: reversal arrows the bar a trend exhausts (▼ bearish
    // as OB is left, ▲ bullish as OS is left). Trend-start points (just
    // entered a zone) get a smaller warning circle.
    const markers = [
      ...prte.obReversal.map(p => ({time: p.time, position: 'aboveBar', color: '#CA0017', shape: 'arrowDown', text: '▼'})),
      ...prte.osReversal.map(p => ({time: p.time, position: 'belowBar', color: '#2466A7', shape: 'arrowUp',   text: '▲'})),
      ...prte.obStart.map(p    => ({time: p.time, position: 'aboveBar', color: '#CA0017', shape: 'circle'})),
      ...prte.osStart.map(p    => ({time: p.time, position: 'belowBar', color: '#2466A7', shape: 'circle'})),
    ].sort((a, b) => a.time - b.time);
    pane.subCharts.prte.fastLine.setMarkers(markers);
  }

  if (pane.indicators.has('roc')) {
    if (!pane.subCharts.roc) {
      const sub = addSubPane(pane, 'roc', 'ROC + RSI Zones (21,5,5,14)');
      // Fill layer: baseline series at zero. Colors are inverted vs the ROC
      // line — green fill below zero (contrarian bullish exhaustion tell),
      // red fill above zero (overheat warning) — matches the Pine original.
      sub.baseline = sub.chart.addBaselineSeries({
        baseValue: {type: 'price', price: 0},
        topLineColor:    'rgba(0,0,0,0)',
        topFillColor1:   'rgba(239,83,80,0.28)',
        topFillColor2:   'rgba(239,83,80,0.05)',
        bottomLineColor: 'rgba(0,0,0,0)',
        bottomFillColor1:'rgba(38,166,154,0.05)',
        bottomFillColor2:'rgba(38,166,154,0.28)',
        priceLineVisible: false, lastValueVisible: false,
      });
      // Base blue ROC line (always visible).
      sub.rocLine = sub.chart.addLineSeries({
        color: '#2962ff', lineWidth: 1,
        priceLineVisible: false, lastValueVisible: true,
      });
      // Zone-overlay lines — only carry data where the confluence holds.
      // Line becomes visually thicker in-zone because it's drawn over the
      // base line, matching Pine's linewidth=2 conditional plot.
      sub.overlayGreen = sub.chart.addLineSeries({
        color: '#26a69a', lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false,
      });
      sub.overlayRed = sub.chart.addLineSeries({
        color: '#ef5350', lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false,
      });
      sub.series = sub.rocLine;   // used for crosshair sync
      sub.rocLine.createPriceLine({price:0, color:'rgba(120,123,134,0.6)', lineWidth:1, lineStyle:0, axisLabelVisible:false});
    }
    const r = rocRsiSeries(bars);
    pane.subCharts.roc.baseline.setData(r.baseline);
    pane.subCharts.roc.rocLine.setData(r.roc);
    pane.subCharts.roc.overlayGreen.setData(r.overlayGreen);
    pane.subCharts.roc.overlayRed.setData(r.overlayRed);
    const markers = [...r.buys, ...r.sells].sort((a,b) => a.time - b.time);
    pane.subCharts.roc.rocLine.setMarkers(markers);
  }

  if (pane.indicators.has('stoch')) {
    if (!pane.subCharts.stoch) {
      const sub = addSubPane(pane, 'stoch', 'Stochastic (14,3,3)');
      sub.kLine = sub.chart.addLineSeries({
        color: '#26c6da', lineWidth: 1.5,
        priceLineVisible: false, lastValueVisible: true,
      });
      sub.dLine = sub.chart.addLineSeries({
        color: '#ff9800', lineWidth: 1, lineStyle: 2,
        priceLineVisible: false, lastValueVisible: true,
      });
      // 80 / 50 / 20 guide lines — canonical Lane thresholds.
      sub.kLine.createPriceLine({price:80, color:'rgba(248,81,73,0.45)',  lineWidth:1, lineStyle:1, axisLabelVisible:false});
      sub.kLine.createPriceLine({price:50, color:'rgba(140,140,140,0.25)',lineWidth:1, lineStyle:2, axisLabelVisible:false});
      sub.kLine.createPriceLine({price:20, color:'rgba(63,185,80,0.45)',  lineWidth:1, lineStyle:1, axisLabelVisible:false});
      sub.series = sub.kLine;   // crosshair sync target
    }
    const {k, d} = stochSeries(bars, 14, 3, 3);
    pane.subCharts.stoch.kLine.setData(k);
    pane.subCharts.stoch.dLine.setData(d);
  }

  if (pane.indicators.has('volprofile')) {
    // Defer to next animation frame — priceToCoordinate returns null right
    // after setData because LWC hasn't finished recomputing the price scale
    // yet (that's why the VP histogram disappeared on tf change, SUVEN.NS
    // case 2026-07-04). One RAF is enough for LWC to settle its layout.
    requestAnimationFrame(() => {
      if (pane.indicators.has('volprofile')) drawVolumeProfile(pane);
    });
  }

  if (pane.indicators.has('fvg')) {
    drawFVG(pane);
    renderFVGSignals(pane);
  }

  // ── MA Bias overlay (regime / stack / trigger / distrust card + crosses) ────
  if (pane.indicators.has('mabias')) {
    renderMABias(pane);
  }

  if (pane.indicators.has('volume')) {
    if (!pane.subCharts.volume) {
      const sub = addSubPane(pane, 'volume', 'Volume');
      sub.series = sub.chart.addHistogramSeries({
        priceLineVisible: false, lastValueVisible: true,
        priceFormat: {type: 'volume'},
      });
    }
    pane.subCharts.volume.series.setData(volumeBarSeries(bars));
  }

  // ── Elliott Wave overlay (plug-in module, see elliott_wave.js) ────────────────
  if (pane.indicators.has('elliott')) {
    renderElliottWave(pane);
  }

  // ── Rounding Bottom overlay (server-side detection, see scanner_templates.py) ─
  if (pane.indicators.has('roundbottom')) {
    renderRoundingBottom(pane);
  }

  // ── VCP Coiling overlay (server-side detection, see scanner_templates.py) ────
  if (pane.indicators.has('vcp')) {
    renderVCP(pane);
  }

  // ── Trendlines overlay (server-side detection, see scanner_templates.py) ─────
  if (pane.indicators.has('harmonic')) {
    renderHarmonic(pane);
  }
  if (pane.indicators.has('trendlines')) {
    renderTrendlines(pane);
  }
