  // Follow-through is rendered as its own block, ALWAYS with n. A bare "100%"
  // off two prior patterns reads as a measurement when it is an anecdote, and
  // this is descriptive history for one symbol — never a forward claim.
  html += `<hr style="border-color:#30363d;margin:4px 0;">`;
  if (ft) {
    const ftColor = ft.n >= 5 ? '#c9d1d9' : '#8b949e';
    html += `<span style="color:${ftColor}">Follow-through: <b>${ft.follows}/${ft.n}</b> ` +
            `(${ft.rate}%) moved ${ft.atr_mult}+ ATR within ${ft.horizon} bars</span>` +
            `<br><i style="color:var(--text-muted)">This name's own past double ` +
            `bottoms. Descriptive on n=${ft.n}, not a forward claim.</i>`;
  } else {
    html += `<i style="color:var(--text-muted)">No prior double bottom on this name ` +
            `has resolved — no follow-through record.</i>`;
  }

  html += `<br><i style="color:var(--text-muted)">Shape quality and follow-through ` +
          `are separate readings: a textbook grade can sit on a poor record.</i>`;

  if (db.infoBody) db.infoBody.innerHTML = html;
  else             db.infoEl.innerHTML   = html;
  db.infoEl.style.display = 'block';
}

// ── VCP Coiling overlay ───────────────────────────────────────────────────────
// Server-side pivot-based detection (see chart_server.py::api_vcp +
// scanner_templates.detect_vcp_geometry + concepts/VCP.md). Draws the
// contraction ladder as a series of line segments connecting each swing
// high to its corresponding leg low, plus a horizontal pivot line and the
// standard entry/stop/target reference lines.
function ensureVcpState(pane) {
  if (!pane.vcp) {
    pane.vcp = {
      pivotLine:      null,
      entryLine:      null,
      stopLine:       null,
      targetLine:     null,
      // One line series per contraction leg — kept in an array so we can
      // clear/re-create when the count changes (new pivot detected, etc.).
      legSeries:      [],
      infoEl:         null,
      infoBody:       null,
      infoSummary:    null,
      collapsed:      loadVcpCollapsed(),
      lastFetchKey:   null,
    };
  }
  return pane.vcp;
}

function clearVCP(pane) {
  if (!pane.vcp) return;
  ['pivotLine', 'entryLine', 'stopLine', 'targetLine'].forEach(k => {
    if (pane.vcp[k]) {
      try { pane.chart.removeSeries(pane.vcp[k]); } catch {}
      pane.vcp[k] = null;
    }
  });
  pane.vcp.legSeries.forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  pane.vcp.legSeries = [];
  setPaneMarkers(pane, 'vcp', null);
  if (pane.vcp.infoEl) pane.vcp.infoEl.style.display = 'none';
  pane.vcp.baseZone = null;
  pane.vcp.lastFetchKey = null;
  drawPatternZones(pane);
}

async function renderVCP(pane) {
  const vcp = ensureVcpState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (vcp.lastFetchKey === key) return;
  vcp.lastFetchKey = key;

  let g = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/vcp?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) g = (await res.json()).vcp || null;
  } catch (e) { console.warn('vcp fetch failed:', e); }

  if (!pane.indicators.has('vcp')) return;
  const stillCurrentKey = paneFetchKey(pane);
  if (stillCurrentKey !== key) return;

  if (!g) {
    clearVCP(pane);
    renderVcpInfo(pane, null);
    return;
  }

  // Contraction ladder — one thin cyan zigzag from each swing high down to
  // its leg low and back up to the next swing high (or the current bar for
  // the in-progress leg). Rendered as individual line series so tearing
  // them down on a new fetch is trivial. autoscaleInfoProvider excluded
  // because the pivot might sit above visible candles on breakout.
  vcp.legSeries.forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  vcp.legSeries = [];
  g.contractions.forEach((cc, i) => {
    const line = pane.chart.addLineSeries({
      color: cc.in_progress ? 'rgba(38,198,218,0.9)' : 'rgba(38,198,218,0.55)',
      lineWidth: cc.in_progress ? 2 : 1,
      lineStyle: 0,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,
    });
    const nextHi = g.contractions[i + 1];
    const points = [
      {time: cc.high_time, value: cc.high_price},
      {time: cc.low_time,  value: cc.low_price},
    ];
    if (nextHi) points.push({time: nextHi.high_time, value: nextHi.high_price});
    line.setData(points);
    vcp.legSeries.push(line);
  });

  // Pivot line (dashed cyan) + entry/stop/target (solid cyan/red/green).
  const fromTime = g.base_start_time || pane.bars[0].time;
  const toTime   = g.base_end_time   || pane.bars[pane.bars.length - 1].time;
  // Base-zone footprint box: base window (x) × base_low→pivot (y). Drawn on the
  // pattern canvas by drawPatternZones (see renderVcpInfo call below).
  vcp.baseZone = {start: fromTime, end: toTime, low: g.base_low, high: g.pivot};
  const ensureLine = (key, opts) => {
    if (!vcp[key]) vcp[key] = pane.chart.addLineSeries({
      priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,
      ...opts,
    });
    return vcp[key];
  };
  ensureLine('pivotLine', {color: '#26c6da', lineWidth: 2, lineStyle: 3, title: 'Pivot'})
    .setData([{time: fromTime, value: g.pivot}, {time: toTime, value: g.pivot}]);
  if (Number.isFinite(g.entry) && g.entry !== g.pivot) {
    ensureLine('entryLine', {color: '#26c6da', lineWidth: 1, lineStyle: 0, title: 'Entry'})
      .setData([{time: fromTime, value: g.entry}, {time: toTime, value: g.entry}]);
  } else if (vcp.entryLine) {
    // Entry coincides with pivot — no separate line needed.
    try { pane.chart.removeSeries(vcp.entryLine); } catch {}
    vcp.entryLine = null;
  }
  if (Number.isFinite(g.stop)) {
    ensureLine('stopLine',   {color: '#f85149', lineWidth: 1, lineStyle: 0, title: 'Stop'})
      .setData([{time: fromTime, value: g.stop},   {time: toTime, value: g.stop}]);
  }
  if (Number.isFinite(g.target)) {
    ensureLine('targetLine', {color: '#3fb950', lineWidth: 1, lineStyle: 0, title: 'Target'})
      .setData([{time: fromTime, value: g.target}, {time: toTime, value: g.target}]);
  }

  // Markers: a cyan diamond at each contraction low so the "coil" is
  // legible at a glance without labels crowding the chart.
  const markers = g.contractions.map(cc => ({
    time:     cc.low_time,
    position: 'belowBar',
    color:    cc.in_progress ? '#26c6da' : 'rgba(38,198,218,0.7)',
    shape:    'circle',
    size:     0.9,
    text:     `${cc.depth_pct}%`,
  }));
  setPaneMarkers(pane, 'vcp', markers);

  renderVcpInfo(pane, g);
  drawPatternZones(pane);
}

function renderVcpInfo(pane, g) {
  const vcp = ensureVcpState(pane);
  if (!vcp.infoEl) {
    vcp.infoEl = document.createElement('div');
    vcp.infoEl.className = 'vcp-info';
    if (vcp.collapsed) vcp.infoEl.classList.add('collapsed');
    const summary = document.createElement('span');
    summary.className = 'vcp-info-summary';
    const body = document.createElement('div');
    body.className = 'vcp-info-body';
    const toggle = document.createElement('span');
    toggle.className = 'vcp-info-toggle';
    toggle.textContent = vcp.collapsed ? '▸' : '×';
    toggle.title = vcp.collapsed ? 'Show VCP info' : 'Collapse';
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowCollapsed = !vcp.infoEl.classList.contains('collapsed');
      vcp.infoEl.classList.toggle('collapsed', nowCollapsed);
      vcp.collapsed = nowCollapsed;
      toggle.textContent = nowCollapsed ? '▸' : '×';
      toggle.title      = nowCollapsed ? 'Show VCP info' : 'Collapse';
      saveVcpCollapsed(nowCollapsed);
    });
    vcp.infoEl.appendChild(summary);
    vcp.infoEl.appendChild(toggle);
    vcp.infoEl.appendChild(body);
    vcp.infoBody = body;
    vcp.infoSummary = summary;
    mountCard(pane, vcp.infoEl, 'corner');
  }
  if (!g) { vcp.infoEl.style.display = 'none'; return; }

  // Verdict color mirrors the RB overlay so the two speak the same visual
  // language: green BUY, orange WEAK, gold READY/WATCH, muted for anything
  // that doesn't warrant action.
  const verdictColor = ({
    'BUY':      '#3fb950',
    'WEAK BUY': '#f0883e',
    'READY':    '#ffd60a',
    'WATCH':    '#8b949e',
  })[g.verdict] || '#8b949e';

  // Compact chip leads with verdict + footprint (the Minervini WW notation
  // "28/12/6" telling you at a glance whether the depths are shrinking).
  vcp.infoSummary.innerHTML =
    `<span style="color:${verdictColor}">VCP: ${g.verdict}</span> · ` +
    `<span style="font-family:'Courier New',monospace">${g.footprint}</span>`;

  const rr = Number.isFinite(g.risk_reward) ? `${g.risk_reward}×` : '—';
  const volTag = g.vol_confirmed
    ? '<i style="color:#3fb950">volume dried ✓</i>'
    : g.vol_drying
      ? '<i style="color:#ffd60a">volume drying</i>'
      : '<i style="color:#d29922">volume not dry yet</i>';
  const expandTag = g.vol_expansion
    ? ' · <i style="color:#3fb950">expansion ✓</i>' : '';

  let html =
    `<b style="color:${verdictColor}">${g.verdict}</b>` +
    ` · <span style="color:var(--text-muted)">R:R ${rr}</span>` +
    `<div style="margin-top:3px;font-family:'Courier New',monospace;font-size:10px">` +
      `<span style="color:#26c6da">Entry ₹${g.entry.toFixed(2)}</span> · ` +
      `<span style="color:#f85149">Stop ₹${g.stop.toFixed(2)}</span> · ` +
      `<span style="color:#3fb950">Target ₹${g.target.toFixed(2)}</span>` +
    `</div>` +
    `<hr style="border-color:#30363d;margin:4px 0;">` +
    `Footprint: <b>${g.footprint}</b> · ${g.n_contractions} contractions` +
    `<br>Pivot ₹${g.pivot.toFixed(2)} · Base low ₹${g.base_low.toFixed(2)}` +
    `<br>Base: ${g.base_weeks}w · ${g.dist_to_pivot_pct}% from pivot` +
    `<br>${volTag}${expandTag}`;

  if (vcp.infoBody) vcp.infoBody.innerHTML = html;
  else              vcp.infoEl.innerHTML   = html;
  vcp.infoEl.style.display = 'block';
}

// ── User drawing tools — integration layer for chart_drawings.js ─────────────
// window.Drawings is the pure model/geometry/painter and has zero chart
// dependency. Everything here is the "plug" onto Lightweight Charts: the
// coordinate adapter, pointer handling, the toolbar, and the redraw hooks. To
// swap charting libraries later only this section changes — exactly the split
// used for the Elliott Wave integration above.

const DRAW_TOOL_DEFS = [
  {key: 'trend', glyph: '╱',  title: 'Trend line — click and drag between two points'},
  {key: 'hline', glyph: '━',  title: 'Horizontal ray — click a price level'},
  {key: 'rect',  glyph: '▭',  title: 'Zone — drag a rectangle (supply/demand, consolidation)'},
  {key: 'fib',   glyph: '≣',  title: 'Fib retracement — drag from swing low to swing high'},
  {key: 'text',  glyph: 'T',  title: 'Text note — click to place a label'},
];

const DRAW_TOOLBAR_HTML = (() => {
  const tools = DRAW_TOOL_DEFS.map(t =>
    `<button type="button" class="draw-btn" data-tool="${t.key}" title="${t.title}">${t.glyph}</button>`
  ).join('');
  return tools +
    '<div class="draw-sep"></div>' +
    '<button type="button" class="draw-btn" data-act="magnet" title="Magnet — snap points to the nearest OHLC value">🧲</button>' +
    '<button type="button" class="draw-btn" data-act="erase" title="Erase — click a drawing to delete it">⌫</button>' +
    '<button type="button" class="draw-btn" data-act="undo" title="Undo the last drawing">↶</button>' +
    '<button type="button" class="draw-btn" data-act="hide" title="Hide/show all drawings">👁</button>' +
    '<button type="button" class="draw-btn danger" data-act="clear" title="Delete every drawing on this symbol">🗑</button>' +
    '<div class="draw-sep"></div>' +
    // Cards are not a drawing tool, but this toolbar is already the pane's
    // "what is drawn on my chart" panel, so the switch belongs here rather than
    // as a ninth control in the header. Glyph and title come from
    // syncCardModeBtn(), which reads the live mode.
    '<button type="button" class="draw-btn" data-act="cards"></button>' +
    '<div class="draw-count"></div>';
})();

/** Data<->pixel adapter. Null outside the visible range, which the painter
 *  treats as "skip this drawing" rather than clamping it to an edge. */
function drawAdapter(pane) {
  const ts = pane.chart.timeScale();
  const s  = pane.series;
  return {
    toX:   t => { try { return ts.timeToCoordinate(t); } catch { return null; } },
    toY:   p => { try { return s.priceToCoordinate(p); } catch { return null; } },
    fromX: x => { try { return ts.coordinateToTime(x); } catch { return null; } },
    fromY: y => { try { return s.coordinateToPrice(y); } catch { return null; } },
  };
}

function redrawDrawings(pane) {
  const canvas = pane.drawCanvas;
  if (!canvas) return;
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) {
    // Restored drawings paint once at pane creation, and in a multi-chart grid
    // the container can still be 0x0 at that moment. The ResizeObserver hook is
    // no help — it already fired while pane.drawings was empty — so without a
    // retry the markup stays invisible until the next pan. Bounded, so a pane
    // that is legitimately collapsed to zero does not spin a frame callback
    // forever; the ResizeObserver still covers it once it gets a real size.
    if (pane.drawings && pane.drawings.length && (pane._drawSizeTries = (pane._drawSizeTries || 0) + 1) < 120)
      scheduleDrawRedraw(pane);
    return;
  }
  pane._drawSizeTries = 0;
  const ctx = canvas.getContext('2d');
  if (pane.drawHidden) { ctx.clearRect(0, 0, W, H); return; }
  Drawings.render(ctx, pane.drawings || [], drawAdapter(pane), W, H, {
    selectedId: pane.drawSel,
    preview: pane.drawPreview,
    textColor: currentTheme === 'light' ? '#101521' : '#eaeff7',
  });
}

/**
 * Redraw on the NEXT animation frame, coalescing repeats.
 *
 * Lightweight Charts settles its price autoscale a frame AFTER it emits the
 * visible-range event, so painting synchronously inside that callback anchors
 * every drawing against the outgoing y-mapping — the line stays where it was
 * while the candles move under it. Deferring one frame is what makes drawings
 * track their bars through a range-preset change or a "Go to date" jump. It
 * also collapses the burst of range events during a drag into one paint.
 *
 * The live drawing path still calls redrawDrawings() directly: while you are
 * dragging out a shape the price scale is not moving, and a frame of latency on
 * the rubber-band preview is visible.
 */
function scheduleDrawRedraw(pane) {
  if (!pane || pane._drawRaf) return;
  pane._drawRaf = requestAnimationFrame(() => {
    pane._drawRaf = 0;
    try { redrawDrawings(pane); } catch {}
  });
}

function saveDrawings(pane) {
  Drawings.save(pane.symbol, pane.drawings || []);
  updateDrawCount(pane);
}

function updateDrawCount(pane) {
  const el = pane.drawTools && pane.drawTools.querySelector('.draw-count');
  if (el) el.textContent = (pane.drawings && pane.drawings.length) || '';
}

/** Load this symbol's saved drawings — called whenever the symbol changes. */
function loadDrawings(pane) {
  pane.drawings = Drawings.load(pane.symbol);
  pane.drawSel = null;
  pane.drawPreview = null;
  updateDrawCount(pane);
  redrawDrawings(pane);
}

/** pointer-events follows the armed state: the chart must stay fully
 *  interactive whenever no tool is active, or panning breaks. */
function syncDrawMode(pane) {
  const armed = !!pane.drawTool || pane.drawErase;
  pane.drawCanvas.style.pointerEvents = armed ? 'auto' : 'none';
  pane.drawTools.classList.toggle('armed', armed);
  pane.el.querySelector('.chart-main').classList.toggle('drawing', armed);
  pane.drawTools.querySelectorAll('[data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === pane.drawTool));
  const eraseBtn = pane.drawTools.querySelector('[data-act="erase"]');
  if (eraseBtn) eraseBtn.classList.toggle('active', !!pane.drawErase);
}

function setDrawTool(pane, tool) {
  pane.drawTool = (pane.drawTool === tool) ? null : tool;   // click again to disarm
  if (pane.drawTool) pane.drawErase = false;
  pane.drawStart = null;
  pane.drawPreview = null;
  syncDrawMode(pane);
  redrawDrawings(pane);
}

function wireDrawingTools(pane) {
  const canvas = pane.drawCanvas;
  const tools  = pane.drawTools;
  if (!canvas || !tools || typeof Drawings === 'undefined') return;

  tools.addEventListener('click', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    if (btn.dataset.tool) { setDrawTool(pane, btn.dataset.tool); return; }
    switch (btn.dataset.act) {
      case 'magnet':
        pane.drawMagnet = !pane.drawMagnet;
        btn.classList.toggle('active', pane.drawMagnet);
        break;
      case 'erase':
        pane.drawErase = !pane.drawErase;
        if (pane.drawErase) pane.drawTool = null;
        syncDrawMode(pane);
        break;
      case 'undo':
        if (pane.drawings.length) { pane.drawings.pop(); saveDrawings(pane); redrawDrawings(pane); }
        break;
      case 'hide':
        pane.drawHidden = !pane.drawHidden;
        btn.classList.toggle('active', pane.drawHidden);
        redrawDrawings(pane);
        break;
      case 'cards':
        // Cycles float -> dock -> off, for THIS pane only.
        setCardMode(pane, CARD_MODES[(CARD_MODES.indexOf(cardMode(pane)) + 1) % CARD_MODES.length]);
        break;
      case 'clear':
        if (pane.drawings.length &&
            confirm(`Delete all ${pane.drawings.length} drawing(s) on ${pane.symbol}?`)) {
          pane.drawings = [];
          pane.drawSel = null;
          saveDrawings(pane);
          redrawDrawings(pane);
        }
        break;
    }
  });
  // Reflect the default-on magnet in the UI.
  const mag = tools.querySelector('[data-act="magnet"]');
  if (mag) mag.classList.toggle('active', pane.drawMagnet);
  syncCardModeBtn(pane);

  const pointFrom = (ev) => {
    const r = canvas.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    const a = drawAdapter(pane);
    const t = a.fromX(x), p = a.fromY(y);
    if (t == null || p == null) return null;
    return pane.drawMagnet ? Drawings.snap(pane.bars, a, t, p, 8) : {t: t, y: p};
  };

  canvas.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    // offsetWidth, NOT canvas.width: the mouse coordinates below are CSS pixels,
    // and the backing store is now devicePixelRatio times larger. This was
    // already wrong whenever the buffer was stale — erase-hit-testing on a
    // resized pane tested against the old width.
    const W = canvas.offsetWidth;

    if (pane.drawErase) {
      const r = canvas.getBoundingClientRect();
      const hit = Drawings.hitTest(pane.drawings, drawAdapter(pane),
                                   ev.clientX - r.left, ev.clientY - r.top, W,
                                   canvas.getContext('2d'));
      if (hit) {
        pane.drawings = pane.drawings.filter(d => d.id !== hit.id);
        saveDrawings(pane);
        redrawDrawings(pane);
      }
      return;
    }
    if (!pane.drawTool) return;
    const pt = pointFrom(ev);
    if (!pt) return;
    ev.preventDefault();

    // One-click tools finish immediately; two-point tools start a drag.
    if (pane.drawTool === 'hline') {
      pane.drawings.push(Drawings.make('hline', pt));
      saveDrawings(pane);
      setDrawTool(pane, null);
      redrawDrawings(pane);
      return;
    }
    if (pane.drawTool === 'text') {
      const txt = prompt('Note text:');
      if (txt) {
        pane.drawings.push(Drawings.make('text', pt, null, {text: txt}));
        saveDrawings(pane);
      }
      setDrawTool(pane, null);
      redrawDrawings(pane);
      return;
    }
    pane.drawStart = {pt: pt, px: ev.clientX, py: ev.clientY};
  });

  canvas.addEventListener('mousemove', ev => {
    if (!pane.drawStart || !pane.drawTool) return;
    const pt = pointFrom(ev);
    if (!pt) return;
    pane.drawPreview = Drawings.make(pane.drawTool, pane.drawStart.pt, pt);
    redrawDrawings(pane);
  });

  const finish = ev => {
    if (!pane.drawStart || !pane.drawTool) return;
    const moved = Math.hypot(ev.clientX - pane.drawStart.px, ev.clientY - pane.drawStart.py);
    const pt = pointFrom(ev);
    // A click with no drag is an accident, not a zero-length shape.
    if (pt && moved >= Drawings.MIN_DRAG_PX) {
      pane.drawings.push(Drawings.make(pane.drawTool, pane.drawStart.pt, pt));
      saveDrawings(pane);
    }
    pane.drawStart = null;
    pane.drawPreview = null;
    setDrawTool(pane, null);       // one shape per arming, as TradingView does
    redrawDrawings(pane);
  };
  canvas.addEventListener('mouseup', finish);
  canvas.addEventListener('mouseleave', () => {
    if (!pane.drawStart) return;
    pane.drawStart = null;
    pane.drawPreview = null;
    redrawDrawings(pane);
  });

  // Escape disarms — the standard way out of a tool you picked by mistake.
  pane.el.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && (pane.drawTool || pane.drawErase)) {
      pane.drawTool = null;
      pane.drawErase = false;
      pane.drawStart = null;
      pane.drawPreview = null;
      syncDrawMode(pane);
      redrawDrawings(pane);
    }
  });

  syncDrawMode(pane);
  updateDrawCount(pane);
}

// ── Trendlines overlay (supply/demand) ────────────────────────────────────────
// Backed by /api/trendlines (which calls scanner_templates.detect_trendline_break,
// a port of the "Trend Lines by Kris" Pine indicator). Draws the two active
// lines — falling supply (red) between the two most recent pivot highs, rising
// demand (orange) between the two most recent pivot lows — each extended
// forward to the last bar so the projected level is visible.
function ensureTlState(pane) {
  if (!pane.tl) {
    pane.tl = {supplyLine: null, demandLine: null, lastFetchKey: null};
  }
  return pane.tl;
}

function clearTrendlines(pane) {
  if (!pane.tl) return;
  ['supplyLine', 'demandLine'].forEach(k => {
    if (pane.tl[k]) {
      try { pane.chart.removeSeries(pane.tl[k]); } catch {}
      pane.tl[k] = null;
    }
  });
  pane.tl.lastFetchKey = null;
}

async function renderTrendlines(pane) {
  const tl = ensureTlState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (tl.lastFetchKey === key) return;
  tl.lastFetchKey = key;

  let g = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/trendlines?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) g = (await res.json()).trendlines || null;
  } catch (e) { console.warn('trendlines fetch failed:', e); }

  if (!pane.indicators.has('trendlines')) return;
  const stillCurrentKey = paneFetchKey(pane);
  if (stillCurrentKey !== key) return;

  if (!g) { clearTrendlines(pane); return; }

  const draw = (seriesKey, side, color) => {
    if (!side || side.t1 == null || side.t2 == null || side.t3 == null) {
      if (tl[seriesKey]) { try { pane.chart.removeSeries(tl[seriesKey]); } catch {}; tl[seriesKey] = null; }
      return;
    }
    if (!tl[seriesKey]) {
      tl[seriesKey] = pane.chart.addLineSeries({
        color, lineWidth: 2,
        lineStyle: side.broken ? 2 /* dashed once broken */ : 0,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        autoscaleInfoProvider: () => null,
      });
    } else {
      // If broken-state flipped, refresh the line style.
      tl[seriesKey].applyOptions({lineStyle: side.broken ? 2 : 0, color});
    }
    // Three points: two pivot anchors + projected end-of-data. Lightweight-
    // charts requires strictly increasing time; anchors are already ordered.
    tl[seriesKey].setData([
      {time: side.t1, value: side.y1},
      {time: side.t2, value: side.y2},
      {time: side.t3, value: side.y3},
    ]);
  };

  draw('supplyLine', g.supply, '#f23645');  // falling supply — red
  draw('demandLine', g.demand, '#ff9800');  // rising demand — orange (matches screenshot)
}

// ── Falling Wedge overlay ─────────────────────────────────────────────────────
// ── Flag & Pole ──────────────────────────────────────────────────────────────
// Backed by /api/flag_pole (tools/flag_pole.py, B-92 / PR-4). Draws the pole as a
// thick line, the flag as its two boundaries, and the three PLAN levels as price
// lines: trigger, stop (the far flag boundary) and the pole-height target.
//
// Both directions are drawn when both exist. They are mutually exclusive in
// practice, but nothing guarantees it, and hiding one would be a decision the
// detector never made.
//
// THE TARGET IS A PROJECTION, NOT A FORECAST, and the card says so. Nothing here
// is backtested; B-19 measured 0 of 41 scanners stable after costs.
const FP_COLORS = {bull: '#26a69a', bear: '#ef5350'};

function ensureFlagPoleState(pane) {
  if (!pane.flagPole) pane.flagPole = {series: [], priceLines: [], infoEl: null, lastFetchKey: null};
  return pane.flagPole;
}

function clearFlagPole(pane) {
  const fp = pane.flagPole;
  if (!fp) return;
  (fp.series || []).forEach(sr => { try { pane.chart.removeSeries(sr); } catch {} });
  fp.series = [];
  // Price lines belong to the candle series, not the chart, so they are removed
  // through their owner or they survive a teardown and stack up on the next draw.
  (fp.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  fp.priceLines = [];
  if (fp.infoEl) { try { fp.infoEl.remove(); } catch {}; fp.infoEl = null; }
  setPaneMarkers(pane, 'flagPole', null);
  fp.lastFetchKey = null;
}

async function renderFlagPole(pane) {
  const fp = ensureFlagPoleState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (fp.lastFetchKey === key) return;
  fp.lastFetchKey = key;

  let data = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/flag_pole?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) data = await res.json();
  } catch (e) { console.warn('flag_pole fetch failed:', e); }

  // Guard against a stale response landing after a toggle-off or symbol switch.
  if (!pane.indicators.has('flag_pole')) return;
  if (paneFetchKey(pane) !== key) return;

  clearFlagPole(pane);
  fp.lastFetchKey = key;
  if (!data) return;

  const found = ['bull', 'bear'].map(d => data[d]).filter(Boolean);
  if (!found.length) {
    // Absent renders absent -- but say WHY when the frame was simply too short,
    // because "no pattern" and "could not look" are different answers.
    if (data.note) showFlagPoleCard(pane, null, data.note);
    return;
  }

  const markers = [];
  found.forEach(g => {
    const col = FP_COLORS[g.direction] || '#4c9aff';
    const seg = (pts, width, dashed) => {
      const sr = pane.chart.addLineSeries({
        color: col, lineWidth: width, lineStyle: dashed ? 2 : 0,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false, autoscaleInfoProvider: () => null,
      });
      sr.setData(pts);
      fp.series.push(sr);
    };

    // The pole, drawn low->high for a bull and high->low for a bear so the line
    // slopes the way the thrust did.
    if (g.pole_t0 != null && g.pole_t1 != null) {
      const a = g.direction === 'bull' ? g.pole_low : g.pole_high;
      const b = g.direction === 'bull' ? g.pole_high : g.pole_low;
      seg([{time: g.pole_t0, value: a}, {time: g.pole_t1, value: b}], 3, false);
    }
    // The flag: both boundaries, flat across the consolidation.
    if (g.flag_t0 != null && g.flag_t1 != null) {
      seg([{time: g.flag_t0, value: g.flag_high}, {time: g.flag_t1, value: g.flag_high}], 1, true);
      seg([{time: g.flag_t0, value: g.flag_low},  {time: g.flag_t1, value: g.flag_low}],  1, true);
    }

    // The plan. Price lines rather than segments so they extend to the right edge
    // where a trade would actually be managed.
    const pl = (price, colour, title, style) => {
      try {
        fp.priceLines.push(pane.series.createPriceLine({
          price: price, color: colour, lineWidth: 1, lineStyle: style,
          axisLabelVisible: true, title: title,
        }));
      } catch {}
    };
    const tag = g.direction === 'bull' ? '' : ' \u25bc';
    pl(g.entry,  col,        `FP trigger${tag}`, 0);
    pl(g.stop,   '#f85149',  `FP stop${tag}`,    2);
    pl(g.target, '#3fb950',  `FP target${tag}`,  2);

    const t = g.broken ? (g.flag_t1 != null ? g.last_t : null) : g.flag_t1;
    if (t != null) {
      markers.push(g.direction === 'bull'
        ? {time: t, position: 'belowBar', color: col,
           shape: g.broken ? 'arrowUp' : 'circle',
           text: g.broken ? 'FLAG BREAK' : 'FLAG'}
        : {time: t, position: 'aboveBar', color: col,
           shape: g.broken ? 'arrowDown' : 'circle',
           text: g.broken ? 'FLAG BREAK \u25bc' : 'FLAG \u25bc'});
    }
  });
  if (markers.length) setPaneMarkers(pane, 'flagPole', markers);
  showFlagPoleCard(pane, found, null);
}

function showFlagPoleCard(pane, found, note) {
  const fp = ensureFlagPoleState(pane);
  if (!fp.infoEl) {
    fp.infoEl = document.createElement('div');
    fp.infoEl.style.cssText =
      'position:absolute;left:8px;bottom:8px;z-index:9;pointer-events:none;' +
      'font:11px -apple-system,"Segoe UI",sans-serif;color:var(--text-chart);' +
      'background:rgba(76,154,255,0.12);border:1px solid rgba(76,154,255,0.5);' +
      'border-radius:6px;padding:5px 9px;line-height:1.5;';
    fp.infoEl.className = 'flagpole-info';
    mountCard(pane, fp.infoEl, 'corner');
  }
  if (note) {
    fp.infoEl.innerHTML = `<b>Flag &amp; Pole</b> — not computed: ${note}`;
    return;
  }
  const rows = (found || []).map(g => {
    const vc = g.vol_contract == null ? 'vol n/a'
      : (g.vol_contract > 0
          ? `vol dried ${(g.vol_contract * 100).toFixed(0)}%`
          : `vol ROSE ${(-g.vol_contract * 100).toFixed(0)}%`);
    const arrow = g.direction === 'bull' ? '\u25b2' : '\u25bc';
    return `${arrow} pole <b>${g.pole_atr}\u00d7ATR</b>/${g.pole_bars}b · ` +
           `flag ${g.flag_bars}b retrace <b>${(g.retrace * 100).toFixed(0)}%</b> · ${vc}<br>` +
           `&nbsp;&nbsp;${g.broken ? '<b>BROKEN</b>' : 'watch'} — ` +
           `trigger ${g.entry} · stop ${g.stop} · target ${g.target} (R:R ${g.rr})`;
  });
  fp.infoEl.innerHTML =
    '<b>Flag &amp; Pole</b><br>' + rows.join('<br>') +
    '<br><span style="opacity:0.75">Target = pole height projected — a measured ' +
    'move, <b>not a forecast</b>. UNMEASURED.</span>';
}

// Backed by /api/falling_wedge (scanner_templates.detect_falling_wedge_geometry,
// concepts/Falling-Wedge.md). Draws the two converging downward trendlines (green),
// a translucent fill between them (painted by drawPatternZones from pane.fw.poly),
// a breakout marker, and a compact stat label. FW-3 of Falling-Wedge-Scanner-Fit.
const FW_COLOR = '#26a69a';

function ensureFwState(pane) {
  if (!pane.fw) pane.fw = {upperLine: null, lowerLine: null, poly: null, infoEl: null, lastFetchKey: null};
  return pane.fw;
}

function clearFallingWedge(pane) {
  const fw = pane.fw;
  if (!fw) return;
  ['upperLine', 'lowerLine'].forEach(k => {
    if (fw[k]) { try { pane.chart.removeSeries(fw[k]); } catch {}; fw[k] = null; }
  });
  fw.poly = null;
  if (fw.infoEl) { try { fw.infoEl.remove(); } catch {}; fw.infoEl = null; }
  setPaneMarkers(pane, 'fw', null);
  fw.lastFetchKey = null;
  drawPatternZones(pane);
}

async function renderFallingWedge(pane) {
  const fw = ensureFwState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (fw.lastFetchKey === key) return;
  fw.lastFetchKey = key;

  let w = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/falling_wedge?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) w = (await res.json()).falling_wedge || null;
  } catch (e) { console.warn('falling_wedge fetch failed:', e); }

  // Guard against a stale response landing after the user toggled off / switched.
  if (!pane.indicators.has('falling_wedge')) return;
  const stillCurrent = paneFetchKey(pane);
  if (stillCurrent !== key) return;

  if (!w || !w.upper || !w.lower || w.upper.t0 == null || w.lower.t0 == null) {
    clearFallingWedge(pane); return;
  }

  const line = (seriesKey, seg, dashed) => {
    if (!fw[seriesKey]) {
      fw[seriesKey] = pane.chart.addLineSeries({
        color: FW_COLOR, lineWidth: 2, lineStyle: dashed ? 2 : 0,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        autoscaleInfoProvider: () => null,
      });
    } else {
      fw[seriesKey].applyOptions({lineStyle: dashed ? 2 : 0});
    }
    fw[seriesKey].setData([{time: seg.t0, value: seg.y0}, {time: seg.t1, value: seg.y1}]);
  };
  const broken = w.state === 'confirmed';
  line('upperLine', w.upper, broken);   // upper dashes once price has broken it
  line('lowerLine', w.lower, false);

  // Stash the quadrilateral for the translucent fill (drawn by drawPatternZones).
  fw.poly = {
    ut0: w.upper.t0, uy0: w.upper.y0, ut1: w.upper.t1, uy1: w.upper.y1,
    lt0: w.lower.t0, ly0: w.lower.y0, lt1: w.lower.t1, ly1: w.lower.y1,
  };

  // Breakout / state marker on the last bar.
  const mk = w.state === 'confirmed'
    ? {time: w.breakout_time, position: 'belowBar', color: FW_COLOR, shape: 'arrowUp', text: 'WEDGE BREAK'}
    : {time: w.breakout_time, position: 'belowBar', color: '#9aa4af', shape: 'circle',
       text: w.state === 'pre-breakout' ? 'PRE-BREAK' : 'WEDGE'};
  if (mk.time != null) setPaneMarkers(pane, 'fw', [mk]);

  // Compact stat label (bottom-left) mirroring the source screener's tiles.
  if (!fw.infoEl) {
    fw.infoEl = document.createElement('div');
    fw.infoEl.style.cssText =
      'position:absolute;left:8px;bottom:8px;z-index:9;pointer-events:none;' +
      'font:11px -apple-system,"Segoe UI",sans-serif;color:var(--text-chart);' +
      'background:rgba(38,166,154,0.12);border:1px solid rgba(38,166,154,0.5);' +
      'border-radius:6px;padding:5px 9px;line-height:1.5;';
    // Classed and mounted like every other card so the placement switch and the
    // snapshot can both find it — it used to piggyback on the pattern canvas's
    // parent, which is the one place the switch does not look.
    fw.infoEl.className = 'fw-info';
    mountCard(pane, fw.infoEl, 'corner');
  }
  const rrTxt = (w.rr != null) ? ` · R:R ${w.rr}` : '';
  fw.infoEl.innerHTML =
    `<b>Falling Wedge · ${w.state_label}</b> · conf ${w.confidence}` +
    ` · contain ${w.containment_pct}% · conv ${w.convergence_pct}%` +
    ` · ${w.touches_h}H/${w.touches_l}L · ${w.vol_dry ? 'vol↓' : 'vol~'}` +
    `<br>entry ${w.entry} · stop ${w.stop} · target ${w.target}${rrTxt}`;

  drawPatternZones(pane);
}

// ── Structure Break Chain overlay ─────────────────────────────────────────────
// Backed by /api/structure_chain (scanner_templates.detect_structure_chain — a port
// of Structure Break Chain [SBC], © SharpStrat, MPL 2.0; see
// sources/Structure-Break-Chain-SBC-Pine.md + concepts/Market-Structure-CHOCH-BOS.md).
// Draws: dashed swing levels, a BOS/CHoCH/FAILED marker per event, and a chain card.
// Quality is encoded as marker OPACITY (strong = solid, weak = faded), as in the
// source — so a weak break visually recedes instead of shouting a fourth label.
const SBC_BULL  = '0,230,118';    // #00e676  (rgb triples — alpha is per-quality)
const SBC_BEAR  = '255,23,68';    // #ff1744
const SBC_CHOCH = '255,171,0';    // #ffab00
const SBC_FAIL  = '213,0,249';    // #d500f9
const SBC_SWING = '#455a64';
const SBC_MAX_MARKERS = 30;       // most recent events only — history stays legible
const SBC_ALPHA = {STRONG: 1, NORMAL: 0.72, WEAK: 0.4};   // Pine: 0 / 28 / 60 transp.

function ensureSbcState(pane) {
  if (!pane.sbc) pane.sbc = {swingLines: [], infoEl: null, infoBody: null,
                             collapsed: false, lastFetchKey: null};
  return pane.sbc;
}

function clearStructureChain(pane) {
  const st = pane.sbc;
  if (!st) return;
  (st.swingLines || []).forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  st.swingLines = [];
  if (st.infoEl) { try { st.infoEl.remove(); } catch {}; st.infoEl = null; st.infoBody = null; }
  setPaneMarkers(pane, 'sbc', null);
  pane.sbc = null;
}

async function renderStructureChain(pane) {
  const st = ensureSbcState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (st.lastFetchKey === key) return;
  st.lastFetchKey = key;

  let d = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/structure_chain?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}&max_swings=12`;
    const res = await fetch(url);
    if (res.ok) d = (await res.json()).structure_chain || null;
  } catch (e) { console.warn('structure_chain fetch failed:', e); }

  // Guard against a stale response landing after the user toggled off / switched.
  if (!pane.indicators.has('structure_chain')) return;
  const stillCurrent = paneFetchKey(pane);
  if (stillCurrent !== key) return;

  if (!d || !d.events || !d.events.length) { clearStructureChain(pane); return; }

  // ── dashed swing levels (one thin line each, pivot → right edge) ──
  (st.swingLines || []).forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  st.swingLines = [];
  (d.swings || []).forEach(sw => {
    if (sw.t0 == null || sw.t1 == null || sw.t1 <= sw.t0) return;
    const s = pane.chart.addLineSeries({
      color: SBC_SWING, lineWidth: 1, lineStyle: 2,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,
    });
    s.setData([{time: sw.t0, value: sw.level}, {time: sw.t1, value: sw.level}]);
    st.swingLines.push(s);
  });

  // ── one marker per event (+ a separate FAILED marker where it broke back) ──
  const markers = [];
  d.events.slice(-SBC_MAX_MARKERS).forEach(e => {
    const up = e.direction === 'up';
    const a  = SBC_ALPHA[e.quality] != null ? SBC_ALPHA[e.quality] : 0.72;
    const rgb = e.type === 'CHOCH' ? SBC_CHOCH : (up ? SBC_BULL : SBC_BEAR);
    markers.push({
      time: e.time,
      position: up ? 'belowBar' : 'aboveBar',
      color: `rgba(${rgb},${a})`,
      shape: e.type === 'CHOCH' ? 'circle' : (up ? 'arrowUp' : 'arrowDown'),
      text: `${e.type === 'CHOCH' ? 'CHoCH' : 'BOS'} ${e.quality[0]}${e.chain > 1 ? '·' + e.chain : ''}`,
    });
    if (e.failed && e.failed_time != null) {
      markers.push({time: e.failed_time, position: up ? 'aboveBar' : 'belowBar',
                    color: `rgba(${SBC_FAIL},0.9)`, shape: 'square', text: '✗ FAILED'});
    }
  });
  setPaneMarkers(pane, 'sbc', markers);

  renderSbcInfo(pane, d);
}

// ── The Structure Break Chain card, in English ───────────────────────────────
// The card used to print six rows of numbers and a formula. Everything a reader
// needs was there and none of it said what it MEANT, so the two things that
// matter most — did the last break hold, and is this structure trending or
// flipping — had to be inferred from glyphs. Two of those inferences were made
// wrong in front of me, which is the whole reason this function exists.
//
// It is DESCRIPTIVE. It says what the structure did; it never says what to do,
// and no threshold here has been measured against forward returns.
const SBC_THRESH = {
  // Average completed-chain length: how many breaks run the same way before the
  // structure turns. 1-2 is a market changing its mind almost every event.
  chainChoppy: 2.0,
  chainTrending: 3.0,
  // Share of all breaks that failed inside the fail window.
  failHigh: 0.30,
  failLow: 0.15,
};

function sbcReading(s, last) {
  const total = (s.total_bos || 0) + (s.total_choch || 0);
  const failRate = total ? (s.failed_count || 0) / total : 0;
  const avg = s.avg_chain;
  const dirTxt = last.direction === 'up' ? 'upward' : 'downward';

  // 1. What the last event WAS — quality and survival are separate facts, and
  //    the compact card ran them together as "STRONG ✗".
  const strength = last.quality === 'STRONG' ? 'a decisive break'
                 : last.quality === 'NORMAL' ? 'an ordinary break'
                 : 'a shallow break';
  const held = last.failed
    ? `and it did <b>NOT hold</b> — price came back through ${last.level} inside ${s.fail_win} bars`
    : 'and it has held so far';
  const what = last.type === 'CHOCH'
    ? `Last event: a <b>character change</b> ${dirTxt} through ${last.level}`
    : `Last event: a <b>continuation break</b> ${dirTxt} through ${last.level}`;

  // 2. What KIND of market these events happened in.
  let env, envWhy;
  if (avg == null) {
    env = 'not enough completed chains to judge the environment';
    envWhy = '';
  } else if (avg < SBC_THRESH.chainChoppy) {
    env = 'choppy';
    envWhy = `chains average ${avg} breaks before the structure turns`;
  } else if (avg < SBC_THRESH.chainTrending) {
    env = 'mixed';
    envWhy = `chains average ${avg} breaks (longest ${s.max_chain})`;
  } else {
    env = 'trending';
    envWhy = `chains average ${avg} breaks, longest ${s.max_chain}`;
  }

  const failTxt = !total ? ''
    : failRate >= SBC_THRESH.failHigh
      ? `<b>${Math.round(failRate * 100)}% of breaks failed</b> (${s.failed_count} of ${total}) — levels are being taken and given back`
      : failRate <= SBC_THRESH.failLow
        ? `${Math.round(failRate * 100)}% of breaks failed (${s.failed_count} of ${total}) — breaks mostly stick`
        : `${Math.round(failRate * 100)}% of breaks failed (${s.failed_count} of ${total})`;

  // 3. The bottom line. Deliberately about CONFIRMATION, not about direction:
  //    a failed break in a choppy tape is a statement about evidence, and the
  //    card has no business turning that into a trade.
  const shift = last.type === 'CHOCH';
  let verdict, tone;
  if (last.failed) {
    verdict = shift ? 'Trend change NOT confirmed — the CHoCH failed'
                    : 'Continuation NOT confirmed — the break failed';
    tone = 'bad';
  } else if (last.quality === 'WEAK' || env === 'choppy') {
    verdict = shift ? 'Trend change is TENTATIVE' : 'Break held, but weakly';
    tone = 'warn';
  } else {
    verdict = shift ? 'Trend change confirmed so far' : 'Trend continuing';
    tone = 'good';
  }
  return {verdict, tone,
          lines: [`${what} — ${strength} (quality ${last.quality}), ${held}.`,
                  `Environment: <b>${env}</b>${envWhy ? ' — ' + envWhy : ''}.`,
                  failTxt].filter(Boolean)};
}

function renderSbcInfo(pane, d) {
  const st = ensureSbcState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'sbc-info' + (st.collapsed ? ' collapsed' : '');
    const head = document.createElement('div');
    head.className = 'sbc-head';
    const body = document.createElement('div');
    body.className = 'sbc-body';
    st.infoEl.appendChild(head);
    st.infoEl.appendChild(body);
    st.infoHead = head;
    st.infoBody = body;
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.sbc-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
    mountCard(pane, st.infoEl, 'stack');
  }
  const s = d.stats;
  const last = d.events[d.events.length - 1];
  const trendTxt = s.trend === 1 ? 'BULLISH' : s.trend === -1 ? 'BEARISH' : 'UNSET';
  const trendCol = s.trend === 1 ? `rgb(${SBC_BULL})` : s.trend === -1 ? `rgb(${SBC_BEAR})` : '#90a4ae';
  const lastCol  = last.type === 'CHOCH' ? `rgb(${SBC_CHOCH})`
                 : last.direction === 'up' ? `rgb(${SBC_BULL})` : `rgb(${SBC_BEAR})`;

  st.infoEl.style.display = 'block';
  st.infoHead.innerHTML =
    `<span style="color:${trendCol}">Structure ${trendTxt}</span>` +
    `<span class="sbc-chain" style="background:${trendCol}">chain ${s.chain}</span>`;
  const read = sbcReading(s, last);
  const readCol = read.tone === 'bad' ? `rgb(${SBC_BEAR})`
                : read.tone === 'good' ? `rgb(${SBC_BULL})` : '#ffab40';
  st.infoBody.innerHTML =
    `<div class="sbc-read">` +
      `<span class="sbc-verdict" style="color:${readCol}">${read.verdict}` +
      ` · ${s.last_bars_ago} bars ago</span>` +
      read.lines.map(l => `<span class="sbc-bullet">${l}</span>`).join('') +
    `</div>` +
    // The numbers stay: the reading is a summary of them, not a replacement,
    // and a reader who disagrees with the wording needs the inputs to argue.
    `<div class="sbc-row" title="What broke, how cleanly, and whether it held. ` +
      `✗ means the break FAILED — it is not the quality label."><span>Last event</span>` +
      `<span style="color:${lastCol}">${last.type} ${last.quality}` +
      `${last.failed ? ' ✗ failed' : ''}</span></div>` +
    `<div class="sbc-row" title="The swing level this event broke through."><span>Level broken</span>` +
      `<span>${last.level}</span></div>` +
    `<div class="sbc-row" title="BOS continues the current direction; CHoCH reverses it. ` +
      `Many CHoCHs relative to BOSs means the structure keeps turning.">` +
      `<span>BOS / CHoCH</span><span>${s.total_bos} / ${s.total_choch}</span></div>` +
    `<div class="sbc-row" title="Breaks that ran the same way before the structure turned — ` +
      `longest run, and the average across completed chains.">` +
      `<span>Chain max / avg</span>` +
      `<span>${s.max_chain} / ${s.avg_chain != null ? s.avg_chain : '—'}</span></div>` +
    `<div class="sbc-row" title="Breaks that reversed back through their own level inside the ` +
      `fail window — fakeouts and liquidity grabs."><span>Failed breaks</span>` +
      `<span>${s.failed_count} of ${(s.total_bos || 0) + (s.total_choch || 0)}</span></div>` +
    // SETTINGS, labelled as settings. "fail window 3b" printed beside the
    // results was read as "it only held for 3 bars"; it is the detector's own
    // watch period and says nothing about this event.
    `<div class="sbc-settings">Settings — pivot ${s.pivot_len} · ${s.confirm}-confirmed · ` +
      `fail window ${s.fail_win}b (how long a break is watched, not how long it lasted)` +
      `<br>quality = 0.6·dist/ATR + 0.4·body/ATR → STRONG ≥0.75 · NORMAL ≥0.35 · else WEAK; ` +
      `opacity shows it` +
      `<br><i>Held vs failed MEASURED 2026-09-21 (B-114): +1.28pp @20d over 4,608 events, 150 names, and it survives clustering (133 symbols, p=0.0015). The quality ladder does NOT rank on the same data — read STRONG/NORMAL/WEAK as description, not as strength. B-115: a held UP break also beats owning the same bars, +0.82pp @20d (p=0.006, 58% of names) — real, and small.</i></div>`;
}

// ── PMax trade overlay (flip markers + live position levels) ──────────────────
// The two PMax lines show WHERE the trailing band is but not WHEN it flipped or
// what to do about it. This layer makes each flip legible: a BUY/SELL arrow on
// the flip bar, and — for the currently-open direction only — entry / trailing
// stop / TP1-3 price lines plus a bottom-center state chip.
const PMAX_UP   = '#26a69a';
const PMAX_DOWN = '#f23645';

function ensurePmaxState(pane) {
  if (!pane.pmaxTrade) pane.pmaxTrade = {priceLines: [], infoEl: null, collapsed: loadPmaxCollapsed()};
  return pane.pmaxTrade;
}

// ── Renko state line (integration layer for renko.js) ────────────────────────
// Renko's whole read is two numbers — the brick size in force and how far the current
// run has travelled — and neither is legible from the staircase alone. Drawn as ONE
// labelled price line at the live grid level rather than a card: it is the level the
// next brick prints from, so it belongs on the price axis next to it.
function clearRenkoState(pane) {
  (pane._renkoLines || []).forEach(pl => {
    try { pane.series.removePriceLine(pl); } catch {}
  });
  pane._renkoLines = [];
}

function renderRenkoState(pane, rk) {
  clearRenkoState(pane);
  if (!rk || !rk.state || !rk.state.brick) return;
  const st = rk.state;
  const up = st.dir === 1;
  // Brick as a % of price travels across instruments; the raw points do not.
  const last = pane.bars && pane.bars.length ? pane.bars[pane.bars.length - 1].close : 0;
  const pct = last > 0 ? (st.brick / last * 100).toFixed(2) : '?';
  pane._renkoLines = [pane.series.createPriceLine({
    price: st.lastClose,
    color: up ? '#26a69a' : '#ab47bc',
    lineWidth: 1, lineStyle: 2, axisLabelVisible: true,
    // No BUY/SELL wording anywhere: B-43 measured the flip at zero forward edge, so
    // this reports STATE (where the grid is, how big a brick is) and nothing more.
    title: `Renko ${up ? '▲' : '▼'} ${st.bricks}br · brick ${st.brick.toFixed(2)} (${pct}%)`,
  })];
}

function clearPmaxTrade(pane) {
  const st = pane.pmaxTrade;
  if (!st) return;
  (st.priceLines || []).forEach(pl => {
    try { pane.series.removePriceLine(pl); } catch {}
  });
  st.priceLines = [];
  if (st.infoEl) {
    try { st.infoEl.remove(); } catch {}
    st.infoEl = null;
  }
  setPaneMarkers(pane, 'pmax', null);
  pane.pmaxTrade = null;
}

function renderPmaxTrade(pane, rows, bars) {
  const st = ensurePmaxState(pane);
  // Price lines are rebuilt every recompute (timeframe change, new bar).
  (st.priceLines || []).forEach(pl => {
    try { pane.series.removePriceLine(pl); } catch {}
  });
  st.priceLines = [];

  const sigs = pmaxSignals(rows, bars);
  if (!sigs.length) {
    setPaneMarkers(pane, 'pmax', null);
    if (st.infoEl) st.infoEl.style.display = 'none';
    return;
  }

  // Every historical flip gets an arrow so the reversal history is readable.
  setPaneMarkers(pane, 'pmax', sigs.map(s => s.dir === 1
    ? {time: s.time, position: 'belowBar', color: PMAX_UP,   shape: 'arrowUp',   text: 'BUY'}
    : {time: s.time, position: 'aboveBar', color: PMAX_DOWN, shape: 'arrowDown', text: 'SELL'}));

  // Levels are drawn for the open position only — the last flip.
  const sig  = sigs[sigs.length - 1];
  const cur  = rows[rows.length - 1];
  const last = bars[bars.length - 1];
  // Trailing stop is the LIVE band, not the flip-bar band: PMax ratchets, so
  // the current value is the real invalidation price today.
  const trail = cur && cur.dir === sig.dir ? cur.pmax : sig.stop;
  const long  = sig.dir === 1;
  const col   = long ? PMAX_UP : PMAX_DOWN;

  const mk = (price, title, color, style) => {
    if (!Number.isFinite(price)) return;
    try {
      st.priceLines.push(pane.series.createPriceLine({
        price, color, lineWidth: 1, lineStyle: style,
        axisLabelVisible: true, title,
      }));
    } catch {}
  };
  mk(sig.entry, 'PMax Entry', '#4c9aff', 0);
  mk(trail,     'PMax SL',    PMAX_DOWN, 2);
  sig.targets.forEach((t, i) => mk(t, `TP${i + 1}`, PMAX_UP, 2));

  renderPmaxInfo(pane, sig, trail, last, long, col);
}

function renderPmaxInfo(pane, sig, trail, last, long, col) {
  const st = ensurePmaxState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'pmax-info';
    mountCard(pane, st.infoEl, 'corner');
    // Click the header to collapse to a one-line chip; persist the choice.
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.pmax-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
      savePmaxCollapsed(st.collapsed);
    });
  }
  const px  = last ? last.close : sig.entry;
  const fmt = v => Number.isFinite(v) ? v.toFixed(2) : '—';
  const pnl = sig.risk ? ((long ? px - sig.entry : sig.entry - px) / sig.risk) : 0;
  // Where the ratcheting trail now sits RELATIVE TO ENTRY, in R. Negative is
  // live risk (stop still behind entry); zero is breakeven; positive means the
  // trail has locked in that much profit. This is the number that tells you
  // whether the position still costs you anything to hold.
  const stopR = sig.risk ? ((long ? trail - sig.entry : sig.entry - trail) / sig.risk) : 0;
  // Un-hit targets and live risk previously used --text-muted, which on a
  // translucent overlay is the first thing to become unreadable. They are
  // primary numbers, so they get primary contrast; the ✓ still marks hits.
  const stopTag = stopR >= 0
    ? `<span style="color:${PMAX_UP}">stop locks +${stopR.toFixed(1)}R</span>`
    : `<span style="color:var(--text-chart)">risk ${Math.abs(stopR).toFixed(1)}R</span>`;
  const tps   = sig.targets.map((t, i) =>
    `<span style="color:${i < sig.hit ? PMAX_UP : 'var(--text-chart)'}">` +
    `TP${i + 1} ${fmt(t)}${i < sig.hit ? ' ✓' : ''}</span>`).join(' · ');
  const dt = new Date(sig.time * 1000).toISOString().slice(0, 10);

  // Font sizes inherit the 10.5px house style shared by every other overlay so
  // no card shouts over its neighbours. The header line (identity + live R) is
  // the click target and the one line that survives collapse — the entry/stop/
  // targets detail and exit note live in the body and fold away.
  st.infoEl.innerHTML =
    `<div class="pmax-head">` +
      `<span style="color:${col}">PMax ${long ? 'LONG' : 'SHORT'}</span>` +
      ` <span style="color:var(--text-muted);font-weight:400;font-size:9.5px;">since ${dt}</span>` +
      ` · <span style="color:${pnl >= 0 ? PMAX_UP : PMAX_DOWN}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(1)}R</span>` +
      ` <span style="color:var(--text-muted);font-weight:400;">▾</span>` +
    `</div>` +
    `<div class="pmax-body">` +
      `<div style="margin-top:5px;font-family:'Courier New',monospace;font-weight:700;">` +
        `<span style="color:#4c9aff">Entry ${fmt(sig.entry)}</span> · ` +
        `<span style="color:${PMAX_DOWN}">Trail SL ${fmt(trail)}</span> · ` +
        stopTag +
        `<br>${tps}` +
      `</div>` +
      `<div style="margin-top:4px;font-size:9.5px;opacity:.85;">` +
        `Exit when the band flips — a ${long ? 'SELL' : 'BUY'} arrow closes this position.` +
      `</div>` +
      // B-65 (`pmax_edge.py`) scored PMax for the first time on 2026-09-10 and it
      // failed, so the card states the result rather than presenting a plan with
      // nothing behind it — the same move the SVP card made after svp_backtest.py.
      //
      // Two distinctions the wording has to keep, because both are the desk's own:
      //   * p=0.511 is a NULL, not a measured loss. Of the four trailing-stop
      //     detectors that converged here (Renko -1.01, STAI -1.00, PSAR -0.77,
      //     PMax -0.55) only B-43r is individually significant, so "no edge" is
      //     the honest claim and "it loses" is not.
      //   * B-65 measured the SIGNAL (flip -> 20d forward return), not THIS
      //     entry/stop/target. The B-41m/B-41p split on the liquidity sweep is
      //     the precedent: a signal measurement does not transfer to a plan built
      //     on it, and no one has scored this plan.
      `<div class="pmax-cav">` +
        `<b>Measured, and worse than doing nothing</b> — B-65: the flip has no ` +
        `edge (−0.55% @20d, p=0.511). B-74: <b>this plan returns −0.50R against ` +
        `simply holding the same stock for the same days</b> (n=1,269 long, CI ` +
        `excludes 0); a plain 20-day hold gives back only −0.15R, and using the ` +
        `drawn trail as a stop is worse again. The levels are the indicator's ` +
        `geometry — not a plan to trade. Not advice.</div>` +
    `</div>`;
  st.infoEl.classList.toggle('collapsed', st.collapsed);
  st.infoEl.style.display = 'block';
}

// ── Session Volume Profile HD — per-session profiles + D/P/B/I + A/D card ─────
// One volume profile per session (day / week / month by timeframe), each drawn as
// a horizontal histogram anchored to its time span, classified D/P/B/I, with a
// card that reads accumulation vs distribution and flags the P-profile trap stack.
// Compute lives in session_volume_profile.js (window.SVP).
const SVP_COL = {P: '#26a69a', B: '#f23645', D: '#4c9aff', I: '#8b93a3'};
function svpRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

// ── Delta Profile (LEFT edge) ────────────────────────────────────────────────
// The only genuinely aggressor-side view in this tool. Hyperliquid publishes the
// taker side with every print; yfinance, the NSE bhavcopy and intraday.db do not
// carry it at any timeframe. So this indicator REFUSES to draw for a non-HL
// symbol rather than falling back to a close-location estimate that would look
// identical and mean something else. A bar-derived guess could not be validated
// either — there is no trade-side ground truth in this stack to check it against.
//
// It is drawn on the LEFT so it can sit beside the (right-anchored) Volume
// Profile without either one covering the other: same price axis, one showing
// where volume traded, the other who lifted it.
const DP_WIDTH_FRAC = 0.16;     // of the plot width, matching VP's restraint
const DP_REFRESH_MS = 4000;     // tape poll while the indicator is on
const DP_BINS = 48;

function ensureDpCanvas(pane) {
  if (!pane.dpCanvas) {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:9;width:100%;height:100%;';
    pane.el.querySelector('.chart-main').appendChild(c);
    pane.dpCanvas = c;
  }
  return pane.dpCanvas;
}

function clearDeltaProfile(pane) {
  if (pane.dpCanvas) {
    const ctx = pane.dpCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.dpCanvas.width, pane.dpCanvas.height);
  }
  if (pane.dpTimer) { clearInterval(pane.dpTimer); pane.dpTimer = null; }
  pane.dp = null;
}

function dpIsSupported(pane) {
  // Mirrors the server's own check: HL coins are bare tickers with no exchange
  // suffix and no slash. Wrong guesses are harmless — the endpoint answers 400
  // with the reason, which is surfaced in the overlay note.
  const s = (pane.symbol || '').toUpperCase();
  return !!s && !s.includes('.') && !s.includes(':') && !s.includes('/');
}

async function refreshDeltaProfile(pane) {
  if (!pane.indicators.has('deltaprofile') || !dpIsSupported(pane)) return;
  // Bin over the VISIBLE price range so the rows line up with what is on screen
  // rather than with the tape's own min/max, which drifts as prints arrive.
  let lo = null, hi = null;
  try {
    const H = pane.dpCanvas ? pane.dpCanvas.offsetHeight : 0;
    if (H > 0) {
      hi = pane.series.coordinateToPrice(0);
      lo = pane.series.coordinateToPrice(H);
    }
  } catch {}
  const q = new URLSearchParams({coin: pane.symbol, bins: String(DP_BINS)});
  if (lo != null && hi != null && hi > lo) { q.set('lo', lo); q.set('hi', hi); }
  try {
    const r = await fetch(`${SERVER}/api/delta_profile?${q}`);
    const d = await r.json();
    pane.dp = r.ok ? d : {error: d.error || `HTTP ${r.status}`};
  } catch (e) {
    pane.dp = {error: String(e && e.message || e)};
  }
  drawDeltaProfile(pane);
}

function drawDeltaProfile(pane) {
  if (!pane.indicators || !pane.indicators.has('deltaprofile')) return;
  const canvas = ensureDpCanvas(pane);
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const light = currentTheme === 'light';
  const note = (txt, tone) => {
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillStyle = tone || (light ? 'rgba(60,60,70,0.75)' : 'rgba(220,225,235,0.72)');
    ctx.fillText(txt, 10, 16);
  };

  if (!dpIsSupported(pane)) {
    note(`Delta Profile: no aggressor-side feed for ${pane.symbol} — Hyperliquid coins only`);
    return;
  }
  const d = pane.dp;
  if (!d) { note('Delta Profile: loading tape…'); return; }
  if (d.error) { note(`Delta Profile: ${d.error}`); return; }
  if (!d.bins || !d.bins.length || !d.n_trades) {
    note(d.note ? `Delta Profile: ${d.note}` : 'Delta Profile: tape is empty');
    return;
  }

  const maxVol = Math.max(...d.bins.map(b => b.buy + b.sell));
  if (!(maxVol > 0)) { note('Delta Profile: no prints in the visible range'); return; }
  const maxBarW = W * DP_WIDTH_FRAC;
  const yOf = pr => pane.series.priceToCoordinate(pr);
  const buyFill  = light ? 'rgba(20,140,70,0.55)'  : 'rgba(38,166,154,0.55)';
  const sellFill = light ? 'rgba(200,50,45,0.50)'  : 'rgba(239,83,80,0.50)';

  for (const b of d.bins) {
    const total = b.buy + b.sell;
    if (total <= 0) continue;
    const yTop = yOf(b.hi), yBot = yOf(b.lo);
    if (yTop == null || yBot == null) continue;
    const h = Math.max(1, Math.abs(yBot - yTop) - 1);
    const y = Math.min(yTop, yBot);
    const wTotal = (total / maxVol) * maxBarW;
    // Stacked from the left edge: sell first, then buy. Stacked rather than
    // diverging because at 16% of the plot a two-sided bar leaves each half too
    // short to read, and the split is the point.
    const wSell = wTotal * (b.sell / total);
    ctx.fillStyle = sellFill;
    ctx.fillRect(0, y, wSell, h);
    ctx.fillStyle = buyFill;
    ctx.fillRect(wSell, y, wTotal - wSell, h);
  }

  // Header: what this is, and how much of the window it actually covers. The
  // tape starts at server subscribe time, so "since" is load-bearing, not decor.
  const since = new Date(d.first_ts).toLocaleTimeString();
  const dTone = d.cum_delta >= 0 ? buyFill : sellFill;
  ctx.font = '600 11px ui-sans-serif, system-ui, sans-serif';
  ctx.fillStyle = dTone;
  ctx.fillText(`Δ ${d.cum_delta >= 0 ? '+' : ''}${d.cum_delta.toFixed(3)}`, 10, 16);
  ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
  ctx.fillStyle = light ? 'rgba(60,60,70,0.62)' : 'rgba(210,215,225,0.58)';
  ctx.fillText(`real taker side · ${d.n_trades} prints since ${since}` +
               (d.ring_full ? ' (ring full)' : ''), 10, 30);
}

function ensureSvpCanvas(pane) {
  if (!pane.svpCanvas) {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:8;width:100%;height:100%;';
    pane.el.querySelector('.chart-main').appendChild(c);
    pane.svpCanvas = c;
  }
  return pane.svpCanvas;
}

function clearSessionVP(pane) {
  if (pane.svpCanvas) {
    const ctx = pane.svpCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.svpCanvas.width, pane.svpCanvas.height);
  }
  if (pane.svp && pane.svp.infoEl) { try { pane.svp.infoEl.remove(); } catch {} }
  pane.svp = null;
}

function drawSessionVP(pane) {
  if (typeof SVP === 'undefined') { console.warn('session_volume_profile.js not loaded'); return; }
  if (!pane.bars || pane.bars.length < 20) return;
  const canvas = ensureSvpCanvas(pane);
  const {W, H} = sizeOverlay(canvas);
  if (!W || !H) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const r = SVP.analyze(pane.bars, pane.tf);
  if (!r) return;
  if (!pane.svp) pane.svp = {infoEl: null, collapsed: false};
  pane.svp.data = r;

  const ts = pane.chart.timeScale();
  const yOf = pr => pane.series.priceToCoordinate(pr);
  const xOf = t => { try { return ts.timeToCoordinate(t); } catch { return null; } };
  const light = (typeof currentTheme !== 'undefined') && currentTheme === 'light';
  const lastSess = r.sessions[r.sessions.length - 1];

  r.sessions.forEach(s => {
    let x0 = xOf(s.startTime), x1 = xOf(s.endTime);
    if (x0 == null && x1 == null) return;               // wholly off-screen
    if (x0 == null) x0 = 0;
    if (x1 == null) x1 = W;
    if (x1 <= x0) x1 = x0 + 2;
    const segW = x1 - x0;
    const maxBarW = Math.max(2, Math.min(segW * 0.92, segW - 1));
    const maxVol = Math.max.apply(null, s.bins) || 1;
    const col = SVP_COL[s.shape] || SVP_COL.D;
    const trapOn = r.trap && s === lastSess;

    s.bins.forEach((vol, i) => {
      if (vol <= 0) return;
      const yTop = yOf(s.binEdges[i + 1]), yBot = yOf(s.binEdges[i]);
      if (yTop == null || yBot == null) return;
      const rowH = Math.max(1, yBot - yTop - 1);
      const barW = Math.max(1, (vol / maxVol) * maxBarW);
      ctx.fillStyle = svpRgba(col, i === s.pocIdx ? 0.55 : 0.22);
      ctx.fillRect(x0, yTop, barW, rowH);
    });

    const yp = yOf(s.poc);                                // POC line across session
    if (yp != null) {
      ctx.strokeStyle = svpRgba(col, 0.9);
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(x0, yp); ctx.lineTo(x1, yp); ctx.stroke();
    }
    const yLbl = yOf(s.hi);                               // shape tag at session top
    if (yLbl != null) {
      ctx.fillStyle = col;
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.fillText(s.shape + (trapOn ? ' ⚠' : ''), x0 + 2, Math.max(10, yLbl - 2));
    }
    ctx.strokeStyle = light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke();
  });

  renderSVPInfo(pane, r);
}

function renderSVPInfo(pane, r) {
  const st = pane.svp;
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'svp-info';
    mountCard(pane, st.infoEl, 'corner');
    st.infoEl.addEventListener('click', ev => {
      if (ev.target.closest('.svp-q')) {           // ? toggles the plain-English guide
        st.helpOpen = !st.helpOpen;
        st.infoEl.classList.toggle('help-open', st.helpOpen);
        ev.stopPropagation();
        return;
      }
      if (!ev.target.closest('.svp-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
  }
  const c = r.card;
  // Thousands separators: these are price levels people read off a chart, and
  // "3935.56" is measurably harder to scan than "3,935.56".
  const f = v => Number.isFinite(v)
    ? v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '—';
  const shp = sh => `<span class="svp-${sh}">${sh}</span>`;
  const seq = (c.sequence || '').split(' ').filter(Boolean).map(shp).join(' ');
  const grainWord = {day: 'daily', week: 'weekly', month: 'monthly'}[c.grain] || '';
  const grainNoun = {day: 'day', week: 'week', month: 'month'}[c.grain] || 'session';

  // ── Plain-English layer ────────────────────────────────────────────────────
  // Translation lives HERE, in the renderer, not in the engine: the engine's factor
  // names and detail strings are also written into the backtest CSVs, so rewording
  // them would silently break comparability with the 2026-08-29 measurement.
  const PLAIN_NAME = {
    'D-anchor regime':      'Trend anchor',
    'VA re-entry':          'Back inside fair value',
    'VA breakout':          'Holding above fair value',
    'VA breakdown':         'Holding below fair value',
    'POC trap (support)':   'Buyers defending',
    'POC trap (resistance)':'Sellers capping',
    'exhaustion stack':     'Push running out of steam',
    'sequence tilt':        `Recent ${grainNoun}s lean`,
    'liquidity sweep':      'Stop-run then reversal',
    'POC cluster':          'Stacked levels (shelf)',
  };
  // De-jargon the engine's own detail string while KEEPING every number in it.
  const plainDetail = (s) => String(s || '')
    // The sequence factor's detail is "STATE: note", and the state's own plain
    // wording duplicates the note — so strip the prefix here, BEFORE the rules
    // below translate a bare state (used on its own in the header).
    .replace(/^(?:DISTRIBUTION→MARKDOWN|ACCUMULATION→MARKUP)\s*:\s*/i, '')
    // Group thousands in the embedded price levels so they match the lines above.
    // Guarded to 4+ integer digits with 2 decimals, so counts ("5 times") are safe.
    .replace(/\b(\d{4,})\.(\d{2})\b/g,
             (m, a, b) => Number(a).toLocaleString() + '.' + b)
    .replace(/(\d+)×\s*rejection of\s*[BPDI]-level\s*([\d.,]+)\s*held/i,
             'pushed back from $2 $1 times and held')
    .replace(/(\d+)×\s*rejection of\s*[BPDI]-level\s*([\d.,]+)\s*failed/i,
             'capped at $2 $1 times')
    .replace(/(\d+)\s*POCs stacked at/i, '$1 busy levels stacked at')
    .replace(/Direction-POC/gi, 'trend anchor')
    .replace(/composite VAL/gi, 'the fair-value floor')
    .replace(/composite VAH/gi, 'the fair-value ceiling')
    .replace(/\bVAL\b/g, 'fair-value floor').replace(/\bVAH\b/g, 'fair-value ceiling')
    .replace(/→\s*bull regime/i, '— up-regime').replace(/→\s*bear regime/i, '— down-regime')
    .replace(/→\s*reversal-UP/i, '— buyers in control')
    .replace(/→\s*reversal-DOWN/i, '— sellers in control')
    .replace(/→\s*support shelf below/i, '— a floor beneath price')
    .replace(/→\s*resistance shelf above/i, '— a ceiling above price')
    .replace(/→\s*acceptance higher/i, '— accepted at higher prices')
    .replace(/→\s*acceptance lower/i, '— accepted at lower prices')
    .replace(/→\s*acceptance/i, '— accepted back inside')
    .replace(/→\s*distribution/i, '— sellers took it back')
    .replace(/→\s*bull sweep/i, '— swept the low, then reclaimed it')
    .replace(/→\s*bear sweep/i, '— swept the high, then failed')
    .replace(/DISTRIBUTION→MARKDOWN/i, 'selling pressure building')
    .replace(/ACCUMULATION→MARKUP/i, 'buying pressure building')
    .replace(/→/g, '—');
  const cur = c.current;
  const adCol = /DISTRIB/.test(c.ad.state) ? '#f23645'
              : /ACCUM/.test(c.ad.state) ? '#26a69a' : 'var(--text-muted)';
  const trapLine = c.trap
    ? `<div style="color:#f23645;margin-top:3px;">⚠ ${c.trap.note}</div>` : '';
  const levels = (c.levels || []).map(l => `${shp(l.shape)} ${f(l.poc)}`).join(' · ');

  // ── Confluence signal block ──────────────────────────────────────────────────
  const sig = c.signal;
  let sigBadge = '', sigBody = '';
  if (sig && sig.dir) {
    // Deliberately MUTED, not colour-coded. It was measured (2026-08-29) to carry no
    // forward edge, so giving it the same visual weight as the structural facts —
    // green for BUY, red for SELL — would have the card shouting its weakest claim.
    // The word stays, because hiding a reading is not the same as qualifying it.
    const kindTxt = sig.kind ? ` · ${sig.kind}` : '';
    const conf = sig.confidence ? ` (${sig.confidence} conf)` : '';
    sigBadge = `<span style="color:var(--text-muted);font-weight:600;" ` +
               `title="Measured: no forward edge — see ?">${sig.dir}${kindTxt}${conf}</span>`;
    if (sig.dir !== 'NEUTRAL') {
      // "agree 40%" told nobody anything. Say what the number means.
      const agr = Math.round((sig.agreement || 0) * 100);
      const agrWord = agr >= 70 ? 'signals mostly agree'
                    : agr >= 45 ? 'signals partly disagree'
                                : 'signals conflict — weak, mixed structure';
      const bar = `<span style="color:#26a69a;">▲${f(sig.bullW)}</span> up vs ` +
                  `<span style="color:#f23645;">▼${f(sig.bearW)}</span> down · ` +
                  `<span class="svp-plain">${agr}% ${agrWord}</span>`;
      // These are STRUCTURE levels, not a forecast — say so in the label rather
      // than leaving "Target" to be read as a price prediction.
      const tgtParts = [];
      if (sig.target != null) tgtParts.push(`next structure level <b>${f(sig.target)}</b>`);
      else tgtParts.push(`no level ahead (price broke ${sig.dir === 'SELL' ? 'below' : 'above'} them all)`);
      if (sig.invalidation != null) tgtParts.push(`this read breaks if price passes <b>${f(sig.invalidation)}</b>`);
      const tgt = `<div>${tgtParts.join(' · ')}</div>`;
      const facs = (sig.factors || []).filter(x => x.dir)
        .map(x => {
          const label = PLAIN_NAME[x.name] || x.name;
          return `<div style="margin-left:8px;color:${x.dir>0?'#26a69a':'#f23645'};">` +
                 `${x.dir>0?'▲':'▼'} <b>${label}</b> ` +
                 `<span class="svp-tech">— ${plainDetail(x.detail)}</span></div>`;
        })
        .join('');
      sigBody = `<div style="margin-top:4px;border-top:1px solid var(--border,rgba(255,255,255,.08));padding-top:4px;">` +
        `<div style="color:var(--text-muted);">Confluence: ${bar}</div>` + tgt + facs + `</div>`;
    }
  }
  // Flag the agreement between the short- and long-run busiest price: when they sit
  // on top of each other that IS the structural read, and it was invisible before.
  const compAlign = (c.composite && cur && cur.poc > 0
                     && Math.abs(c.composite.poc - cur.poc) / cur.poc < 0.01)
    ? ` <span style="color:#26a69a;">— same as this ${grainNoun}'s, a level both agree on</span>` : '';
  const compLine = c.composite
    ? `<div>Longer-run busiest <b>${f(c.composite.poc)}</b> · fair value ` +
      `${f(c.composite.val)}–${f(c.composite.vah)}${compAlign}</div>` : '';

  st.infoEl.innerHTML =
    `<div class="svp-head">Session VP · ` +
      (sig && sig.dir ? sigBadge + ` · ` : '') +
      (cur ? `now ${shp(cur.shape)} <span style="color:var(--text-muted);font-weight:400;">(${cur.label})</span>` : '') +
      ` · <span style="color:${adCol};font-weight:700;">${plainDetail(c.ad.state)}</span> ` +
      `<span style="color:var(--text-muted);font-weight:400;">▾</span>` +
      `<span class="svp-q" title="What am I looking at?">?</span></div>` +
    `<div class="svp-body" style="margin-top:5px;">` +
      // Name the grain. "Session" means a different period per timeframe (a day
      // intraday, a week on 1d, a month on 1w — and a week on coarse intraday bars
      // where a day is too thin to profile), and reading the shape sequence without
      // knowing which is a silent misread.
      `<div>Sessions${grainWord ? ` <span style="color:var(--text-muted);font-weight:400;">(${grainWord})</span>` : ''}: ` +
        (seq ? `<span class="svp-seq">${seq}</span>`
             : `<span style="color:var(--text-muted);">${c.note || 'none computable'}</span>`) + `</div>` +
      (cur ? `<div>Busiest price <b>${f(cur.poc)}</b> · fair value ${f(cur.val)}–${f(cur.vah)}` +
             ` <span class="svp-tech">(this ${grainNoun})</span></div>` : '') +
      compLine +
      trapLine +
      (levels ? `<div style="margin-top:3px;">Key levels <span class="svp-tech">(newest first)</span>: ${levels}</div>` : '') +
      sigBody +
      // The caveat used to read "every weight is unbacktested". That is no longer
      // true — svp_backtest.py measured it on 2026-08-29 and it FAILED, so the card
      // now states the result instead of the absence of one. The structural read
      // (shapes, POC, value area) stands; the directional call does not.
      // One line by default. The evidence behind it is real and must stay reachable,
      // but a paragraph of statistics on a chart overlay is how a caveat gets skipped.
      `<div class="svp-cav">` +
        `<b>Read the structure, not the BUY/SELL word</b> — the direction call was ` +
        `measured and has no edge. Not advice.</div>` +

      `<div class="svp-help">` +
        `<div><b>What this is.</b> A map of where trading actually happened — where price ` +
        `is supported, where it is capped, and whether the market is trending or balanced. ` +
        `It describes structure; it does not predict.</div>` +
        `<div style="margin-top:4px;"><b>Busiest price (POC)</b> — the single price with the ` +
        `most trade. <b>Fair value</b> — the band holding most of the trade. Price leaving ` +
        `that band and staying out is the market repricing.</div>` +
        `<div style="margin-top:4px;"><b>${grainNoun[0].toUpperCase()+grainNoun.slice(1)} shapes</b> — ` +
        `${shp('D')} one-way move · ${shp('P')} buyers absorbing · ${shp('B')} sellers ` +
        `unloading · ${shp('I')} balanced. Read left→right, newest last.</div>` +
        `<div style="margin-top:4px;"><b>Stacked levels</b> — several ${grainNoun}s agreeing ` +
        `on a price build a shelf: a floor below, a ceiling above.</div>` +
        `<div style="margin-top:4px;"><b>Agreement %</b> — how much the individual reads point ` +
        `the same way. Low means conflicting evidence, so expect chop rather than follow-through.</div>` +
        `<div style="margin-top:4px;"><b>Levels, not forecasts</b> — the "next structure level" ` +
        `is where the map says price would next meet business, not where it will go.</div>` +
        `<div style="margin-top:5px;padding-top:4px;border-top:1px solid var(--border);">` +
        `<b>Why the direction word is greyed out.</b> Measured 2026-08-29 over 8 names and ` +
        `~19 years: BUY days did <b>worse</b> than an average day (−0.12 to −0.68pp) and SELL ` +
        `days did <b>better</b> — backwards, though not significantly (p=0.21). The confluence ` +
        `score carried no information either (corr with 20-day return = −0.04). The levels and ` +
        `shapes above are still worth reading; the arrow is not.</div>` +
      `</div>` +
    `</div>`;
  st.infoEl.classList.toggle('collapsed', st.collapsed);
  st.infoEl.style.display = 'block';
}

// ── Gann Square-of-9 S/R levels + honest break-odds card (see gann.js) ────────
// Draws ONLY the deterministic horizontal SO9 levels (not the scale-dependent
// fan). The card states the conditional break heuristic — "if R breaks up, this
// ── TPO / Market Profile overlay ────────────────────────────────────────────
const TPO_COLORS = {D: '#4c9aff', P: '#26a69a', B: '#f23645', I: '#b0b7c3'};

function ensureTpoCanvas(pane) {
  if (!pane.tpoCanvas) {
    const c = document.createElement('canvas');
    c.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:8;width:100%;height:100%;';
    pane.el.querySelector('.chart-main').appendChild(c);
    pane.tpoCanvas = c;
  }
  return pane.tpoCanvas;
}

function clearTPO(pane) {
  if (pane.tpoCanvas) {
    const ctx = pane.tpoCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.tpoCanvas.width, pane.tpoCanvas.height);
  }
  if (pane.tpo && pane.tpo.infoEl) { try { pane.tpo.infoEl.remove(); } catch {} }
  pane.tpo = null;
}

function drawTPO(pane) {
  if (typeof TPO === 'undefined') { console.warn('tpo.js not loaded'); return; }
  if (!pane.bars || pane.bars.length < 10) return;
  const canvas = ensureTpoCanvas(pane);
  const {W, H} = sizeOverlay(canvas);
  if (!W || !H) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const r = TPO.compute(pane.bars);
  if (!r || !r.sessions.length) return;
  if (!pane.tpo) pane.tpo = {infoEl: null, collapsed: false};
  pane.tpo.data = r;

  const ts = pane.chart.timeScale();
  const yOf = pr => pane.series.priceToCoordinate(pr);
  const xOf = t => { try { return ts.timeToCoordinate(t); } catch { return null; } };
  const light = (typeof currentTheme !== 'undefined') && currentTheme === 'light';

  r.sessions.forEach(s => {
    let x0 = xOf(s.startTime), x1 = xOf(s.endTime);
    if (x0 == null && x1 == null) return;
    if (x0 == null) x0 = 0;
    if (x1 == null) x1 = W;
    if (x1 <= x0) x1 = x0 + 2;
    const segW = x1 - x0;
    const col = TPO_COLORS[s.shape] || TPO_COLORS.D;

    // Draw TPO letters at each price row
    const maxTPO = s.pocMax || 1;
    const charW = Math.max(4, Math.min(8, segW / (maxTPO + 1)));
