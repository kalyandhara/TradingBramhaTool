    ctx.font = Math.max(6, Math.min(9, charW * 1.1)) + 'px monospace';
    ctx.textBaseline = 'middle';

    for (let row = 0; row < s.nRows; row++) {
      const letters = s.letters[row];
      if (!letters) continue;
      const price = s.priceLow + row * s.tickSize;
      const y = yOf(price);
      if (y == null) continue;

      const isPoc = row === s.pocRow;
      const inVA = price >= s.vaLow && price <= s.vaHigh;

      for (let ci = 0; ci < letters.length; ci++) {
        const lx = x0 + 2 + ci * charW;
        if (lx > x1 - 2) break;
        ctx.fillStyle = isPoc ? '#ff9800' : inVA ? col : (light ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)');
        ctx.fillText(letters[ci], lx, y);
      }
    }

    // POC line
    const yp = yOf(s.pocPrice);
    if (yp != null) {
      ctx.strokeStyle = '#ff9800';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(x0, yp); ctx.lineTo(x1, yp); ctx.stroke();
      ctx.setLineDash([]);
    }

    // VA boundaries
    const yVAH = yOf(s.vaHigh), yVAL = yOf(s.vaLow);
    if (yVAH != null && yVAL != null) {
      ctx.fillStyle = light ? 'rgba(255,152,0,0.06)' : 'rgba(255,152,0,0.04)';
      ctx.fillRect(x0, yVAH, segW, yVAL - yVAH);
    }

    // IB boundaries (dashed lines)
    if (s.ibHigh != null) {
      const yIBH = yOf(s.ibHigh), yIBL = yOf(s.ibLow);
      ctx.strokeStyle = light ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      if (yIBH != null) { ctx.beginPath(); ctx.moveTo(x0, yIBH); ctx.lineTo(x1, yIBH); ctx.stroke(); }
      if (yIBL != null) { ctx.beginPath(); ctx.moveTo(x0, yIBL); ctx.lineTo(x1, yIBL); ctx.stroke(); }
      ctx.setLineDash([]);
    }

    // Shape label at session top
    const yLbl = yOf(s.hi);
    if (yLbl != null) {
      ctx.fillStyle = col;
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.fillText(s.shape, x0 + 2, Math.max(10, yLbl - 2));
    }

    // Session divider
    ctx.strokeStyle = light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke();
  });

  renderTPOInfo(pane, r);
}

function renderTPOInfo(pane, r) {
  const st = pane.tpo;
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'tpo-info';
    mountCard(pane, st.infoEl, 'corner');
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.tpo-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
  }

  const s = r.state;
  const f = v => Number.isFinite(v)
    ? v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '—';
  const shapeCol = TPO_COLORS[s.shape] || TPO_COLORS.D;
  const pvpEmoji = {above_va: '🟢', below_va: '🔴', at_poc: '🟡', in_va: '⚪'}[s.priceVsPoc] || '⚪';
  const pvpLabel = {above_va: 'Above VA', below_va: 'Below VA', at_poc: 'At POC', in_va: 'In VA'}[s.priceVsPoc] || '';

  st.infoEl.innerHTML = `
    <div class="tpo-head">TPO · <span style="color:${shapeCol}">${s.shape}</span>-profile ${pvpEmoji} ${pvpLabel}</div>
    <div class="tpo-body">
      <div>POC: ${f(s.pocPrice)}</div>
      <div>VA: ${f(s.vaLow)} – ${f(s.vaHigh)}</div>
      ${s.ibHigh != null ? `<div>IB: ${f(s.ibLow)} – ${f(s.ibHigh)}</div>` : ''}
      <div>Single prints: ${s.nSinglePrints}</div>
      <div class="tpo-cav">Overlay only — no signal measured</div>
    </div>`;
}

// is the follow-through probability" — where the probability is THIS symbol's
// own historical breakout base rate, so the Gann framing cannot smuggle in
// confidence it has not earned.
const GANN_SUP = '#26a69a';
const GANN_RES = '#f23645';
const GANN_GOLD = '#d9b45b';

function ensureGannState(pane) {
  if (!pane.gann) pane.gann = {priceLines: [], infoEl: null, collapsed: false, lastKey: null};
  return pane.gann;
}

function clearGann(pane) {
  const st = pane.gann;
  if (!st) return;
  (st.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  st.priceLines = [];
  if (st.infoEl) { try { st.infoEl.remove(); } catch {} st.infoEl = null; }
  pane.gann = null;
}

function renderGann(pane) {
  if (typeof GANN === 'undefined') { console.warn('gann.js not loaded'); return; }
  if (!pane.bars || pane.bars.length < 40) return;
  const st = ensureGannState(pane);
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (st.lastKey === key && st.infoEl) return;      // no recompute thrash
  st.lastKey = key;

  const r = GANN.analyze(pane.bars);
  (st.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  st.priceLines = [];
  if (!r) return;

  const mk = (lv, color, style, title) => {
    if (!lv || !Number.isFinite(lv.price)) return;
    try {
      st.priceLines.push(pane.series.createPriceLine({
        price: lv.price, color, lineWidth: 1, lineStyle: style,
        axisLabelVisible: true, title,
      }));
    } catch {}
  };
  // Nearest S/R solid; the next levels beyond them dashed/faint context.
  mk(r.resistance, GANN_RES, 0, `R ${r.resistance ? r.resistance.deg + '°' : ''}`);
  mk(r.secondUp,   GANN_RES, 2, 'R2');
  mk(r.support,    GANN_SUP, 0, `S ${r.support ? r.support.deg + '°' : ''}`);
  mk(r.secondDown, GANN_SUP, 2, 'S2');

  renderGannInfo(pane, r);
}

function renderGannInfo(pane, r) {
  const st = ensureGannState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'gann-info';
    mountCard(pane, st.infoEl, 'corner');
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.gann-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
  }
  const f = v => Number.isFinite(v) ? v.toFixed(2) : '—';
  const pct = v => (v * 100).toFixed(0) + '%';
  const c = r.card;
  const basePct = pct(c.base);

  // Honest edge tag: only call a branch an "edge" if follow-through clears the
  // unconditional base rate by a margin; otherwise it is ordinary S/R.
  const edgeTag = (edge) => edge >= 0.05
    ? `<span style="color:${GANN_SUP}">+${(edge * 100).toFixed(0)}% vs base</span>`
    : `<span style="color:var(--text-muted)">≈ base (no edge)</span>`;

  // Plain-English "if X → then Y" scenarios with the level numbers inline.
  // The break branches carry the honest follow-through % + no-edge flag; the
  // bounce branches are the complementary path (no invented probability).
  const R = c.up, S = c.down;
  const lvl = v => `<b>${f(v)}</b>`;
  const sc = txt => `<div style="padding-left:12px;color:var(--text-chart);">↳ ${txt}</div>`;
  const contTag = b =>
    `<span style="color:var(--text-muted)">${pct(b.prob)} of past breaks continued ` +
    `(n=${b.n})</span> · ${edgeTag(b.edge)}`;

  const resBlock = R ? (
    `<div><span style="color:${GANN_RES}">▲ Resistance ${lvl(R.level)}</span> ` +
      `<span style="color:var(--text-muted)">(${R.deg}°)</span></div>` +
    sc(`If price is rejected here → pull back toward support ${S ? f(S.level) : '—'}.`) +
    sc(`If price breaks above ${f(R.level)} → upside continuation likely to next line ` +
       `${R.target ? lvl(R.target) : '(beyond range)'}. ${contTag(R)}`)
  ) : '';
  const supBlock = S ? (
    `<div><span style="color:${GANN_SUP}">▼ Support ${lvl(S.level)}</span> ` +
      `<span style="color:var(--text-muted)">(${S.deg}°)</span></div>` +
    sc(`If price bounces from ${f(S.level)} → trend resumes upward toward ` +
       `${R ? f(R.level) : '—'}.`) +
    sc(`If price breaks below ${f(S.level)} → deeper correction likely to next line ` +
       `${S.target ? lvl(S.target) : '(beyond range)'}. ${contTag(S)}`)
  ) : '';

  st.infoEl.innerHTML =
    `<div class="gann-head">` +
      `<span style="color:${GANN_GOLD}">Gann S/R · Break Odds</span> ` +
      `<span style="color:var(--text-muted);font-weight:400;">P ${f(c.price)} · base up ${basePct}</span> ` +
      `<span style="color:var(--text-muted);font-weight:400;">▾</span>` +
    `</div>` +
    `<div class="gann-body" style="margin-top:5px;line-height:1.7;">` +
      resBlock + supBlock +
      `<div class="gann-cav">Lines are deterministic Square-of-9 levels; the % is THIS ` +
        `symbol's historical breakout follow-through (n past breaks), not a Gann ` +
        `forecast. “No edge” = the break behaves like ordinary S/R. Not advice.</div>` +
    `</div>`;
  st.infoEl.classList.toggle('collapsed', st.collapsed);
  st.infoEl.style.display = 'block';
}

// ── Option OI walls + max pain overlay (B-28) ────────────────────────────────
// Backed by /api/option_levels (option_chain.read_levels). Draws the highest-OI
// call strikes as resistance, the highest-OI put strikes as support, and the
// max-pain strike as a magnet line.
//
// Price lines, not a canvas: these are horizontal PRICE levels, so
// createPriceLine lets Lightweight Charts own the anchoring and the axis label
// and there is no pan/zoom redraw to get wrong (the trap the user drawing layer
// had to solve).
//
// Two rules inherited from option_chain.py, and the overlay must not re-derive
// its own view of either:
//   1. Levels are PER EXPIRY. The card carries an expiry selector; without one a
//      weekly and a monthly chain merge into one meaningless picture.
//   2. Walls are side-correct — resistance at/above spot, support at/below. The
//      server already enforces it; this draws what it is given rather than
//      re-ranking the raw strike table.
//
// UNMEASURED. "Price gravitates to max pain" and "a wall rejects the first
// touch" are untested folk claims; the payload carries `unmeasured: true` and
// the card says so. This is levels-with-context, not a signal.
const OIW_RES  = '#f23645';   // call walls — resistance
const OIW_SUP  = '#26a69a';   // put walls  — support
const OIW_PAIN = '#7e57c2';   // max pain   — magnet

function ensureOiWallsState(pane) {
  if (!pane.oiw) {
    pane.oiw = {priceLines: [], infoEl: null, collapsed: false,
                lastKey: null, expiry: null, data: null, inflight: false};
  }
  return pane.oiw;
}

// ── Liquidity pools + sweep ─────────────────────────────────────────────────
// Backed by /api/liquidity, which calls scanner_templates.detect_liquidity_pools
// and detect_liquidity_sweep -- the SAME functions scan_liquidity_sweep fires on.
// Nothing is recomputed here, so the zones drawn and the scanner's hits cannot
// disagree; that drift is what B-24 was raised over.
//
// WHY THIS OVERLAY EARNS ITS PLACE: B-41m measured `Liquidity Sweep` at +0.51%
// @20d (p=0.005) NET of ~29bps -- the only scanner on this desk whose edge
// survives costs -- and it was the one SMC component with a measured edge and no
// way to see it on a chart. Drawing an already-measured detector makes no new
// claim, so no backtest is owed for the overlay itself.
//
// Drawn with createPriceLine + markers rather than a canvas, deliberately: a pool
// IS a horizontal level, and price lines cost nothing on pan/zoom and cannot
// repeat the 1x-into-2x snapshot bug that the canvas overlays needed sizeOverlay()
// to fix.
const LIQ_BUYSIDE  = '#ef5350';   // equal HIGHS  -- stops rest ABOVE (buy-side liquidity)
const LIQ_SELLSIDE = '#26a69a';   // equal LOWS   -- stops rest BELOW (sell-side)
const LIQ_SWEPT    = '#ff6d00';   // the level that was actually raided

function ensureLiqState(pane) {
  if (!pane.liq) pane.liq = {priceLines: [], lastFetchKey: null, inflight: false};
  return pane.liq;
}

function clearLiquidity(pane) {
  const st = pane.liq;
  if (!st) return;
  (st.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  st.priceLines = [];
  setPaneMarkers(pane, 'liq', null);
  pane.liq = null;
}

async function renderLiquidity(pane) {
  const st = ensureLiqState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (st.lastFetchKey === key && st.data) { drawLiquidity(pane); return; }
  if (st.inflight) return;

  st.inflight = true;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/liquidity?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    st.data = res.ok ? await res.json() : {pools: [], sweep: null};
    st.lastFetchKey = key;
  } catch (e) {
    console.warn('liquidity fetch failed:', e);
    st.data = {pools: [], sweep: null};
  } finally {
    st.inflight = false;
  }
  if (pane.indicators.has('liquidity')) drawLiquidity(pane);
}

function drawLiquidity(pane) {
  const st = pane.liq;
  if (!st || !st.data) return;
  (st.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  st.priceLines = [];

  const sweep = st.data.sweep || null;
  const pools = st.data.pools || [];

  pools.forEach(pool => {
    // The swept level is drawn in its own colour and solid: it is the one level
    // on the chart something already happened at, and it should not read as just
    // another resting pool.
    const isSwept = sweep && Math.abs(sweep.level - pool.level) < 1e-6;
    const color = isSwept ? LIQ_SWEPT
                : (pool.kind === 'high' ? LIQ_BUYSIDE : LIQ_SELLSIDE);
    // Touch count IS the strength of the pool -- more touches, more stops resting
    // there -- so it goes in the label rather than being encoded as opacity, which
    // would be unreadable against candles.
    const side = pool.kind === 'high' ? 'buy-side' : 'sell-side';
    try {
      st.priceLines.push(pane.series.createPriceLine({
        price: pool.level,
        color,
        lineWidth: isSwept ? 2 : 1,
        lineStyle: isSwept ? 0 : 2,           // solid when swept, dashed while resting
        axisLabelVisible: true,
        title: `${isSwept ? 'SWEPT ' : ''}${side} x${pool.touches}`,
      }));
    } catch {}
  });

  // The swept level MUST be drawn even when it is not in `pools`, and it often is
  // not: `detect_liquidity_pools` returns the strongest `max_pools` (6) levels,
  // while `detect_liquidity_sweep` searches its own `lookback`, so the raided pool
  // can legitimately fall outside the top six. Found in the browser -- RELIANCE
  // drew six lines and put the SWEEP arrow at 1279.45, a level with no line under
  // it. An arrow pointing at nothing is worse than no arrow.
  if (sweep && !pools.some(pl => Math.abs(sweep.level - pl.level) < 1e-6)) {
    try {
      st.priceLines.push(pane.series.createPriceLine({
        price: sweep.level,
        color: LIQ_SWEPT,
        lineWidth: 2,
        lineStyle: 0,
        axisLabelVisible: true,
        title: `SWEPT ${sweep.direction === 'bullish' ? 'sell-side' : 'buy-side'} x${sweep.touches || ''}`,
      }));
    } catch {}
  }

  if (sweep && sweep.time) {
    const bullish = sweep.direction === 'bullish';
    // A bullish sweep raids stops BELOW and reverses UP, so its marker belongs
    // under the bar pointing up. Naming the direction by what it does to PRICE,
    // not by which pool it took, is the reading error the detector's own
    // docstring warns about.
    // THE BUY SIGNAL. Drawn only when the SCANNER fires, which gates it on
    // freshness (max_bars_ago=3). An older sweep keeps its arrow as CONTEXT and
    // gets no plan: a signal is a claim about now, and the difference between
    // 'this happened' and 'act on this' is the whole point of the gate.
    //
    // There is deliberately NO SELL signal. The bearish sweep is a RISK read whose
    // B-41m arm never reached significance and which emits target=None, so a SELL
    // arrow would be a plan nobody measured. Asymmetric evidence, asymmetric UI.
    // The plan levels, with the MEASUREMENT attached to the stop's own label.
    // B-41m measured the SIGNAL at +0.51% @20d net; B-41p measured THIS plan at
    // +0.06R, and found the cause is that a stop exists at all rather than where
    // it sits. Drawing the stop without that on it would ship a plan the desk has
    // already measured to return nothing.
    if (st.data.plan && st.data.plan.stop != null && st.data.plan.target != null) {
      const pl = st.data.plan;
      try {
        st.priceLines.push(pane.series.createPriceLine({
          price: pl.stop, color: '#ef5350', lineWidth: 1, lineStyle: 2,
          axisLabelVisible: true, title: 'stop · B-41p: this plan returns +0.06R',
        }));
        st.priceLines.push(pane.series.createPriceLine({
          price: pl.target, color: '#26a69a', lineWidth: 1, lineStyle: 2,
          axisLabelVisible: true, title: 'target',
        }));
      } catch {}
    }
    const firedNow = !!(st.data.plan && bullish);
    setPaneMarkers(pane, 'liq', [{
      time: sweep.time,
      position: bullish ? 'belowBar' : 'aboveBar',
      color: bullish ? LIQ_SELLSIDE : LIQ_BUYSIDE,
      shape: bullish ? 'arrowUp' : 'arrowDown',
      text: (firedNow && bullish ? 'BUY · ' : '')
            + `SWEEP ${sweep.level} · wick ${Math.round((sweep.wick_ratio || 0) * 100)}%`,
    }]);
  } else {
    setPaneMarkers(pane, 'liq', null);
  }
}

function clearOiWalls(pane) {
  const st = pane.oiw;
  if (!st) return;
  (st.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  st.priceLines = [];
  if (st.infoEl) { try { st.infoEl.remove(); } catch {} st.infoEl = null; }
  pane.oiw = null;
}

async function renderOiWalls(pane) {
  const st = ensureOiWallsState(pane);
  // Options are an underlying-level fact: the same chain regardless of the
  // chart timeframe, so tf is deliberately NOT part of the cache key.
  const key = `${pane.symbol}:${st.expiry || 'near'}`;
  if (st.lastKey === key && st.data) { drawOiWalls(pane); return; }
  if (st.inflight) return;

  st.inflight = true;
  let payload = null;
  try {
    const url = `${SERVER}/api/option_levels?symbol=${encodeURIComponent(pane.symbol)}`
              + (st.expiry ? `&expiry=${encodeURIComponent(st.expiry)}` : '')
              + '&walls=3';
    const res = await fetch(url);
    if (res.ok) payload = await res.json();
  } catch (e) { console.warn('option_levels fetch failed:', e); }
  st.inflight = false;

  // The user may have switched the indicator off or changed symbol mid-flight.
  if (!pane.indicators.has('oiwalls')) return;
  if (pane.symbol !== key.split(':')[0]) return;

  st.lastKey = key;
  st.data = payload ? payload.levels : null;
  drawOiWalls(pane);
}

function drawOiWalls(pane) {
  const st = ensureOiWallsState(pane);
  (st.priceLines || []).forEach(pl => { try { pane.series.removePriceLine(pl); } catch {} });
  st.priceLines = [];

  const r = st.data;
  if (!r) { renderOiWallsInfo(pane, null); return; }

  const mk = (price, color, style, width, title) => {
    if (!Number.isFinite(price)) return;
    try {
      st.priceLines.push(pane.series.createPriceLine({
        price, color, lineWidth: width, lineStyle: style,
        axisLabelVisible: true, title,
      }));
    } catch {}
  };

  // Rank drives line weight, so the heaviest wall reads as the heaviest line
  // without needing the numbers. Server returns strongest-first.
  (r.resistance || []).forEach((w, i) => {
    mk(w.strike, OIW_RES, i === 0 ? 0 : 2, i === 0 ? 2 : 1,
       `CE wall ${i === 0 ? '' : (i + 1)}`.trim());
  });
  (r.support || []).forEach((w, i) => {
    mk(w.strike, OIW_SUP, i === 0 ? 0 : 2, i === 0 ? 2 : 1,
       `PE wall ${i === 0 ? '' : (i + 1)}`.trim());
  });
  // Max pain is a magnet, not a barrier — dashed so it never reads as S/R.
  if (r.max_pain != null) mk(r.max_pain, OIW_PAIN, 1, 2, 'Max pain');

  renderOiWallsInfo(pane, r);
}

function renderOiWallsInfo(pane, r) {
  const st = ensureOiWallsState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'oiw-info';
    mountCard(pane, st.infoEl, 'corner');
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.oiw-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
    // Expiry switch — refetch that chain rather than re-slicing the old one,
    // since max pain is only defined against a single settlement.
    st.infoEl.addEventListener('change', ev => {
      const sel = ev.target.closest('.oiw-exp');
      if (!sel) return;
      st.expiry = sel.value || null;
      st.lastKey = null;
      renderOiWalls(pane);
    });
  }

  if (!r) {
    st.infoEl.innerHTML =
      `<div class="oiw-head"><span style="color:${OIW_PAIN}">Option OI Walls</span> ` +
      `<span style="color:var(--text-muted);font-weight:400;">no F&O chain for ` +
      `${pane.symbol}</span></div>`;
    st.infoEl.style.display = 'block';
    return;
  }

  const f = v => Number.isFinite(v)
    ? v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '—';
  const oiFmt = v => Number.isFinite(v)
    ? (v >= 1e7 ? (v / 1e7).toFixed(2) + ' Cr' : v >= 1e5 ? (v / 1e5).toFixed(2) + ' L'
       : v.toLocaleString()) : '—';
  const dist = w => (w.dist_pct == null ? '' :
    ` <span class="oiw-oi">${w.dist_pct >= 0 ? '+' : ''}${w.dist_pct.toFixed(2)}%</span>`);

  const expOpts = (r.expiries || []).map(e =>
    `<option value="${e}"${e === r.expiry ? ' selected' : ''}>${e}</option>`).join('');

  const row = (w, color, tag) =>
    `<div class="oiw-row"><span style="color:${color}">${tag} <b>${f(w.strike)}</b>${dist(w)}</span>` +
    `<span class="oiw-oi">${oiFmt(w.oi)}</span></div>`;

  const mpLine = r.max_pain == null
    ? `<div class="oiw-oi">Max pain n/a (pooled expiry)</div>`
    : `<div><span style="color:${OIW_PAIN}">◆ Max pain <b>${f(r.max_pain)}</b></span>` +
      (r.max_pain_dist_pct == null ? '' :
        ` <span class="oiw-oi">${r.max_pain_dist_pct >= 0 ? '+' : ''}` +
        `${r.max_pain_dist_pct.toFixed(2)}% from spot</span>`) + `</div>`;

  st.infoEl.innerHTML =
    `<div class="oiw-head">` +
      `<span style="color:${OIW_PAIN}">Option OI Walls · Max Pain</span> ` +
      `<span class="oiw-oi" style="font-weight:400;">${r.class} · spot ${f(r.spot)}` +
      (r.pcr_oi != null ? ` · PCR ${r.pcr_oi.toFixed(2)}` : '') + `</span> ` +
      `<span class="oiw-oi" style="font-weight:400;">▾</span>` +
    `</div>` +
    `<div class="oiw-body" style="margin-top:5px;">` +
      `<div class="oiw-oi" style="margin-bottom:3px;">Expiry` +
        `<select class="oiw-exp">${expOpts}</select>` +
        (r.trade_date ? ` <span class="oiw-oi">· session ${r.trade_date}</span>` : '') +
      `</div>` +
      (r.resistance || []).map(w => row(w, OIW_RES, '▲')).join('') +
      mpLine +
      (r.support || []).map(w => row(w, OIW_SUP, '▼')).join('') +
      `<div class="oiw-cav">Where option OI sits, from the EOD F&O bhavcopy — ` +
        `call writers above, put writers below, max pain the settlement that pays ` +
        `holders least. <b>Unmeasured:</b> "price gravitates to max pain" and "a ` +
        `wall rejects the first touch" are untested here. Levels for context, not ` +
        `a signal. Not advice.</div>` +
    `</div>`;
  st.infoEl.classList.toggle('collapsed', st.collapsed);
  st.infoEl.style.display = 'block';
}

// ── Harmonic pattern overlay (Gartley/Bat/Butterfly/Crab) ─────────────────────
// Backed by /api/harmonic (harmonic_patterns.detect_last_pattern). Draws the
// X-A-B-C-D zigzag as one line series, the X→D diagonal as a dashed line, five
// pivot labels via setPaneMarkers, and price lines for entry/stop/T1/T2.
const HARMONIC_COLORS = {
  bullish: '#26c6da',
  bearish: '#ff5252',
};

function ensureHmState(pane) {
  if (!pane.hm) {
    pane.hm = {zigzag: null, diagonal: null, priceLines: [], lastFetchKey: null};
  }
  return pane.hm;
}

function clearHarmonic(pane) {
  if (!pane.hm) return;
  ['zigzag', 'diagonal'].forEach(k => {
    if (pane.hm[k]) {
      try { pane.chart.removeSeries(pane.hm[k]); } catch {}
      pane.hm[k] = null;
    }
  });
  (pane.hm.priceLines || []).forEach(pl => {
    try { pane.series.removePriceLine(pl); } catch {}
  });
  pane.hm.priceLines = [];
  setPaneMarkers(pane, 'harmonic', null);
  pane.hm.lastFetchKey = null;
}

async function renderHarmonic(pane) {
  const hm = ensureHmState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (hm.lastFetchKey === key) return;
  hm.lastFetchKey = key;

  let g = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/harmonic?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) g = (await res.json()).harmonic || null;
  } catch (e) { console.warn('harmonic fetch failed:', e); }

  if (!pane.indicators.has('harmonic')) return;
  const stillCurrentKey = paneFetchKey(pane);
  if (stillCurrentKey !== key) return;

  // Tear down previous overlay first — otherwise stale price lines pile up on
  // each re-render when the pattern (or its D-pivot) shifts.
  ['zigzag', 'diagonal'].forEach(k => {
    if (hm[k]) { try { pane.chart.removeSeries(hm[k]); } catch {}; hm[k] = null; }
  });
  (hm.priceLines || []).forEach(pl => {
    try { pane.series.removePriceLine(pl); } catch {}
  });
  hm.priceLines = [];

  if (!g || !g.points) { setPaneMarkers(pane, 'harmonic', null); return; }
  const pts = ['X','A','B','C','D'].map(k => g.points[k]).filter(p => p && p.time != null);
  if (pts.length !== 5) { setPaneMarkers(pane, 'harmonic', null); return; }

  const color = HARMONIC_COLORS[g.direction] || '#ba68c8';

  hm.zigzag = pane.chart.addLineSeries({
    color, lineWidth: 2, lineStyle: 0,
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => null,
  });
  hm.zigzag.setData(pts.map(p => ({time: p.time, value: p.price})));

  hm.diagonal = pane.chart.addLineSeries({
    color, lineWidth: 1, lineStyle: 2,  // dashed X→D
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    autoscaleInfoProvider: () => null,
  });
  hm.diagonal.setData([
    {time: pts[0].time, value: pts[0].price},
    {time: pts[4].time, value: pts[4].price},
  ]);

  // Pivot labels — X/A/B/C/D above highs, below lows, matching direction.
  // Bullish LHLHL: X(L) A(H) B(L) C(H) D(L); bearish inverted.
  const bull = g.direction === 'bullish';
  const kinds = bull ? ['L','H','L','H','L'] : ['H','L','H','L','H'];
  const labels = ['X','A','B','C','D'];
  const markers = pts.map((p, i) => ({
    time: p.time,
    position: kinds[i] === 'H' ? 'aboveBar' : 'belowBar',
    color,
    shape: kinds[i] === 'H' ? 'arrowDown' : 'arrowUp',
    text: labels[i],
  }));
  setPaneMarkers(pane, 'harmonic', markers);

  // Entry / stop / targets — priced against the D pivot.
  const t = g.trade || {};
  const mk = (price, label, col, style) => {
    if (price == null) return;
    const pl = pane.series.createPriceLine({
      price, color: col, lineWidth: 1, lineStyle: style,
      axisLabelVisible: true, title: label,
    });
    hm.priceLines.push(pl);
  };
  mk(t.entry,       `H:${g.pattern} entry`, color,     0);
  mk(t.stop,        'H:stop',               '#f23645', 2);
  if (t.targets && t.targets.length) {
    mk(t.targets[0], 'H:T1 (0.382 AD)',     '#26a69a', 2);
    mk(t.targets[1], 'H:T2 (0.618 AD)',     '#26a69a', 2);
  }
}

// ── Price Projection overlay (Milestone 3) ────────────────────────────────────
// Backed by /api/projection (projection.py). Draws a dashed forward slope from
// the last bar's close to a projected target price, a right-edge price+% label,
// and a bottom-right info panel carrying the confidence band + reasoning +
// invalidation. The projection is DETERMINISTIC (Elliott Wave Fib targets + VCP/
// Rounding/Harmonic measured-moves), and the server suppresses anything below
// Medium confidence — so when this draws nothing, that IS the signal.
function ensureProjState(pane) {
  if (!pane.proj) pane.proj = {infoEl: null, data: null, lastFetchKey: null,
                               collapsed: loadProjCollapsed()};
  return pane.proj;
}

function clearProjection(pane) {
  if (!pane.proj) return;
  if (pane.projCanvas) {
    const ctx = pane.projCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.projCanvas.width, pane.projCanvas.height);
  }
  if (pane.proj.infoEl) pane.proj.infoEl.style.display = 'none';
  pane.proj.data = null;
  pane.proj.lastFetchKey = null;
}

async function renderProjection(pane) {
  const pr = ensureProjState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (pr.lastFetchKey === key) return;
  pr.lastFetchKey = key;

  let p = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/projection?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) p = (await res.json()).projection || null;
  } catch (e) { console.warn('projection fetch failed:', e); }

  if (!pane.indicators.has('projection')) return;
  const stillCurrentKey = paneFetchKey(pane);
  if (stillCurrentKey !== key) return;

  pr.data = p;
  drawProjection(pane);
  renderProjInfo(pane, p);
}

function drawProjection(pane) {
  const canvas = pane.projCanvas;
  if (!canvas) return;
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const p = pane.proj && pane.proj.data;
  if (!p || !pane.indicators.has('projection')) return;

  const ts = pane.chart.timeScale();
  const anchorX = ts.timeToCoordinate(p.anchor_time);
  const y0 = pane.series.priceToCoordinate(p.current_price);
  const y1 = pane.series.priceToCoordinate(p.projected_price);
  if (anchorX === null || y0 === null || y1 === null) return;

  // Forward horizon in pixels: bar spacing × indicative horizon, clamped so the
  // slope stays on-screen. The line conveys direction + magnitude, not a date.
  const prevBar = pane.bars.length > 1 ? pane.bars[pane.bars.length - 2] : null;
  const xPrev = prevBar ? ts.timeToCoordinate(prevBar.time) : null;
  const spacing = (xPrev !== null && anchorX !== null) ? Math.abs(anchorX - xPrev) : 6;
  let horizonPx = spacing * (p.horizon_bars || 20);
  horizonPx = Math.max(50, Math.min(horizonPx, 220));
  const x1 = anchorX + horizonPx;

  const up = p.direction === 'up';
  const col = up ? '#26a69a' : '#ef5350';

  // Dashed projection slope.
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.8;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(anchorX, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  ctx.setLineDash([]);

  // Anchor dot + target dot.
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(anchorX, y0, 2.5, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(x1, y1, 3, 0, 2 * Math.PI); ctx.fill();

  // Right-edge label: projected price + % move, stacked. Clamped inside canvas.
  const l1 = `₹${p.projected_price.toFixed(2)}`;
  const l2 = `${p.pct_move >= 0 ? '+' : ''}${p.pct_move.toFixed(1)}%`;
  ctx.font = 'bold 11px -apple-system, "Segoe UI", sans-serif';
  const boxW = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) + 12;
  const boxH = 30;
  let lx = x1 + 6;
  if (lx + boxW > W) lx = Math.max(0, x1 - boxW - 6);
  let ly = y1 - boxH / 2;
  ly = Math.max(2, Math.min(ly, H - boxH - 2));
  ctx.fillStyle = up ? 'rgba(38,166,154,0.16)' : 'rgba(239,83,80,0.16)';
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(lx, ly, boxW, boxH, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col;
  ctx.textBaseline = 'middle';
  ctx.fillText(l1, lx + 6, ly + 9);
  ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(l2, lx + 6, ly + 22);
  ctx.restore();
}

function renderProjInfo(pane, p) {
  const pr = ensureProjState(pane);
  if (!pr.infoEl) {
    pr.infoEl = document.createElement('div');
    pr.infoEl.className = 'proj-info';
    mountCard(pane, pr.infoEl, 'stack');
    // Head-click collapses, same as the other action-stack cards. The state is
    // per-pane (an open pane keeps whatever you set it to) but the choice is
    // saved, so reloads and newly-added panes open the way you left it.
    pr.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.proj-head')) return;
      pr.collapsed = !pr.collapsed;
      pr.infoEl.classList.toggle('collapsed', pr.collapsed);
      saveProjCollapsed(pr.collapsed);
    });
  }
  if (!p) { pr.infoEl.style.display = 'none'; return; }

  const bandColor = p.band === 'High' ? '#3fb950' : '#f0883e';
  const moveColor = p.direction === 'up' ? '#26a69a' : '#ef5350';
  const sign = p.pct_move >= 0 ? '+' : '';
  const confluence = p.confluence_count > 1
    ? `<span style="color:#3fb950"> · ${p.confluence_count} methods agree</span>` : '';
  const inval = (p.invalidation != null)
    ? `<br><span style="color:var(--text-muted)">Invalidation (stop): ₹${p.invalidation.toFixed(2)}</span>` : '';
  const atrDist = (p.target_atr != null)
    ? `<br><span style="color:${p.target_atr > 5 ? '#ef5350' : p.target_atr > 3 ? '#f0883e' : 'var(--text-chart)'}">` +
      `Target distance: ${p.target_atr.toFixed(1)}× ATR</span>` : '';

  pr.infoEl.innerHTML =
    `<div class="proj-head" style="margin-bottom:3px;" title="Click to collapse / expand">` +
      `<span class="proj-badge" style="background:${bandColor}">${p.band} confidence</span> ` +
      `<b style="color:${moveColor}">₹${p.projected_price.toFixed(2)} (${sign}${p.pct_move.toFixed(1)}%)</b> ` +
      `<span style="color:var(--text-muted)">▾</span>` +
    `</div>` +
    `<div class="proj-body">` +
      `<span style="color:var(--text-muted)">via</span> ${p.source} · conf ${p.confidence}%${confluence}` +
      `<hr>` +
      `<div style="color:var(--text-chart)">${p.reasoning}</div>` +
      inval +
      atrDist +
      (p.nearby_levels && p.nearby_levels.length
        ? `<hr><div style="font-size:10px;color:var(--text-muted)">` +
          `<b>Levels in the way</b> (nearest to target first):<br>` +
          p.nearby_levels.map(l =>
            `<span style="color:${Math.abs(l.dist_pct) < 1 ? '#ef5350' : 'var(--text-chart)'}">` +
            `₹${l.price.toFixed(2)} — ${l.source} (${l.dist_pct > 0 ? '+' : ''}${l.dist_pct.toFixed(1)}% from target)</span>`
          ).join('<br>') +
          `</div>`
        : `<hr><div style="font-size:10px;color:var(--text-muted)">No structural level between price and target — open air.</div>`) +
      `<hr>` +
      `<div class="proj-disclaimer">Indicative model projection from Elliott Wave + pattern ` +
      `measured-moves — not investment advice. Verify against your own analysis.</div>` +
    `</div>`;
  pr.infoEl.classList.toggle('collapsed', pr.collapsed);
  pr.infoEl.style.display = 'block';
}

// ── Fibonacci grid + trade plan overlay ───────────────────────────────────────
// All computation lives in fibonacci.js (FIB.*); this draws it. Levels are
// auto-anchored to the last zigzag swing (EW.computeZigzag) and scored against
// the Volume Profile (VP.findConfluence) plus the server's Price Projection.
//
// The drawing encodes confluence, so the chart says what the numbers say:
//   • a level with no independent backing is a faint hairline;
//   • a level that coincides with a volume node is solid and labelled with it;
//   • entry / stop / target are the only heavy lines, and they are drawn ONLY
//     when the plan is actionable — a plan blocked by direction conflict, weak
//     reward-to-risk, or a missed entry shows its levels and states why, rather
//     than drawing tradeable-looking lines that the rules rejected.

const FIB_COLORS = {
  grid:    'rgba(201,162,39,0.35)',   // unconfirmed level — deliberately faint
  gridHit: 'rgba(201,162,39,0.95)',   // level backed by a volume node
  golden:  'rgba(201,162,39,0.75)',   // 0.5 / 0.618 pocket
  entry:   '#4c9aff',
  stop:    '#ef5350',
  target:  '#26a69a',
  swing:   'rgba(201,162,39,0.55)',
  // 113% overshoot: past the leg origin the setup is WRONG, not cheap. Drawing
  // it in the grid's gold would put an invalidation level in the same visual
  // language as the entry rungs, which is the overtrust this module exists to
  // avoid. Muted red says "this is the stop side" without shouting.
  overshoot: 'rgba(239,83,80,0.45)',
};

function ensureFibState(pane) {
  if (!pane.fib) pane.fib = {infoEl: null, data: null, lastKey: null, collapsed: false};
  return pane.fib;
}

function clearFibonacci(pane) {
  if (!pane.fib) return;
  if (pane.fibCanvas) {
    const ctx = pane.fibCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.fibCanvas.width, pane.fibCanvas.height);
  }
  if (pane.fib.infoEl) pane.fib.infoEl.style.display = 'none';
  pane.fib.data = null;
  pane.fib.lastKey = null;
}

/**
 * Recompute the grid + plan for the current bars.
 *
 * The Volume Profile is computed here rather than reused from pane.vp, so the
 * plan does not silently change depending on whether the user happens to have
 * the volprofile indicator switched on. Confluence must mean the same thing
 * either way.
 *
 * The projection is fetched independently for the same reason. When the
 * projection indicator is already on, pane.proj.data is used directly to avoid
 * a duplicate request.
 */
async function renderFibonacci(pane) {
  const st = ensureFibState(pane);
  if (!pane.bars || pane.bars.length < 20) return;
  if (!window.FIB) { console.warn('fibonacci.js not loaded'); return; }

  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (st.lastKey === key) return;
  st.lastKey = key;

  // Projection: reuse if the projection overlay already fetched it, else fetch.
  let p = (pane.proj && pane.proj.data) || null;
  if (!p) {
    try {
      const barCount = TF_BARS[pane.tf] || 300;
      const url = `${SERVER}/api/projection?symbol=${encodeURIComponent(pane.symbol)}` +
                  `&timeframe=${pane.tf}&bars=${barCount}`;
      const res = await fetch(url);
      if (res.ok) p = (await res.json()).projection || null;
    } catch (e) { console.warn('fib: projection fetch failed:', e); }
  }

  // Bail if the user switched the indicator off or changed symbol mid-flight.
  if (!pane.indicators.has('fib')) return;
  const stillCurrent = paneFetchKey(pane);
  if (stillCurrent !== key) return;

  // Shares VP_OPTS (value-area / node thresholds) with the drawn profile, but
  // deliberately NOT its window or bin count: the drawn profile follows the
  // viewport, and a trade plan that changes because you zoomed is worse than
  // one computed over a fixed window. This stays on every loaded bar, binned at
  // the module default (30) — unchanged from before the profile started
  // tracking the viewport. Consequence to keep in mind: a fib level flagged
  // "VP-confluent" is scored against the full-history POC, which is not
  // necessarily the POC currently on screen.
  const profile = window.VP ? VP.computeProfile(pane.bars, VP_OPTS) : null;
  st.data = FIB.analyze(pane.bars, {
    profile, projection: p, lastClose: lastBar.close,
  });

  drawFibonacci(pane);
  renderFibInfo(pane, st.data);
}

function drawFibonacci(pane) {
  const canvas = pane.fibCanvas;
  if (!canvas) return;
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const d = pane.fib && pane.fib.data;
  if (!d || !d.swing || !pane.indicators.has('fib')) return;

  const ts = pane.chart.timeScale();
  const xStart = ts.timeToCoordinate(d.swing.startTime);
  // Levels are only meaningful from the swing onward, but the swing may be
  // scrolled off the left edge — clamp rather than skip drawing entirely.
  const x0 = (xStart === null) ? 0 : Math.max(0, xStart);

  ctx.save();
  ctx.textBaseline = 'middle';

  // ── Fibonacci grid ─────────────────────────────────────────────────────────
  d.levels.forEach(l => {
    const y = pane.series.priceToCoordinate(l.price);
    if (y === null || y < 0 || y > H) return;
    const hit = l.score > 0;

    const over = l.kind === 'overshoot';
    ctx.strokeStyle = over ? FIB_COLORS.overshoot
                           : (hit ? FIB_COLORS.gridHit
                                  : (l.golden ? FIB_COLORS.golden : FIB_COLORS.grid));
    ctx.lineWidth = hit ? 1.4 : 1;
    ctx.setLineDash(hit ? [] : [3, 3]);
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Label: ratio, price, and — when present — what agreed with it.
    const zones = hit ? ` · ${[...new Set(l.matches.map(m => m.type))].join('/')}` : '';
    const txt = `${l.label}  ${l.price.toFixed(2)}${zones}`;
    ctx.font = hit ? 'bold 9.5px -apple-system, "Segoe UI", sans-serif'
                   : '9.5px -apple-system, "Segoe UI", sans-serif';
    ctx.fillStyle = over ? FIB_COLORS.overshoot
                         : (hit ? FIB_COLORS.gridHit : FIB_COLORS.grid);
    ctx.fillText(txt, x0 + 4, y - 6);
  });

  // ── Trade-plan lines ───────────────────────────────────────────────────────
  // Drawn only when the rules actually cleared. A blocked plan is explained in
  // the info panel instead — drawing heavy entry/stop/target lines for a setup
  // the rules rejected is exactly the overtrust this is meant to avoid.
  const plan = d.plan;
  if (plan && plan.actionable) {
    const rows = [
      {price: plan.entry,  color: FIB_COLORS.entry,  label: `ENTRY ${plan.entry.toFixed(2)}`},
      {price: plan.stop,   color: FIB_COLORS.stop,   label: `STOP ${plan.stop.toFixed(2)}`},
      {price: plan.target, color: FIB_COLORS.target, label: `TARGET ${plan.target.toFixed(2)}`},
    ];
    rows.forEach(r => {
      if (r.price == null) return;
      const y = pane.series.priceToCoordinate(r.price);
      if (y === null || y < 0 || y > H) return;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(W, y);
      ctx.stroke();

      ctx.font = 'bold 10px -apple-system, "Segoe UI", sans-serif';
      const tw = ctx.measureText(r.label).width + 10;
      const bx = Math.max(0, W - tw - 4);
      ctx.fillStyle = r.color;
      ctx.beginPath(); ctx.roundRect(bx, y - 8, tw, 16, 3); ctx.fill();
      ctx.fillStyle = '#0d1117';
      ctx.fillText(r.label, bx + 5, y);
    });
  }

  ctx.restore();
}

function renderFibInfo(pane, d) {
  const st = ensureFibState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'fib-info';
    mountCard(pane, st.infoEl, 'stack');
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.fib-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
  }
  const el = st.infoEl;
  if (!d || !d.swing) { el.style.display = 'none'; return; }

  const plan = d.plan;
  const badge = plan && plan.actionable
    ? `<span class="fib-badge" style="background:#3fb950">PLAN</span>`
    : `<span class="fib-badge" style="background:#8b949e">LEVELS ONLY</span>`;
  const dirTxt = plan ? plan.direction.toUpperCase() : '—';
  // Only warn when the extreme is genuinely fresh. EW's trailing pivot is
  // provisional on every chart, so warning on that would fire always and
  // train the eye to ignore it.
  const prov = d.swing.forming
    ? ` <span style="color:#f0883e">· extreme ${d.swing.barsSinceExtreme}b old, unconfirmed</span>` : '';

  let body = `<div class="fib-why">Swing ${d.swing.low.toFixed(2)} → ${d.swing.high.toFixed(2)} ` +
             `(${d.swing.direction})${prov}</div><hr>`;

  if (plan && plan.actionable) {
    body +=
      `<div class="fib-row"><span>Entry (${plan.entryLabel})</span><span style="color:${FIB_COLORS.entry}">${plan.entry.toFixed(2)}</span></div>` +
      `<div class="fib-row"><span>Stop</span><span style="color:${FIB_COLORS.stop}">${plan.stop.toFixed(2)}</span></div>` +
      `<div class="fib-row"><span>Target</span><span style="color:${FIB_COLORS.target}">${plan.target.toFixed(2)}</span></div>` +
      `<div class="fib-row"><span>Reward : risk</span><span>${plan.rr.toFixed(2)} : 1</span></div><hr>` +
      `<div class="fib-why">Stop from ${plan.stopSource}.</div>` +
      `<div class="fib-why">Target from ${plan.targetSource}.</div>`;
  } else if (plan) {
    body += `<div class="fib-why">No entry proposed. The grid is drawn; ` +
            `the rules that would make it tradeable did not clear:</div>`;
    plan.blockers.forEach(b => { body += `<div class="fib-block">• ${b}</div>`; });
  }

  if (plan && plan.reasons.length) {
    body += `<hr>`;
    plan.reasons.forEach(r => { body += `<div class="fib-why">• ${r}</div>`; });
  }

  body += `<hr><div class="proj-disclaimer">Rule-based level arithmetic from swing ` +
          `Fibonacci, Volume Profile and the price projection — not investment advice.</div>`;

  el.innerHTML =
    `<div class="fib-head">${badge} Fibonacci ${dirTxt} <span style="color:var(--text-muted)">▾</span></div>` +
    `<div class="fib-body">${body}</div>`;
  el.classList.toggle('collapsed', st.collapsed);
  el.style.display = 'block';
}

// ── Reversal Calendar overlay ─────────────────────────────────────────────────
// Backed by /api/reversal_events (which reads tools/reversal_calendar.db).
// One marker per event, with a short glyph that fits in the marker bubble.
// When ≥2 events fall on the same calendar day (coincidence ≥ 2), the marker
// goes brighter & bigger and the tooltip lists all of them — per the user's
// spec that overlapping muhurtas trigger a sharper reversal.

const REVERSAL_GLYPHS = {
  indra:           'I',  ravi:        'R',  sarvarthasiddhi: 'SS',
  amritsiddhi:     'AS', dwipushkar:  'DP', tripushkar:      'TP',
  ravipushya:      'RP', gurupushya:  'GP', maitreya:        'M',
  full_moon:       'F',  new_moon:    'N',
};
const REVERSAL_COLORS = {
  // single-event marker — muted gold
  single: '#bf8f00',
  // coincidence ≥ 2 — bright gold (matches POC line)
  coincident: '#ffd60a',
};

function ensureRevState(pane) {
  if (!pane.rev) {
    pane.rev = {
      lastFetchKey: null,   // skip re-fetch when bar window hasn't moved much
      eventsByDate: null,
    };
  }
  return pane.rev;
}

function clearReversalCalendar(pane) {
  if (!pane.rev) return;
  setPaneMarkers(pane, 'reversal', null);
  pane.rev.lastFetchKey = null;
  pane.rev.eventsByDate = null;
}

function _isoDateUTC(unixSec) {
  // The server stores event_date in IST. Bar timestamps from yfinance for
  // Indian symbols are at IST midnight (00:00 IST = 18:30 UTC prev day),
  // so use the UTC date of the bar to match against event_date. This is
  // good enough for daily bars; intraday bars also match via the first bar
  // of their date.
  return new Date(unixSec * 1000).toISOString().slice(0, 10);
}

async function renderReversalCalendar(pane) {
  const rev = ensureRevState(pane);
  const bars = pane.bars;
  if (!bars || bars.length < 2) return;

  const first = bars[0].time, last = bars[bars.length - 1].time;
  const from = _isoDateUTC(first);
  const to   = _isoDateUTC(last + 86400); // +1 day for inclusivity
  const key  = `${from}:${to}`;

  if (rev.lastFetchKey !== key || !rev.eventsByDate) {
    try {
      const r = await fetch(`${SERVER}/api/reversal_events?from=${from}&to=${to}`);
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();

      // Group by event_date so coincidences become one marker with a combined
      // label (matches reversal_calendar.coincidence_scores() server-side).
      const grouped = {};
      (data.events || []).forEach(ev => {
        (grouped[ev.event_date] = grouped[ev.event_date] || []).push(ev);
      });
      rev.eventsByDate = grouped;
      rev.lastFetchKey = key;
    } catch (e) {
      console.warn('reversal_events fetch failed:', e);
      setPaneMarkers(pane, 'reversal', null);
      return;
    }
  }

  // Map each event date to the bar.time of the *first* bar on that date —
  // markers are anchored to bar timestamps, not arbitrary times, so this
  // ensures every marker actually sits on a candle.
  const firstBarOfDate = {};
  bars.forEach(b => {
    const d = _isoDateUTC(b.time);
    if (firstBarOfDate[d] === undefined) firstBarOfDate[d] = b.time;
  });

  const markers = [];
  Object.entries(rev.eventsByDate).forEach(([d, evs]) => {
    const t = firstBarOfDate[d];
    if (t === undefined) return; // event not in the visible bar range
    const coincident = evs.length >= 2;
    const labels = evs.map(e => REVERSAL_GLYPHS[e.event_type] || e.event_type[0].toUpperCase());
    const titles = evs.map(e => e.display_name).join(' + ');
    markers.push({
      time: t,
      position: 'belowBar',
      color: coincident ? REVERSAL_COLORS.coincident : REVERSAL_COLORS.single,
      shape: coincident ? 'arrowUp' : 'circle',
      size: coincident ? 1.4 : 0.8,
      text: labels.join('+'),
      // Lightweight Charts doesn't natively render marker tooltips, but the
      // browser will pick up the underlying SVG <title> if we encode it in
      // the text — keep the visible glyphs short and put the human-readable
      // names in a separate per-pane info panel below.
    });
  });

  setPaneMarkers(pane, 'reversal', markers);

  // Update a small info panel listing today's + tomorrow's events so users
  // see *what* the markers represent without hovering.
  renderReversalInfo(pane, rev.eventsByDate);
}

function renderReversalInfo(pane, eventsByDate) {
  let el = pane.el.querySelector('.rev-info');
  if (!el) {
    el = document.createElement('div');
    el.className = 'rev-info';
    mountCard(pane, el, 'corner');
  }
  const today = new Date().toISOString().slice(0, 10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const items = [];
  [today, tomorrow].forEach(d => {
    if (eventsByDate[d]) {
      const labels = eventsByDate[d].map(e => e.display_name).join(' + ');
      items.push(`<b>${d === today ? 'Today' : 'Tomorrow'}:</b> ${labels}`);
    }
  });
  if (!items.length) { el.style.display = 'none'; return; }
  el.innerHTML = '<b style="color:#ffd60a">★ Reversal Calendar</b><br>' + items.join('<br>');
  el.style.display = 'block';
}

// ── RS vs Benchmark (async fetch) ─────────────────────────────────────────────
async function fetchRsData(pane, bars) {
  const sym = pane.symbol;
  const ref = (sym.endsWith('.NS') || sym.endsWith('.BO')) ? '^NSEI' : 'BTC';
  try {
    const r = await fetch(`${SERVER}/api/ohlcv?symbol=${encodeURIComponent(ref)}&timeframe=${pane.tf}&bars=${TF_BARS[pane.tf] || 300}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const refBars = d.bars || [];
    if (!refBars.length || !pane.subCharts.rs) return;
    const refMap = new Map(refBars.map(b => [b.time, b.close]));
    // Build RS on the FULL main-bar grid — one point per main bar, never a subset.
    //
    // The old form was `bars.filter(b => refMap.has(b.time))`, which silently
    // dropped every bar the benchmark did not also print. That is not rare:
    // measured 2026-08-05, RELIANCE.NS / TCS.NS / JAYNECOIND.NS each returned 300
    // daily bars against ^NSEI's 300 with only **296 timestamps in common**, so RS
    // was a 296-point series living inside a 300-bar window.
    //
    // That matters because syncSubPaneRanges pins panes by LOGICAL range (bar
    // index) and relies on "logical index i is the same bar in every pane". A
    // short series breaks it. Padding with whitespace {time} does NOT repair it —
    // this build of lightweight-charts DISCARDS whitespace points (verified: 2600
    // in, 2591 stored), so the grid stays short. Only real values on every bar fix
    // the index mapping.
    //
    // On a bar the benchmark did not print we carry its LAST KNOWN close forward:
    // the index did not move that day, so the ratio legitimately does not change.
    // That is a carried value, not an invented one — no direction is fabricated.
    let lastRef = null;
    const rows = [];
    for (const b of bars) {
      const rv = refMap.get(b.time);
      if (rv !== undefined && rv > 0) lastRef = rv;
      rows.push({time: b.time, close: b.close, ref: lastRef});
    }
    // Leading bars before the benchmark's first print have nothing to carry
    // forward, so they borrow its first close — the alternative is a short series,
    // which is the bug this is fixing.
    const firstRef = rows.find(r => r.ref !== null)?.ref;
    if (!firstRef) return;
    for (const r of rows) if (r.ref === null) r.ref = firstRef;

    const pairs = rows.map(r => ({time: r.time, value: r.close / r.ref}));
    if (!pairs.length) return;
    const base = pairs[0].value;
    const rsData = pairs.map(p => ({time: p.time, value: (p.value / base) * 100}));
    if (pane.subCharts.rs && pane.subCharts.rs.series) {
      pane.subCharts.rs.series.setData(padToBars(rsData, bars));
      pane.subCharts.rs.label.textContent = `RS vs ${ref}`;
      syncSubPaneRanges(pane);   // async arrival — re-pin to the main's window
    }
  } catch(e) {
    console.warn('RS fetch failed:', e);
  }
}

// ── Data loader ───────────────────────────────────────────────────────────────
async function loadData(idx) {
  const p = panes[idx];
  if (!p) return;

  const loader = p.el.querySelector('.loading-msg');
  if (loader) { loader.textContent = 'Loading…'; loader.style.display = 'flex'; }

  let ok = false;
  const reqSym = p.symbol;
  const reqTf  = p.tf;
  try {
    const barCount = TF_BARS[p.tf] || 300;
    const url = `${SERVER}/api/ohlcv?symbol=${encodeURIComponent(p.symbol)}&timeframe=${p.tf}&bars=${barCount}`;
    const res  = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const bars = data.bars || [];

    // Race guard: if the pane switched symbols/tf while we were fetching,
    // drop this response — otherwise a slow first-load (e.g. saved ADON.BO)
    // can clobber a URL-param navigation to a different ticker.
    if (p.symbol !== reqSym || p.tf !== reqTf) {
      return;
    }

    if (bars.length) {
      // Server resolves bare/typed tickers to their canonical fetch symbol
      // (e.g. 'IFCI' -> 'IFCI.NS'). Sync the resolved value back into pane
      // state so the WebSocket subscription key matches what the server
      // broadcasts ticks under — without this, typing a bare NSE ticker
      // would load candles but never get live updates.
      if (data.symbol && data.symbol !== p.symbol) {
        p.symbol = data.symbol;
        p.badge.textContent = data.symbol;
        const bare = data.symbol.replace(/\.(NS|BO|BSE)$/i, '');
        const sfx = (data.symbol.match(/\.(NS|BO|BSE)$/i) || [''])[0].toUpperCase();
        const wantExch = sfx === '.NS' ? 'NSE' : (sfx === '.BO' || sfx === '.BSE') ? 'BSE' : null;
        fetchSymbolMatches(bare).then(results => {
          const cEl = p.el.querySelector('.sym-company');
          const eEl = p.el.querySelector('.sym-exch-badge');
          let match = results.find(r => r.symbol.toUpperCase() === data.symbol.toUpperCase());
          if (!match && wantExch) {
            match = results.find(r => r.exchange === wantExch && r.display.toUpperCase() === bare.toUpperCase());
          }
          if (!match && !wantExch) {
            match = results.find(r => r.display.toUpperCase() === bare.toUpperCase()) || results[0];
          }
          if (match && cEl) {
            cEl.textContent = match.name;
            cEl.title = match.name;
            if (p.badge) {
              p.badge.textContent = match.name;
              p.badge.title = `${p.symbol} — ${match.name}`;
            }
            eEl.textContent = match.exchange;
            eEl.className = `sym-exch-badge ${match.exchange}`;
          } else if (wantExch && eEl) {
            if (cEl) cEl.textContent = '';
            eEl.textContent = wantExch;
            eEl.className = `sym-exch-badge ${wantExch}`;
          }
        });
        savePaneCfg();
      }
      p.bars = bars;
      applyPriceStyle(p);   // feeds raw bars or their Heikin-Ashi transform per p.chartType
      // Per-symbol external research links (covers the initial load and reloads;
      // p.symbol is canonical after the reconciliation block above).
      {
        const qbare = p.symbol.replace(/\.(NS|BO|BSE)$/i, '');
        const qsfx  = (p.symbol.match(/\.(NS|BO|BSE)$/i) || [''])[0].toUpperCase();
        renderQuickLinks(p.el, qbare,
          qsfx === '.NS' ? 'NSE' : (qsfx === '.BO' || qsfx === '.BSE') ? 'BSE' : null);
      }
      applyRangeView(p);
      // Sanity check: if the range didn't take (which happens when the pane
      // container was 0×0 at chart construction and its logical extent hasn't
      // been re-measured yet), fall back to fitContent — the ResizeObserver
      // will re-apply the preset range once real dimensions land.
      requestAnimationFrame(() => {
        try {
          const r = p.chart.timeScale().getVisibleRange();
          if (!r || r.from == null || r.to == null || r.from === r.to) {
            p.chart.timeScale().fitContent();
          }
        } catch {}
      });
      applyIndicators(p);
      if (p.indicators.has('volprofile')) drawVolumeProfile(p);
      if (p.indicators.has('svp')) drawSessionVP(p);
      if (p.indicators.has('tpo')) drawTPO(p);
      if (p.indicators.has('deltaprofile')) drawDeltaProfile(p);
      if (p.indicators.has('fvg')) drawFVG(p);
      const last = bars[bars.length - 1];
      p.openPrice = bars[0].open;
      p.prevClose = (typeof data.prev_close === 'number') ? data.prev_close : null;
      p.dataSource = data.source || null;
      // The server may rescue an unusable BSE line by swapping to NSE (or vice
      // versa). That is usually what you want, but silently answering about a
      // different exchange is not — surface it.
      if (data.exchange_fallback) showToast(`⚠ ${data.exchange_fallback}`, 4500);
      updateTicker(idx, last.close, false);
      ok = true;
    } else if (loader) {
      loader.textContent = `⚠ ${p.symbol} — no data`;
      loader.style.display = 'flex';
    }
  } catch(e) {
    console.warn(`load failed [${p.symbol}]:`, e);
    if (loader) {
      loader.textContent = `⚠ ${p.symbol} — load failed`;
      // Force visible: previous successful loads hide the loader, and if
      // this failure hits on a symbol switch the message would otherwise be
      // written to a hidden element (silent blank chart).
      loader.style.display = 'flex';
    }
  }

  // Only hide the loader on a successful fetch — the failure paths above
  // set their own visible error text and leave it shown, so the user sees
  // *why* the chart is blank instead of looking at it forever.
  if (loader && ok) {
    loader.style.display = 'none';
    // Record this successful chart load in history
    if (p && p.recordChartState) p.recordChartState();
  }

  if (wsReady) wsSubscribe(idx);
}

// ── Ticker update ─────────────────────────────────────────────────────────────
function updateTicker(idx, price, flash = true) {
  const p = panes[idx];
  if (!p) return;

  const prev = p.lastPrice;
  const up   = prev === null || price >= prev;
  p.lastPrice = price;

  p.priceEl.textContent = fmtPrice(price);
  p.priceEl.className   = `price-el ${up ? 'up' : 'down'}`;

  // "Today's" change, Google-Finance-style: vs. previous daily close when
  // the server was able to resolve one (prev_close on /api/ohlcv). Falls
  // back to change-vs-first-loaded-bar only if prev_close is unavailable
  // (e.g. a brand-new listing with <2 daily candles) — better to show a
  // number with a caveat than nothing.
  const basis = p.prevClose !== null ? p.prevClose : p.openPrice;
  if (basis !== null && basis !== 0) {
    const diff = price - basis;
    const chgPct = (diff / basis) * 100;
    const up2 = chgPct >= 0;
    p.chgEl.innerHTML = `<span class="chg-arrow">${up2 ? '▲' : '▼'}</span>` +
                        `<span>${fmtChg(chgPct)}</span>` +
                        `<span>${fmtAbsChange(diff, p.symbol, p.dataSource)}</span>`;
    p.chgEl.className = `chg-el ${up2 ? 'up' : 'down'}`;
    p.chgEl.title = p.prevClose !== null
      ? 'Change vs previous close'
      : 'Change vs first loaded bar (previous close unavailable)';
  }

  if (flash && prev !== null) {
    const cls = up ? 'flash-g' : 'flash-r';
    p.priceEl.classList.remove('flash-g', 'flash-r');
    void p.priceEl.offsetWidth;   // force reflow to restart animation
    p.priceEl.classList.add(cls);
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
function setWsStatus(state) {
  const el = document.getElementById('ws-indicator');
  const map = {
    live:  ['⬤ Live',        'ws-live'],
    off:   ['⬤ Offline',     'ws-off'],
    retry: ['⬤ Reconnecting','ws-retry'],
  };
  const [txt, cls] = map[state] || map.off;
  el.textContent = txt;
  el.className   = cls;
}

function connectWS() {
  clearTimeout(retryTimer);
  if (socket) { try { socket.close(); } catch {} }
  setWsStatus('retry');

  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    wsReady = true;
    retryDelay = 2000;
    setWsStatus('live');
    panes.forEach((_, i) => wsSubscribe(i));
  };

  socket.onmessage = evt => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'ping') return;
      if (msg.type === 'candle') onCandleMsg(msg);
    } catch {}
  };

  socket.onclose = () => {
    wsReady = false;
    setWsStatus('off');
    retryTimer = setTimeout(() => {
      retryDelay = Math.min(retryDelay * 1.5, 30000);
      connectWS();
    }, retryDelay);
  };

  socket.onerror = () => socket.close();
}

// REST fallback for the ticker. /api/tick returns the same live price the WS
// feed carries, so when the socket is down (server restart, proxy idle-timeout,
// the reconnect backoff climbing to 30s) the header price keeps moving instead
// of freezing at the last loaded bar. Deliberately price-only: the candle
// series is left alone until the socket returns and resumes sending bars.
const TICK_FALLBACK_MS = 15000;
setInterval(async () => {
  if (wsReady || !panes.length) return;
  for (let i = 0; i < panes.length; i++) {
    const p = panes[i];
    if (!p || !p.symbol) continue;
    try {
      const r = await fetch(`${SERVER}/api/tick?symbol=${encodeURIComponent(p.symbol)}`);
      if (!r.ok) continue;
      const d = await r.json();
      if (typeof d.price === 'number') updateTicker(i, d.price, true);
    } catch {}
  }
}, TICK_FALLBACK_MS);

function wsSubscribe(idx) {
  const p = panes[idx];
  if (!p || !wsReady) return;
  socket.send(JSON.stringify({action:'subscribe', symbol:p.symbol, timeframe:p.tf}));
}

function onCandleMsg(msg) {
  panes.forEach((p, i) => {
    if (p.symbol !== msg.symbol) return;
    // Filter by timeframe too — otherwise a 1d tick lands on a 4h/1w pane and
    // series.update() writes a phantom bar off the pane's time grid, showing
    // up as a "mirrored duplicate" candle floating near current price.
    if (msg.timeframe && msg.timeframe !== p.tf) return;
    const bar = msg.bar;
    // Update the raw bar store first so indicators + any HA recompute see it.
    let barsChanged = false;
    if (p.bars && p.bars.length) {
      const lastBar = p.bars[p.bars.length - 1];
      if (lastBar.time === bar.time) p.bars[p.bars.length - 1] = bar;
      else                           p.bars.push(bar);
      barsChanged = true;
    }
    // In Heikin-Ashi mode a raw series.update() would break the HA chain (each HA
    // bar depends on the prior HA open/close), so recompute the HA series from the
    // raw bars. Candles mode does the cheap in-place update.
    if (p.chartType === 'heikin') applyPriceStyle(p);
    else                          p.series.update(bar);
    updateTicker(i, bar.close, true);
    if (barsChanged && p.indicators.size) applyIndicators(p);
  });
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
const cntSel = document.getElementById('cnt-sel');
const saved  = loadCount();
cntSel.value = String(saved);

cntSel.addEventListener('change', () => {
  const n = parseInt(cntSel.value);
  saveCount(n);
  buildGrid(n);
  if (wsReady) panes.forEach((_, i) => wsSubscribe(i));
});

// ── Theme radio buttons ────────────────────────────────────────────────────────
(function () {
  // Restore saved theme before first grid build so charts use correct colors
  if (currentTheme === 'light') document.documentElement.classList.add('light');
  document.querySelectorAll('input[name="theme"]').forEach(r => {
    if (r.value === currentTheme) r.checked = true;
    r.addEventListener('change', () => applyTheme(r.value));
  });
})();

// ── URL param: ?symbol=RELIANCE.NS&tf=1d  ─────────────────────────────────
// Opening the chart from an external grid injects these params so pane 0
// auto-loads the requested ticker without any manual typing. This MUST run
// BEFORE buildGrid() — earlier versions applied the URL symbol after grid
// build via a 50 ms setTimeout, which raced with the initial loadData(0)
// call started by buildGrid on the LAST-SAVED symbol. When the URL symbol
// changed between openings, the previous symbol's slower fetch would land
// after the URL-triggered fetch and overwrite the correct chart.
(function () {
  const params = new URLSearchParams(window.location.search);
  const rawSym = params.get('symbol') || params.get('s');
  const tf     = params.get('tf') || params.get('timeframe');
  const exch   = (params.get('exchange') || params.get('exch') || '').toUpperCase();
  if (!rawSym) return;
  let sym = rawSym.trim().toUpperCase();
  const hasSuffix = /\.(NS|BO|BSE)$/i.test(sym);
  if (!hasSuffix && exch === 'BSE') sym += '.BO';
  else if (!hasSuffix && exch === 'NSE') sym += '.NS';
  const display = sym.replace(/\.(NS|BO|BSE)$/i, '');
  // Override pane 0 in the persisted pane config so buildGrid picks up
  // the URL symbol on its first pass — no race, no double-fetch. Write
  // localStorage directly since savePaneCfg() derives its dict from the
  // live panes[] array (which doesn't exist yet at this point).
  const cfg = loadPaneCfg();
  cfg[0] = Object.assign({}, cfg[0] || {}, {symbol: sym});
  if (tf) cfg[0].tf = tf;
  // ?compare=A,B,C fills panes 2.. in order; ?charts=N sets the pane count.
  const compare = (params.get('compare') || '').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
  compare.slice(0, 7).forEach((s, k) => {
    cfg[k + 1] = Object.assign({}, cfg[k + 1] || {}, {symbol: s});
    if (tf) cfg[k + 1].tf = tf;
  });
  localStorage.setItem(LS_PANES, JSON.stringify(cfg));
  const n = parseInt(params.get('charts') || '', 10);
  if (n >= 1 && n <= 8) { saveCount(n); cntSel.value = String(n); }
  document.title = `${display} — Trading Bramha`;
})();

buildGrid(parseInt(cntSel.value, 10) || saved);
connectWS();
</script>
</body>
</html>
