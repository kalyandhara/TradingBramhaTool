  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (st.lastFetchKey !== key) {
    st.lastFetchKey = key;
    try {
      const barCount = TF_BARS[pane.tf] || 300;
      const url = `${SERVER}/api/order_blocks?symbol=${encodeURIComponent(pane.symbol)}` +
                  `&timeframe=${pane.tf}&bars=${barCount}`;
      const res = await fetch(url);
      const data = res.ok ? await res.json() : {};
      st.zones = data.order_blocks || [];
      st.retests = data.retests || [];
    } catch (e) { console.warn('order_blocks fetch failed:', e); st.zones = []; st.retests = []; }
  }
  // Guard against a stale response landing after toggle-off / symbol switch.
  if (!pane.indicators.has('orderblock')) return;
  if (paneFetchKey(pane) !== key) return;
  drawOrderBlocks(pane);
  // Zones just landed — refresh %R confluence so exhaustion arrows sitting in a
  // zone upgrade to their ▲ OB / ▼ OB confluence marker.
  if (pane.indicators.has('prte')) renderPrteOverlay(pane);
}

function drawOrderBlocks(pane) {
  const canvas = pane.obCanvas;
  const st = pane.ob;
  if (!canvas || !st || !st.zones) return;
  const {W, H} = sizeOverlay(canvas);
  if (!W || !H) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (!st.zones.length) return;

  const ts = pane.chart.timeScale();
  const lastBarTime = pane.bars[pane.bars.length - 1].time;

  st.zones.forEach(z => {
    const xL = ts.timeToCoordinate(z.start_time);
    if (xL === null) return;
    let xR = ts.timeToCoordinate(z.end_time);
    if (xR === null) xR = ts.timeToCoordinate(lastBarTime);
    const yTop = pane.series.priceToCoordinate(z.high);
    const yBot = pane.series.priceToCoordinate(z.low);
    if (xR === null || yTop === null || yBot === null) return;

    const x = Math.max(0, xL);
    const w = Math.min(W, xR) - x;
    if (w <= 0) return;
    const y = Math.min(yTop, yBot);
    const h = Math.max(1, Math.abs(yBot - yTop));

    const bull = z.dir === 'bull';
    // BigBeluga-style: cyan (#00ffcc) = bullish, magenta (#ff007f) = bearish
    const rgb = bull ? '0,255,204' : '255,0,127';
    const fillA   = {fresh: 0.15, mitigated: 0.07, violated: 0.035}[z.state] ?? 0.10;
    const strokeA = {fresh: 0.70, mitigated: 0.35, violated: 0.18}[z.state] ?? 0.4;

    // Buy/Sell volume split — draw two sub-zones like the Pine indicator
    const buyPct  = (z.buy_pct  ?? 50) / 100;
    const sellPct = 1 - buyPct;
    const splitY  = y + h * sellPct;  // sell zone on top, buy zone on bottom

    // Top sub-zone (sell side)
    const topH = splitY - y;
    if (topH > 0) {
      ctx.fillStyle = `rgba(${rgb},${bull ? fillA * 0.7 : fillA})`;
      ctx.fillRect(x, y, w, topH);
    }
    // Bottom sub-zone (buy side)
    const botH = h - topH;
    if (botH > 0) {
      ctx.fillStyle = `rgba(${rgb},${bull ? fillA : fillA * 0.7})`;
      ctx.fillRect(x, splitY, w, botH);
    }

    // Border around the full zone
    ctx.strokeStyle = `rgba(${rgb},${strokeA})`;
    ctx.lineWidth = 1;
    ctx.setLineDash(z.state === 'violated' ? [2, 3] : []);
    ctx.strokeRect(x, y, w, h);
    // Split line
    if (h >= 6 && z.state !== 'violated') {
      ctx.strokeStyle = `rgba(${rgb},${strokeA * 0.5})`;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x, splitY); ctx.lineTo(x + w, splitY); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Labels: Buy%/Sell% + structure signal
    if (h >= 18 && w >= 40 && z.state !== 'violated') {
      const fresh = z.state === 'fresh';
      const txtA = fresh ? 0.92 : 0.55;
      ctx.font = 'bold 9px system-ui, sans-serif';
      // Sell % in top sub-zone
      if (topH >= 10) {
        ctx.fillStyle = `rgba(224,224,224,${txtA})`;
        ctx.textAlign = 'right';
        ctx.fillText(`Sell ${z.sell_pct ?? 50}%`, x + w - 4, y + 10);
      }
      // Buy % in bottom sub-zone
      if (botH >= 10) {
        ctx.fillStyle = `rgba(224,224,224,${txtA})`;
        ctx.textAlign = 'right';
        ctx.fillText(`Buy ${z.buy_pct ?? 50}%`, x + w - 4, splitY + 10);
      }
      // Structure label (BOS/CHOCH) on the left
      ctx.textAlign = 'left';
      const sigLabel = (bull ? 'Demand' : 'Supply') + ' ' + z.signal + (fresh ? ' ●' : '');
      ctx.fillStyle = `rgba(${rgb},${fresh ? 0.95 : 0.6})`;
      ctx.fillText(sigLabel, x + 3, y + 9);
    }
    ctx.textAlign = 'left';

    // ── Trade plan: stop-loss + take-profit rails ──────────────────────────
    // Only fresh zones carry rails — a mitigated zone has already been used, and
    // striping every historical box would bury the price action. Server sends
    // entry/stop/target only when the plan clears 1R, so absence = no plan.
    if (z.state === 'fresh' && z.target != null && z.stop != null) {
      const yTgt  = pane.series.priceToCoordinate(z.target);
      const yStop = pane.series.priceToCoordinate(z.stop);
      const xEnd  = Math.min(W, xR);
      if (yTgt !== null && yStop !== null) {
        ctx.save();
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 4]);
        ctx.font = 'bold 9px system-ui, sans-serif';
        ctx.textAlign = 'left';
        // No R:R on the label: the target is a flat 2R since the ladder was
        // measured away (2026-09-13), so the ratio is a constant and printing it
        // every time would dress a definition up as a finding.
        [[yTgt, '#26a69a', `TP ${z.target}`],
         [yStop, '#ef5350', `SL ${z.stop}`]].forEach(([yy, col, tag]) => {
          ctx.strokeStyle = col;
          ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(xEnd, yy); ctx.stroke();
          ctx.fillStyle = col;
          ctx.fillText(tag, x + 3, yy - 3);
        });
        ctx.restore();
        ctx.textAlign = 'left';
      }
    }
  });

  // ── Retest markers ────────────────────────────────────────────────────
  // Two shapes, because they are two different entries (see detect_order_blocks):
  //   confirmed → solid ✕ (Pine's shape.cross) — price has left the zone.
  //   early     → hollow diamond — the wick rejection AT the zone, earlier and
  //               looser, so it must not read as the same signal at a glance.
  if (st.retests && st.retests.length) {
    st.retests.forEach(rt => {
      const xPos = ts.timeToCoordinate(rt.time);
      if (xPos === null) return;
      const bull = rt.dir === 'bull';
      const yAnchor = pane.series.priceToCoordinate(rt.price);
      if (yAnchor === null) return;
      const early = rt.kind === 'early';
      const yOff = bull ? 12 : -12;  // below bar for bull, above for bear
      const cx = xPos, cy = yAnchor + yOff;
      const col = bull ? '0,255,204' : '255,0,127';
      const sz = 5;

      ctx.strokeStyle = `rgba(${col},${early ? 0.75 : 0.9})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (early) {
        ctx.moveTo(cx, cy - sz); ctx.lineTo(cx + sz, cy);
        ctx.lineTo(cx, cy + sz); ctx.lineTo(cx - sz, cy);
        ctx.closePath();
      } else {
        ctx.moveTo(cx - sz, cy - sz); ctx.lineTo(cx + sz, cy + sz);
        ctx.moveTo(cx + sz, cy - sz); ctx.lineTo(cx - sz, cy + sz);
      }
      ctx.stroke();

      // Small label
      ctx.font = 'bold 8px system-ui, sans-serif';
      ctx.fillStyle = `rgba(${col},${early ? 0.7 : 0.85})`;
      ctx.textAlign = 'center';
      const pct = bull ? rt.buy_pct : rt.sell_pct;
      const pctLabel = (early ? 'rej ' : '') + (bull ? 'B' : 'S') + (pct ?? '') + '%';
      ctx.fillText(pctLabel, cx, cy + (bull ? 14 : -8));
      ctx.textAlign = 'left';
    });
  }

}

// ── Trend-strength gauge — RETIRED 2026-09-13 ─────────────────────────────────
// The .ob-info card tallied live zones per side, weighted fresh ones double, and
// printed a direction ("BULLISH 3×") on the SMC claim that stacked same-direction
// zones confirm a stronger institutional lean.
//
// It was measured and it pointed the WRONG WAY. Over LIQUID_50 / 1500d, raw 20d
// forward return was +0.70% after a bullish lean and +2.19% after a bearish one,
// against a +0.958% baseline — so both sides lost to their direction-matched
// benchmark (-0.26pp and -1.23pp gross; -0.26pp and -1.84pp net, i.e. costs make
// the bearish side WORSE). Clustered by SYMBOL rather than by bar, which
// is the honest unit when a lean persists for weeks, the inversion held: bullish
// -0.373pp negative on 38/50 names, bearish -2.361pp negative on 40/44.
//
// Retired outright rather than relabelled, per the GEX precedent in
// analyses/Open-Backlog#B-44r. A gauge that is confidently backwards is worse
// than no gauge. The zone boxes themselves are unaffected — they are the
// detector's own geometry, and only the verdict drawn on top of them was wrong.
// See analyses/Order-Block-Rules-Measured.

// ── %R exhaustion main-chart overlay (candle arrows + confluence + tint) ──────
// Extends the %R Trend Exhaustion indicator onto the price chart: the ▲/▼ flips
// as candle markers — upgraded to a bold ▲ OB / ▼ OB "confluence" marker when a
// flip lands inside a matching, non-violated order block — plus a faint red/green
// background wash while %R sits in its OB/OS exhaustion zone. The confluence
// upgrade needs the Order Blocks overlay on too; without it the arrows are plain.
function clearPrteOverlay(pane) {
  setPaneMarkers(pane, 'prte', null);
  pane.prteData = null;
  if (pane.prteCanvas) {
    const ctx = pane.prteCanvas.getContext('2d');
    ctx.clearRect(0, 0, pane.prteCanvas.width, pane.prteCanvas.height);
  }
}

function renderPrteOverlay(pane, prte) {
  if (typeof PRTE === 'undefined' || !pane.bars || !pane.bars.length) { clearPrteOverlay(pane); return; }
  prte = prte || PRTE.compute(pane.bars);
  pane.prteData = prte;

  // Order-block zones for the confluence test (only when that overlay is on).
  const zones = (pane.indicators.has('orderblock') && pane.ob && pane.ob.zones) ? pane.ob.zones : null;
  const barByTime = new Map(pane.bars.map(b => [b.time, b]));
  // Confluent = the flip candle reaches (within a small buffer of) a live,
  // same-direction order block active at that time. The buffer catches an
  // exhaustion right at a zone's edge, not only a dead-centre tag.
  const confluent = (dir, t) => {
    if (!zones) return false;
    const bar = barByTime.get(t);
    if (!bar) return false;
    return zones.some(z => {
      if (z.dir !== dir) return false;
      // Zone must be LIVE at the flip's time. end_time already ends a violated
      // zone at its violation bar, so a flip before that still counts (a zone
      // that failed later was valid when the exhaustion tagged it).
      if (!(z.start_time <= t && t <= z.end_time)) return false;
      // Proximity buffer: an exhaustion right at a zone's edge still counts, not
      // only a dead-centre tag. ~0.6% of price or 0.75× the zone height.
      const buf = Math.max((z.high - z.low) * 0.75, bar.close * 0.006);
      return bar.low <= z.high + buf && bar.high >= z.low - buf;
    });
  };

  // Every flip, tagged with confluence. On the MAIN chart we don't want all of
  // them (the sub-pane already shows the full set) — keep every confluent flip
  // plus only the most recent MAIN_MAX non-confluent ones, so the price chart
  // stays readable and the A+ setups stand out.
  const MAIN_MAX = 12;
  const flips = [];
  prte.osReversal.forEach(p => flips.push({t: p.time, dir: 'bull', conf: confluent('bull', p.time)}));
  prte.obReversal.forEach(p => flips.push({t: p.time, dir: 'bear', conf: confluent('bear', p.time)}));
  flips.sort((a, b) => a.t - b.t);
  const recentPlain = new Set(flips.filter(f => !f.conf).slice(-MAIN_MAX).map(f => f.t + ':' + f.dir));
  const markers = flips
    .filter(f => f.conf || recentPlain.has(f.t + ':' + f.dir))
    .map(f => f.dir === 'bull'
      ? (f.conf ? {time: f.t, position: 'belowBar', color: '#00e676', shape: 'arrowUp',   text: '▲ OB', size: 2}
                : {time: f.t, position: 'belowBar', color: '#2466A7', shape: 'arrowUp',   text: '▲'})
      : (f.conf ? {time: f.t, position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: '▼ OB', size: 2}
                : {time: f.t, position: 'aboveBar', color: '#CA0017', shape: 'arrowDown', text: '▼'}));
  setPaneMarkers(pane, 'prte', markers.length ? markers : null);

  drawPrteBackground(pane, prte);
}

function drawPrteBackground(pane, prte) {
  const canvas = pane.prteCanvas;
  if (!canvas) return;
  const {W, H} = sizeOverlay(canvas);
  if (!W || !H) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  prte = prte || pane.prteData;
  if (!prte || !pane.bars || !pane.bars.length) return;

  const th = prte.threshold;
  const fastMap = new Map(prte.fast.map(p => [p.time, p.value]));
  const slowMap = new Map(prte.slow.map(p => [p.time, p.value]));
  const ts = pane.chart.timeScale();
  const bars = pane.bars;

  // Estimate bar spacing so the last bar of a shaded run still gets width.
  let sp = 6;
  for (let i = 1; i < bars.length; i++) {
    const a = ts.timeToCoordinate(bars[i - 1].time), b = ts.timeToCoordinate(bars[i].time);
    if (a != null && b != null) { sp = Math.max(1, Math.abs(b - a)); break; }
  }

  // Shade contiguous runs where BOTH fast & slow %R sit in the same zone (the
  // real OB/OS condition), red for overbought, green for oversold.
  let run = null;   // {type:'ob'|'os', x0, x1}
  const flush = () => {
    if (!run) return;
    ctx.fillStyle = run.type === 'ob' ? 'rgba(202,0,23,0.06)' : 'rgba(38,166,154,0.06)';
    ctx.fillRect(Math.min(run.x0, run.x1) - sp / 2, 0, Math.abs(run.x1 - run.x0) + sp, H);
    run = null;
  };
  for (const bar of bars) {
    const f = fastMap.get(bar.time), s = slowMap.get(bar.time);
    let type = null;
    if (f !== undefined && s !== undefined) {
      if (f >= -th && s >= -th) type = 'ob';
      else if (f <= (-100 + th) && s <= (-100 + th)) type = 'os';
    }
    if (!type) { flush(); continue; }
    const x = ts.timeToCoordinate(bar.time);
    if (x == null) { flush(); continue; }
    if (run && run.type === type) run.x1 = x;
    else { flush(); run = {type, x0: x, x1: x}; }
  }
  flush();
}

// ── FVG actionable buy/sell signal (integration layer for FVG.signals) ────────
// drawFVG() above paints every raw gap; this layer runs FVG.signals() — the
// ATR-gated pullback-rejection state machine — and surfaces the ONE actionable
// verdict per side: a BUY/SELL arrow marker plus a bottom-right panel grading it
// with the price+volume "FPV" read and Zeiierman-style bull/bear power.
// Computation is cached per (symbol,tf,lastBar) so pan/zoom redraws of drawFVG
// don't recompute it; only a new bar set does.
const FVG_SIG_OPTS = {atrMult: 0.5, atrLen: 14, volLen: 20, recent: 10};

function ensureFvgSigState(pane) {
  if (!pane.fvgSig) pane.fvgSig = {infoEl: null, data: null, lastKey: null, collapsed: false};
  return pane.fvgSig;
}

function clearFVGSignals(pane) {
  setPaneMarkers(pane, 'fvg', null);
  if (pane.fvgSig) {
    if (pane.fvgSig.infoEl) pane.fvgSig.infoEl.style.display = 'none';
    pane.fvgSig.data = null;
    pane.fvgSig.lastKey = null;
  }
}

function renderFVGSignals(pane) {
  const st = ensureFvgSigState(pane);
  if (!pane.bars || pane.bars.length < 25 || typeof FVG === 'undefined' || !FVG.signals) {
    clearFVGSignals(pane);
    return;
  }
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  // Recompute only when the bar set actually changed; otherwise just re-attach
  // markers (setMarkers is idempotent) so a re-render doesn't drop them.
  if (st.lastKey !== key) {
    st.lastKey = key;
    st.data = FVG.signals(pane.bars, FVG_SIG_OPTS);
  }
  const d = st.data;

  const markers = [];
  const arrow = (sig, bullish) => {
    if (!sig) return;
    // A live signal is bright; a stale one (older than `recent` bars) is muted
    // so the eye isn't drawn to an entry that has already passed.
    const strong = sig.fpv.strength === 'STRONG';
    const base = bullish ? (strong ? '#26a69a' : '#7fd0c8') : (strong ? '#ef5350' : '#f0a1a0');
    const color = sig.live ? base : (bullish ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)');
    markers.push({
      time: sig.time,
      position: bullish ? 'belowBar' : 'aboveBar',
      color,
      shape: bullish ? 'arrowUp' : 'arrowDown',
      text: sig.fpv.rec,
    });
  };
  if (d) { arrow(d.buy, true); arrow(d.sell, false); }
  setPaneMarkers(pane, 'fvg', markers.length ? markers : null);

  renderFVGInfo(pane, d);
}

// One flex container per pane for the top-left card row: actionable overlay
// cards append here (instead of claiming their own absolute corner) so
// however many are visible at once, they align and flow without overlap.
function ensureActionStack(pane) {
  const main = pane.el.querySelector('.chart-main');
  let stack = main.querySelector(':scope > .action-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.className = 'action-stack';
    main.appendChild(stack);
  }
  return stack;
}

function renderFVGInfo(pane, d) {
  const st = ensureFvgSigState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'fvg-info';
    mountCard(pane, st.infoEl, 'stack');
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.fvg-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
  }
  const el = st.infoEl;

  // Choose the headline signal: the most recent of buy/sell.
  let head = null, bullish = true;
  if (d && d.buy && d.sell) {
    if (d.buy.barsAgo <= d.sell.barsAgo) { head = d.buy; bullish = true; }
    else { head = d.sell; bullish = false; }
  } else if (d && d.buy) { head = d.buy; bullish = true; }
  else if (d && d.sell) { head = d.sell; bullish = false; }

  if (!head) {
    // No fired signal — but an active (armed) zone is still worth showing.
    const armed = d && (d.activeBull || d.activeBear);
    if (!armed) { el.style.display = 'none'; return; }
    const z = d.activeBull || d.activeBear;
    const side = d.activeBull ? 'bullish' : 'bearish';
    el.innerHTML =
      `<div class="fvg-head"><span class="fvg-badge" style="background:#8b949e">ARMED</span> ` +
      `FVG signal <span style="color:var(--text-muted)">▾</span></div>` +
      `<div class="fvg-body"><div class="fvg-why">No rejection entry yet. An active ${side} ` +
      `zone ${z.bottom.toFixed(2)}–${z.top.toFixed(2)} is waiting for price to tag it and ` +
      `reject.</div><hr><div class="proj-disclaimer">Rule-based FVG pullback state machine — not investment advice.</div></div>`;
    el.classList.toggle('collapsed', st.collapsed);
    el.style.display = 'block';
    return;
  }

  const f = head.fpv;
  const strongCol = f.strength === 'STRONG' ? '#3fb950' : f.strength === 'WEAK' ? '#f0883e' : '#8b949e';
  const dirCol = bullish ? '#26a69a' : '#ef5350';
  const recency = head.live
    ? `<span style="color:${dirCol}">live · ${head.barsAgo}b ago</span>`
    : `<span style="color:var(--text-muted)">historical · ${head.barsAgo}b ago</span>`;

  const volTxt = f.hasVolume
    ? `${f.volRatio.toFixed(2)}× avg (${f.volUp ? 'expanding' : 'thin'})`
    : 'no volume data';

  let body =
    `<div class="fvg-row"><span>Signal</span><span style="color:${dirCol}">${f.rec}</span></div>` +
    `<div class="fvg-row"><span>At</span><span>${head.price.toFixed(2)}</span></div>` +
    `<div class="fvg-row"><span>Zone</span><span>${head.zone.bottom.toFixed(2)}–${head.zone.top.toFixed(2)}</span></div>` +
    `<div class="fvg-row"><span>When</span><span>${recency}</span></div><hr>` +
    `<div class="fvg-row"><span>Price + Volume</span><span style="color:${strongCol}">${f.strength}</span></div>` +
    `<div class="fvg-row"><span>Displacement vol</span><span>${volTxt}</span></div>` +
    `<div class="fvg-row"><span>Bull / bear power</span><span>${f.buyPct}% / ${f.sellPct}%</span></div>` +
    `<div class="fvg-power" style="--buy:${f.buyPct}%"></div>`;

  // The framework's honest caveat: rising on thin volume is a distrust signal.
  if (f.strength === 'WEAK') {
    body += `<div class="fvg-why" style="color:#f0883e">⚠ ${bullish ? 'Rejection' : 'Rejection'} on thinning ` +
            `volume — the framework rates this a weak ${bullish ? 'long' : 'short'} (distrust the move).</div>`;
  }
  // Show a second signal on the other side if one also exists.
  const other = bullish ? (d && d.sell) : (d && d.buy);
  if (other) {
    body += `<hr><div class="fvg-why">Also: ${other.fpv.rec} ${other.barsAgo}b ago ` +
            `@ ${other.price.toFixed(2)} (${other.live ? 'live' : 'historical'}).</div>`;
  }
  body += `<hr><div class="proj-disclaimer">Rule-based FVG pullback-rejection entry graded by ` +
          `price+volume — not investment advice.</div>`;

  const badgeCol = f.strength === 'STRONG' ? '#3fb950' : f.strength === 'WEAK' ? '#f0883e' : '#8b949e';
  el.innerHTML =
    `<div class="fvg-head"><span class="fvg-badge" style="background:${badgeCol}">${f.rec}</span> ` +
    `<span style="color:var(--text-muted)">▾</span></div>` +
    `<div class="fvg-body">${body}</div>`;
  el.classList.toggle('collapsed', st.collapsed);
  el.style.display = 'block';
}

// ── MA Bias overlay ───────────────────────────────────────────────────────────
// The professional moving-average read as a four-tier gate, not a signal:
//   1 Regime   — price vs 200 SMA + golden/death cross (50/200 SMA): may I
//                be long at all?
//   2 Quality  — EMA stack order (9>20>50>200 = orderly trend); MAs braided
//                within a fraction of an ATR = chop, stand down.
//   3 Trigger  — the 9/20 EMA cross for momentum entries, plus the
//                pullback-to-rising-20-EMA bounce.
//   4 Distrust — volume on the cross bar (same FPV read as the FVG card),
//                extension from the 20 EMA (chasing), and a whipsaw counter.
// A cross that fails a tier is reported as information, not invitation —
// e.g. a 9/20 bull cross under a bearish 50/200 regime prints COUNTER-TREND.
// All client-side from bars[]; independent of which MA *lines* are toggled
// on, so the card works without cluttering the chart with six lines.
// Computation cached per (symbol,tf,lastBar), same policy as the FVG card.
const MA_BIAS_OPTS = {
  whipsawWin: 15,  // bars scanned for repeat 9/20 crosses
  whipsawN:   3,   // crosses within that window that mark a whipsaw zone
  recent:     10,  // a 9/20 cross younger than this is "live"
  extAtr:     2,   // |close − 20 EMA| beyond this × ATR14 = overextended
  braidAtr:   0.8, // 9/20/50 EMA spread under this × ATR14 = braided (chop)
  volLen:     20,  // trailing volume average for cross-bar grading
};

function maBiasCompute(bars) {
  if (!bars || bars.length < 60) return null;
  const O = MA_BIAS_OPTS;
  const toMap = arr => { const m = new Map(); arr.forEach(pt => m.set(pt.time, pt.value)); return m; };
  const e9   = toMap(emaSeries(bars, 9));
  const e20  = toMap(emaSeries(bars, 20));
  const e50  = toMap(emaSeries(bars, 50));
  const s50  = toMap(smaSeries(bars, 50));
  const s200 = bars.length >= 200 ? toMap(smaSeries(bars, 200)) : null;
  const atrArr = atrSeries(bars, 14);
  const atr  = atrArr.length ? atrArr[atrArr.length - 1].value : null;
  const last = bars[bars.length - 1];
  const iLast = bars.length - 1;

  // Sign-change scan of fast−slow; shared by the 9/20 and 50/200 pairs.
  const crossings = (fast, slow) => {
    const out = [];
    let prev = null;
    for (let i = 0; i < bars.length; i++) {
      const t = bars[i].time;
      const f = fast.get(t), sl = slow.get(t);
      if (f === undefined || sl === undefined) continue;
      const diff = f - sl;
      if (prev !== null && ((prev <= 0 && diff > 0) || (prev >= 0 && diff < 0)))
        out.push({i, time: t, dir: diff > 0 ? 1 : -1, price: bars[i].close});
      prev = diff;
    }
    return out;
  };
  const fastCrosses   = crossings(e9, e20);
  const regimeCrosses = s200 ? crossings(s50, s200) : [];

  // Tier 1 — regime. Needs a real 200 SMA; on short history it stays null
  // and the verdict is capped below rather than pretending a regime exists.
  const s200Last = s200 ? s200.get(last.time) : undefined;
  const s50Last  = s50.get(last.time);
  let regime = null;
  if (s200Last !== undefined && s50Last !== undefined) {
    const above200 = last.close > s200Last;
    const gcBull = s50Last > s200Last;
    const lastRC = regimeCrosses.length ? regimeCrosses[regimeCrosses.length - 1] : null;
    regime = {
      above200, gcBull,
      dir: above200 && gcBull ? 1 : (!above200 && !gcBull ? -1 : 0),
      lastCross: lastRC ? {dir: lastRC.dir, barsAgo: iLast - lastRC.i, price: lastRC.price} : null,
    };
  }

  // Tier 2 — stack quality.
  const v9 = e9.get(last.time), v20 = e20.get(last.time), v50 = e50.get(last.time);
  let stack = null;
  if (v9 !== undefined && v20 !== undefined && v50 !== undefined) {
    const withS200 = s200Last !== undefined;
    const bull = v9 > v20 && v20 > v50 && (!withS200 || v50 > s200Last);
    const bear = v9 < v20 && v20 < v50 && (!withS200 || v50 < s200Last);
    const spread = Math.max(v9, v20, v50) - Math.min(v9, v20, v50);
    stack = {
      aligned: bull ? 1 : bear ? -1 : 0,
      withS200,
      braided: atr !== null && spread < O.braidAtr * atr,
      spreadAtr: atr ? spread / atr : null,
    };
  }

  // Tier 3 — trigger: the latest 9/20 cross, volume-graded at its own bar.
  let trigger = null;
  const lastFC = fastCrosses.length ? fastCrosses[fastCrosses.length - 1] : null;
  if (lastFC) {
    let volRatio = null;
    const cb = bars[lastFC.i];
    if (cb.volume) {
      let sum = 0, n = 0;
      for (let j = Math.max(0, lastFC.i - O.volLen); j < lastFC.i; j++) {
        if (bars[j].volume) { sum += bars[j].volume; n++; }
      }
      if (n >= 5 && sum > 0) volRatio = cb.volume / (sum / n);
    }
    const barsAgo = iLast - lastFC.i;
    trigger = {dir: lastFC.dir, barsAgo, price: lastFC.price, live: barsAgo <= O.recent, volRatio};
  }
  // Pullback bounce: in an aligned trend, price tagged the 20 EMA within the
  // last 3 bars and the latest close is back on the trend side of it.
  let pullback = 0;
  if (stack && stack.aligned !== 0 && v20 !== undefined) {
    for (let j = Math.max(0, iLast - 2); j <= iLast; j++) {
      const m = e20.get(bars[j].time);
      if (m === undefined) continue;
      if (stack.aligned === 1  && bars[j].low  <= m && last.close > v20) pullback = 1;
      if (stack.aligned === -1 && bars[j].high >= m && last.close < v20) pullback = -1;
    }
  }

  // Tier 4 — distrust.
  const ext = v20 !== undefined ? last.close - v20 : null;
  const whipsawCount = fastCrosses.filter(c => iLast - c.i < O.whipsawWin).length;
  const distrust = {
    extPct: ext !== null && v20 ? (ext / v20) * 100 : null,
    extended: ext !== null && atr !== null && Math.abs(ext) > O.extAtr * atr,
    whipsawCount,
    whipsaw: whipsawCount >= O.whipsawN,
    thinVolume: !!(trigger && trigger.volRatio !== null && trigger.volRatio < 1),
  };

  // Verdict ladder — chop gates veto first, then regime × trigger.
  let verdict = 'MIXED';
  if (stack && stack.braided) verdict = 'CHOP';
  else if (distrust.whipsaw) verdict = 'CHOP';
  else if (regime && regime.dir !== 0) {
    const agree = stack && stack.aligned === regime.dir;
    if (trigger && trigger.live && trigger.dir !== regime.dir) verdict = 'COUNTER-TREND';
    else if (agree) verdict = regime.dir === 1 ? 'LONG' : 'SHORT';
    // regime set but stack disagrees → stays MIXED
  }

  return {verdict, regime, stack, trigger, pullback, distrust, fastCrosses, regimeCrosses};
}

function ensureMABiasState(pane) {
  if (!pane.maBias) pane.maBias = {infoEl: null, data: null, lastKey: null, collapsed: false};
  return pane.maBias;
}

function clearMABias(pane) {
  setPaneMarkers(pane, 'mabias', null);
  if (pane.maBias) {
    if (pane.maBias.infoEl) pane.maBias.infoEl.style.display = 'none';
    pane.maBias.data = null;
    pane.maBias.lastKey = null;
  }
}

function renderMABias(pane) {
  const st = ensureMABiasState(pane);
  if (!pane.bars || pane.bars.length < 60) { clearMABias(pane); return; }
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (st.lastKey !== key) {
    st.lastKey = key;
    st.data = maBiasCompute(pane.bars);
  }
  const d = st.data;
  if (!d) { clearMABias(pane); return; }

  // Markers: every 50/200 cross is regime history worth keeping on screen;
  // 9/20 crosses stay muted except the latest so old entries don't shout.
  const markers = [];
  d.regimeCrosses.forEach(c => markers.push(c.dir === 1
    ? {time: c.time, position: 'belowBar', color: '#ffd60a', shape: 'circle', text: 'GC'}
    : {time: c.time, position: 'aboveBar', color: '#ef5350', shape: 'circle', text: 'DC'}));
  d.fastCrosses.forEach((c, idx) => {
    const latest = idx === d.fastCrosses.length - 1;
    const bull = c.dir === 1;
    const m = {
      time: c.time,
      position: bull ? 'belowBar' : 'aboveBar',
      color: latest && d.trigger && d.trigger.live
        ? (bull ? '#26a69a' : '#ef5350')
        : (bull ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)'),
      shape: bull ? 'arrowUp' : 'arrowDown',
    };
    if (latest) m.text = '9/20';
    markers.push(m);
  });
  setPaneMarkers(pane, 'mabias', markers.length ? markers : null);

  renderMABiasInfo(pane, d);
}

const MA_BADGE = {
  LONG:            {label: 'LONG BIAS',         color: '#3fb950'},
  SHORT:           {label: 'SHORT BIAS',        color: '#ef5350'},
  'COUNTER-TREND': {label: 'COUNTER-TREND',     color: '#f0883e'},
  CHOP:            {label: 'CHOP — STAND DOWN', color: '#8b949e'},
  MIXED:           {label: 'MIXED',             color: '#8b949e'},
};

function renderMABiasInfo(pane, d) {
  const st = ensureMABiasState(pane);
  if (!st.infoEl) {
    st.infoEl = document.createElement('div');
    st.infoEl.className = 'ma-info';
    mountCard(pane, st.infoEl, 'stack');
    st.infoEl.addEventListener('click', ev => {
      if (!ev.target.closest('.ma-head')) return;
      st.collapsed = !st.collapsed;
      st.infoEl.classList.toggle('collapsed', st.collapsed);
    });
  }
  const el = st.infoEl;
  const b = MA_BADGE[d.verdict] || MA_BADGE.MIXED;

  // Tier 1 — regime row (+ last golden/death cross when one exists).
  let regimeTxt, gcTxt = '';
  if (!d.regime) {
    regimeTxt = `<span style="color:var(--text-muted)">— · &lt;200 bars of history</span>`;
  } else {
    const dirCol = d.regime.dir === 1 ? '#26a69a' : d.regime.dir === -1 ? '#ef5350' : '#f0883e';
    const word = d.regime.dir === 1 ? 'BULL' : d.regime.dir === -1 ? 'BEAR' : 'MIXED';
    regimeTxt = `<span style="color:${dirCol}">${word}</span> · ${d.regime.above200 ? 'above' : 'below'} 200 SMA`;
    if (d.regime.lastCross) {
      const gc = d.regime.lastCross.dir === 1;
      gcTxt = `<div class="ma-row"><span>${gc ? 'Golden' : 'Death'} cross</span>` +
              `<span style="color:${gc ? '#ffd60a' : '#ef5350'}">${d.regime.lastCross.barsAgo}b ago ` +
              `@ ${d.regime.lastCross.price.toFixed(2)}</span></div>`;
    }
  }

  // Tier 2 — stack row.
  let stackTxt = '—';
  if (d.stack) {
    const chain = d.stack.withS200 ? '9&gt;20&gt;50&gt;200' : '9&gt;20&gt;50';
    stackTxt = d.stack.aligned === 1  ? `<span style="color:#26a69a">${chain} ✓ aligned</span>`
             : d.stack.aligned === -1 ? `<span style="color:#ef5350">inverted (bearish)</span>`
             : `<span style="color:#f0883e">mixed</span>`;
  }

  // Tier 3 — trigger rows.
  let trigTxt = `<span style="color:var(--text-muted)">no 9/20 cross yet</span>`;
  if (d.trigger) {
    const bull = d.trigger.dir === 1;
    const c = bull ? '#26a69a' : '#ef5350';
    const rec = d.trigger.live
      ? `<span style="color:${c}">live · ${d.trigger.barsAgo}b ago</span>`
      : `<span style="color:var(--text-muted)">stale · ${d.trigger.barsAgo}b ago</span>`;
    trigTxt = `<span style="color:${c}">9/20 ${bull ? 'bull' : 'bear'}</span> @ ${d.trigger.price.toFixed(2)} · ${rec}`;
  }
  const volTxt = d.trigger && d.trigger.volRatio !== null
    ? `${d.trigger.volRatio.toFixed(2)}× avg (${d.trigger.volRatio >= 1 ? 'expanding' : 'thin'})`
    : 'no volume data';
  const extTxt = d.distrust.extPct !== null
    ? `${d.distrust.extPct >= 0 ? '+' : ''}${d.distrust.extPct.toFixed(1)}% from 20 EMA${d.distrust.extended ? '' : ' (ok)'}`
    : '—';

  let body =
    `<div class="ma-row"><span>Regime</span><span>${regimeTxt}</span></div>` +
    gcTxt +
    `<div class="ma-row"><span>Stack</span><span>${stackTxt}</span></div><hr>` +
    `<div class="ma-row"><span>Trigger</span><span>${trigTxt}</span></div>` +
    (d.pullback !== 0
      ? `<div class="ma-row"><span>Pullback</span><span style="color:#26a69a">tagged ` +
        `${d.pullback === 1 ? 'rising' : 'falling'} 20 EMA and held</span></div>`
      : '') +
    `<div class="ma-row"><span>Cross vol</span><span>${volTxt}</span></div>` +
    `<div class="ma-row"><span>Extension</span><span>${extTxt}</span></div>`;

  // Tier 4 — every reason to doubt the verdict, spelled out in the same
  // distrust voice as the FVG card.
  const warns = [];
  if (d.stack && d.stack.braided && d.stack.spreadAtr !== null)
    warns.push(`MAs braided within ${d.stack.spreadAtr.toFixed(1)} ATR — no trend to follow.`);
  if (d.distrust.whipsaw)
    warns.push(`${d.distrust.whipsawCount} crosses in ${MA_BIAS_OPTS.whipsawWin} bars — whipsaw zone, halve conviction.`);
  if (d.verdict === 'COUNTER-TREND')
    warns.push('9/20 cross fights the 50/200 regime — information, not invitation.');
  if (d.distrust.thinVolume)
    warns.push('Cross printed on thin volume — distrust the move.');
  if (d.distrust.extended)
    warns.push(`Price &gt; ${MA_BIAS_OPTS.extAtr} ATR from the 20 EMA — chasing risk; wait for the pullback.`);
  warns.forEach(w => { body += `<div class="ma-warn">⚠ ${w}</div>`; });
  if ((d.verdict === 'LONG' || d.verdict === 'SHORT') && (!d.trigger || !d.trigger.live))
    body += `<div class="ma-why">Bias only — no fresh 9/20 trigger inside ${MA_BIAS_OPTS.recent} bars.</div>`;

  body += `<hr><div class="proj-disclaimer">Rule-based MA regime/stack/trigger read — ` +
          `lagging by construction, not investment advice.</div>`;

  el.innerHTML =
    `<div class="ma-head"><span class="ma-badge" style="background:${b.color}">${b.label}</span> ` +
    `MA Stack <span style="color:var(--text-muted)">▾</span></div>` +
    `<div class="ma-body">${body}</div>`;
  el.classList.toggle('collapsed', st.collapsed);
  el.style.display = 'block';
}

// ── Pattern base-zone shading (VCP + Rounding Bottom footprints) ──────────────
// Draws a semi-transparent filled rectangle over each active pattern's
// consolidation/base window so the footprint is legible at a glance
// (Milestone 2). Mirrors drawFVG's box style — time-anchored via
// timeToCoordinate, price-anchored via priceToCoordinate — and is redrawn on
// pan/zoom/resize from the same hooks. The actionable trade-plan detail still
// lives in each overlay's collapsible info panel; this only marks *where* the
// pattern sits. Zone data is stashed on pane.vcp.baseZone / pane.rb.baseZone
// when those overlays render, and nulled on teardown.
function drawPatternZones(pane) {
  const canvas = pane.patternCanvas;
  if (!canvas) return;
  const {W, H} = sizeOverlay(canvas);
  if (W === 0 || H === 0) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const ts = pane.chart.timeScale();

  const box = (zone, fill, stroke, label) => {
    if (!zone) return;
    const xL = ts.timeToCoordinate(zone.start);
    const xR = ts.timeToCoordinate(zone.end);
    const yT = pane.series.priceToCoordinate(zone.high);
    const yB = pane.series.priceToCoordinate(zone.low);
    if (xL === null || xR === null || yT === null || yB === null) return;
    const x = Math.max(0, xL);
    const w = Math.min(W, xR) - x;
    if (w <= 0) return;
    const y = Math.min(yT, yB);
    const h = Math.max(1, Math.abs(yB - yT));
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    ctx.font = '10px -apple-system, "Segoe UI", sans-serif';
    ctx.fillStyle = stroke;
    ctx.fillText(label, x + 4, y + 11);
  };

  if (pane.indicators && pane.indicators.has('vcp'))
    box(pane.vcp && pane.vcp.baseZone,
        'rgba(38,198,218,0.10)', 'rgba(38,198,218,0.6)', 'VCP base');
  if (pane.indicators && pane.indicators.has('roundbottom'))
    box(pane.rb && pane.rb.baseZone,
        'rgba(255,171,64,0.10)', 'rgba(255,171,64,0.6)', 'Rounding base');
  if (pane.indicators && pane.indicators.has('doublebottom'))
    box(pane.db && pane.db.baseZone,
        'rgba(247,120,186,0.10)', 'rgba(247,120,186,0.6)', 'Double bottom');

  // Falling-wedge translucent fill — a quadrilateral between the two converging
  // trendlines (upper-left → upper-right → lower-right → lower-left). Poly is
  // stashed on pane.fw.poly by renderFallingWedge and nulled on teardown.
  if (pane.indicators && pane.indicators.has('falling_wedge') && pane.fw && pane.fw.poly) {
    const p = pane.fw.poly;
    const pts = [
      [ts.timeToCoordinate(p.ut0), pane.series.priceToCoordinate(p.uy0)],
      [ts.timeToCoordinate(p.ut1), pane.series.priceToCoordinate(p.uy1)],
      [ts.timeToCoordinate(p.lt1), pane.series.priceToCoordinate(p.ly1)],
      [ts.timeToCoordinate(p.lt0), pane.series.priceToCoordinate(p.ly0)],
    ];
    if (pts.every(pt => pt[0] !== null && pt[1] !== null)) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = 'rgba(38,166,154,0.10)';
      ctx.fill();
    }
  }
}

// ── Elliott Wave overlay rendering (integration layer for elliott_wave.js) ────
// elliott_wave.js (window.EW) is a pure computation module with zero chart
// dependency. Everything in this section is the "plug" that adapts its
// output onto a Lightweight Charts series: line paths, text markers,
// Fibonacci projection rays, and the numeric info panel. To swap charting
// libraries later, only this section needs to change — EW.analyze() itself
// never has to know what's drawing it.
const EW_OPTS = {atrPeriod: 14, atrMult: 1.2, minPct: 0.5};
const EW_MAX_RENDERED  = 3;   // cap how many wave-structures are drawn at once
const EW_MIN_SCORE     = 25;  // hide near-zero-confidence noise structures
const EW_VP_CONFLUENCE_TOL = 0.004; // 0.4% price tolerance for EW+VolumeProfile confluence

// ── Central marker merger ─────────────────────────────────────────────────────
// Multiple indicators want to put text markers on the candlestick series
// (Elliott Wave puts wave numbers, the Reversal Calendar puts yoga/lunar
// glyphs). Lightweight Charts' setMarkers() replaces the whole marker set
// on each call, so calling it from two places would have them overwrite
// each other. Each indicator registers its markers under a source key in
// pane._markerSrcs, and we merge + push exactly once via setPaneMarkers().
function setPaneMarkers(pane, source, markers) {
  if (!pane._markerSrcs) pane._markerSrcs = {};
  if (!markers || !markers.length) delete pane._markerSrcs[source];
  else pane._markerSrcs[source] = markers;
  const merged = [];
  Object.values(pane._markerSrcs).forEach(arr => merged.push(...arr));
  merged.sort((a, b) => a.time - b.time);
  try { pane.series.setMarkers(merged); } catch {}
}

function ensureEwState(pane) {
  if (!pane.ew) {
    pane.ew = {
      lineSeries: {},        // structure id -> LWC line series (the zigzag path)
      fibLineSeries: [],     // [LWC line series] for the active fib projection rays
      infoEl: null,
      infoBody: null,        // inner div that receives the html — outer holds the collapse toggle
      infoSummary: null,     // the compact one-line chip shown when collapsed
      // Default collapsed on first render — the actionable info (fib
      // targets + VP-confluence stars) is already labeled on the right
      // axis; the wave-math list is context, not a decision. User's toggle
      // choice persists across pages via localStorage (LS_EW_COLLAPSED).
      collapsed: loadEwCollapsed(),
      lastComputeKey: null,
    };
  }
  return pane.ew;
}

// ── RSI Divergence rendering (integration layer for rsi_divergence.js) ────────
// rsi_divergence.js (window.RSIDIV) is a pure computation module with zero chart
// dependency. This function is the rendering plug: it draws each divergence
// TWICE — once across the price swings, once across the matching RSI swings —
// because the whole point is that the two disagree, and one line alone cannot
// show a disagreement.
//
// Encoding: colour carries direction (green bullish / red bearish), dash
// carries kind (solid regular = reversal, dashed hidden = continuation). That
// is two dimensions in two channels, so the chart stays readable in greyscale
// and does not need four separate colours the eye has to memorise.
const RSIDIV_STYLE = {
  bull: {color: '#3fb950', faded: 'rgba(63,185,80,0.40)'},
  bear: {color: '#f85149', faded: 'rgba(248,81,73,0.40)'},
};

function ensureRsiDivState(pane) {
  if (!pane.rsidiv) pane.rsidiv = {priceLines: [], rsiLines: []};
  return pane.rsidiv;
}

function clearRsiDivergence(pane) {
  if (!pane.rsidiv) return;
  pane.rsidiv.priceLines.forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  const sub = pane.subCharts && pane.subCharts.rsi;
  if (sub) pane.rsidiv.rsiLines.forEach(s => { try { sub.chart.removeSeries(s); } catch {} });
  setPaneMarkers(pane, 'rsidiv', null);
  pane.rsidiv.priceLines = [];
  pane.rsidiv.rsiLines = [];
}

function renderRsiDivergence(pane) {
  const st = ensureRsiDivState(pane);
  clearRsiDivergence(pane);
  const bars = pane.bars;
  if (!bars || !bars.length || !window.RSIDIV) return;

  // Hand the module the SAME RSI series the pane draws, so the line you see and
  // the values the divergence is measured from cannot drift apart.
  const rsiData = rsiSeries(bars, 14);
  let res;
  try { res = RSIDIV.compute(bars, {rsi: rsiData}); } catch (e) { return; }
  if (!res.divergences.length) return;

  const sub = pane.subCharts && pane.subCharts.rsi;
  const markers = [];

  for (const d of res.divergences) {
    const style = RSIDIV_STYLE[d.dir];
    // A provisional divergence hangs off a pivot the zigzag has not confirmed:
    // it can move or vanish on the next bar. Drawn faded and labelled '?' so it
    // never reads as settled. Repainting is acceptable; silent repainting is not.
    const color = d.provisional ? style.faded : style.color;
    const lineStyle = d.kind === 'hidden' ? 2 : 0;      // 2 = dashed, 0 = solid

    const priceLine = pane.chart.addLineSeries({
      color, lineWidth: 2, lineStyle,
      priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    priceLine.setData(RSIDIV.lineOnGrid(bars, d.from.idx, d.from.price,
                                              d.to.idx,   d.to.price));
    st.priceLines.push(priceLine);

    if (sub) {
      const rsiLine = sub.chart.addLineSeries({
        color, lineWidth: 2, lineStyle,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
      rsiLine.setData(RSIDIV.lineOnGrid(bars, d.from.idx, d.from.rsi,
                                              d.to.idx,   d.to.rsi));
      st.rsiLines.push(rsiLine);
    }

    markers.push({
      time: bars[d.to.idx].time,
      position: d.dir === 'bull' ? 'belowBar' : 'aboveBar',
      color,
      shape: d.dir === 'bull' ? 'arrowUp' : 'arrowDown',
      text: `${d.kind === 'hidden' ? 'Hid' : 'Reg'} ${d.dir === 'bull' ? 'Bull' : 'Bear'}`
            + (d.provisional ? ' ?' : ''),
    });
  }
  setPaneMarkers(pane, 'rsidiv', markers);
}

// ── OBV divergence (B-61) ────────────────────────────────────────────────────
// Same shape as renderRsiDivergence, drawn into the OBV sub-pane instead of the
// RSI one. Deliberately NOT merged with it into one parameterised renderer: the
// two panes have different series lookups and different state keys, and the
// merged version was longer than the two separate ones.

function ensureObvDivState(pane) {
  if (!pane.obvdiv) pane.obvdiv = {priceLines: [], obvLines: []};
  return pane.obvdiv;
}

function clearObvDivergence(pane) {
  if (!pane.obvdiv) return;
  pane.obvdiv.priceLines.forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  const sub = pane.subCharts && pane.subCharts.obv;
  if (sub) pane.obvdiv.obvLines.forEach(s => { try { sub.chart.removeSeries(s); } catch {} });
  setPaneMarkers(pane, 'obvdiv', null);
  pane.obvdiv.priceLines = [];
  pane.obvdiv.obvLines = [];
}

function renderObvDivergence(pane) {
  const st = ensureObvDivState(pane);
  clearObvDivergence(pane);
  const bars = pane.bars;
  if (!bars || !bars.length || !window.OBVDIV) return;

  // The SAME OBV series the sub-pane draws, so the line you see and the values
  // the divergence is measured from cannot drift apart.
  const obvData = obvSeries(bars);
  let res;
  try { res = OBVDIV.compute(bars, {obv: obvData}); } catch (e) { return; }
  if (!res.divergences.length) return;

  const sub = pane.subCharts && pane.subCharts.obv;

  // First activation ordering: turning obvdiv on ADDS 'obv' in the same pass,
  // and the sub-pane is built after this render runs -- so the very first draw
  // would put the price half on the chart and silently drop the OBV half.
  // Measured: priceLines 6, obvLines 0 on pass one; both 6 on pass two. Retry
  // once on the next frame rather than leaving the user to toggle twice.
  // setTimeout, not requestAnimationFrame: rAF does not fire while the tab is
  // hidden, so a chart opened in a background tab would stay half-drawn until
  // it was looked at. A macrotask runs either way.
  if (!sub && pane.indicators.has('obv') && !pane._obvdivRetry) {
    pane._obvdivRetry = true;
    setTimeout(() => {
      pane._obvdivRetry = false;
      if (pane.indicators.has('obvdiv')) renderObvDivergence(pane);
    }, 0);
  }

  const markers = [];

  for (const d of res.divergences) {
    const style = RSIDIV_STYLE[d.dir];       // one colour vocabulary for both panes
    const color = d.provisional ? style.faded : style.color;
    const lineStyle = d.kind === 'hidden' ? 2 : 0;

    const priceLine = pane.chart.addLineSeries({
      color, lineWidth: 2, lineStyle,
      priceLineVisible: false, lastValueVisible: false,
      crosshairMarkerVisible: false,
    });
    priceLine.setData(RSIDIV.lineOnGrid(bars, d.from.idx, d.from.price,
                                              d.to.idx,   d.to.price));
    st.priceLines.push(priceLine);

    if (sub) {
      const obvLine = sub.chart.addLineSeries({
        color, lineWidth: 2, lineStyle,
        priceLineVisible: false, lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
      obvLine.setData(RSIDIV.lineOnGrid(bars, d.from.idx, d.from.obv,
                                              d.to.idx,   d.to.obv));
      st.obvLines.push(obvLine);
    }

    // `!` flags a divergence one session's volume effectively created. OBV books
    // a bar's ENTIRE volume by its close-to-close sign, so a news candle or an
    // index rebalance can bend the line into a divergence no genuine flow
    // produced — the artifact LuxAlgo names as the main false-signal source.
    // volConcentration is that print's share of the window's volume.
    const conc = d.volConcentration;
    const oneBar = conc !== null && conc >= 0.5;

    markers.push({
      time: bars[d.to.idx].time,
      position: d.dir === 'bull' ? 'belowBar' : 'aboveBar',
      color,
      shape: d.dir === 'bull' ? 'arrowUp' : 'arrowDown',
      text: `OBV ${d.kind === 'hidden' ? 'Hid' : 'Reg'} `
            + `${d.dir === 'bull' ? 'Bull' : 'Bear'}`
            + (d.provisional ? ' ?' : '') + (oneBar ? ' !' : ''),
    });
  }
  setPaneMarkers(pane, 'obvdiv', markers);
}

function clearElliottWave(pane) {
  if (!pane.ew) return;
  Object.values(pane.ew.lineSeries).forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  pane.ew.fibLineSeries.forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  setPaneMarkers(pane, 'elliott', null);
  if (pane.ew.infoEl) pane.ew.infoEl.style.display = 'none';
  pane.ew.lineSeries = {};
  pane.ew.fibLineSeries = [];
  pane.ew.lastComputeKey = null;
}

// Presentation policy: rank by confidence score (ties broken by recency), then
// cap to EW_MAX_RENDERED. This keeps low-confidence noise (inevitable with any
// volatility-adaptive pivot detector during flat/choppy stretches) from
// cluttering the chart, while always surfacing the cleanest wave counts found.
function selectStructuresToRender(impulses) {
  return impulses
    .filter(imp => imp.score >= EW_MIN_SCORE)
    .slice()
    .sort((a, b) => (b.score - a.score) || (b.startIdx - a.startIdx))
    .slice(0, EW_MAX_RENDERED);
}

function ewWavePointPosition(p) {
  return p.type === 'high' ? 'aboveBar' : 'belowBar';
}

function renderElliottWave(pane) {
  const ew = ensureEwState(pane);
  const bars = pane.bars;
  if (!bars || bars.length < EW_OPTS.atrPeriod + 10) {
    if (ew.infoEl) ew.infoEl.style.display = 'none';
    return;
  }

  // Cheap guard: skip recompute if the bar series hasn't materially changed
  // since the last call (e.g. an unrelated indicator toggle re-ran applyIndicators).
  const lastBar = bars[bars.length - 1];
  const cacheKey = bars.length + ':' + lastBar.time + ':' + lastBar.close;
  if (ew.lastComputeKey === cacheKey) return;
  ew.lastComputeKey = cacheKey;

  const {impulses, correctives} = EW.analyze(bars, EW_OPTS);
  const shown = selectStructuresToRender(impulses);
  const shownIds = new Set(shown.map(s => s.id));
  const shownCorrectives = correctives.filter(c => shownIds.has(c.parentImpulseId));

  const allStructures = [...shown, ...shownCorrectives];

  // Drop line series for structures that fell out of the rendered set.
  Object.keys(ew.lineSeries).forEach(id => {
    if (!allStructures.some(s => s.id === id)) {
      try { pane.chart.removeSeries(ew.lineSeries[id]); } catch {}
      delete ew.lineSeries[id];
    }
  });

  const lastImpulse    = shown[shown.length - 1];
  const lastCorrective = shownCorrectives[shownCorrectives.length - 1];

  // ── Elliott Wave + Volume Profile confluence ──────────────────────────────
  // Only meaningful once both modules have run — relies on drawVolumeProfile()
  // having already populated pane.vp earlier in this same applyIndicators()
  // pass. A wave point "confluences" with a volume zone when its price sits
  // inside (or within tolerance of) the POC, a Value Area edge, or an HVN/LVN
  // pocket — see VOLUME_PROFILE_MODULE.md for the exact confluence rule.
  let confluentKeys = new Set();
  let confluenceList = [];
  if (pane.indicators.has('volprofile') && pane.vp && typeof VP !== 'undefined') {
    const ewPoints = [];
    if (lastImpulse)    lastImpulse.points.forEach(p => ewPoints.push({time: p.time, price: p.price, label: p.label}));
    if (lastCorrective) lastCorrective.points.forEach(p => ewPoints.push({time: p.time, price: p.price, label: p.label}));
    confluenceList = VP.findConfluence(ewPoints, pane.vp, EW_VP_CONFLUENCE_TOL);
    confluentKeys = new Set(confluenceList.map(c => c.time + ':' + c.label));
  }

  // Draw/refresh the zigzag path + collect text markers for each structure.
  const markers = [];
  allStructures.forEach(s => {
    let line = ew.lineSeries[s.id];
    if (!line) {
      line = pane.chart.addLineSeries({
        color: s.type === 'impulse' ? '#00e5ff' : '#ffab40',
        lineWidth: 2,
        lineStyle: s.type === 'impulse' ? 0 : 2,           // solid impulse, dashed corrective
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
        // Zigzag connectors span pivots that may sit outside the currently
        // visible candle range — including them in the price-scale auto-fit
        // stretches the y-axis and crushes the candles (TCS.NS, 2026-07-03).
        // The candle series remains the sole autoscale driver.
        autoscaleInfoProvider: () => null,
      });
      ew.lineSeries[s.id] = line;
    }
    line.setData(s.points.map(p => ({time: p.time, value: p.price})));

    s.points.forEach(p => {
      const isConfluent = confluentKeys.has(p.time + ':' + p.label);
      markers.push({
        time: p.time,
        position: ewWavePointPosition(p),
        color: isConfluent ? '#ffd60a' : (s.type === 'impulse' ? '#00e5ff' : '#ffab40'),
        shape: 'circle',
        size: isConfluent ? 1.4 : 0.8,
        text: isConfluent ? p.label + '★' : p.label,
      });
    });
  });

  setPaneMarkers(pane, 'elliott', markers);

  const fibConfluence = renderEwFibLevels(pane, lastImpulse, lastCorrective);
  renderEwInfo(pane, lastImpulse, lastCorrective, confluenceList, fibConfluence);
}

function renderEwFibLevels(pane, lastImpulse, lastCorrective) {
  const ew = ensureEwState(pane);
  ew.fibLineSeries.forEach(s => { try { pane.chart.removeSeries(s); } catch {} });
  ew.fibLineSeries = [];
  if (!pane.bars.length) return [];

  const lastTime = pane.bars[pane.bars.length - 1].time;
  const rawLevels = [];
  if (lastImpulse)    rawLevels.push(...EW.fibLevelsForImpulse(lastImpulse));
  if (lastCorrective) rawLevels.push(...EW.fibLevelsForCorrective(lastCorrective));

  // Forward-looking confluence runs against the FULL raw set so a far-off
  // extension that lands on a real POC/HVN can still be marked confluent
  // even if the distance filter below would otherwise cull it.
  let fibConfluentLabels = new Set();
  if (pane.indicators.has('volprofile') && pane.vp && typeof VP !== 'undefined' && rawLevels.length) {
    const asPoints = rawLevels.map(lv => ({time: lv.fromTime, price: lv.price, label: lv.label}));
    const matched = VP.findConfluence(asPoints, pane.vp, EW_VP_CONFLUENCE_TOL);
    fibConfluentLabels = new Set(matched.map(m => m.label));
  }

  // Extension math (2.618×W1 etc.) can produce targets very far from the
  // last close — beyond ±40% they clutter the right-axis without giving the
  // user anything actionable. VP-confluent levels are always kept because
  // those ARE the signal even when distant.
  const lastClose = pane.bars[pane.bars.length - 1].close;
  const MAX_FIB_DIST = 0.40;
  const levels = rawLevels.filter(lv => {
    if (!Number.isFinite(lv.price)) return false;
    if (fibConfluentLabels.has(lv.label)) return true;
    if (!lastClose) return false;
    return Math.abs(lv.price - lastClose) / lastClose <= MAX_FIB_DIST;
  });

  levels.forEach(lv => {
    if (lv.fromTime >= lastTime) return; // nothing to draw yet
    const isConfluent = fibConfluentLabels.has(lv.label);
    const s = pane.chart.addLineSeries({
      color: isConfluent ? 'rgba(255,214,10,0.9)' : 'rgba(255,214,10,0.55)',
      lineWidth: isConfluent ? 2 : 1,
      lineStyle: 3,
      priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false,
      title: isConfluent ? lv.label + ' ★VP' : lv.label,
      // Fib targets/extensions can sit far above/below the candle range
      // (e.g. W3 2.618×W1, W5 targets, C 1.618×A) — including them in
      // autoscale is what stretched the y-axis to 1000–2825 on TCS.NS and
      // crushed the actual candle range into a hairline. Same guard as the
      // impulse zigzag: draw them, label them, but don't let them drive the
      // price scale.
      autoscaleInfoProvider: () => null,
    });
    s.setData([{time: lv.fromTime, value: lv.price}, {time: lastTime, value: lv.price}]);
    ew.fibLineSeries.push(s);
  });

  return levels.filter(lv => fibConfluentLabels.has(lv.label));
}

function renderEwInfo(pane, lastImpulse, lastCorrective, confluenceList, fibConfluence) {
  const ew = ensureEwState(pane);
  if (!ew.infoEl) {
    ew.infoEl = document.createElement('div');
    ew.infoEl.className = 'ew-info';
    if (ew.collapsed) ew.infoEl.classList.add('collapsed');
    // Layout: [summary chip] [toggle button] + [body div (hidden when collapsed)].
    // The summary chip is what the user sees when the panel is collapsed —
    // "EW: Bullish 5W · 70/100" — enough to know it's alive without stealing
    // real estate. Body carries the full rich content; toggle switches modes
    // and persists the choice to localStorage so it survives reloads.
    const summary = document.createElement('span');
    summary.className = 'ew-info-summary';
    const body = document.createElement('div');
    body.className = 'ew-info-body';
    const toggle = document.createElement('span');
    toggle.className = 'ew-info-toggle';
    toggle.textContent = ew.collapsed ? '▸' : '×';
    toggle.title = ew.collapsed ? 'Show Elliott Wave info' : 'Collapse';
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowCollapsed = !ew.infoEl.classList.contains('collapsed');
      ew.infoEl.classList.toggle('collapsed', nowCollapsed);
      ew.collapsed = nowCollapsed;
      toggle.textContent = nowCollapsed ? '▸' : '×';
      toggle.title      = nowCollapsed ? 'Show Elliott Wave info' : 'Collapse';
      saveEwCollapsed(nowCollapsed);
    });
    ew.infoEl.appendChild(summary);
    ew.infoEl.appendChild(toggle);
    ew.infoEl.appendChild(body);
    ew.infoBody = body;
    ew.infoSummary = summary;
    mountCard(pane, ew.infoEl, 'corner');
  }
  if (!lastImpulse) { ew.infoEl.style.display = 'none'; return; }
  // Compact chip: label + confidence, matches the leading line of the full
  // panel so users know what's parked there when it's collapsed.
  if (ew.infoSummary) {
    ew.infoSummary.textContent =
      `EW: ${lastImpulse.bullish ? 'Bullish' : 'Bearish'} ` +
      `${lastImpulse.final ? '5W' : '5W?'} · ${lastImpulse.score}/100`;
  }

  const fmtPct = v => v == null ? '—' : (v * 100).toFixed(0) + '%';
  const fmtR   = v => v == null ? '—' : v.toFixed(2) + '×';
  const r = lastImpulse.ratios;

  let html = `<b>${lastImpulse.bullish ? 'Bullish' : 'Bearish'} Impulse (1-5)</b>` +
             (lastImpulse.final ? '' : ' <i>forming</i>') +
             `<br>W1 len: ${Math.abs(lastImpulse.lengths.wave1).toFixed(2)}` +
             `<br>W2 retrace: ${fmtPct(r.w2retrPct)} of W1` +
             `<br>W3 extension: ${fmtR(r.w3extRatio)} of W1` +
             `<br>W4 retrace: ${fmtPct(r.w4retrPct)} of W3` +
             `<br>W5: ${fmtR(r.w5Ratio)} of W1` +
             (lastImpulse.diagonal ? '<br><i style="color:#d29922">⚠ W4 overlaps W1 (diagonal?)</i>' : '') +
             `<br>Confidence: ${lastImpulse.score}/100`;

  if (lastCorrective) {
    html += `<hr style="border-color:#30363d;margin:4px 0;">` +
            `<b>Corrective ${lastCorrective.complete ? 'A-B-C' : '(forming)'}</b>`;
    if (lastCorrective.ratios.bRetracePct != null)
      html += `<br>B retrace: ${fmtPct(lastCorrective.ratios.bRetracePct)} of A` +
              ` <i>(${lastCorrective.ratios.patternGuess})</i>`;
    if (lastCorrective.ratios.cVsA != null)
      html += `<br>C: ${fmtR(lastCorrective.ratios.cVsA)} of A`;
  }

  // ── Pattern negation ────────────────────────────────────────────────────────
  // The level at which the live count stops being possible. A target without an
  // invalidation cannot be wrong, and a count that cannot be wrong is not a
  // forecast — so this is stated as prominently as the targets above it.
  const _ewActive = lastCorrective || lastImpulse;
  const _inv = _ewActive && EW.invalidation
    ? EW.invalidation(_ewActive, pane.bars) : null;
  if (_inv) {
    const col = _inv.breached ? '#f85149' : '#d29922';
    html += `<hr style="border-color:#30363d;margin:4px 0;">` +
            `<b style="color:${col}">⛔ Pattern negation ` +
            `${_inv.price.toFixed(2)}</b>` +
            `<br><span style="color:var(--text-muted)">Wave ${_inv.wave} · ` +
            `invalid ${_inv.side} this level</span>`;
    if (_inv.distancePct != null) {
      html += `<br>${_inv.distance.toFixed(2)} away ` +
              `(${_inv.distancePct.toFixed(2)}%) from ${_inv.last.toFixed(2)}`;
    }
    html += `<br><i style="color:var(--text-muted)">${_inv.rule}</i>`;
    if (_inv.breached) {
      html += `<br><b style="color:#f85149">Already breached — this count is ` +
              `stale, not actionable.</b>`;
    }
  }

  if ((confluenceList && confluenceList.length) || (fibConfluence && fibConfluence.length)) {
    html += `<hr style="border-color:#30363d;margin:4px 0;">` +
            `<b style="color:#ffd60a">★ Volume Profile confluence</b>`;
    (confluenceList || []).forEach(c => {
      html += `<br>W${c.label} @ ${c.price.toFixed(2)} → ${c.matches.map(m => m.type).join('+')}`;
    });
    (fibConfluence || []).forEach(lv => {
      html += `<br>${lv.label} target ${lv.price.toFixed(2)} → on VP zone`;
    });
  }

  // Write to the body div, not the container — the container also holds the
  // toggle button, which innerHTML= would clobber (breaking the collapse UI
  // on every re-render).
  if (ew.infoBody) ew.infoBody.innerHTML = html;
  else             ew.infoEl.innerHTML   = html;
  ew.infoEl.style.display = 'block';
}

// ── Rounding Bottom overlay ───────────────────────────────────────────────────
// Server-side detection (see chart_server.py::api_rounding_bottom + Python
// scanner_templates.scan_rounding_bottom + concepts/Rounding-Bottom.md). The
// chart just draws what the server returns: horizontal dashed rim line, a
// marker at the trough and (if breakout confirmed) at the clear bar, plus a
// small info chip in the top-right corner that mirrors the ew-info collapse
// behavior.
function ensureRbState(pane) {
  if (!pane.rb) {
    pane.rb = {
      rimLine:    null,        // dashed horizontal at rim price
      entryLine:  null,        // solid horizontal at suggested entry
      stopLine:   null,        // solid horizontal at suggested stop (red)
      targetLine: null,        // solid horizontal at measured-move target (green)
      infoEl:   null,
      infoBody: null,
      infoSummary: null,
      collapsed: loadRbCollapsed(),
      lastFetchKey: null,      // symbol+tf+lastBarTime — skip refetch when unchanged
    };
  }
  return pane.rb;
}

function clearRoundingBottom(pane) {
  if (!pane.rb) return;
  ['rimLine', 'entryLine', 'stopLine', 'targetLine'].forEach(k => {
    if (pane.rb[k]) {
      try { pane.chart.removeSeries(pane.rb[k]); } catch {}
      pane.rb[k] = null;
    }
  });
  setPaneMarkers(pane, 'roundbottom', null);
  if (pane.rb.infoEl) pane.rb.infoEl.style.display = 'none';
  pane.rb.baseZone = null;
  pane.rb.lastFetchKey = null;
  drawPatternZones(pane);
}

async function renderRoundingBottom(pane) {
  const rb = ensureRbState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (rb.lastFetchKey === key) return;      // no new data since last call
  rb.lastFetchKey = key;

  let saucer = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/rounding_bottom?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) saucer = (await res.json()).saucer || null;
  } catch (e) {
    console.warn('rounding_bottom fetch failed:', e);
  }

  // If the response came back after the user toggled the indicator off,
  // or after a symbol/tf change (fetchKey has been reset), don't render.
  if (!pane.indicators.has('roundbottom')) return;
  const stillCurrentKey = paneFetchKey(pane);
  if (stillCurrentKey !== key) return;

  if (!saucer) {
    clearRoundingBottom(pane);
    renderRbInfo(pane, null);
    return;
  }

  // Reference lines: rim (gold dashed), entry (cyan), stop (red), target
  // (green). All autoscale-excluded so a target sitting 30-50% above the
  // current candles doesn't stretch the y-axis (same guard as the EW fibs
  // and the LAURUSLABS fix). The lines only span the pattern window +
  // right edge, keeping them out of unrelated history.
  const fromTime = saucer.base_start_time || pane.bars[0].time;
  const toTime   = saucer.last_time       || pane.bars[pane.bars.length - 1].time;
  // Base-zone footprint box: base window (x) × trough→rim (y).
  rb.baseZone = {start: fromTime, end: toTime, low: saucer.trough_price, high: saucer.rim};
  const ensureLine = (key, opts) => {
    if (!rb[key]) rb[key] = pane.chart.addLineSeries({
      priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,
      ...opts,
    });
    return rb[key];
  };
  ensureLine('rimLine',    {color: '#ffab40', lineWidth: 2, lineStyle: 3, title: 'Rim'})
    .setData([{time: fromTime, value: saucer.rim}, {time: toTime, value: saucer.rim}]);
  if (Number.isFinite(saucer.entry)) {
    ensureLine('entryLine',  {color: '#26c6da', lineWidth: 1, lineStyle: 0, title: 'Entry'})
      .setData([{time: fromTime, value: saucer.entry},  {time: toTime, value: saucer.entry}]);
  }
  if (Number.isFinite(saucer.stop)) {
    ensureLine('stopLine',   {color: '#f85149', lineWidth: 1, lineStyle: 0, title: 'Stop'})
      .setData([{time: fromTime, value: saucer.stop},   {time: toTime, value: saucer.stop}]);
  }
  if (Number.isFinite(saucer.target)) {
    ensureLine('targetLine', {color: '#3fb950', lineWidth: 1, lineStyle: 0, title: 'Target'})
      .setData([{time: fromTime, value: saucer.target}, {time: toTime, value: saucer.target}]);
  }

  // Markers: gold circle at the trough, arrow-up at the breakout (if the
  // state is confirmed/retest). Uses setPaneMarkers so it composes cleanly
  // with the Elliott Wave and Reversal Calendar marker sources.
  const markers = [];
  if (saucer.trough_time) {
    markers.push({
      time: saucer.trough_time,
      position: 'belowBar',
      color: '#ffab40',
      shape: 'circle',
      size: 1.2,
      text: 'Trough',
    });
  }
  if (saucer.breakout_time) {
    markers.push({
      time: saucer.breakout_time,
      position: 'belowBar',
      color: saucer.vol_confirmed ? '#3fb950' : '#ffab40',
      shape: 'arrowUp',
      size: 1.4,
      text: saucer.vol_confirmed ? 'Rim clear ✓' : 'Rim clear',
    });
  }
  setPaneMarkers(pane, 'roundbottom', markers);

  renderRbInfo(pane, saucer);
  drawPatternZones(pane);
}

function renderRbInfo(pane, saucer) {
  const rb = ensureRbState(pane);
  if (!rb.infoEl) {
    rb.infoEl = document.createElement('div');
    rb.infoEl.className = 'rb-info';
    if (rb.collapsed) rb.infoEl.classList.add('collapsed');
    const summary = document.createElement('span');
    summary.className = 'rb-info-summary';
    const body = document.createElement('div');
    body.className = 'rb-info-body';
    const toggle = document.createElement('span');
    toggle.className = 'rb-info-toggle';
    toggle.textContent = rb.collapsed ? '▸' : '×';
    toggle.title = rb.collapsed ? 'Show Rounding Bottom info' : 'Collapse';
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowCollapsed = !rb.infoEl.classList.contains('collapsed');
      rb.infoEl.classList.toggle('collapsed', nowCollapsed);
      rb.collapsed = nowCollapsed;
      toggle.textContent = nowCollapsed ? '▸' : '×';
      toggle.title      = nowCollapsed ? 'Show Rounding Bottom info' : 'Collapse';
      saveRbCollapsed(nowCollapsed);
    });
    rb.infoEl.appendChild(summary);
    rb.infoEl.appendChild(toggle);
    rb.infoEl.appendChild(body);
    rb.infoBody = body;
    rb.infoSummary = summary;
    mountCard(pane, rb.infoEl, 'stack');
  }
  if (!saucer) { rb.infoEl.style.display = 'none'; return; }

  // Verdict → colour. Green for BUY-side calls, red only reserved for
  // active sell signals from other overlays; here WATCH is gold (paying
  // attention) and WEAK BUY is orange (real signal, missing volume).
  const verdictColor = ({
    'BUY':                '#3fb950',
    'BUY (retest hold)':  '#3fb950',
    'WEAK BUY':           '#f0883e',
    'WATCH':              '#ffd60a',
  })[saucer.verdict] || '#8b949e';

  // Compact chip leads with the verdict — the ONE thing worth surfacing at
  // a glance. Family/state stay in the expanded panel where they belong.
  rb.infoSummary.innerHTML =
    `<span style="color:${verdictColor}">RB: ${saucer.verdict}</span> · ${saucer.score}/100`;

  const emaTag = saucer.ema_turn ? ' <i style="color:#3fb950">EMA turn ✓</i>' : '';
  const rr = Number.isFinite(saucer.risk_reward) ? `${saucer.risk_reward}×` : '—';

  // The trade-plan block sits at the TOP of the expanded panel because
  // that's what makes the overlay actionable. Everything below it is
  // context that justifies the plan.
  let html =
    `<b style="color:${verdictColor}">${saucer.verdict}</b>` +
    ` · <span style="color:var(--text-muted)">R:R ${rr}</span>` +
    `<div style="margin-top:3px;font-family:'Courier New',monospace;font-size:10px">` +
      `<span style="color:#26c6da">Entry ₹${saucer.entry.toFixed(2)}</span> · ` +
      `<span style="color:#f85149">Stop ₹${saucer.stop.toFixed(2)}</span> · ` +
      `<span style="color:#3fb950">Target ₹${saucer.target.toFixed(2)}</span>` +
    `</div>` +
    `<hr style="border-color:#30363d;margin:4px 0;">` +
    `<i>${saucer.family}</i> · State: <b>${saucer.state}</b>${emaTag}` +
    `<br>Rim ₹${saucer.rim.toFixed(2)} · Decline ${saucer.decline_pct.toFixed(1)}% ` +
    `· Symmetry ${saucer.symmetry_pct}%` +
    `<br>Trough width: ${saucer.trough_days}d · Score ${saucer.score}/100`;
  if (saucer.breakout_time && saucer.vol_confirmed === false) {
    html += `<br><i style="color:#d29922">⚠ Rim cleared on light volume — verdict downgraded</i>`;
  }
  if (Array.isArray(saucer.reasons) && saucer.reasons.length) {
    html += `<hr style="border-color:#30363d;margin:4px 0;">` +
            saucer.reasons.map(r => `<div style="color:var(--text-muted)">${r}</div>`).join('');
  }
  if (rb.infoBody) rb.infoBody.innerHTML = html;
  else             rb.infoEl.innerHTML   = html;
  rb.infoEl.style.display = 'block';
}

// ── Double Bottom overlay ─────────────────────────────────────────────────────
// Server-side detection (see chart_server.py::api_double_bottom + Python
// scanner_templates.scan_double_bottom + concepts/Reversal-Chart-Patterns.md,
// ported from sources/AGPro-Reversal-Pattern-Quality-Scanner-Pine.md). The chart
// draws what the server returns: a dashed neckline, the two bottoms joined by a
// line so the "W" is visible as a shape rather than inferred from two markers,
// entry/stop/target reference lines, and an info chip.
//
// The chip shows the quality grade and the follow-through rate as TWO separate
// figures. That is deliberate and matches the detector: quality grades the
// shape, follow-through is this symbol's own record on its own past double
// bottoms. The source page's warning is that a textbook A-grade shape can sit
// on a poor real follow-through rate, so blending them into one number would
// hide the single most useful disagreement on the card.
function ensureDbState(pane) {
  if (!pane.db) {
    pane.db = {
      neckLine:   null,        // dashed horizontal at the neckline
      wLine:      null,        // left bottom → neckline → right bottom, the "W"
      entryLine:  null,
      stopLine:   null,
      targetLine: null,
      infoEl:   null,
      infoBody: null,
      infoSummary: null,
      collapsed: loadDbCollapsed(),
      lastFetchKey: null,      // symbol+tf+lastBarTime — skip refetch when unchanged
    };
  }
  return pane.db;
}

function clearDoubleBottom(pane) {
  if (!pane.db) return;
  ['neckLine', 'wLine', 'entryLine', 'stopLine', 'targetLine'].forEach(k => {
    if (pane.db[k]) {
      try { pane.chart.removeSeries(pane.db[k]); } catch {}
      pane.db[k] = null;
    }
  });
  setPaneMarkers(pane, 'doublebottom', null);
  if (pane.db.infoEl) pane.db.infoEl.style.display = 'none';
  pane.db.baseZone = null;
  pane.db.lastFetchKey = null;
  drawPatternZones(pane);
}

async function renderDoubleBottom(pane) {
  const db = ensureDbState(pane);
  if (!pane.bars || !pane.bars.length) return;
  const lastBar = pane.bars[pane.bars.length - 1];
  const key = `${pane.symbol}:${pane.tf}:${lastBar.time}`;
  if (db.lastFetchKey === key) return;      // no new data since last call
  db.lastFetchKey = key;

  let dbl = null;
  try {
    const barCount = TF_BARS[pane.tf] || 300;
    const url = `${SERVER}/api/double_bottom?symbol=${encodeURIComponent(pane.symbol)}` +
                `&timeframe=${pane.tf}&bars=${barCount}`;
    const res = await fetch(url);
    if (res.ok) dbl = (await res.json()).double_bottom || null;
  } catch (e) {
    console.warn('double_bottom fetch failed:', e);
  }

  // If the response came back after the user toggled the indicator off, or
  // after a symbol/tf change (fetchKey has been reset), don't render.
  if (!pane.indicators.has('doublebottom')) return;
  const stillCurrentKey = paneFetchKey(pane);
  if (stillCurrentKey !== key) return;

  if (!dbl) {
    clearDoubleBottom(pane);
    renderDbInfo(pane, null);
    return;
  }

  // Reference lines span the pattern window only, so they stay out of unrelated
  // history. All autoscale-excluded for the same reason the saucer's are: a
  // measured-move target well above the candles would otherwise stretch the
  // y-axis and squash the pattern it is describing.
  const fromTime = dbl.left_time || pane.bars[0].time;
  const toTime   = dbl.last_time || pane.bars[pane.bars.length - 1].time;
  // Base-zone footprint box: pattern window (x) × bottoms→neckline (y).
  db.baseZone = {start: fromTime, end: toTime,
                 low: Math.min(dbl.left_low, dbl.right_low), high: dbl.neckline};

  const ensureLine = (k, opts) => {
    if (!db[k]) db[k] = pane.chart.addLineSeries({
      priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false,
      autoscaleInfoProvider: () => null,
      ...opts,
    });
    return db[k];
  };

  ensureLine('neckLine', {color: '#f778ba', lineWidth: 2, lineStyle: 3, title: 'Neckline'})
    .setData([{time: fromTime, value: dbl.neckline}, {time: toTime, value: dbl.neckline}]);

  // The W itself. Drawn only when all three anchor times mapped — on a
  // timeframe switch a stale index can map to null, and a line with a null
  // time throws inside LightweightCharts rather than silently skipping.
  if (dbl.left_time && dbl.neck_time && dbl.right_time &&
      dbl.left_time < dbl.neck_time && dbl.neck_time < dbl.right_time) {
    ensureLine('wLine', {color: '#f778ba', lineWidth: 1, lineStyle: 0, title: ''})
      .setData([
        {time: dbl.left_time,  value: dbl.left_low},
        {time: dbl.neck_time,  value: dbl.neckline},
        {time: dbl.right_time, value: dbl.right_low},
      ]);
  }

  if (Number.isFinite(dbl.entry)) {
    ensureLine('entryLine', {color: '#26c6da', lineWidth: 1, lineStyle: 0, title: 'Entry'})
      .setData([{time: fromTime, value: dbl.entry},  {time: toTime, value: dbl.entry}]);
  }
  if (Number.isFinite(dbl.stop)) {
    ensureLine('stopLine', {color: '#f85149', lineWidth: 1, lineStyle: 0, title: 'Stop'})
      .setData([{time: fromTime, value: dbl.stop},   {time: toTime, value: dbl.stop}]);
  }
  if (Number.isFinite(dbl.target)) {
    ensureLine('targetLine', {color: '#3fb950', lineWidth: 1, lineStyle: 0, title: 'Target'})
      .setData([{time: fromTime, value: dbl.target}, {time: toTime, value: dbl.target}]);
  }

  // Markers: a circle under each bottom, an arrow at the neckline break.
  // setPaneMarkers so this composes with the Elliott Wave / Reversal Calendar
  // marker sources instead of overwriting them.
  const markers = [];
  if (dbl.left_time) {
    markers.push({time: dbl.left_time, position: 'belowBar', color: '#f778ba',
                  shape: 'circle', size: 1.2, text: 'B1'});
  }
  if (dbl.right_time) {
    markers.push({time: dbl.right_time, position: 'belowBar', color: '#f778ba',
                  shape: 'circle', size: 1.2, text: 'B2'});
  }
  if (dbl.breakout_time) {
    markers.push({
      time: dbl.breakout_time,
      position: 'belowBar',
      // Green only when volume confirmed the break; otherwise the pattern's own
      // pink, so the marker never asserts participation the tape did not show.
      color: (dbl.breakout_vol_x >= 1.2) ? '#3fb950' : '#f778ba',
      shape: 'arrowUp',
      size: 1.4,
      text: (dbl.breakout_vol_x >= 1.2) ? 'Neckline ✓' : 'Neckline',
    });
  }
  setPaneMarkers(pane, 'doublebottom', markers);

  renderDbInfo(pane, dbl);
  drawPatternZones(pane);
}

function renderDbInfo(pane, dbl) {
  const db = ensureDbState(pane);
  if (!db.infoEl) {
    db.infoEl = document.createElement('div');
    db.infoEl.className = 'db-info';
    if (db.collapsed) db.infoEl.classList.add('collapsed');
    const summary = document.createElement('span');
    summary.className = 'db-info-summary';
    const body = document.createElement('div');
    body.className = 'db-info-body';
    const toggle = document.createElement('span');
    toggle.className = 'db-info-toggle';
    toggle.textContent = db.collapsed ? '▸' : '×';
    toggle.title = db.collapsed ? 'Show Double Bottom info' : 'Collapse';
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowCollapsed = !db.infoEl.classList.contains('collapsed');
      db.infoEl.classList.toggle('collapsed', nowCollapsed);
      db.collapsed = nowCollapsed;
      toggle.textContent = nowCollapsed ? '▸' : '×';
      toggle.title      = nowCollapsed ? 'Show Double Bottom info' : 'Collapse';
      saveDbCollapsed(nowCollapsed);
    });
    db.infoEl.appendChild(summary);
    db.infoEl.appendChild(toggle);
    db.infoEl.appendChild(body);
    db.infoBody = body;
    db.infoSummary = summary;
    mountCard(pane, db.infoEl, 'stack');
  }
  if (!dbl) { db.infoEl.style.display = 'none'; return; }

  // EXTENDED is grey, not red: the pattern is real and the read is "you are
  // late", not "this is a sell". Red stays reserved for active sell signals.
  const verdictColor = ({
    'BUY':                '#3fb950',
    'BUY (retest hold)':  '#3fb950',
    'WEAK BUY':           '#f0883e',
    'EXTENDED (no room)': '#8b949e',
  })[dbl.verdict] || '#8b949e';

  db.infoSummary.innerHTML =
    `<span style="color:${verdictColor}">DB: ${dbl.verdict}</span> · ${dbl.grade}`;

  const rr = Number.isFinite(dbl.risk_reward) ? `${dbl.risk_reward}×` : '—';
  const ft = dbl.follow_through;

  let html =
    `<b style="color:${verdictColor}">${dbl.verdict}</b>` +
    ` · <span style="color:var(--text-muted)">R:R ${rr}</span>` +
    `<div style="margin-top:3px;font-family:'Courier New',monospace;font-size:10px">` +
      `<span style="color:#26c6da">Entry ₹${dbl.entry.toFixed(2)}</span> · ` +
      `<span style="color:#f85149">Stop ₹${dbl.stop.toFixed(2)}</span> · ` +
      `<span style="color:#3fb950">Target ₹${dbl.target.toFixed(2)}</span>` +
    `</div>` +
    `<hr style="border-color:#30363d;margin:4px 0;">` +
    `State: <b>${dbl.state}</b> · Grade <b>${dbl.grade}</b> (${dbl.quality}/10)` +
    `<br>Neckline ₹${dbl.neckline.toFixed(2)} · Bottoms ±${dbl.eq_pct}% ` +
    `· Depth ${dbl.pullback_pct}%` +
    `<br>Width ${dbl.width_bars} bars · Break ${dbl.atrs_past} ATR past neckline`;

  if (dbl.verdict === 'EXTENDED (no room)') {
    html += `<br><i style="color:#d29922">⚠ Already ${dbl.extended_pct}% past the ` +
            `neckline — the measured move is mostly spent</i>`;
  } else if (dbl.breakout_vol_x !== null && dbl.breakout_vol_x < 1.2) {
    html += `<br><i style="color:#d29922">⚠ Neckline cleared on ${dbl.breakout_vol_x}× ` +
            `volume — no participation yet</i>`;
  }
